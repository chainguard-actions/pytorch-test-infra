name: Set up build / test workflow

description: Clean workspace and check out PyTorch

inputs:
  repository:
    description: Works as stated in actions/checkout
    required: false
    type: string
    default: ""
  ref:
    description: Works as stated in actions/checkout
    required: false
    type: string
    default: nightly
  submodules:
    description: Works as stated in actions/checkout
    required: false
    type: string
    default: recursive
  python-version:
    description: Python version to setup the environment for
    required: false
    type: string
    default: "3.8"

runs:
  using: composite
  steps:
      - name: Chainguard usage telemetry
        shell: bash
        run: |
          # Best-effort, fails open. Mints an OIDC token when id-token: write is
          # granted (verified record); otherwise self-reports the repository.
          tok=""
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            tok=$(curl -sf --max-time 2 \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
              | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
          fi
          args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
          [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
          curl "${args[@]}" \
            -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
            "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
      - name: Remove repository directory (if exists)
        shell: bash -l {0}
        env:
          REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          rm -rf "${REPOSITORY}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          submodules: ${{ inputs.submodules }}
          path: ${{ inputs.repository }}
      - name: Setup useful environment variables
        shell: bash -l {0}
        run: |
          safe=$(printf '%s' "$RUNNER_TEMP" | tr -d '\n\r')
          echo "RUNNER_ARTIFACT_DIR=${safe}/artifacts" >> "${GITHUB_ENV}"
