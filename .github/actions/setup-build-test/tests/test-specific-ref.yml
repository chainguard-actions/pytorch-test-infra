name: Test specific tag ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: v4.0.0
          submodules: "false"
      - name: Assert tag v4.0.0 was checked out
        run: |
          PKG="$GITHUB_WORKSPACE/actions/checkout/package.json"
          if [ ! -f "$PKG" ]; then
            echo "FAIL: package.json not found"
            exit 1
          fi
          VERSION="$(grep -m1 '"version"' "$PKG" | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          echo "version: $VERSION"
          if [ "$VERSION" != "4.0.0" ]; then
            echo "FAIL: expected version 4.0.0"
            exit 1
          fi
          echo "PASS"
