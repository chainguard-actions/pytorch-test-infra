name: Test checkout of a specific tag ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: v4.1.0
          submodules: "false"
      - name: Assert tag checked out
        run: |
          DIR="$GITHUB_WORKSPACE/actions/checkout"
          if [ ! -f "$DIR/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          git config --global --add safe.directory "$DIR" || true
          TAG="$(git -C "$DIR" tag --points-at HEAD)"
          echo "tags at HEAD: $TAG"
          if ! echo "$TAG" | grep -qx 'v4.1.0'; then
            echo "FAIL: expected HEAD at v4.1.0"
            exit 1
          fi
          echo "PASS"
