name: Test pre-existing repository directory is cleaned
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create stale directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/octocat/Hello-World"
          echo stale > "$GITHUB_WORKSPACE/octocat/Hello-World/stale.txt"
      - id: action
        uses: .
        with:
          repository: octocat/Hello-World
          ref: master
          submodules: "false"
      - name: Assert stale file removed and repo checked out
        run: |
          if [ -e "$GITHUB_WORKSPACE/octocat/Hello-World/stale.txt" ]; then
            echo "FAIL: stale.txt still present"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/octocat/Hello-World/README" ]; then
            echo "FAIL: README not found"
            exit 1
          fi
          echo "PASS"
