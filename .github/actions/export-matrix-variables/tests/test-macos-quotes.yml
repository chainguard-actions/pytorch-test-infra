name: Test export matrix variables (non-linux adds quotes)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install stub export script at test-infra/.github/scripts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-infra/.github/scripts"
          cp "$GITHUB_WORKSPACE/tests/fixtures/export_matrix_variables.py" \
             "$GITHUB_WORKSPACE/test-infra/.github/scripts/export_matrix_variables.py"
          rm -f "$RUNNER_TEMP/matrix_to_export.json" "$RUNNER_TEMP/github_env_${GITHUB_RUN_ID}" "$RUNNER_TEMP/stub_args.txt"
      - id: action
        uses: .
        with:
          binary-matrix: '{"desired_cuda": "cu121"}'
          target-os: macos
      - name: Assert results
        run: |
          ARGS="$(cat "$RUNNER_TEMP/stub_args.txt")" || { echo "FAIL: script not invoked"; exit 1; }
          echo "args: $ARGS"
          if ! echo "$ARGS" | grep -q -- "--add-quotes-around-value"; then
            echo "FAIL: non-linux should pass quotes flag"; exit 1
          fi
          echo "$ARGS" | grep -q -- "--input-file .*matrix_to_export.json" || { echo "FAIL: input-file arg wrong"; exit 1; }
          ENVF="$RUNNER_TEMP/github_env_${GITHUB_RUN_ID}"
          echo "--- env file"; cat "$ENVF" || { echo "FAIL: env file missing"; exit 1; }
          grep -qx 'DESIRED_CUDA="cu121"' "$ENVF" || { echo "FAIL: quoted DESIRED_CUDA line missing"; exit 1; }
          echo "PASS"
