name: Test non-linux export (quoted values)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install export script at the path the action expects
        run: |
          mkdir -p test-infra/.github/scripts
          cp tests/fixtures/export_matrix_variables.py test-infra/.github/scripts/export_matrix_variables.py
          rm -f "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}" "${RUNNER_TEMP}/matrix_to_export.json"
      - id: action
        uses: .
        with:
          binary-matrix: '{"python_version": "3.11", "desired_cuda": "cpu"}'
          target-os: macos
      - name: Assert quoted exported variables
        run: |
          f="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          echo "--- env file"; cat "$f" || { echo "FAIL: env file missing"; exit 1; }
          grep -qx 'PYTHON_VERSION="3.11"' "$f" || { echo "FAIL: PYTHON_VERSION not quoted"; exit 1; }
          grep -qx 'DESIRED_CUDA="cpu"' "$f" || { echo "FAIL: DESIRED_CUDA not quoted"; exit 1; }
          echo "PASS"
