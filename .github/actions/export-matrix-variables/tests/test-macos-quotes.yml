name: Test non-linux export (quoted values)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide export script at expected path
        run: |
          mkdir -p test-infra/.github/scripts
          cp tests/fixtures/export_matrix_variables.py test-infra/.github/scripts/export_matrix_variables.py
          rm -f "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}" "${RUNNER_TEMP}/matrix_to_export.json"
      - id: action
        uses: .
        with:
          binary-matrix: '{"python_version": "3.11", "desired_cuda": "cpu"}'
          target-os: macos
      - name: Assert env file content is quoted
        run: |
          F="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          echo "--- $F"; cat "$F" || { echo "FAIL: env file missing"; exit 1; }
          grep -qx 'PYTHON_VERSION="3.11"' "$F" || { echo "FAIL: quoted PYTHON_VERSION missing"; exit 1; }
          grep -qx 'DESIRED_CUDA="cpu"' "$F" || { echo "FAIL: quoted DESIRED_CUDA missing"; exit 1; }
          echo "PASS"
