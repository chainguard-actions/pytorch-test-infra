name: Test non-linux target (quotes added)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install helper script stub at expected path
        run: |
          mkdir -p test-infra/.github/scripts
          cp tests/fixtures/export_matrix_variables_stub.py test-infra/.github/scripts/export_matrix_variables.py
          rm -f "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}" "${RUNNER_TEMP}/matrix_to_export.json"
      - id: action
        uses: .
        with:
          binary-matrix: '{"python_version": "3.12", "desired_cuda": "cpu"}'
          target-os: macos
      - name: Assert outputs
        run: |
          F="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          echo "--- $F"
          cat "$F" || { echo "FAIL: env file missing"; exit 1; }
          grep -qx 'STUB_QUOTES=yes' "$F" || { echo "FAIL: quotes flag expected for macos"; exit 1; }
          grep -qx 'PYTHON_VERSION="3.12"' "$F" || { echo "FAIL: PYTHON_VERSION"; exit 1; }
          grep -qx 'DESIRED_CUDA="cpu"' "$F" || { echo "FAIL: DESIRED_CUDA"; exit 1; }
          echo "PASS"
