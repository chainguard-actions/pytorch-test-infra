name: Test macos target (quoted values)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          path: test-infra
          fetch-depth: 1
      - name: Clean previous output
        run: rm -f "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}" "${RUNNER_TEMP}/matrix_to_export.json"
      - id: action
        uses: .
        with:
          binary-matrix: '{"python_version": "3.11", "gpu_arch_type": "cpu"}'
          target-os: macos
      - name: Assert exported variables are quoted
        run: |
          F="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          if [ ! -f "$F" ]; then echo "FAIL: $F not created"; exit 1; fi
          echo "--- contents ---"; cat "$F"
          grep -qi 'python_version' "$F" || { echo "FAIL: python_version not exported"; exit 1; }
          grep -q '"3\.11"' "$F" || { echo "FAIL: expected quoted value \"3.11\""; exit 1; }
          grep -q '"cpu"' "$F" || { echo "FAIL: expected quoted value \"cpu\""; exit 1; }
          echo "PASS"
