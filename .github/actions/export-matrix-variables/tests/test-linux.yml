name: Test linux target (no quotes)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install export script stub at expected path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-infra/.github/scripts"
          cp "$GITHUB_WORKSPACE/tests/fixtures/export_matrix_variables.py" \
             "$GITHUB_WORKSPACE/test-infra/.github/scripts/export_matrix_variables.py"
          rm -f "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}" "${RUNNER_TEMP}/matrix_to_export.json"
      - id: action
        uses: .
        with:
          binary-matrix: '{"python_version": "3.11", "gpu_arch_type": "cuda"}'
          target-os: linux
      - name: Assert env file content
        run: |
          F="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          echo "--- matrix json"; cat "${RUNNER_TEMP}/matrix_to_export.json" || { echo "FAIL: matrix json missing"; exit 1; }
          grep -q '"python_version": "3.11"' "${RUNNER_TEMP}/matrix_to_export.json" || { echo "FAIL: matrix json content"; exit 1; }
          echo "--- env file"; cat "$F" || { echo "FAIL: env file missing"; exit 1; }
          grep -qx 'PYTHON_VERSION=3.11' "$F" || { echo "FAIL: PYTHON_VERSION unquoted line missing"; exit 1; }
          grep -qx 'GPU_ARCH_TYPE=cuda' "$F" || { echo "FAIL: GPU_ARCH_TYPE unquoted line missing"; exit 1; }
          echo "PASS"
