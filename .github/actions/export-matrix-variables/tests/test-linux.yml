name: Test linux matrix export (no quotes)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Stage export script where the action expects it
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-infra/.github/scripts"
          cp "$GITHUB_WORKSPACE/tests/fixtures/export_matrix_variables.py" \
            "$GITHUB_WORKSPACE/test-infra/.github/scripts/export_matrix_variables.py"
          rm -f "$RUNNER_TEMP/github_env_$GITHUB_RUN_ID"
      - id: action
        uses: .
        with:
          binary-matrix: '{"python_version": "3.10", "gpu_arch_type": "cpu"}'
          target-os: linux
      - name: Assert env file written without quotes
        run: |
          F="$RUNNER_TEMP/github_env_$GITHUB_RUN_ID"
          echo "--- $F"; cat "$F" || { echo "FAIL: env file missing"; exit 1; }
          echo "--- matrix json"; cat "$RUNNER_TEMP/matrix_to_export.json"
          grep -qiE '^python_version=3\.10$' "$F" || { echo "FAIL: python_version line missing/quoted"; exit 1; }
          grep -qiE '^gpu_arch_type=cpu$' "$F" || { echo "FAIL: gpu_arch_type line missing/quoted"; exit 1; }
          if grep -q '"' "$F"; then echo "FAIL: linux output should not be quoted"; exit 1; fi
          echo "PASS"
