name: Test linux export (no quotes)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide export script at expected relative path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-infra/.github/scripts"
          cp "$GITHUB_WORKSPACE/tests/fixtures/export_matrix_variables.py" \
            "$GITHUB_WORKSPACE/test-infra/.github/scripts/export_matrix_variables.py"
          rm -f "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
      - id: action
        uses: .
        with:
          binary-matrix: '{"python_version":"3.10","gpu_arch_type":"cpu"}'
          target-os: linux
      - name: Assert matrix json written
        run: |
          cat "${RUNNER_TEMP}/matrix_to_export.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['python_version']=='3.10' and d['gpu_arch_type']=='cpu'" "${RUNNER_TEMP}/matrix_to_export.json" || { echo "FAIL: matrix json mismatch"; exit 1; }
          echo "PASS"
      - name: Assert env file contents without quotes
        run: |
          F="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          if [ ! -f "$F" ]; then echo "FAIL: $F missing"; exit 1; fi
          cat "$F"
          grep -qx 'PYTHON_VERSION=3.10' "$F" || { echo "FAIL: PYTHON_VERSION line"; exit 1; }
          grep -qx 'GPU_ARCH_TYPE=cpu' "$F" || { echo "FAIL: GPU_ARCH_TYPE line"; exit 1; }
          if grep -q '"' "$F"; then echo "FAIL: unexpected quotes for linux"; exit 1; fi
          echo "PASS"
