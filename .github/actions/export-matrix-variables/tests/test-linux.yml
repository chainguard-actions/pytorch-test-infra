name: Test linux matrix export (no quotes)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide export script at expected path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-infra/.github/scripts"
          cp "$GITHUB_WORKSPACE/tests/fixtures/export_matrix_variables.py" \
             "$GITHUB_WORKSPACE/test-infra/.github/scripts/export_matrix_variables.py"
          rm -f "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}" "${RUNNER_TEMP}/matrix_to_export.json"
      - id: action
        uses: .
        with:
          binary-matrix: '{"python_version": "3.10", "gpu_arch_type": "cuda"}'
          target-os: linux
      - name: Assert env file content
        run: |
          F="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          echo "--- matrix json ---"; cat "${RUNNER_TEMP}/matrix_to_export.json"
          echo "--- env file ---"; cat "$F" || { echo "FAIL: env file missing"; exit 1; }
          grep -qx 'QUOTES_FLAG=no' "$F" || { echo "FAIL: quotes flag should not be passed on linux"; exit 1; }
          grep -qx 'PYTHON_VERSION=3.10' "$F" || { echo "FAIL: PYTHON_VERSION missing"; exit 1; }
          grep -qx 'GPU_ARCH_TYPE=cuda' "$F" || { echo "FAIL: GPU_ARCH_TYPE missing"; exit 1; }
          grep -q '"python_version"' "${RUNNER_TEMP}/matrix_to_export.json" || { echo "FAIL: matrix json not written"; exit 1; }
          echo "PASS"
