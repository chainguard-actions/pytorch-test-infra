name: Test linux target (no quotes)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install helper script stub at expected path
        run: |
          mkdir -p test-infra/.github/scripts
          cp tests/fixtures/export_matrix_variables_stub.py test-infra/.github/scripts/export_matrix_variables.py
          rm -f "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}" "${RUNNER_TEMP}/matrix_to_export.json"
      - id: action
        uses: .
        with:
          binary-matrix: '{"python_version": "3.11", "gpu_arch_type": "cuda"}'
          target-os: linux
      - name: Assert outputs
        run: |
          set -u
          echo "--- matrix_to_export.json"
          cat "${RUNNER_TEMP}/matrix_to_export.json" || { echo "FAIL: matrix json missing"; exit 1; }
          grep -q '"python_version": "3.11"' "${RUNNER_TEMP}/matrix_to_export.json" || { echo "FAIL: json content"; exit 1; }
          F="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          echo "--- $F"
          cat "$F" || { echo "FAIL: env file missing"; exit 1; }
          grep -qx 'STUB_QUOTES=no' "$F" || { echo "FAIL: quotes flag should not be passed for linux"; exit 1; }
          grep -qx 'PYTHON_VERSION=3.11' "$F" || { echo "FAIL: PYTHON_VERSION"; exit 1; }
          grep -qx 'GPU_ARCH_TYPE=cuda' "$F" || { echo "FAIL: GPU_ARCH_TYPE"; exit 1; }
          echo "PASS"
