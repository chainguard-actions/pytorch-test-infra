name: Test linux target (no quotes)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide test-infra script dependency
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-infra"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/test-infra/.github" "$GITHUB_WORKSPACE/test-infra/"
          rm -f "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
      - id: action
        uses: .
        with:
          binary-matrix: '{"python_version": "3.10", "gpu_arch_type": "cuda"}'
          target-os: linux
      - name: Assert matrix json written and env file without quotes
        run: |
          echo "--- matrix_to_export.json"
          cat "${RUNNER_TEMP}/matrix_to_export.json"
          grep -q '"python_version": "3.10"' "${RUNNER_TEMP}/matrix_to_export.json" || { echo "FAIL: matrix json missing content"; exit 1; }
          F="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          echo "--- $F"
          cat "$F" || { echo "FAIL: env file missing"; exit 1; }
          grep -qx 'PYTHON_VERSION=3.10' "$F" || { echo "FAIL: PYTHON_VERSION line missing"; exit 1; }
          grep -qx 'GPU_ARCH_TYPE=cuda' "$F" || { echo "FAIL: GPU_ARCH_TYPE line missing"; exit 1; }
          if grep -q '"' "$F"; then echo "FAIL: linux should not quote values"; exit 1; fi
          echo "PASS"
