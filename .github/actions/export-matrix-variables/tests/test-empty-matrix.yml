name: Test empty binary-matrix skips export
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean any previous state
        run: |
          rm -f "${RUNNER_TEMP}/matrix_to_export.json" "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
      - id: action
        uses: .
        with:
          binary-matrix: ""
          target-os: linux
      - name: Assert nothing was exported
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -e "${RUNNER_TEMP}/matrix_to_export.json" ]; then
            echo "FAIL: matrix_to_export.json should not be created"
            exit 1
          fi
          if [ -e "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}" ]; then
            echo "FAIL: github_env file should not be created"
            exit 1
          fi
          echo "PASS"
