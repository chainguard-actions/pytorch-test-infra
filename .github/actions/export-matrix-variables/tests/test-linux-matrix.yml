name: Test linux matrix export
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare test-infra script path
        run: |
          mkdir -p test-infra/.github/scripts
          if [ -f .github/scripts/export_matrix_variables.py ]; then
            cp .github/scripts/export_matrix_variables.py test-infra/.github/scripts/
          else
            cp tests/fixtures/export_matrix_variables.py test-infra/.github/scripts/
          fi
          rm -f "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
      - id: action
        uses: .
        with:
          binary-matrix: '{"python_version": "3.10", "gpu_arch_type": "cpu"}'
          target-os: linux
      - name: Assert env file written
        run: |
          F="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          if [ ! -f "$F" ]; then echo "FAIL: $F missing"; exit 1; fi
          echo "--- content ---"; cat "$F"
          grep -qiE '^(MATRIX_)?python_version=' "$F" || { echo "FAIL: python_version missing"; exit 1; }
          grep -qiE '^(MATRIX_)?gpu_arch_type=' "$F" || { echo "FAIL: gpu_arch_type missing"; exit 1; }
          grep -qiE '^(MATRIX_)?python_version=3\.10$' "$F" || { echo "FAIL: python_version value should be unquoted 3.10"; exit 1; }
          grep -qiE '^(MATRIX_)?gpu_arch_type=cpu$' "$F" || { echo "FAIL: gpu_arch_type value should be unquoted cpu"; exit 1; }
          if grep -qE '="' "$F"; then echo "FAIL: linux values should not be quoted"; exit 1; fi
          if [ ! -f "${RUNNER_TEMP}/matrix_to_export.json" ]; then echo "FAIL: matrix json missing"; exit 1; fi
          echo "PASS"
