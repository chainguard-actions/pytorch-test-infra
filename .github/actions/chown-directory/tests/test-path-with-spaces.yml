name: Test chown of directory with spaces in path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create target directory with spaces
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dir with spaces/sub"
          echo "data" > "$GITHUB_WORKSPACE/dir with spaces/sub/a file.txt"
      - id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/dir with spaces
          ALPINE_IMAGE: alpine:3.20
      - name: Assert action succeeded and ownership correct
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          OWNER="$(stat -c '%u:%g' "$GITHUB_WORKSPACE/dir with spaces/sub/a file.txt")"
          echo "owner: $OWNER"
          if [ "$OWNER" != "$(id -u):$(id -g)" ]; then
            echo "FAIL: file not owned by current user"
            exit 1
          fi
          echo "PASS"
