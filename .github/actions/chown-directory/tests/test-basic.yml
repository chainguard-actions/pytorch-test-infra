name: Test basic chown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/chown-target/sub"
          echo hello > "$GITHUB_WORKSPACE/chown-target/a.txt"
          echo world > "$GITHUB_WORKSPACE/chown-target/sub/b.txt"
      - id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/chown-target
          ALPINE_IMAGE: alpine:3.20
      - name: Assert files owned by current user
        run: |
          UID_NOW="$(id -u)"; GID_NOW="$(id -g)"
          echo "expected owner: $UID_NOW:$GID_NOW"
          for f in chown-target chown-target/a.txt chown-target/sub chown-target/sub/b.txt; do
            OWNER="$(stat -c '%u:%g' "$GITHUB_WORKSPACE/$f")"
            echo "$f -> $OWNER"
            if [ "$OWNER" != "$UID_NOW:$GID_NOW" ]; then
              echo "FAIL: $f owned by $OWNER"
              exit 1
            fi
          done
          if [ "$(cat "$GITHUB_WORKSPACE/chown-target/a.txt")" != "hello" ]; then
            echo "FAIL: file content changed"
            exit 1
          fi
          echo "PASS"
