name: Test basic chown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/chown-target/nested/deeper"
          echo "hello" > "$GITHUB_WORKSPACE/chown-target/file.txt"
          echo "world" > "$GITHUB_WORKSPACE/chown-target/nested/deeper/inner.txt"
      - id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/chown-target
          ALPINE_IMAGE: alpine:3.20
      - name: Assert action succeeded and files intact
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          for f in chown-target/file.txt chown-target/nested/deeper/inner.txt; do
            if [ ! -f "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f missing"
              exit 1
            fi
          done
          ME="$(id -u):$(id -g)"
          OWNER="$(stat -c '%u:%g' "$GITHUB_WORKSPACE/chown-target/file.txt")"
          echo "me: $ME owner: $OWNER"
          if [ "$OWNER" != "$ME" ]; then
            echo "FAIL: file not owned by current user"
            exit 1
          fi
          echo "PASS"
