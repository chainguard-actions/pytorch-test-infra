name: Test basic chown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/chown-target/sub"
          echo hello > "$GITHUB_WORKSPACE/chown-target/file.txt"
          echo world > "$GITHUB_WORKSPACE/chown-target/sub/nested.txt"
      - id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/chown-target
          ALPINE_IMAGE: alpine:3.19
      - name: Assert files owned by current user
        run: |
          uid="$(id -u)"; gid="$(id -g)"
          echo "expected owner: $uid:$gid"
          ls -lnR "$GITHUB_WORKSPACE/chown-target"
          bad="$(find "$GITHUB_WORKSPACE/chown-target" \( ! -uid "$uid" -o ! -gid "$gid" \) -print)"
          if [ -n "$bad" ]; then
            echo "FAIL: files not owned by $uid:$gid:"
            echo "$bad"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/chown-target/sub/nested.txt" ]; then
            echo "FAIL: nested file missing"
            exit 1
          fi
          echo "PASS"
