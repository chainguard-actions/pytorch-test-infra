name: Test failure with a non-existent image
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory to chown
        run: |
          mkdir -p "$GITHUB_WORKSPACE/chown-target"
          echo "hello" > "$GITHUB_WORKSPACE/chown-target/file.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ${{ github.workspace }}/chown-target
          ALPINE_IMAGE: localhost:1/does-not-exist/alpine-nonexistent:never
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an unpullable image"
            exit 1
          fi
          echo "PASS"
