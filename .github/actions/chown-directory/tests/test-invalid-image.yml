name: Test invalid image fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare directory
        run: mkdir -p "$GITHUB_WORKSPACE/chown-target"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ${{ github.workspace }}/chown-target
          ALPINE_IMAGE: localhost/this-image-does-not-exist-xyz:nope
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with nonexistent image"
            exit 1
          fi
          echo "PASS"
