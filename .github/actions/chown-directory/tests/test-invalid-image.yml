name: Test failure with invalid alpine image
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create target directory
        run: mkdir -p "$GITHUB_WORKSPACE/chown-invalid"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ${{ github.workspace }}/chown-invalid
          ALPINE_IMAGE: actionchain-nonexistent-image-xyz/does-not-exist:nope
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with nonexistent image"
            exit 1
          fi
          echo "PASS"
