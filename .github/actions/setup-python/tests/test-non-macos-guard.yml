name: Test non-macOS platform guard
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Assert action refused to run on non-macOS (or set up venv on macOS)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "platform: $(uname -s)"
          echo "VENV_PATH: ${VENV_PATH:-<unset>}"
          if [ "$(uname -s)" = "Darwin" ]; then
            if [ "$OUTCOME" != "success" ] || [ -z "$VENV_PATH" ] || [ ! -x "$VENV_PATH/bin/python" ]; then
              echo "FAIL: expected venv to be created on macOS"
              exit 1
            fi
            echo "PASS: venv created on macOS"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-macOS, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$VENV_PATH" ]; then
            echo "FAIL: VENV_PATH should not be set when the action refuses to run"
            exit 1
          fi
          if ls "${RUNNER_TEMP:-/tmp}"/venv-3.12-* >/dev/null 2>&1; then
            echo "FAIL: a venv directory was created despite platform guard"
            exit 1
          fi
          echo "PASS: action failed on non-macOS without side effects"
