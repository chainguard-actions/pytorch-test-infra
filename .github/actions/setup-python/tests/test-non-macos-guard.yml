name: Test non-macOS platform guard
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record pre-state
        run: |
          ls -1 "$RUNNER_TEMP" 2>/dev/null | grep '^venv-' > /tmp/venvs-before.txt || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Assert action refused to run on non-macOS
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "platform: $(uname -s)"
          echo "VENV_PATH: ${VENV_PATH:-<unset>}"
          if [ "$(uname -s)" = "Darwin" ]; then
            if [ "$OUTCOME" != "success" ] || [ -z "$VENV_PATH" ] || [ ! -x "$VENV_PATH/bin/python" ]; then
              echo "FAIL: expected venv on macOS"
              exit 1
            fi
            echo "PASS: venv created on macOS"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on non-macOS, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$VENV_PATH" ]; then
            echo "FAIL: VENV_PATH should not be exported when the action refuses to run"
            exit 1
          fi
          ls -1 "$RUNNER_TEMP" 2>/dev/null | grep '^venv-' > /tmp/venvs-after.txt || true
          if ! diff -q /tmp/venvs-before.txt /tmp/venvs-after.txt >/dev/null; then
            echo "FAIL: a venv directory was created in RUNNER_TEMP"
            exit 1
          fi
          echo "PASS: action exited early on non-macOS without side effects"
