name: Test action rejects non-macOS runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Assert action failed on Linux and did not create a venv
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "VENV_PATH: '${VENV_PATH:-}'"
          if [ "$(uname -s)" = "Darwin" ]; then
            echo "Running on macOS; expecting success"
            if [ "$OUTCOME" != "success" ] || [ -z "${VENV_PATH:-}" ]; then
              echo "FAIL: expected success with VENV_PATH set"
              exit 1
            fi
            echo "PASS"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on non-macOS, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "${VENV_PATH:-}" ]; then
            echo "FAIL: VENV_PATH should not be set when action fails"
            exit 1
          fi
          if ls "$RUNNER_TEMP"/venv-3.12-* >/dev/null 2>&1; then
            echo "FAIL: venv directory unexpectedly created"
            exit 1
          fi
          echo "PASS"
