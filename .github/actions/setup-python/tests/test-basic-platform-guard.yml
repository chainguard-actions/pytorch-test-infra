name: Test basic usage (platform guard)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Assert outcome matches platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uname: $(uname -s)"
          echo "VENV_PATH: ${VENV_PATH:-<unset>}"
          if [ "$(uname -s)" = "Darwin" ]; then
            if [ "$OUTCOME" != "success" ] || [ -z "$VENV_PATH" ] || [ ! -x "$VENV_PATH/bin/python" ]; then
              echo "FAIL: expected venv on macOS"
              exit 1
            fi
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected action to fail on non-macOS, got '$OUTCOME'"
              exit 1
            fi
            if [ -n "$VENV_PATH" ]; then
              echo "FAIL: VENV_PATH should not be set when the action refused to run"
              exit 1
            fi
            if ls -d "$RUNNER_TEMP"/venv-3.12-* 2>/dev/null; then
              echo "FAIL: venv directory unexpectedly created"
              exit 1
            fi
          fi
          echo "PASS"
