name: Test pip requirements file is installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake macOS environment (platform preload, brew, python)
        run: |
          set -e
          rm -rf /tmp/fakebrew
          mkdir -p /tmp/fakebrew/bin /tmp/fakebrew/shim
          cat > /tmp/fakebrew/fake-darwin.js <<'JSEOF'
          Object.defineProperty(process, 'platform', { value: 'darwin' });
          JSEOF
          cat > /tmp/fakebrew/shim/brew <<'BREWEOF'
          #!/bin/sh
          echo "brew $*" >> /tmp/fakebrew/brew.log
          if [ "$1" = "--prefix" ]; then echo /tmp/fakebrew; fi
          exit 0
          BREWEOF
          chmod +x /tmp/fakebrew/shim/brew
          cat > /tmp/fakebrew/bin/python3.12 <<'PYEOF'
          #!/bin/sh
          echo "python3.12 $*" >> /tmp/fakebrew/python.log
          if [ "$1" = "-m" ] && [ "$2" = "venv" ]; then
            mkdir -p "$3/bin"
            printf '#!/bin/sh\necho "venv-python $*" >> /tmp/fakebrew/venv-python.log\nexit 0\n' > "$3/bin/python"
            chmod +x "$3/bin/python"
            touch "$3/pyvenv.cfg"
            exit 0
          fi
          exit 1
          PYEOF
          chmod +x /tmp/fakebrew/bin/python3.12
          printf 'requests==2.31.0\n' > /tmp/fakebrew/requirements.txt
          echo "/tmp/fakebrew/shim" >> "$GITHUB_PATH"
      - id: action
        uses: .
        env:
          NODE_OPTIONS: --require /tmp/fakebrew/fake-darwin.js
        with:
          python-version: "3.12"
          pip-requirements-file: /tmp/fakebrew/requirements.txt
      - name: Assert requirements installed with venv python
        run: |
          echo "VENV_PATH: $VENV_PATH"
          echo "--- venv-python.log"; cat /tmp/fakebrew/venv-python.log || true
          if [ ! -f /tmp/fakebrew/venv-python.log ]; then
            echo "FAIL: venv python never invoked"; exit 1
          fi
          if ! grep -qx "venv-python -m pip install -r /tmp/fakebrew/requirements.txt" /tmp/fakebrew/venv-python.log; then
            echo "FAIL: expected pip install -r of the requirements file"; exit 1
          fi
          case "$VENV_PATH" in
            "$RUNNER_TEMP"/venv-3.12-*) ;;
            *) echo "FAIL: unexpected VENV_PATH"; exit 1 ;;
          esac
          echo "PASS"
