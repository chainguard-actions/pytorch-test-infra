name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Assert outcome (macOS-only action)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "platform: $(uname -s)"
          echo "VENV_PATH: ${VENV_PATH:-<unset>}"
          if [ "$(uname -s)" = "Darwin" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: expected success on macOS"
              exit 1
            fi
            case "$VENV_PATH" in
              "$RUNNER_TEMP"/venv-3.12-*) ;;
              *) echo "FAIL: unexpected VENV_PATH '$VENV_PATH'"; exit 1 ;;
            esac
            if [ ! -x "$VENV_PATH/bin/python" ]; then
              echo "FAIL: venv python missing"
              exit 1
            fi
            echo "PASS: venv created"
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected failure on non-macOS, got '$OUTCOME'"
              exit 1
            fi
            if [ -n "$VENV_PATH" ]; then
              echo "FAIL: VENV_PATH must not be set when action refuses to run"
              exit 1
            fi
            echo "PASS: action refused to run on non-macOS"
          fi
