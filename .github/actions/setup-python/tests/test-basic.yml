name: Test basic usage (platform guard)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Assert outcome matches platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "runner os: $RUNNER_OS"
          echo "outcome: $OUTCOME"
          echo "VENV_PATH: ${VENV_PATH:-<unset>}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: expected success on macOS"
              exit 1
            fi
            if [ -z "$VENV_PATH" ] || [ ! -x "$VENV_PATH/bin/python" ]; then
              echo "FAIL: venv not created"
              exit 1
            fi
            echo "PASS: venv created on macOS"
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected the action to refuse to run on non-macOS, got '$OUTCOME'"
              exit 1
            fi
            if [ -n "$VENV_PATH" ]; then
              echo "FAIL: VENV_PATH must not be exported when the platform guard trips"
              exit 1
            fi
            echo "PASS: action rejected non-macOS platform without side effects"
          fi
