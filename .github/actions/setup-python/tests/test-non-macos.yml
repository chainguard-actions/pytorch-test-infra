name: Test action fails on non-macOS runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Assert action failed and exported nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "VENV_PATH: ${VENV_PATH:-<unset>}"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on Linux runner"
            exit 1
          fi
          if [ -n "$VENV_PATH" ]; then
            echo "FAIL: VENV_PATH should not be set when the action refuses to run"
            exit 1
          fi
          echo "PASS"
