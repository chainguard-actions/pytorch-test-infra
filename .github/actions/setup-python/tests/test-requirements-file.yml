name: Test pip requirements file is installed into the venv
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake brew and fake Homebrew python
        run: |
          FAKE_DIR="$RUNNER_TEMP/fake-brew"
          rm -rf "$FAKE_DIR"
          mkdir -p "$FAKE_DIR/bin" "$FAKE_DIR/prefix/bin"
          cp tests/fixtures/fake-brew.sh "$FAKE_DIR/bin/brew"
          cp tests/fixtures/fake-python.sh "$FAKE_DIR/prefix/bin/python3.10"
          chmod +x "$FAKE_DIR/bin/brew" "$FAKE_DIR/prefix/bin/python3.10"
          : > "$FAKE_DIR/log"
          echo "requests==2.31.0" > "$FAKE_DIR/requirements.txt"
          echo "FAKE_LOG=$FAKE_DIR/log" >> "$GITHUB_ENV"
          echo "FAKE_PREFIX=$FAKE_DIR/prefix" >> "$GITHUB_ENV"
          echo "REQ_FILE=$FAKE_DIR/requirements.txt" >> "$GITHUB_ENV"
          echo "$FAKE_DIR/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/tests/fixtures/fake-darwin.js
        with:
          python-version: "3.10"
          pip-requirements-file: ${{ env.REQ_FILE }}
      - name: Assert requirements installed with venv python
        run: |
          echo "log:"; cat "$FAKE_LOG"
          echo "VENV_PATH: $VENV_PATH"
          grep -qx "brew install python@3.10" "$FAKE_LOG" || { echo "FAIL: expected brew install python@3.10"; exit 1; }
          grep -qx "venvpython -m pip install -r $REQ_FILE" "$FAKE_LOG" || { echo "FAIL: pip install -r not run with venv python"; exit 1; }
          case "$VENV_PATH" in
            "$RUNNER_TEMP"/venv-3.10-*) ;;
            *) echo "FAIL: unexpected VENV_PATH"; exit 1 ;;
          esac
          echo "PASS"
