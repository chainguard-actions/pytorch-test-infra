name: Test non-macOS runner is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Assert action failed on Linux
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on a non-macOS runner"
            exit 1
          fi
          echo "PASS"
      - name: Assert no venv was registered
        run: |
          echo "VENV_PATH: '${VENV_PATH:-}'"
          if [ -n "${VENV_PATH:-}" ]; then
            echo "FAIL: VENV_PATH should not be set"
            exit 1
          fi
          echo "PASS"
