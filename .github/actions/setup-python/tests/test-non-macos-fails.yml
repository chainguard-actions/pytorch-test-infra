name: Test non-macOS platform guard
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Assert action refused to run on Linux
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "platform: $(uname -s)"
          if [ "$(uname -s)" = "Darwin" ]; then
            echo "SKIP: running on macOS, guard not applicable"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on non-macOS, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert no venv side effects
        run: |
          echo "VENV_PATH='${VENV_PATH:-}'"
          if [ -n "${VENV_PATH:-}" ]; then
            echo "FAIL: VENV_PATH should not be set"
            exit 1
          fi
          if ls -d "$RUNNER_TEMP"/venv-3.12-* 2>/dev/null; then
            echo "FAIL: venv directory should not have been created"
            exit 1
          fi
          echo "PASS"
