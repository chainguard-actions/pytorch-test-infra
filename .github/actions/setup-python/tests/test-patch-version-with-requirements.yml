name: Test patch version with requirements file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create requirements file
        run: |
          echo "six" > "$RUNNER_TEMP/requirements.txt"
          echo "REQ_FILE=$RUNNER_TEMP/requirements.txt" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.11.4"
          pip-requirements-file: ${{ env.REQ_FILE }}
      - name: Assert outcome (macOS-only action)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "platform: $(uname -s)"
          echo "VENV_PATH: ${VENV_PATH:-<unset>}"
          if [ "$(uname -s)" = "Darwin" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: expected success on macOS"
              exit 1
            fi
            case "$VENV_PATH" in
              "$RUNNER_TEMP"/venv-3.11-*) ;;
              *) echo "FAIL: patch version not truncated, VENV_PATH '$VENV_PATH'"; exit 1 ;;
            esac
            "$VENV_PATH/bin/python" -c "import six" || { echo "FAIL: requirements not installed"; exit 1; }
            echo "PASS"
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected failure on non-macOS, got '$OUTCOME'"
              exit 1
            fi
            if [ -n "$VENV_PATH" ]; then
              echo "FAIL: VENV_PATH must not be set"
              exit 1
            fi
            echo "PASS: action refused to run on non-macOS"
          fi
