name: Test patch version with requirements file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create requirements file
        run: |
          echo "# no requirements" > "$RUNNER_TEMP/requirements.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.11.9"
          pip-requirements-file: ${{ runner.temp }}/requirements.txt
      - name: Assert outcome matches platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "runner os: $RUNNER_OS"
          echo "outcome: $OUTCOME"
          echo "VENV_PATH: ${VENV_PATH:-<unset>}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: expected success on macOS"
              exit 1
            fi
            case "$VENV_PATH" in
              */venv-3.11-*) ;;
              *) echo "FAIL: expected venv path truncated to major.minor (venv-3.11-*)"; exit 1 ;;
            esac
            echo "PASS"
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected the action to refuse to run on non-macOS, got '$OUTCOME'"
              exit 1
            fi
            if [ -n "$VENV_PATH" ]; then
              echo "FAIL: VENV_PATH must not be exported on non-macOS"
              exit 1
            fi
            if ls "$RUNNER_TEMP" | grep -q '^venv-'; then
              echo "FAIL: a venv directory was created despite platform guard"
              exit 1
            fi
            echo "PASS: action rejected non-macOS platform without side effects"
          fi
