name: Test patch-level version with requirements file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create requirements file
        run: |
          mkdir -p "$RUNNER_TEMP/reqs"
          echo "six" > "$RUNNER_TEMP/reqs/requirements.txt"
          echo "REQ_FILE=$RUNNER_TEMP/reqs/requirements.txt" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.11.4"
          pip-requirements-file: ${{ env.REQ_FILE }}
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "VENV_PATH: ${VENV_PATH:-<unset>}"
          if [ "$(uname -s)" = "Darwin" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: expected success on macOS"
              exit 1
            fi
            case "$VENV_PATH" in
              */venv-3.11-*) ;;
              *) echo "FAIL: expected version truncated to 3.11 in VENV_PATH"; exit 1 ;;
            esac
            "$VENV_PATH/bin/python" -c "import six" || { echo "FAIL: six not installed"; exit 1; }
            echo "PASS"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on non-macOS, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$VENV_PATH" ]; then
            echo "FAIL: VENV_PATH should not be set"
            exit 1
          fi
          case ":$PATH:" in
            *venv-3.11-*) echo "FAIL: venv bin added to PATH"; exit 1 ;;
          esac
          echo "PASS: action rejected non-macOS platform before installing anything"
