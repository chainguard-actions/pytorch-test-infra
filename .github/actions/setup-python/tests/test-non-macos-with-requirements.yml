name: Test non-macOS guard with patch version and requirements file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create requirements file
        run: echo "six" > "$RUNNER_TEMP/requirements.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.11.4"
          pip-requirements-file: ${{ runner.temp }}/requirements.txt
      - name: Assert action failed before doing any work
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$(uname -s)" = "Darwin" ]; then
            echo "SKIP: running on macOS, guard not applicable"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on non-macOS, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "${VENV_PATH:-}" ]; then
            echo "FAIL: VENV_PATH should not be set"
            exit 1
          fi
          if ls -d "$RUNNER_TEMP"/venv-3.11* 2>/dev/null; then
            echo "FAIL: venv directory should not exist"
            exit 1
          fi
          case ":$PATH:" in
            *venv-3.11*) echo "FAIL: venv bin added to PATH"; exit 1 ;;
          esac
          echo "PASS"
