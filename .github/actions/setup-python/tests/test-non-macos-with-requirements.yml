name: Test action with requirements file rejects non-macOS runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create requirements file
        run: echo "six" > "$RUNNER_TEMP/requirements.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.11.4"
          pip-requirements-file: ${{ runner.temp }}/requirements.txt
      - name: Assert action failed early on Linux without touching PATH
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "PATH: $PATH"
          if [ "$(uname -s)" = "Darwin" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: expected success on macOS"
              exit 1
            fi
            echo "PASS"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on non-macOS, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "${VENV_PATH:-}" ]; then
            echo "FAIL: VENV_PATH should not be set"
            exit 1
          fi
          case "$PATH" in
            *venv-3.11-*) echo "FAIL: venv bin added to PATH"; exit 1 ;;
          esac
          echo "PASS"
