name: Test patch version is truncated to major.minor
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake brew and fake Homebrew python
        run: |
          FAKE_DIR="$RUNNER_TEMP/fake-brew"
          rm -rf "$FAKE_DIR"
          mkdir -p "$FAKE_DIR/bin" "$FAKE_DIR/prefix/bin"
          cp tests/fixtures/fake-brew.sh "$FAKE_DIR/bin/brew"
          cp tests/fixtures/fake-python.sh "$FAKE_DIR/prefix/bin/python3.11"
          chmod +x "$FAKE_DIR/bin/brew" "$FAKE_DIR/prefix/bin/python3.11"
          : > "$FAKE_DIR/log"
          echo "FAKE_LOG=$FAKE_DIR/log" >> "$GITHUB_ENV"
          echo "FAKE_PREFIX=$FAKE_DIR/prefix" >> "$GITHUB_ENV"
          echo "$FAKE_DIR/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/tests/fixtures/fake-darwin.js
        with:
          python-version: "3.11.4"
      - name: Assert truncated formula and venv path
        run: |
          echo "log:"; cat "$FAKE_LOG"
          echo "VENV_PATH: $VENV_PATH"
          grep -qx "brew install python@3.11" "$FAKE_LOG" || { echo "FAIL: expected brew install python@3.11"; exit 1; }
          if grep -q "python@3.11.4" "$FAKE_LOG"; then echo "FAIL: patch version not truncated"; exit 1; fi
          case "$VENV_PATH" in
            "$RUNNER_TEMP"/venv-3.11-*) ;;
            *) echo "FAIL: VENV_PATH should be \$RUNNER_TEMP/venv-3.11-<ts>"; exit 1 ;;
          esac
          [ -x "$VENV_PATH/bin/python" ] || { echo "FAIL: venv python missing"; exit 1; }
          echo "PASS"
