name: Test custom stable-branch and test-infra inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Hello-World
          stable-branch: viable/custom-test
          requires: '["build"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: nobody
          clickhouse-password: nothing
          test-infra-repository: pytorch/test-infra
          test-infra-ref: main
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH: ${{ steps.action.outputs.push_result }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          echo "push: $PUSH"
          echo "time: $TIME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: success but latest_viable_sha empty"
              exit 1
            fi
            echo "PASS: got sha $SHA"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$TIME" ]; then
              echo "FAIL: push step should not have run when commit lookup failed"
              exit 1
            fi
            echo "PASS: failed gracefully (no ClickHouse / helper script unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
