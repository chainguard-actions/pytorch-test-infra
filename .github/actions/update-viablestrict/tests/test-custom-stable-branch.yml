name: Test custom stable branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Spoon-Knife
          stable-branch: viable/custom-test
          requires: '["build"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: https://clickhouse.invalid:8443
          clickhouse-username: default
          clickhouse-password: unused
      - name: Assert target repository was checked out with full history
        run: |
          DIR="$GITHUB_WORKSPACE/octocat/Spoon-Knife"
          if [ ! -d "$DIR/.git" ]; then
            echo "FAIL: expected checkout at octocat/Spoon-Knife"
            exit 1
          fi
          SHALLOW="$(git -C "$DIR" rev-parse --is-shallow-repository)"
          echo "shallow: $SHALLOW"
          if [ "$SHALLOW" != "false" ]; then
            echo "FAIL: expected full history (fetch-depth: 0)"
            exit 1
          fi
          echo "PASS"
      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH: ${{ steps.action.outputs.push_result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          echo "push: $PUSH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: action succeeded but latest_viable_sha is empty"
              exit 1
            fi
            echo "PASS: got sha '$SHA'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$PUSH" ]; then
              echo "FAIL: push should not have happened when the action failed"
              exit 1
            fi
            echo "PASS: action failed gracefully (ClickHouse/test-infra scripts unavailable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
