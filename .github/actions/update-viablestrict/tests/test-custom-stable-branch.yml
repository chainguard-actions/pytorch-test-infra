name: Test custom stable branch does not push on lookup failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Hello-World
          stable-branch: viable/test-branch
          requires: '["build"]'
          secret-bot-token: ${{ secrets.GITHUB_TOKEN }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: nobody
          clickhouse-password: nothing
      - name: Assert failure and no push output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUSH_RESULT: ${{ steps.action.outputs.push_result }}
          PUSH_TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "outcome: $OUTCOME"
          echo "push_result: '$PUSH_RESULT'"
          echo "time: '$PUSH_TIME'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$PUSH_RESULT" ] || [ -n "$PUSH_TIME" ]; then
            echo "FAIL: push to stable branch should not have happened"
            exit 1
          fi
          echo "PASS"
