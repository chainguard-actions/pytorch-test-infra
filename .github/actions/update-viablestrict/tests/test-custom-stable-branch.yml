name: Test custom stable branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Spoon-Knife
          stable-branch: test/viable-strict
          requires: '["lint"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: nobody
          clickhouse-password: nothing
      - name: Assert full-history checkout in repository-named subdirectory
        run: |
          DIR="$GITHUB_WORKSPACE/octocat/Spoon-Knife"
          if [ ! -d "$DIR/.git" ]; then
            echo "FAIL: expected checkout at $DIR"
            exit 1
          fi
          SHALLOW="$(git -C "$DIR" rev-parse --is-shallow-repository)"
          echo "shallow: $SHALLOW"
          if [ "$SHALLOW" != "false" ]; then
            echo "FAIL: expected full history (fetch-depth: 0)"
            exit 1
          fi
          echo "PASS"
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH: ${{ steps.action.outputs.push_result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          echo "push_result: $PUSH"
          if [ "$OUTCOME" = "failure" ]; then
            if [ -n "$PUSH" ]; then
              echo "FAIL: push should not have happened when the action failed"
              exit 1
            fi
            echo "PASS: action failed as expected (ClickHouse unreachable)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: action succeeded but latest_viable_sha is empty"
              exit 1
            fi
            echo "PASS: got sha '$SHA'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
