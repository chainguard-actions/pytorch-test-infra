name: Test custom stable branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Spoon-Knife
          stable-branch: viable/custom-test
          requires: '["pull"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: user
          clickhouse-password: pass
      - name: Assert target repo was fully checked out
        run: |
          DIR="$GITHUB_WORKSPACE/octocat/Spoon-Knife"
          if [ ! -f "$DIR/index.html" ]; then
            echo "FAIL: expected index.html in $DIR"
            exit 1
          fi
          if [ "$(git -C "$DIR" rev-parse --is-shallow-repository)" != "false" ]; then
            echo "FAIL: expected full history (fetch-depth: 0)"
            exit 1
          fi
          echo "PASS"
      - name: Assert action outcome
        env:
          RESULT: ${{ steps.action.outputs.latest_viable_sha }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but latest_viable_sha is empty"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no reachable ClickHouse / fetch script)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
