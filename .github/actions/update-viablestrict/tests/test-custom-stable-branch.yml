name: Test custom stable-branch does not push when no green commit is found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Spoon-Knife
          stable-branch: viable/test-branch
          requires: '["lint"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: user
          clickhouse-password: pass
      - name: Assert checkout landed in repository-named subdirectory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/octocat/Spoon-Knife/index.html" ]; then
            echo "FAIL: expected octocat/Spoon-Knife/index.html"
            exit 1
          fi
          echo "PASS"
      - name: Assert stable branch was not created remotely-tracked locally and outcome is sane
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "outcome: $OUTCOME sha: $SHA time: $TIME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: success but empty sha"
              exit 1
            fi
            if [ "$SHA" != "None" ] && ! echo "$TIME" | grep -qE '^[0-9]+$'; then
              echo "FAIL: expected numeric time output after push attempt"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$TIME" ]; then
              echo "FAIL: push step should have been skipped"
              exit 1
            fi
            echo "PASS: failed gracefully without ClickHouse/test-infra scripts"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
