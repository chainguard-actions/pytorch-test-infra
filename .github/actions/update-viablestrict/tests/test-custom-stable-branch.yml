name: Test custom stable branch is not pushed when green commit lookup fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Hello-World
          stable-branch: viable/custom-test
          requires: '["build"]'
          secret-bot-token: ${{ secrets.GITHUB_TOKEN }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: nobody
          clickhouse-password: nothing
      - name: Assert failure and no push
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH_RESULT: ${{ steps.action.outputs.push_result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: '$SHA'"
          echo "push_result: '$PUSH_RESULT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SHA" ] || [ -n "$PUSH_RESULT" ]; then
            echo "FAIL: outputs should be empty when lookup fails"
            exit 1
          fi
          echo "PASS"
      - name: Assert custom branch was not created locally or remotely
        run: |
          DIR="$GITHUB_WORKSPACE/octocat/Hello-World"
          if [ -d "$DIR/.git" ]; then
            if git -C "$DIR" ls-remote --exit-code origin refs/heads/viable/custom-test >/dev/null 2>&1; then
              echo "FAIL: branch viable/custom-test exists on remote"
              exit 1
            fi
          fi
          echo "PASS"
