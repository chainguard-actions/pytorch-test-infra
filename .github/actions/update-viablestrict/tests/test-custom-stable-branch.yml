name: Test custom stable branch does not push on lookup failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Hello-World
          stable-branch: my/custom-stable
          requires: '["lint"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: http://invalid.invalid:8123
          clickhouse-username: nobody
          clickhouse-password: nothing
      - name: Assert checkout happened
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/octocat/Hello-World/README" ]; then
            echo "FAIL: repo not checked out at octocat/Hello-World"
            exit 1
          fi
          echo "PASS"
      - name: Assert outcome and no push/time outputs on failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH: ${{ steps.action.outputs.push_result }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "outcome: $OUTCOME sha: $SHA push: $PUSH time: $TIME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: success but empty latest_viable_sha"
              exit 1
            fi
            if [ "$SHA" != "None" ] && ! echo "$TIME" | grep -qE '^[0-9]+$'; then
              echo "FAIL: push ran but time output is not a unix timestamp"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$PUSH" ] || [ -n "$TIME" ]; then
              echo "FAIL: push step should have been skipped"
              exit 1
            fi
            echo "PASS: failed gracefully without pushing"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert custom stable branch was not created locally
        run: |
          cd "$GITHUB_WORKSPACE/octocat/Hello-World"
          if git show-ref --verify --quiet refs/heads/my/custom-stable; then
            echo "FAIL: unexpected local branch my/custom-stable"
            exit 1
          fi
          echo "PASS"
