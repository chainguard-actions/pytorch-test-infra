name: Test invalid ClickHouse endpoint fails without pushing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Hello-World
          requires: '["pull", "trunk"]'
          secret-bot-token: ${{ secrets.GITHUB_TOKEN }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: invalid-user
          clickhouse-password: invalid-password
      - name: Assert action failed and nothing was pushed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH_RESULT: ${{ steps.action.outputs.push_result }}
          PUSH_TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: '$SHA'"
          echo "push_result: '$PUSH_RESULT'"
          echo "time: '$PUSH_TIME'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with unreachable ClickHouse, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SHA" ]; then
            echo "FAIL: latest_viable_sha should be empty"
            exit 1
          fi
          if [ -n "$PUSH_RESULT" ] || [ -n "$PUSH_TIME" ]; then
            echo "FAIL: push step should not have run"
            exit 1
          fi
          echo "PASS"
      - name: Assert target repository was cloned with full history
        run: |
          DIR="$GITHUB_WORKSPACE/octocat/Hello-World"
          if [ ! -d "$DIR/.git" ]; then
            echo "FAIL: expected repository checkout at $DIR"
            exit 1
          fi
          SHALLOW=$(git -C "$DIR" rev-parse --is-shallow-repository)
          echo "shallow: $SHALLOW"
          if [ "$SHALLOW" != "false" ]; then
            echo "FAIL: expected full history (fetch-depth 0)"
            exit 1
          fi
          echo "PASS"
