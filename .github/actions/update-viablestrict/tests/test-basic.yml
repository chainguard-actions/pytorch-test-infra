name: Test basic usage (checkout target repo, fetch green commit)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Hello-World
          requires: '["pull", "trunk"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: test-user
          clickhouse-password: test-password
      - name: Assert target repo was checked out into its repository-named subdirectory
        run: |
          ls -la "$GITHUB_WORKSPACE/octocat/Hello-World" || true
          if [ ! -d "$GITHUB_WORKSPACE/octocat/Hello-World/.git" ]; then
            echo "FAIL: expected octocat/Hello-World to be checked out under the workspace"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/octocat/Hello-World/README" ]; then
            echo "FAIL: expected README in checked-out repo"
            exit 1
          fi
          echo "PASS"
      - name: Assert action outcome (needs ClickHouse + test-infra scripts; must fail gracefully without them)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH: ${{ steps.action.outputs.push_result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          echo "push_result: $PUSH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: action succeeded but latest_viable_sha is empty"
              exit 1
            fi
            echo "PASS: got sha '$SHA'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$PUSH" ]; then
              echo "FAIL: push should not have happened when fetching the green commit failed"
              exit 1
            fi
            echo "PASS: action failed gracefully (no reachable ClickHouse / test-infra scripts)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
