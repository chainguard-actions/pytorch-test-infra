name: Test basic usage (no ClickHouse access)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actions/checkout
          stable-branch: viable/strict-test
          requires: '["pull", "trunk"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: https://clickhouse.invalid:8443
          clickhouse-username: test-user
          clickhouse-password: test-password
      - name: Assert repository was checked out into its own subdirectory with full history
        run: |
          DIR="$GITHUB_WORKSPACE/actions/checkout"
          ls -la "$DIR" || true
          if [ ! -f "$DIR/action.yml" ]; then
            echo "FAIL: expected $DIR/action.yml from checkout of actions/checkout"
            exit 1
          fi
          COUNT=$(git -C "$DIR" rev-list --count HEAD)
          echo "commit count: $COUNT"
          if [ "$COUNT" -le 1 ]; then
            echo "FAIL: expected full history (fetch-depth: 0)"
            exit 1
          fi
          echo "PASS"
      - name: Assert outcome (ClickHouse is unreachable so fetching the green commit fails)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH: ${{ steps.action.outputs.push_result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          echo "push_result: $PUSH"
          if [ "$OUTCOME" = "failure" ]; then
            if [ -n "$PUSH" ]; then
              echo "FAIL: push should not run when fetching latest commit failed"
              exit 1
            fi
            echo "PASS: action failed gracefully without ClickHouse access"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: action succeeded but latest_viable_sha is empty"
              exit 1
            fi
            echo "PASS: got sha '$SHA'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
