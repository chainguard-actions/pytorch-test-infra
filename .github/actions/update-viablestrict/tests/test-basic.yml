name: Test basic usage (unreachable ClickHouse)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actions/hello-world-javascript-action
          requires: '["pull", "trunk"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: nobody
          clickhouse-password: nothing
      - name: Assert target repository was checked out into its subdirectory
        run: |
          DIR="$GITHUB_WORKSPACE/actions/hello-world-javascript-action"
          ls -la "$DIR" || true
          if [ ! -d "$DIR/.git" ]; then
            echo "FAIL: expected git checkout at $DIR"
            exit 1
          fi
          if [ "$(git -C "$DIR" rev-parse --is-shallow-repository)" != "false" ]; then
            echo "FAIL: expected full history (fetch-depth: 0)"
            exit 1
          fi
          echo "PASS: repository checked out with full history"
      - name: Assert outcome
        env:
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH: ${{ steps.action.outputs.push_result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          echo "push_result: $PUSH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: action succeeded but latest_viable_sha is empty"
              exit 1
            fi
            echo "PASS: got sha '$SHA'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$PUSH" ]; then
              echo "FAIL: push should not have happened when commit lookup failed"
              exit 1
            fi
            echo "PASS: action failed gracefully (ClickHouse unreachable), no push attempted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
