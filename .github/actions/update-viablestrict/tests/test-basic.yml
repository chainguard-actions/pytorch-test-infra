name: Test basic usage (no ClickHouse available)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Hello-World
          requires: '["pull", "trunk"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: nobody
          clickhouse-password: nothing
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH: ${{ steps.action.outputs.push_result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          echo "push: $PUSH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: success but latest_viable_sha empty"
              exit 1
            fi
            echo "PASS: got sha $SHA"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$PUSH" ]; then
              echo "FAIL: push step should not have run when commit lookup failed"
              exit 1
            fi
            echo "PASS: failed gracefully (no ClickHouse / helper script unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert repository was checked out into path named after the repository
        run: |
          ls -la "$GITHUB_WORKSPACE/octocat" || true
          if [ ! -d "$GITHUB_WORKSPACE/octocat/Hello-World/.git" ]; then
            echo "FAIL: expected checkout at octocat/Hello-World"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/octocat/Hello-World/README" ]; then
            echo "FAIL: expected README in checked-out repo"
            exit 1
          fi
          echo "PASS"
