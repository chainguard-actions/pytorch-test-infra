name: Test basic usage (clone + latest green commit lookup)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Hello-World
          requires: '["pull", "trunk"]'
          secret-bot-token: ${{ secrets.GITHUB_TOKEN }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: default
          clickhouse-password: unused
      - name: Assert repository was cloned into the repository-named subdirectory
        run: |
          ls -la "$GITHUB_WORKSPACE/octocat/Hello-World" || true
          if [ ! -d "$GITHUB_WORKSPACE/octocat/Hello-World/.git" ] && [ ! -f "$GITHUB_WORKSPACE/octocat/Hello-World/.git" ]; then
            echo "FAIL: expected clone at octocat/Hello-World"
            exit 1
          fi
          echo "PASS: repository cloned"
      - name: Assert outcome (ClickHouse is not reachable under the harness)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH: ${{ steps.action.outputs.push_result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          echo "push_result: $PUSH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: action succeeded but latest_viable_sha is empty"
              exit 1
            fi
            echo "PASS: got sha '$SHA'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$PUSH" ]; then
              echo "FAIL: push must not run when the green-commit lookup failed"
              exit 1
            fi
            echo "PASS: action failed gracefully before pushing (no ClickHouse/script available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
