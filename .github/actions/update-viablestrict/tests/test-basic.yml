name: Test basic usage (unreachable ClickHouse)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Hello-World
          requires: '["pull", "trunk"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: nobody
          clickhouse-password: nothing
      - name: Assert target repository was checked out into its own subdirectory
        run: |
          ls -la "$GITHUB_WORKSPACE/octocat/Hello-World" || true
          if [ ! -d "$GITHUB_WORKSPACE/octocat/Hello-World/.git" ]; then
            echo "FAIL: octocat/Hello-World was not checked out"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/octocat/Hello-World/README" ]; then
            echo "FAIL: README missing from checkout"
            exit 1
          fi
          DEPTH=$(git -C "$GITHUB_WORKSPACE/octocat/Hello-World" rev-list --count HEAD)
          echo "commit count: $DEPTH"
          if [ "$(git -C "$GITHUB_WORKSPACE/octocat/Hello-World" rev-parse --is-shallow-repository)" != "false" ]; then
            echo "FAIL: expected full history (fetch-depth 0)"
            exit 1
          fi
          echo "PASS"
      - name: Assert action failed without pushing (ClickHouse unreachable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.latest_viable_sha }}
          PUSH: ${{ steps.action.outputs.push_result }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: '$SHA' push: '$PUSH' time: '$TIME'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since ClickHouse is unreachable, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$PUSH" ] || [ -n "$TIME" ]; then
            echo "FAIL: push step should not have run"
            exit 1
          fi
          echo "PASS"
