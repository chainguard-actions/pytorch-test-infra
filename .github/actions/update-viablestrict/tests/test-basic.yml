name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Hello-World
          requires: '["pull", "trunk"]'
          secret-bot-token: ${{ github.token }}
          clickhouse-url: http://127.0.0.1:1
          clickhouse-username: user
          clickhouse-password: pass
      - name: Assert target repo was checked out into its own subdirectory
        run: |
          ls -la "$GITHUB_WORKSPACE/octocat/Hello-World" || true
          if [ ! -d "$GITHUB_WORKSPACE/octocat/Hello-World/.git" ]; then
            echo "FAIL: expected repository checked out at octocat/Hello-World"
            exit 1
          fi
          echo "PASS"
      - name: Assert action outcome
        env:
          RESULT: ${{ steps.action.outputs.latest_viable_sha }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but latest_viable_sha is empty"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no reachable ClickHouse / fetch script)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
