name: Test upload attempt with real files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create files to upload
        run: |
          mkdir -p /tmp/upload-src/sub
          echo "hello" > /tmp/upload-src/a.txt
          echo "world" > /tmp/upload-src/sub/b.txt
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
        with:
          name: act-test-artifact
          path: /tmp/upload-src
          s3-bucket: actionchain-nonexistent-test-bucket-xyz
          region: us-east-1
      - name: Assert upload succeeded with output or failed on missing S3 access
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.uploaded-objects }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ] || ! echo "$RESULT" | grep -q "a.txt"; then
              echo "FAIL: action succeeded but uploaded-objects missing expected keys"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no S3 credentials/bucket access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
