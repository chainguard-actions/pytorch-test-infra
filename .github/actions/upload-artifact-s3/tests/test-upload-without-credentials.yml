name: Test upload attempt with real files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create files to upload
        run: |
          mkdir -p upload-test-dir
          echo "hello" > upload-test-dir/a.txt
          echo "world" > upload-test-dir/b.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-artifact
          path: upload-test-dir
          if-no-files-found: error
          s3-bucket: actionchain-nonexistent-test-bucket-xyz
          region: us-east-1
      - name: Assert action attempted upload (succeeds with outputs, or fails without AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.uploaded-objects }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ] || ! echo "$RESULT" | grep -q "a.txt"; then
              echo "FAIL: action succeeded but uploaded-objects is missing expected keys"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (no AWS credentials / bucket unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
