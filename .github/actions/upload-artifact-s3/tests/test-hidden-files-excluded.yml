name: Test hidden files are excluded by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory containing only hidden files
        run: |
          rm -rf hidden-only
          mkdir -p hidden-only/.secret-dir
          echo "hidden" > hidden-only/.hidden-file
          echo "nested" > hidden-only/.secret-dir/file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: hidden-only
          if-no-files-found: error
          include-hidden-files: 'false'
      - name: Assert no files were found (hidden files excluded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.uploaded-objects }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded-objects: '$ACTUAL'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since only hidden files exist and they are excluded"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no uploaded objects"
            exit 1
          fi
          echo "PASS"
