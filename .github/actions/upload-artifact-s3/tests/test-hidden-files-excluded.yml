name: Test hidden files are excluded by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory with only hidden files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hidden-only"
          echo "secret" > "$GITHUB_WORKSPACE/hidden-only/.hidden-file"
          ls -la "$GITHUB_WORKSPACE/hidden-only"
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: hidden-only
          path: hidden-only
          if-no-files-found: error
          include-hidden-files: 'false'
      - name: Assert no files were found (hidden excluded) so the step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.uploaded-objects }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded-objects: '$ACTUAL'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since hidden files should be excluded"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no uploaded objects"
            exit 1
          fi
          echo "PASS"
