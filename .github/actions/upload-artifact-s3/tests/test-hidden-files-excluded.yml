name: Test hidden files are excluded by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory containing only hidden files
        run: |
          rm -rf "$RUNNER_TEMP/hidden-only"
          mkdir -p "$RUNNER_TEMP/hidden-only/.secretdir"
          echo "secret" > "$RUNNER_TEMP/hidden-only/.hidden-file"
          echo "secret2" > "$RUNNER_TEMP/hidden-only/.secretdir/inner.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/hidden-only
          if-no-files-found: error
      - name: Assert no files were found (hidden files excluded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.uploaded-objects }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since only hidden files exist and they should be excluded"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no uploaded-objects output"
            exit 1
          fi
          echo "PASS"
