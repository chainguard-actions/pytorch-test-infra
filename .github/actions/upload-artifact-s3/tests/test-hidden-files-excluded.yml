name: Test hidden files are excluded by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create only hidden files
        run: |
          rm -rf /tmp/hidden-only
          mkdir -p /tmp/hidden-only/.secretdir
          echo "hidden" > /tmp/hidden-only/.hidden-file
          echo "nested" > /tmp/hidden-only/.secretdir/file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/hidden-only
          if-no-files-found: error
      - name: Assert hidden files were excluded (no files found -> failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.uploaded-objects }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded-objects: '$ACTUAL'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected hidden files to be excluded, causing no-files error"
            exit 1
          fi
          echo "PASS"
