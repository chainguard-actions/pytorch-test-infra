name: Test hidden files excluded by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory with only hidden files
        run: |
          mkdir -p "$RUNNER_TEMP/hidden-only"
          echo "secret" > "$RUNNER_TEMP/hidden-only/.hidden-file"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/hidden-only
          if-no-files-found: error
          include-hidden-files: 'false'
      - name: Assert hidden files were not found (action failed with no files)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since only hidden files exist and they are excluded"
            exit 1
          fi
          echo "PASS"
