name: Test hidden files are excluded by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory containing only hidden files
        run: |
          mkdir -p /tmp/hidden-only/.secret
          echo "hidden" > /tmp/hidden-only/.hidden-file
          echo "nested" > /tmp/hidden-only/.secret/data.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/hidden-only
          if-no-files-found: error
          include-hidden-files: 'false'
      - name: Assert hidden files were excluded (no files found -> error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected 'no files found' failure since only hidden files exist"
            exit 1
          fi
          echo "PASS"
