name: Test no files found (ignore)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: does-not-exist-dir/missing-file.bin
          if-no-files-found: ignore
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UPLOADED: ${{ steps.action.outputs.uploaded-objects }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded: $UPLOADED"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with if-no-files-found=ignore"
            exit 1
          fi
          if [ -n "$UPLOADED" ] && [ "$UPLOADED" != "{}" ]; then
            echo "FAIL: expected no uploaded objects"
            exit 1
          fi
          echo "PASS"
