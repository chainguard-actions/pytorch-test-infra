name: Test no files found (warn default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: does-not-exist-dir/**/*.nothing
      - name: Assert success and no uploaded objects
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.uploaded-objects }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "$RESULT" ] && [ "$RESULT" != "{}" ]; then
            echo "FAIL: expected no uploaded objects"
            exit 1
          fi
          echo "PASS"
