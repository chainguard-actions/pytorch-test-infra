name: Test no files found with warn (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: does-not-exist-dir/**/*.nothing
      - name: Assert step succeeded with no uploaded objects
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.uploaded-objects }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded-objects: '$ACTUAL'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -n "$NORM" ] && [ "$NORM" != "{}" ]; then
            echo "FAIL: expected no uploaded objects"
            exit 1
          fi
          echo "PASS"
