name: Test no files found (warn, default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-artifact
          path: does-not-exist-dir/**/*.txt
      - name: Assert action succeeded with warning and uploaded nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UPLOADED: ${{ steps.action.outputs.uploaded-objects }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded: $UPLOADED"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with default if-no-files-found=warn"
            exit 1
          fi
          if [ -n "$UPLOADED" ] && [ "$UPLOADED" != "{}" ]; then
            echo "FAIL: expected no uploaded objects"
            exit 1
          fi
          echo "PASS"
