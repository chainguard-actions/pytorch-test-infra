name: Test upload attempt with files present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create files to upload
        run: |
          mkdir -p "$RUNNER_TEMP/upload-src/sub"
          echo "hello" > "$RUNNER_TEMP/upload-src/a.txt"
          echo "world" > "$RUNNER_TEMP/upload-src/sub/b.txt"
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: AKIAEXAMPLEEXAMPLE00
          AWS_SECRET_ACCESS_KEY: examplesecretexamplesecretexamplesecret0
          AWS_MAX_ATTEMPTS: "1"
        with:
          name: test-artifact
          path: ${{ runner.temp }}/upload-src
          s3-bucket: actionchain-harness-nonexistent-bucket-test
          if-no-files-found: error
      - name: Assert upload succeeded with objects or failed on credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.uploaded-objects }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            NORM="$(echo "$RESULT" | tr -d '[:space:]')"
            if [ -z "$NORM" ] || [ "$NORM" = "{}" ]; then
              echo "FAIL: action succeeded but uploaded-objects is empty"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action found files and failed at S3 upload (no valid AWS credentials in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
