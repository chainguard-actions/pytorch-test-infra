name: Test upload attempt with files present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create files to upload
        run: |
          mkdir -p upload-dir/sub
          echo "hello" > upload-dir/a.txt
          echo "world" > upload-dir/sub/b.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-artifact
          path: upload-dir
          s3-bucket: actionchain-nonexistent-test-bucket-xyz
          s3-prefix: actionchain-test/prefix
          if-no-files-found: error
      - name: Assert action ran (output set, or failed on unreachable/unauthenticated S3)
        env:
          RESULT: ${{ steps.action.outputs.uploaded-objects }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$RESULT" | grep -q 'actionchain-test/prefix/a.txt'; then
              echo "FAIL: action succeeded but output missing expected key"
              exit 1
            fi
            if ! echo "$RESULT" | grep -q 'actionchain-test/prefix/sub/b.txt'; then
              echo "FAIL: action succeeded but output missing nested key"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no AWS credentials / bucket in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
