name: Test setup-linux in a container runner
on:
  workflow_dispatch:
env:
  CI: "true"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Mark as container runner
        run: |
          SUDO=""; if [ "$(id -u)" != "0" ]; then SUDO=sudo; fi
          $SUDO touch /.incontainer
          $SUDO rm -f /.inarc

      - name: Install mock tools (curl, aws, docker, sudo)
        run: |
          MOCK="$RUNNER_TEMP/mockbin"
          LOG="$RUNNER_TEMP/mock-calls.log"
          mkdir -p "$MOCK"
          : > "$LOG"

          cat > "$MOCK/curl" <<EOF
          #!/bin/bash
          echo "curl \$*" >> "$LOG"
          case "\$*" in
            *api/token*) echo "fake-token" ;;
            *meta-data/ami-id*) echo "ami-0123456789" ;;
            *meta-data/instance-id*) echo "i-0123456789" ;;
            *meta-data/instance-type*) echo "c5.large" ;;
            *) exit 22 ;;
          esac
          EOF

          cat > "$MOCK/aws" <<EOF
          #!/bin/bash
          echo "aws \$*" >> "$LOG"
          case "\$1 \$2" in
            "sts get-caller-identity")
              printf '{\n    "UserId": "AIDAEXAMPLE",\n    "Account": "123456789012",\n    "Arn": "arn:aws:iam::123456789012:user/test"\n}\n'
              ;;
            "ecr get-login-password") echo "fake-ecr-password" ;;
            *) exit 1 ;;
          esac
          EOF

          cat > "$MOCK/docker" <<EOF
          #!/bin/bash
          echo "docker \$*" >> "$LOG"
          if [ "\$1" = "login" ]; then
            pw=\$(cat)
            echo "docker-login-password: \$pw" >> "$LOG"
            echo "Login Succeeded"
          fi
          exit 0
          EOF

          cat > "$MOCK/sudo" <<EOF
          #!/bin/bash
          echo "sudo \$*" >> "$LOG"
          exec "\$@"
          EOF

          chmod +x "$MOCK"/*
          echo "$MOCK" >> "$GITHUB_PATH"

      - id: action
        uses: .

      - name: Assert results
        run: |
          LOG="$RUNNER_TEMP/mock-calls.log"
          echo "--- mock calls ---"; cat "$LOG"; echo "------------------"
          fail=0

          grep -q "meta-data/instance-type" "$LOG" || { echo "FAIL: EC2 metadata not queried"; fail=1; }
          grep -q "^aws sts get-caller-identity" "$LOG" || { echo "FAIL: sts not called"; fail=1; }
          grep -q "^aws ecr get-login-password --region us-east-1" "$LOG" || { echo "FAIL: ecr get-login-password not called"; fail=1; }
          grep -q "^docker login --username AWS --password-stdin 123456789012.dkr.ecr.us-east-1.amazonaws.com" "$LOG" \
            || { echo "FAIL: docker login not called with expected registry"; fail=1; }
          grep -q "docker-login-password: fake-ecr-password" "$LOG" || { echo "FAIL: password not piped to docker login"; fail=1; }

          # Container runner: docker start/prune and nvidia detection must be skipped
          if grep -q "system prune" "$LOG"; then echo "FAIL: prune ran in container runner"; fail=1; fi
          if grep -q "^docker version" "$LOG"; then echo "FAIL: docker daemon check ran in container runner"; fail=1; fi

          for v in RUNNER_ARTIFACT_DIR RUNNER_TEST_RESULTS_DIR RUNNER_DOCS_DIR; do
            val="${!v:-}"
            echo "$v=$val"
            if [ -z "$val" ] || [ ! -d "$val" ]; then echo "FAIL: $v not set or dir missing"; fail=1; fi
          done
          [ "$RUNNER_ARTIFACT_DIR" = "$RUNNER_TEMP/artifacts" ] || { echo "FAIL: artifact dir path"; fail=1; }
          [ "$RUNNER_TEST_RESULTS_DIR" = "$RUNNER_TEMP/test-results" ] || { echo "FAIL: test-results dir path"; fail=1; }
          [ "$RUNNER_DOCS_DIR" = "$RUNNER_TEMP/docs" ] || { echo "FAIL: docs dir path"; fail=1; }

          ENVFILE="$RUNNER_TEMP/github_env_${GITHUB_RUN_ID}"
          if [ ! -f "$ENVFILE" ]; then
            echo "FAIL: $ENVFILE missing"; fail=1
          else
            grep -q '^GITHUB' "$ENVFILE" || { echo "FAIL: no GITHUB vars preserved"; fail=1; }
            grep -q '^CI' "$ENVFILE" || { echo "FAIL: no CI vars preserved"; fail=1; }
            grep -q '^RUNNER' "$ENVFILE" || { echo "FAIL: no RUNNER vars preserved"; fail=1; }
          fi

          echo "GPU_FLAG='${GPU_FLAG:-}'"
          if [ -n "${GPU_FLAG:-}" ]; then echo "FAIL: GPU_FLAG should not be set without /dev/nvidiaX"; fail=1; fi

          [ "$fail" = "0" ] || exit 1
          echo "PASS"

      - name: Cleanup marker
        if: always()
        run: |
          SUDO=""; if [ "$(id -u)" != "0" ]; then SUDO=sudo; fi
          $SUDO rm -f /.incontainer || true
