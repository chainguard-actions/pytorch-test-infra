name: Test container runner path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Mark as container runner
        run: |
          touch /.incontainer 2>/dev/null || sudo touch /.incontainer
          ls -la /.incontainer
      - name: Install mocks
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-mocks.sh"
      - id: action
        uses: .
      - name: Assert container-path behavior
        run: |
          cat "$MOCK_LOG"
          grep -q 'docker login --username AWS --password-stdin 123456789012.dkr.ecr.us-east-1.amazonaws.com' "$MOCK_LOG" || { echo "FAIL: docker login"; exit 1; }
          if grep -q 'docker system prune' "$MOCK_LOG"; then echo "FAIL: prune should be skipped in container"; exit 1; fi
          if grep -q '^lspci' "$MOCK_LOG"; then echo "FAIL: nvidia lspci check should be skipped"; exit 1; fi
          if compgen -G "/dev/nvidia[0-9]" >/dev/null; then
            [ -n "${GPU_FLAG:-}" ] || { echo "FAIL: GPU_FLAG expected"; exit 1; }
          else
            [ -z "${GPU_FLAG:-}" ] || { echo "FAIL: GPU_FLAG unexpectedly set: $GPU_FLAG"; exit 1; }
          fi
          [ -d "$RUNNER_ARTIFACT_DIR" ] || { echo "FAIL: artifact dir"; exit 1; }
          echo "PASS"
      - name: Cleanup marker
        if: always()
        run: rm -f /.incontainer 2>/dev/null || sudo rm -f /.incontainer || true
