name: Test action fails when AWS credentials unavailable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fakes (aws fails)
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fakes.sh" aws-fail
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed at ECR login
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when aws sts fails"; exit 1
          fi
          cat /tmp/fakes-log/aws.log || true
          if ! grep -q "sts get-caller-identity" /tmp/fakes-log/aws.log; then
            echo "FAIL: aws sts was not called"; exit 1
          fi
          if [ -f /tmp/fakes-log/docker.log ] && grep -q "^login" /tmp/fakes-log/docker.log; then
            echo "FAIL: docker login should not have run"; exit 1
          fi
          if [ -f /tmp/fakes-log/docker.log ] && grep -q "system prune" /tmp/fakes-log/docker.log; then
            echo "FAIL: later cleanup step should not have run"; exit 1
          fi
          echo "PASS"
