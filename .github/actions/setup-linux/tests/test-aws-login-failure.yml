name: Test action fails when AWS login fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock tools on PATH (aws always fails)
        run: |
          set -eu
          MOCK="$RUNNER_TEMP/mockbin"
          LOG="$RUNNER_TEMP/mocklog"
          mkdir -p "$MOCK" "$LOG"
          REAL_CURL="$(command -v curl || echo /usr/bin/curl)"

          cat > "$MOCK/curl" <<EOF
          #!/bin/bash
          case "\$*" in
            *169.254.169.254*) echo "fake"; exit 0 ;;
          esac
          exec "$REAL_CURL" "\$@"
          EOF

          cat > "$MOCK/aws" <<EOF
          #!/bin/bash
          echo "aws \$*" >> "$LOG/aws.log"
          echo "Unable to locate credentials" >&2
          exit 255
          EOF

          cat > "$MOCK/docker" <<EOF
          #!/bin/bash
          echo "docker \$*" >> "$LOG/docker.log"
          [ "\$1" = "login" ] && cat > /dev/null
          exit 0
          EOF

          cat > "$MOCK/sudo" <<'EOF'
          #!/bin/bash
          exec "$@"
          EOF

          cat > "$MOCK/systemctl" <<'EOF'
          #!/bin/bash
          exit 0
          EOF

          cat > "$MOCK/lspci" <<'EOF'
          #!/bin/bash
          echo "00:00.0 Host bridge: Intel Corporation 440FX"
          EOF

          chmod +x "$MOCK"/*
          echo "$MOCK" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed at ECR login
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat "$RUNNER_TEMP/mocklog/aws.log" || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when AWS credentials are unavailable"
            exit 1
          fi
          grep -q 'sts get-caller-identity' "$RUNNER_TEMP/mocklog/aws.log" \
            || { echo "FAIL: aws sts was not called"; exit 1; }
          if [ -n "${RUNNER_ARTIFACT_DIR:-}" ]; then
            echo "FAIL: later steps should not have run"
            exit 1
          fi
          echo "PASS"
