name: Test basic usage (non-container runner)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock curl/aws/docker/sudo/systemctl/lspci
        run: |
          set -eu
          MOCK="$RUNNER_TEMP/mockbin"
          LOGS="$RUNNER_TEMP/mock-logs"
          mkdir -p "$MOCK" "$LOGS"
          REAL_CURL="$(command -v curl || true)"

          cat > "$MOCK/curl" <<EOF
          #!/bin/bash
          case "\$*" in
            *169.254.169.254/latest/api/token*) echo "fake-token"; exit 0 ;;
            *169.254.169.254/latest/meta-data/ami-id*) echo "ami-0123456789"; exit 0 ;;
            *169.254.169.254/latest/meta-data/instance-id*) echo "i-0abcdef"; exit 0 ;;
            *169.254.169.254/latest/meta-data/instance-type*) echo "c5.large"; exit 0 ;;
          esac
          if [ -n "$REAL_CURL" ]; then exec "$REAL_CURL" "\$@"; fi
          exit 1
          EOF

          cat > "$MOCK/aws" <<EOF
          #!/bin/bash
          echo "aws \$*" >> "$LOGS/aws.log"
          case "\$1 \$2" in
            "sts get-caller-identity")
              printf '{\n    "UserId": "AIDAEXAMPLE",\n    "Account": "123456789012",\n    "Arn": "arn:aws:iam::123456789012:user/test"\n}\n'
              ;;
            "ecr get-login-password")
              echo "fake-ecr-password"
              ;;
          esac
          exit 0
          EOF

          cat > "$MOCK/docker" <<EOF
          #!/bin/bash
          echo "docker \$*" >> "$LOGS/docker.log"
          case "\$1" in
            login)
              cat > "$LOGS/docker-login-stdin"
              ;;
            ps) ;;
          esac
          exit 0
          EOF

          cat > "$MOCK/sudo" <<'EOF'
          #!/bin/bash
          exec "$@"
          EOF

          cat > "$MOCK/systemctl" <<EOF
          #!/bin/bash
          echo "systemctl \$*" >> "$LOGS/systemctl.log"
          exit 0
          EOF

          cat > "$MOCK/lspci" <<'EOF'
          #!/bin/bash
          echo "00:00.0 Host bridge: Intel Corporation 440FX"
          exit 0
          EOF

          chmod +x "$MOCK"/*
          echo "$MOCK" >> "$GITHUB_PATH"
          # ensure non-container path
          rm -f /.inarc /.incontainer 2>/dev/null || true

      - id: action
        uses: .

      - name: Assert ECR login used mocked account and password
        run: |
          LOGS="$RUNNER_TEMP/mock-logs"
          echo "--- docker.log"; cat "$LOGS/docker.log" || true
          echo "--- aws.log"; cat "$LOGS/aws.log" || true
          if ! grep -q "docker login --username AWS --password-stdin 123456789012.dkr.ecr.us-east-1.amazonaws.com" "$LOGS/docker.log"; then
            echo "FAIL: docker login not called with expected registry"
            exit 1
          fi
          if [ "$(cat "$LOGS/docker-login-stdin")" != "fake-ecr-password" ]; then
            echo "FAIL: password not passed via stdin"
            exit 1
          fi
          if ! grep -q "aws ecr get-login-password --region us-east-1" "$LOGS/aws.log"; then
            echo "FAIL: aws ecr get-login-password not called"
            exit 1
          fi
          echo "PASS"

      - name: Assert docker cleanup ran (non-container runner)
        run: |
          LOGS="$RUNNER_TEMP/mock-logs"
          if ! grep -q "docker system prune -af" "$LOGS/docker.log"; then
            echo "FAIL: docker system prune -af not called"
            exit 1
          fi
          echo "PASS"

      - name: Assert runner directories exported
        run: |
          echo "RUNNER_ARTIFACT_DIR=$RUNNER_ARTIFACT_DIR"
          echo "RUNNER_TEST_RESULTS_DIR=$RUNNER_TEST_RESULTS_DIR"
          echo "RUNNER_DOCS_DIR=$RUNNER_DOCS_DIR"
          if [ "$RUNNER_ARTIFACT_DIR" != "$RUNNER_TEMP/artifacts" ] || [ ! -d "$RUNNER_ARTIFACT_DIR" ]; then
            echo "FAIL: RUNNER_ARTIFACT_DIR"; exit 1
          fi
          if [ "$RUNNER_TEST_RESULTS_DIR" != "$RUNNER_TEMP/test-results" ] || [ ! -d "$RUNNER_TEST_RESULTS_DIR" ]; then
            echo "FAIL: RUNNER_TEST_RESULTS_DIR"; exit 1
          fi
          if [ "$RUNNER_DOCS_DIR" != "$RUNNER_TEMP/docs" ] || [ ! -d "$RUNNER_DOCS_DIR" ]; then
            echo "FAIL: RUNNER_DOCS_DIR"; exit 1
          fi
          echo "PASS"

      - name: Assert github env preserved
        run: |
          F="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          if [ ! -f "$F" ]; then echo "FAIL: $F missing"; exit 1; fi
          for p in '^GITHUB' '^CI' '^RUNNER'; do
            if ! grep -q "$p" "$F"; then echo "FAIL: no $p lines in $F"; exit 1; fi
          done
          echo "PASS"

      - name: Assert GPU_FLAG not set (no NVIDIA GPU)
        run: |
          echo "GPU_FLAG='${GPU_FLAG:-}'"
          if [ -n "${GPU_FLAG:-}" ]; then echo "FAIL: GPU_FLAG should be unset"; exit 1; fi
          echo "PASS"
