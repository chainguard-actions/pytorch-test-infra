name: Test basic usage (non-container EC2 runner, mocked tools)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock tools (curl, aws, docker, sudo, lspci, systemctl)
        run: |
          set -eu
          rm -f /.inarc /.incontainer 2>/dev/null || true
          MOCK="$RUNNER_TEMP/mockbin"
          mkdir -p "$MOCK"
          LOG="$RUNNER_TEMP/docker-calls.log"
          : > "$LOG"

          cat > "$MOCK/curl" <<'EOF'
          #!/bin/sh
          out=""; prev=""
          for arg in "$@"; do
            case "$prev" in -o|--output) out="$arg" ;; esac
            prev="$arg"
          done
          case "$*" in
            *api/token*) payload="fake-imds-token" ;;
            *meta-data/ami-id*) payload="ami-0123456789abcdef0" ;;
            *meta-data/instance-id*) payload="i-0123456789abcdef0" ;;
            *meta-data/instance-type*) payload="c5.large" ;;
            *) exec /usr/bin/curl "$@" ;;
          esac
          if [ -n "$out" ]; then printf '%s' "$payload" > "$out"; else printf '%s' "$payload"; fi
          exit 0
          EOF

          cat > "$MOCK/aws" <<'EOF'
          #!/bin/sh
          case "$1 $2" in
            "sts get-caller-identity")
              printf '{\n    "UserId": "AIDAFAKE",\n    "Account": "123456789012",\n    "Arn": "arn:aws:iam::123456789012:user/fake"\n}\n'
              ;;
            "ecr get-login-password")
              printf 'fake-ecr-password'
              ;;
            *) echo "unexpected aws call: $*" >&2; exit 1 ;;
          esac
          EOF

          cat > "$MOCK/docker" <<EOF
          #!/bin/bash
          echo "docker \$*" >> "$LOG"
          if [ "\$1" = "login" ]; then
            pw=\$(cat)
            echo "password:\$pw" >> "$LOG"
            echo "Login Succeeded"
          fi
          exit 0
          EOF

          cat > "$MOCK/sudo" <<'EOF'
          #!/bin/sh
          exec "$@"
          EOF

          cat > "$MOCK/lspci" <<'EOF'
          #!/bin/sh
          echo "00:00.0 Host bridge: Intel Corporation 440FX"
          EOF

          cat > "$MOCK/systemctl" <<'EOF'
          #!/bin/sh
          exit 0
          EOF

          chmod +x "$MOCK"/*
          echo "$MOCK" >> "$GITHUB_PATH"

      - id: action
        uses: .

      - name: Assert ECR login used account from sts and correct registry
        run: |
          LOG="$RUNNER_TEMP/docker-calls.log"
          echo "--- docker calls ---"; cat "$LOG"
          if ! grep -q -- "login --username AWS --password-stdin 123456789012.dkr.ecr.us-east-1.amazonaws.com" "$LOG"; then
            echo "FAIL: docker login not called with expected registry"
            exit 1
          fi
          if ! grep -q "password:fake-ecr-password" "$LOG"; then
            echo "FAIL: ECR password not passed via stdin"
            exit 1
          fi
          echo "PASS"

      - name: Assert docker cleanup ran (non-container runner)
        run: |
          LOG="$RUNNER_TEMP/docker-calls.log"
          if ! grep -q "docker system prune -af" "$LOG"; then
            echo "FAIL: expected docker system prune -af"
            exit 1
          fi
          if ! grep -q "docker stop" "$LOG"; then
            echo "FAIL: expected docker stop"
            exit 1
          fi
          echo "PASS"

      - name: Assert runner directories exported and created
        run: |
          for pair in "RUNNER_ARTIFACT_DIR:artifacts" "RUNNER_TEST_RESULTS_DIR:test-results" "RUNNER_DOCS_DIR:docs"; do
            name="${pair%%:*}"; sub="${pair##*:}"
            val="${!name:-}"
            echo "$name=$val"
            if [ "$val" != "${RUNNER_TEMP}/${sub}" ]; then
              echo "FAIL: $name expected ${RUNNER_TEMP}/${sub}"
              exit 1
            fi
            if [ ! -d "$val" ]; then
              echo "FAIL: directory $val does not exist"
              exit 1
            fi
          done
          echo "PASS"

      - name: Assert github env preserved file
        run: |
          F="${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
          if [ ! -f "$F" ]; then
            echo "FAIL: $F not found"
            exit 1
          fi
          for prefix in GITHUB CI RUNNER; do
            if ! grep -q "^${prefix}" "$F"; then
              echo "FAIL: no ${prefix}* vars in $F"
              exit 1
            fi
          done
          echo "PASS"

      - name: Assert GPU_FLAG not set (no NVIDIA GPU)
        run: |
          echo "GPU_FLAG='${GPU_FLAG:-}'"
          if [ -n "${GPU_FLAG:-}" ]; then
            echo "FAIL: GPU_FLAG should not be set"
            exit 1
          fi
          echo "PASS"
