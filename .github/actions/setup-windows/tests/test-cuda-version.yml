name: Test setup-windows with cuda version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shims for Windows-only tools and EC2 metadata
        run: |
          SHIMS="$RUNNER_TEMP/shims"
          mkdir -p "$SHIMS"
          REAL_CURL="$(command -v curl || echo /usr/bin/curl)"
          cat > "$SHIMS/curl" <<EOF
          #!/bin/sh
          case "\$*" in
            *169.254.169.254/latest/api/token*) echo "fake-imds-token"; exit 0 ;;
            *169.254.169.254/latest/meta-data/*) echo "fake-metadata"; exit 0 ;;
          esac
          exec "$REAL_CURL" "\$@"
          EOF
          cat > "$SHIMS/powershell" <<'EOF'
          #!/bin/sh
          echo "fake powershell invoked: $*"
          exit 0
          EOF
          cat > "$SHIMS/cygpath" <<'EOF'
          #!/bin/sh
          echo "$1"
          EOF
          chmod +x "$SHIMS/curl" "$SHIMS/powershell" "$SHIMS/cygpath"
          echo "$SHIMS" >> "$GITHUB_PATH"
          # Pre-set opposite values to confirm the action overrides them
          git config --global core.longpaths false
          git config --global core.symlinks false
          git config --global core.fsmonitor true
      - id: action
        uses: .
        with:
          cuda-version: "12.6"
      - name: Assert git global config overridden
        run: |
          for kv in "core.longpaths=true" "core.symlinks=true" "core.fsmonitor=false"; do
            key="${kv%%=*}"; want="${kv#*=}"
            got="$(git config --global --get "$key" || true)"
            echo "$key: $got"
            if [ "$got" != "$want" ]; then
              echo "FAIL: expected $key=$want"
              exit 1
            fi
          done
          echo "PASS"
      - name: Assert environment directories exist
        run: |
          echo "RUNNER_ARTIFACT_DIR=$RUNNER_ARTIFACT_DIR"
          echo "RUNNER_TEST_RESULTS_DIR=$RUNNER_TEST_RESULTS_DIR"
          if [ -z "$RUNNER_ARTIFACT_DIR" ] || [ ! -d "$RUNNER_ARTIFACT_DIR" ]; then
            echo "FAIL: RUNNER_ARTIFACT_DIR missing"
            exit 1
          fi
          if [ -z "$RUNNER_TEST_RESULTS_DIR" ] || [ ! -d "$RUNNER_TEST_RESULTS_DIR" ]; then
            echo "FAIL: RUNNER_TEST_RESULTS_DIR missing"
            exit 1
          fi
          echo "PASS"
