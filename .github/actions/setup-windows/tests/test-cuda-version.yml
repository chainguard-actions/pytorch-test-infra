name: Test setup-windows with a cuda version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Windows-only action: on Linux under act the powershell steps cannot run,
      # so a failure is acceptable; a success must still produce the env vars.
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 20
        with:
          cuda-version: "12.1"
      - name: Assert action outcome
        shell: bash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "RUNNER_ARTIFACT_DIR=${RUNNER_ARTIFACT_DIR:-}"
            echo "RUNNER_TEST_RESULTS_DIR=${RUNNER_TEST_RESULTS_DIR:-}"
            if [ -z "${RUNNER_ARTIFACT_DIR:-}" ] || [ -z "${RUNNER_TEST_RESULTS_DIR:-}" ]; then
              echo "FAIL: expected RUNNER_ARTIFACT_DIR and RUNNER_TEST_RESULTS_DIR to be exported"
              exit 1
            fi
            echo "PASS: action succeeded and exported env vars"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Windows-only action failed gracefully on a non-Windows runner"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
