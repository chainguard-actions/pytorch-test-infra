name: Test setup-windows with a cuda version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake Windows tools (powershell, cygpath) and EC2 metadata curl shim
        run: |
          set -eu
          FAKEBIN=/tmp/fakebin
          mkdir -p "$FAKEBIN"
          rm -f /tmp/fake-powershell.log
          cat > "$FAKEBIN/powershell" <<'EOF'
          #!/bin/sh
          echo "CALL: $*" >> /tmp/fake-powershell.log
          for a in "$@"; do
            f=$(echo "$a" | sed -e "s/^'//" -e "s/'$//")
            if [ -f "$f" ]; then cat "$f" >> /tmp/fake-powershell.log; fi
          done
          exit 0
          EOF
          cat > "$FAKEBIN/cygpath" <<'EOF'
          #!/bin/sh
          echo "$1"
          EOF
          cat > "$FAKEBIN/curl" <<'EOF'
          #!/bin/sh
          case "$*" in
            *169.254.169.254*) echo "fake-metadata"; exit 0 ;;
          esac
          for c in /usr/bin/curl /bin/curl /usr/local/bin/curl; do
            if [ -x "$c" ]; then exec "$c" "$@"; fi
          done
          exit 127
          EOF
          chmod +x "$FAKEBIN"/*
          echo "$FAKEBIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          cuda-version: "12.1"
      - name: Assert action outcome and exported env
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "RUNNER_ARTIFACT_DIR=${RUNNER_ARTIFACT_DIR:-}"
          echo "RUNNER_TEST_RESULTS_DIR=${RUNNER_TEST_RESULTS_DIR:-}"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ "${RUNNER_ARTIFACT_DIR:-}" != "${RUNNER_TEMP}/artifacts" ] || [ ! -d "${RUNNER_ARTIFACT_DIR}" ]; then
            echo "FAIL: RUNNER_ARTIFACT_DIR wrong or missing"
            exit 1
          fi
          if [ "${RUNNER_TEST_RESULTS_DIR:-}" != "${RUNNER_TEMP}/test-results" ] || [ ! -d "${RUNNER_TEST_RESULTS_DIR}" ]; then
            echo "FAIL: RUNNER_TEST_RESULTS_DIR wrong or missing"
            exit 1
          fi
          if [ "$(git config --global --get core.longpaths)" != "true" ]; then
            echo "FAIL: core.longpaths not true"
            exit 1
          fi
          if ! grep -q 'LongPathsEnabled' /tmp/fake-powershell.log; then
            echo "FAIL: long paths powershell script not run"
            cat /tmp/fake-powershell.log || true
            exit 1
          fi
          echo "PASS"
