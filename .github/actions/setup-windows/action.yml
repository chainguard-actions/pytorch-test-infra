name: Setup Windows

description: Set up for windows jobs

inputs:
  cuda-version:
    description: which cuda version to install, 'cpu' for none
    required: true

runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Display EC2 information
      shell: bash
      run: |
        set -euo pipefail
        function get_ec2_metadata() {
          # Pulled from instance metadata endpoint for EC2
          # see https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html
          category=$1
          curl -H "X-aws-ec2-metadata-token: $(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 30")" -fsSL "http://169.254.169.254/latest/meta-data/${category}"
        }
        echo "ami-id: $(get_ec2_metadata ami-id)"
        echo "instance-id: $(get_ec2_metadata instance-id)"
        echo "instance-type: $(get_ec2_metadata instance-type)"
        echo "system info $(uname -a)"

    # Needed for binary builds, see: https://github.com/pytorch/pytorch/issues/73339#issuecomment-1058981560
    - name: Enable long paths on Windows
      shell: powershell
      run: |
        if(-not (Test-Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem")) {
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        } else {
          Set-ItemProperty -Path "HKLM:\\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1
        }

    - name: Enable git long paths and symlinks on Windows and disable fsmonitor daemon
      shell: bash
      run: |
        git config --global core.longpaths true
        git config --global core.symlinks true
        git config --global core.fsmonitor false

    # Since it's just a defensive command, the workflow should continue even the command fails
    - name: Disables Windows Defender scheduled and real-time scanning for files in pytorch directory.
      shell: powershell
      run: |
        Add-MpPreference -ExclusionPath $(Get-Location).tostring() -ErrorAction Ignore
        Add-MpPreference -ExclusionPath C:\\Users\\runneruser -ErrorAction Ignore
        Add-MpPreference -ExclusionPath C:\\actions-runner\\_work -ErrorAction Ignore

    - name: Setup useful environment variables
      shell: bash
      working-directory: ${{ inputs.repository }}
      run: |
        RUNNER_TEMP_CYG="$(cygpath "${RUNNER_TEMP}")"
        RUNNER_ARTIFACT_DIR="${RUNNER_TEMP_CYG}/artifacts"
        mkdir -p "${RUNNER_ARTIFACT_DIR}"
        safe_artifact_dir="$(printf '%s' "${RUNNER_ARTIFACT_DIR}" | tr -d '\n\r')"
        echo "RUNNER_ARTIFACT_DIR=${safe_artifact_dir}" >> "${GITHUB_ENV}"

        RUNNER_TEST_RESULTS_DIR="${RUNNER_TEMP}/test-results"
        mkdir -p "${RUNNER_TEST_RESULTS_DIR}"
        safe_test_results_dir="$(printf '%s' "${RUNNER_TEST_RESULTS_DIR}" | tr -d '\n\r')"
        echo "RUNNER_TEST_RESULTS_DIR=${safe_test_results_dir}" >> "${GITHUB_ENV}"
