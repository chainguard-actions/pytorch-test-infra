name: Test failure when tools/torchci is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove tools/torchci to simulate a non test-infra checkout
        run: |
          if [ -e tools/torchci ]; then
            mv tools/torchci /tmp/torchci-backup
          fi
      - id: action
        uses: .
        continue-on-error: true
      - name: Restore tools/torchci
        if: always()
        run: |
          if [ -e /tmp/torchci-backup ]; then
            mv /tmp/torchci-backup tools/torchci
          fi
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when tools/torchci is missing"
            exit 1
          fi
          echo "PASS"
