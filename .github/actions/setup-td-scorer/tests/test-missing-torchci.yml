name: Test TD scorer fails without tools/torchci
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check whether tools/torchci exists
        run: |
          if [ -f tools/torchci/requirements.txt ]; then
            echo "HAS_TORCHCI=true" >> "$GITHUB_ENV"
          else
            echo "HAS_TORCHCI=false" >> "$GITHUB_ENV"
          fi
      - id: action
        if: env.HAS_TORCHCI == 'false'
        uses: .
        continue-on-error: true
      - name: Assert action failed when requirements are missing
        if: env.HAS_TORCHCI == 'false'
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when tools/torchci is missing"
            exit 1
          fi
          echo "PASS"
