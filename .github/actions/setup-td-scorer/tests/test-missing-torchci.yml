name: Test TD scorer setup fails without tools/torchci
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove tools/torchci requirements so install must fail
        id: prep
        run: |
          if [ -d tools/torchci ]; then
            mv tools/torchci tools/torchci.bak
            echo "restored=true" >> "$GITHUB_OUTPUT"
          fi
          ls tools 2>/dev/null || true
      - id: action
        uses: .
        continue-on-error: true
      - name: Restore tools/torchci
        if: always()
        run: |
          if [ -d tools/torchci.bak ]; then mv tools/torchci.bak tools/torchci; fi
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when tools/torchci is missing"
            exit 1
          fi
          echo "PASS"
