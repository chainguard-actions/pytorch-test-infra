name: Test basic usage (CPU runner)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert device detection and runners info
        env:
          RESULT: ${{ steps.action.outputs.runners-info }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "DEVICE_NAME: ${DEVICE_NAME:-}"
          echo "DEVICE_TYPE: ${DEVICE_TYPE:-}"
          echo "result: $RESULT"
          case "${DEVICE_NAME:-}" in
            cpu|arm64-cpu|cuda|rocm|hpu) echo "PASS: DEVICE_NAME detected" ;;
            *) echo "FAIL: DEVICE_NAME not set to a known value"; exit 1 ;;
          esac
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but runners-info is empty"
              exit 1
            fi
            if ! echo "$RESULT" | python3 -c 'import json,sys; json.load(sys.stdin)'; then
              echo "FAIL: runners-info is not valid JSON"
              exit 1
            fi
            echo "PASS: runners-info is valid JSON"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: device detection ran; info script unavailable in this layout"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
