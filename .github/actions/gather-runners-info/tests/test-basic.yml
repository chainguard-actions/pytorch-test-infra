name: Test basic usage (CPU runner)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert device env vars were set
        run: |
          echo "DEVICE_NAME=$DEVICE_NAME"
          echo "DEVICE_TYPE=$DEVICE_TYPE"
          case "$DEVICE_NAME" in
            cpu|arm64-cpu|cuda|rocm|hpu) echo "PASS: DEVICE_NAME valid" ;;
            *) echo "FAIL: unexpected DEVICE_NAME '$DEVICE_NAME'"; exit 1 ;;
          esac
      - name: Assert runners-info is non-empty valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.runners-info }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: runners-info output is empty"
            exit 1
          fi
          printf '%s' "$ACTUAL" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d not in (None, {}, []), "empty JSON"; print("parsed:", type(d).__name__)' || {
            echo "FAIL: runners-info is not valid non-empty JSON"
            exit 1
          }
          echo "PASS"
