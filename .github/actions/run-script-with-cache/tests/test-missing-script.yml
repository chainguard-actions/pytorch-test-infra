name: Test missing script fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BUILD_ENV_FILE: /tmp/act-test-build-env3.sh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare env file
        run: printf 'export CONDA_RUN=""\n' > /tmp/act-test-build-env3.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          script: .act-test/does-not-exist.sh
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing script"
            exit 1
          fi
          echo "PASS"
