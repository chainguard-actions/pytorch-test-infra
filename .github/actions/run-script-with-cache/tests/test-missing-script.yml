name: Test missing script fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BUILD_ENV_FILE: /tmp/build_env_missing.sh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare build env only
        run: |
          cat > /tmp/build_env_missing.sh <<'EOF'
          export CONDA_RUN=""
          EOF
          rm -f does-not-exist-script.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          script: does-not-exist-script.sh
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing script"
            exit 1
          fi
          echo "PASS"
