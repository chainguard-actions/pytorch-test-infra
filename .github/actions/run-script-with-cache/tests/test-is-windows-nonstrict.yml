name: Test is_windows disables strict mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare env file (without CONDA_RUN) and script
        run: |
          mkdir -p "$RUNNER_TEMP/act-test"
          echo 'export OTHER_VAR="x"' > "$RUNNER_TEMP/act-test/build_env.sh"
          echo "BUILD_ENV_FILE=$RUNNER_TEMP/act-test/build_env.sh" >> "$GITHUB_ENV"
          cat > "$GITHUB_WORKSPACE/act-win-script.sh" <<'EOF'
          echo "nonstrict-ok" > "$GITHUB_WORKSPACE/act-win-output.txt"
          EOF
          rm -f "$GITHUB_WORKSPACE/act-win-output.txt"
      - id: action
        uses: .
        with:
          script: act-win-script.sh
          is_windows: enabled
      - name: Assert script ran despite unset CONDA_RUN
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/act-win-output.txt" ]; then
            echo "FAIL: output file missing"
            exit 1
          fi
          ACTUAL="$(cat "$GITHUB_WORKSPACE/act-win-output.txt")"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "nonstrict-ok" ]; then
            echo "FAIL"
            exit 1
          fi
          echo "PASS"
