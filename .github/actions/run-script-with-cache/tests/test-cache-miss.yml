name: Test cache path set with cache miss runs script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BUILD_ENV_FILE: ${{ github.workspace }}/tests/fixtures/build_env.sh
      CONDA_RUN: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean marker and create cache dir
        run: |
          rm -f "$GITHUB_WORKSPACE/script-marker.txt"
          mkdir -p "$GITHUB_WORKSPACE/cache-dir"
      - id: action
        uses: .
        with:
          cache-path: cache-dir
          cache-key: act-test-miss-${{ github.run_id }}-${{ github.run_attempt }}-unique
          script: tests/fixtures/scripts/write-marker.sh
      - name: Assert script ran on cache miss
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/script-marker.txt" ]; then
            echo "FAIL: marker file not created; script did not run on cache miss"
            exit 1
          fi
          cat "$GITHUB_WORKSPACE/script-marker.txt"
          echo "PASS"
