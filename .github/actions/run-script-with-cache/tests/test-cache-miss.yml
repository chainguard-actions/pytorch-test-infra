name: Test cache path with cache miss runs script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare build env file
        run: |
          printf 'export CONDA_RUN=""\n' > "$RUNNER_TEMP/build_env.sh"
          echo "BUILD_ENV_FILE=$RUNNER_TEMP/build_env.sh" >> "$GITHUB_ENV"
          echo "MARKER_FILE=$RUNNER_TEMP/marker-cache.txt" >> "$GITHUB_ENV"
          echo "CACHE_KEY=act-test-cache-miss-$(date +%s%N)-$RANDOM" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/marker-cache.txt"
          mkdir -p "$GITHUB_WORKSPACE/cache-dir-test"
      - id: action
        uses: .
        with:
          cache-path: cache-dir-test
          cache-key: ${{ env.CACHE_KEY }}
          script: tests/fixtures/write-marker.sh
      - name: Assert script ran on cache miss
        run: |
          cat "$MARKER_FILE" || true
          if ! grep -q "script ran" "$MARKER_FILE"; then
            echo "FAIL: script did not run on cache miss"
            exit 1
          fi
          echo "PASS"
