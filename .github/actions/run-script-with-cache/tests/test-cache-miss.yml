name: Test cache miss runs the script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CONDA_RUN: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare script, build env and unique cache key
        run: |
          echo 'export CACHE_VAR=ran' > "$RUNNER_TEMP/cache_build_env.sh"
          cat > "$RUNNER_TEMP/cache_script.sh" <<'EOF'
          mkdir -p "$GITHUB_WORKSPACE/cache-dir-test"
          echo built > "$GITHUB_WORKSPACE/cache-dir-test/artifact.txt"
          echo "${CACHE_VAR}" > "$RUNNER_TEMP/cache_marker.txt"
          EOF
          echo "BUILD_ENV_FILE=$RUNNER_TEMP/cache_build_env.sh" >> "$GITHUB_ENV"
          echo "SCRIPT_PATH=$RUNNER_TEMP/cache_script.sh" >> "$GITHUB_ENV"
          echo "UNIQUE_KEY=act-test-cache-$(date +%s%N)-$RANDOM" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          cache-path: cache-dir-test
          cache-key: ${{ env.UNIQUE_KEY }}
          script: ${{ env.SCRIPT_PATH }}
      - name: Assert script ran on cache miss
        run: |
          if [ ! -f "$RUNNER_TEMP/cache_marker.txt" ]; then
            echo "FAIL: script did not run on cache miss"
            exit 1
          fi
          ACTUAL="$(cat "$RUNNER_TEMP/cache_marker.txt")"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "ran" ]; then
            echo "FAIL: expected 'ran'"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/cache-dir-test/artifact.txt" ]; then
            echo "FAIL: artifact not created"
            exit 1
          fi
          echo "PASS"
