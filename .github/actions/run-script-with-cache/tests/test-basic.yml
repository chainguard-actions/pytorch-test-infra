name: Test basic script run without cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare build env file
        run: |
          printf 'export CONDA_RUN=""\n' > "$RUNNER_TEMP/build_env.sh"
          echo "BUILD_ENV_FILE=$RUNNER_TEMP/build_env.sh" >> "$GITHUB_ENV"
          echo "MARKER_FILE=$RUNNER_TEMP/marker-basic.txt" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/marker-basic.txt"
      - id: action
        uses: .
        with:
          script: tests/fixtures/write-marker.sh
      - name: Assert script ran
        run: |
          cat "$MARKER_FILE" || true
          if ! grep -q "script ran" "$MARKER_FILE"; then
            echo "FAIL: script did not run"
            exit 1
          fi
          if ! grep -q "FROM_ENV=unset" "$MARKER_FILE"; then
            echo "FAIL: unexpected FROM_ENV"
            exit 1
          fi
          echo "PASS"
