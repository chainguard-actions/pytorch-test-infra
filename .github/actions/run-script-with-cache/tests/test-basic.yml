name: Test basic script run without cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CONDA_RUN: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare build env file and script
        run: |
          mkdir -p "$RUNNER_TEMP/basic"
          cat > "$RUNNER_TEMP/basic/build_env.sh" <<'EOF'
          export MY_BUILD_VAR="from-build-env"
          EOF
          cat > "$RUNNER_TEMP/basic/script.sh" <<EOF
          echo "script running"
          echo "\${MY_BUILD_VAR}" > "$RUNNER_TEMP/basic/marker.txt"
          EOF
          echo "BUILD_ENV_FILE=$RUNNER_TEMP/basic/build_env.sh" >> "$GITHUB_ENV"
          echo "SCRIPT_PATH=$RUNNER_TEMP/basic/script.sh" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          script: ${{ env.SCRIPT_PATH }}
      - name: Assert script ran and build env was sourced
        run: |
          MARKER="$RUNNER_TEMP/basic/marker.txt"
          if [ ! -f "$MARKER" ]; then
            echo "FAIL: marker file not created; script did not run"
            exit 1
          fi
          ACTUAL="$(cat "$MARKER")"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "from-build-env" ]; then
            echo "FAIL: expected 'from-build-env'"
            exit 1
          fi
          echo "PASS"
