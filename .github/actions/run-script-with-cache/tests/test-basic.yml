name: Test basic script run without cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare build env file
        run: |
          printf 'export CONDA_RUN=""\n' > "$RUNNER_TEMP/build.env"
          echo "BUILD_ENV_FILE=$RUNNER_TEMP/build.env" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/marker.txt"
      - id: action
        uses: .
        with:
          script: tests/fixtures/write-marker.sh
      - name: Assert script ran
        run: |
          if [ ! -f "$RUNNER_TEMP/marker.txt" ]; then
            echo "FAIL: marker file not created"
            exit 1
          fi
          cat "$RUNNER_TEMP/marker.txt"
          if ! grep -q "^ran:unset:$GITHUB_WORKSPACE$" "$RUNNER_TEMP/marker.txt"; then
            echo "FAIL: unexpected marker content"
            exit 1
          fi
          echo "PASS"
