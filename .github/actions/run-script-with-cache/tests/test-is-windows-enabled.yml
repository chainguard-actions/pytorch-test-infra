name: Test is_windows enabled (no strict mode, CONDA_RUN unset)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare build env file (without CONDA_RUN) and script
        run: |
          mkdir -p "$RUNNER_TEMP/acttest"
          echo '# intentionally does not define CONDA_RUN' > "$RUNNER_TEMP/acttest/build_env.sh"
          echo "BUILD_ENV_FILE=$RUNNER_TEMP/acttest/build_env.sh" >> "$GITHUB_ENV"
          cat > win-script.sh <<'EOF'
          #!/bin/bash
          echo "windows-mode" > win-marker.txt
          EOF
      - id: action
        uses: .
        with:
          script: win-script.sh
          is_windows: enabled
      - name: Assert script ran
        run: |
          if [ ! -f win-marker.txt ]; then
            echo "FAIL: marker not found"
            exit 1
          fi
          ACTUAL="$(cat win-marker.txt)"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "windows-mode" ]; then
            echo "FAIL: unexpected content"
            exit 1
          fi
          echo "PASS"
