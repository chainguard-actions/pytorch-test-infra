name: Test script runs inside repository subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare env file and script in subdir
        run: |
          mkdir -p "$RUNNER_TEMP/act-test"
          echo 'export CONDA_RUN=""' > "$RUNNER_TEMP/act-test/build_env.sh"
          echo "BUILD_ENV_FILE=$RUNNER_TEMP/act-test/build_env.sh" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/act-subrepo"
          cat > "$GITHUB_WORKSPACE/act-subrepo/run.sh" <<'EOF'
          pwd > "$GITHUB_WORKSPACE/act-subrepo-pwd.txt"
          EOF
          rm -f "$GITHUB_WORKSPACE/act-subrepo-pwd.txt"
      - id: action
        uses: .
        with:
          repository: act-subrepo
          script: run.sh
      - name: Assert script ran in subdirectory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/act-subrepo-pwd.txt" ]; then
            echo "FAIL: script did not run"
            exit 1
          fi
          ACTUAL="$(cat "$GITHUB_WORKSPACE/act-subrepo-pwd.txt")"
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            */act-subrepo) echo "PASS" ;;
            *) echo "FAIL: expected working dir ending in /act-subrepo"; exit 1 ;;
          esac
