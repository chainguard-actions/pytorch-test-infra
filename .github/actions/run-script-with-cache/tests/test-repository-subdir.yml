name: Test repository subdirectory working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare env file and script in subdir
        run: |
          echo 'true' > "$RUNNER_TEMP/build_env.sh"
          echo "BUILD_ENV_FILE=$RUNNER_TEMP/build_env.sh" >> "$GITHUB_ENV"
          echo "CONDA_RUN=" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/subrepo"
          rm -f "$GITHUB_WORKSPACE/subrepo/pwd.txt"
          cat > "$GITHUB_WORKSPACE/subrepo/sub-script.sh" <<'EOF'
          pwd > pwd.txt
          EOF
      - id: action
        uses: .
        with:
          repository: subrepo
          script: sub-script.sh
      - name: Assert script ran in subdir
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/subrepo/pwd.txt" ]; then
            echo "FAIL: pwd.txt not created in subrepo"
            exit 1
          fi
          ACTUAL="$(cat "$GITHUB_WORKSPACE/subrepo/pwd.txt")"
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            */subrepo) echo "PASS" ;;
            *) echo "FAIL: expected working dir ending in /subrepo"; exit 1 ;;
          esac
