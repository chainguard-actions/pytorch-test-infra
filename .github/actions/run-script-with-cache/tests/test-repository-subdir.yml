name: Test script run inside repository subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BUILD_ENV_FILE: ${{ github.workspace }}/tests/fixtures/build_env.sh
      CONDA_RUN: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean marker
        run: rm -f "$GITHUB_WORKSPACE/script-marker.txt"
      - id: action
        uses: .
        with:
          repository: tests/fixtures
          script: scripts/write-marker.sh
      - name: Assert script ran in the repository directory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/script-marker.txt" ]; then
            echo "FAIL: marker file not created; script did not run"
            exit 1
          fi
          cat "$GITHUB_WORKSPACE/script-marker.txt"
          PWD_LINE="$(grep '^pwd=' "$GITHUB_WORKSPACE/script-marker.txt")"
          case "$PWD_LINE" in
            */tests/fixtures) echo "PASS: ran in tests/fixtures" ;;
            *) echo "FAIL: unexpected working dir: $PWD_LINE"; exit 1 ;;
          esac
