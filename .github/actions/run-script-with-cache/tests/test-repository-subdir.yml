name: Test script runs inside repository subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare build env file and subdirectory
        run: |
          printf 'export CONDA_RUN=""\n' > "$RUNNER_TEMP/build.env"
          echo "BUILD_ENV_FILE=$RUNNER_TEMP/build.env" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/marker.txt"
          rm -rf "$GITHUB_WORKSPACE/sub-repo"
          mkdir -p "$GITHUB_WORKSPACE/sub-repo"
          cp tests/fixtures/write-marker.sh "$GITHUB_WORKSPACE/sub-repo/run-me.sh"
      - id: action
        uses: .
        with:
          repository: sub-repo
          script: run-me.sh
      - name: Assert script ran in subdirectory
        run: |
          if [ ! -f "$RUNNER_TEMP/marker.txt" ]; then
            echo "FAIL: marker file not created"
            exit 1
          fi
          cat "$RUNNER_TEMP/marker.txt"
          if ! grep -q "^ran:unset:.*/sub-repo$" "$RUNNER_TEMP/marker.txt"; then
            echo "FAIL: script did not run in sub-repo directory"
            exit 1
          fi
          echo "PASS"
