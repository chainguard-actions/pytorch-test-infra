name: Test with working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p "$GITHUB_WORKSPACE/wd-subdir"
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: wd-subdir
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          JOB_ID: ${{ steps.action.outputs.job-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "job-id: $JOB_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JOB_ID" ]; then
              echo "FAIL: action succeeded but job-id is empty"
              exit 1
            fi
            echo "PASS: got job-id '$JOB_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
