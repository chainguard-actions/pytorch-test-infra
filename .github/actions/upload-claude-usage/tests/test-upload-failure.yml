name: Test S3 upload failure is best-effort
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install failing fake aws CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/aws" <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/aws-calls.log
          echo "upload failed: Access Denied" >&2
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/aws"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -f /tmp/aws-calls.log
      - name: Create metrics file
        run: |
          echo '[{"type": "result", "duration_ms": 10, "num_turns": 2, "total_cost_usd": 0.01}]' > "$RUNNER_TEMP/metrics.json"
      - id: action
        uses: .
        with:
          metrics-file: ${{ runner.temp }}/metrics.json
      - name: Assert step still succeeded after aws failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/aws-calls.log || true
          if [ "$OUTCOME" != "success" ]; then echo "FAIL: expected success"; exit 1; fi
          if [ ! -f /tmp/aws-calls.log ]; then echo "FAIL: aws should have been attempted"; exit 1; fi
          echo "PASS"
