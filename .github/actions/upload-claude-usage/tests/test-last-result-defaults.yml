name: Test last result wins and missing fields default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/aws" <<'EOF'
          #!/bin/bash
          echo "$@" > /tmp/fake-aws-args
          if [ "$1" = "s3" ] && [ "$2" = "cp" ]; then
            cp "$3" /tmp/fake-aws-uploaded.json
          fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/aws"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -f /tmp/fake-aws-args /tmp/fake-aws-uploaded.json
      - name: Create metrics file with two results
        run: |
          cat > "$RUNNER_TEMP/metrics.json" <<'EOF'
          [
            {"type": "result", "duration_ms": 1, "num_turns": 1, "modelUsage": {"first-model": {}}},
            {"type": "result", "duration_ms": "999", "num_turns": "abc", "modelUsage": "not-an-object"}
          ]
          EOF
      - id: action
        uses: .
        with:
          metrics-file: ${{ runner.temp }}/metrics.json
      - name: Assert payload uses last result with defaults
        run: |
          if [ ! -f /tmp/fake-aws-uploaded.json ]; then
            echo "FAIL: aws s3 cp was not invoked"
            exit 1
          fi
          cat /tmp/fake-aws-args
          cat /tmp/fake-aws-uploaded.json
          DEST="$(awk '{print $4}' /tmp/fake-aws-args)"
          case "$DEST" in
            s3://ossci-raw-job-status/claude_code_usage/*.json) ;;
            *) echo "FAIL: unexpected default destination $DEST"; exit 1 ;;
          esac
          F=/tmp/fake-aws-uploaded.json
          check() {
            local actual
            actual="$(jq -r "$1" "$F")"
            echo "$1 = $actual"
            if [ "$actual" != "$2" ]; then
              echo "FAIL: expected $1 == $2"
              exit 1
            fi
          }
          check '.duration_ms' 999
          check '.num_turns' 0
          check '.total_cost_usd' 0
          check '.input_tokens' 0
          check '.output_tokens' 0
          check '.cache_read_input_tokens' 0
          check '.cache_creation_input_tokens' 0
          check '.model' ''
          echo "PASS"
