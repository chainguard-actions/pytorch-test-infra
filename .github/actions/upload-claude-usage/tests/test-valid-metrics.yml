name: Test valid metrics file is parsed and uploaded
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq || (apt-get update -y && apt-get install -y jq)
          fi
          jq --version
      - name: Install fake aws CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/aws" <<EOF
          #!/bin/sh
          echo "\$@" > "$RUNNER_TEMP/aws-args.txt"
          cp "\$3" "$RUNNER_TEMP/aws-captured.json"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/aws"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -f "$RUNNER_TEMP/aws-args.txt" "$RUNNER_TEMP/aws-captured.json"
      - name: Create metrics file
        run: |
          cat > "$RUNNER_TEMP/claude-output.json" <<'EOF'
          [
            {"type": "system", "subtype": "init"},
            {"type": "assistant", "message": {"content": "hi"}},
            {
              "type": "result",
              "duration_ms": 12345,
              "num_turns": 7,
              "total_cost_usd": 0.42,
              "result": "some long text",
              "usage": {
                "input_tokens": 100,
                "output_tokens": 200,
                "cache_read_input_tokens": 300,
                "cache_creation_input_tokens": 400
              },
              "modelUsage": {"claude-sonnet-4": {"inputTokens": 100}}
            }
          ]
          EOF
      - id: action
        uses: .
        with:
          metrics-file: ${{ runner.temp }}/claude-output.json
          s3-bucket: my-test-bucket
          s3-prefix: my-prefix
      - name: Assert payload uploaded with expected fields
        run: |
          ARGS_FILE="$RUNNER_TEMP/aws-args.txt"
          PAYLOAD_FILE="$RUNNER_TEMP/aws-captured.json"
          if [ ! -f "$ARGS_FILE" ] || [ ! -f "$PAYLOAD_FILE" ]; then
            echo "FAIL: aws s3 cp was not invoked"
            exit 1
          fi
          ARGS="$(cat "$ARGS_FILE")"
          echo "aws args: $ARGS"
          cat "$PAYLOAD_FILE"
          case "$ARGS" in
            "s3 cp /tmp/claude_usage.json s3://my-test-bucket/my-prefix/"*) ;;
            *) echo "FAIL: unexpected aws args"; exit 1 ;;
          esac
          case "$ARGS" in
            *_*.json) ;;
            *) echo "FAIL: destination does not end with <run_id>_<attempt>.json"; exit 1 ;;
          esac
          check() {
            local actual
            actual="$(jq -c "$1" "$PAYLOAD_FILE")"
            echo "$1 => $actual"
            if [ "$actual" != "$2" ]; then
              echo "FAIL: expected $2"
              exit 1
            fi
          }
          check '.duration_ms' '12345'
          check '.num_turns' '7'
          check '.total_cost_usd' '0.42'
          check '.input_tokens' '100'
          check '.output_tokens' '200'
          check '.cache_read_input_tokens' '300'
          check '.cache_creation_input_tokens' '400'
          check '.model' '"claude-sonnet-4"'
          check '.pr_number' '0'
          check 'has("result")' 'false'
          check '.run_id | type' '"number"'
          check '.run_attempt | type' '"number"'
          check '.timestamp | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.000$")' 'true'
          check '.event_name | type' '"string"'
          check '.repo | type' '"string"'
          echo "PASS"
