name: Test basic upload with valid metrics
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws CLI and metrics file
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/aws" <<'EOF'
          #!/bin/sh
          echo "$@" >> "$RUNNER_TEMP/aws-calls.log"
          if [ "$1" = "s3" ] && [ "$2" = "cp" ]; then
            cp "$3" "$RUNNER_TEMP/captured-payload.json"
            echo "$4" > "$RUNNER_TEMP/captured-dest.txt"
          fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/aws"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/metrics.json" <<'EOF'
          [
            {"type": "system", "subtype": "init"},
            {"type": "assistant", "message": {"content": "hi"}},
            {"type": "result", "duration_ms": 1234, "num_turns": 5, "total_cost_usd": 0.25,
             "result": "some long text",
             "usage": {"input_tokens": 100, "output_tokens": 200, "cache_read_input_tokens": 300, "cache_creation_input_tokens": 400},
             "modelUsage": {"claude-sonnet-4": {"inputTokens": 100}}}
          ]
          EOF
      - id: action
        uses: .
        with:
          metrics-file: ${{ runner.temp }}/metrics.json
      - name: Assert aws was called with expected destination
        run: |
          cat "$RUNNER_TEMP/aws-calls.log" || { echo "FAIL: aws not called"; exit 1; }
          DEST="$(cat "$RUNNER_TEMP/captured-dest.txt")"
          echo "dest: $DEST"
          case "$DEST" in
            s3://ossci-raw-job-status/claude_code_usage/*.json) echo "PASS: dest ok" ;;
            *) echo "FAIL: unexpected dest"; exit 1 ;;
          esac
          case "$DEST" in
            *"/${GITHUB_RUN_ID}_"*) echo "PASS: run id in dest" ;;
            *) echo "FAIL: run id missing from dest"; exit 1 ;;
          esac
      - name: Assert payload contents
        run: |
          P="$RUNNER_TEMP/captured-payload.json"
          cat "$P"
          check() {
            actual="$(jq -r "$1" "$P")"
            echo "$1 = $actual"
            if [ "$actual" != "$2" ]; then
              echo "FAIL: expected '$2'"
              exit 1
            fi
          }
          check '.duration_ms' 1234
          check '.num_turns' 5
          check '.total_cost_usd' 0.25
          check '.input_tokens' 100
          check '.output_tokens' 200
          check '.cache_read_input_tokens' 300
          check '.cache_creation_input_tokens' 400
          check '.model' claude-sonnet-4
          check '.event_name' workflow_dispatch
          check 'has("result")' false
          check '.run_id | type' number
          check '.pr_number' 0
          check '.timestamp | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.000$")' true
          echo "PASS"
