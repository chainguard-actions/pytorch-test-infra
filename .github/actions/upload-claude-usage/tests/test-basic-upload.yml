name: Test basic upload with valid metrics
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws CLI that captures the upload
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/aws" <<'EOF'
          #!/bin/sh
          echo "$@" > /tmp/fake-aws-args
          if [ "$1" = "s3" ] && [ "$2" = "cp" ]; then
            cp "$3" /tmp/fake-aws-payload.json
          fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/aws"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -f /tmp/fake-aws-args /tmp/fake-aws-payload.json
      - name: Create metrics file
        run: |
          cat > "$RUNNER_TEMP/metrics.json" <<'EOF'
          [
            {"type": "system", "subtype": "init"},
            {"type": "assistant", "message": {"content": "hi"}},
            {"type": "result", "duration_ms": 12345, "num_turns": 7, "total_cost_usd": 0.42,
             "usage": {"input_tokens": 100, "output_tokens": 200, "cache_read_input_tokens": 300, "cache_creation_input_tokens": 400},
             "modelUsage": {"claude-sonnet-4": {"inputTokens": 100}},
             "result": "some long text"}
          ]
          EOF
      - id: action
        uses: .
        with:
          metrics-file: ${{ runner.temp }}/metrics.json
      - name: Assert payload uploaded with correct fields
        run: |
          if [ ! -f /tmp/fake-aws-payload.json ]; then
            echo "FAIL: aws s3 cp was not called"
            exit 1
          fi
          cat /tmp/fake-aws-payload.json
          cat /tmp/fake-aws-args
          P=/tmp/fake-aws-payload.json
          check() {
            actual="$(jq -r "$1" "$P")"
            echo "$1 = $actual"
            if [ "$actual" != "$2" ]; then
              echo "FAIL: expected $1 to be '$2'"
              exit 1
            fi
          }
          check '.duration_ms' '12345'
          check '.num_turns' '7'
          check '.total_cost_usd' '0.42'
          check '.input_tokens' '100'
          check '.output_tokens' '200'
          check '.cache_read_input_tokens' '300'
          check '.cache_creation_input_tokens' '400'
          check '.model' 'claude-sonnet-4'
          check '.pr_number' '0'
          check 'has("result")' 'false'
          check '.run_id | type' 'number'
          check '.timestamp | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}\\.000$")' 'true'
          if ! grep -q "^s3 cp /tmp/claude_usage.json s3://ossci-raw-job-status/claude_code_usage/" /tmp/fake-aws-args; then
            echo "FAIL: unexpected aws args"
            exit 1
          fi
          echo "PASS"
