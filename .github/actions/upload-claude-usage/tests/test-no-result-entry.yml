name: Test file without result entry is skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/aws" <<'EOF'
          #!/bin/bash
          echo "$@" > /tmp/fake-aws-args
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/aws"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -f /tmp/fake-aws-args
      - name: Create metrics file without result
        run: |
          echo '[{"type":"system"},{"type":"assistant"}]' > "$RUNNER_TEMP/noresult.json"
          echo '{"type":"result","duration_ms":5}' > "$RUNNER_TEMP/object.json"
      - id: action
        uses: .
        with:
          metrics-file: ${{ runner.temp }}/noresult.json
      - id: action_obj
        uses: .
        with:
          metrics-file: ${{ runner.temp }}/object.json
      - name: Assert steps succeeded and no upload
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTCOME2: ${{ steps.action_obj.outcome }}
        run: |
          echo "outcome: $OUTCOME / $OUTCOME2"
          if [ "$OUTCOME" != "success" ] || [ "$OUTCOME2" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -f /tmp/fake-aws-args ]; then
            echo "FAIL: aws should not have been invoked: $(cat /tmp/fake-aws-args)"
            exit 1
          fi
          echo "PASS"
