name: Test basic upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake aws and metrics file
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/aws" <<'EOF'
          #!/bin/sh
          echo "$@" > /tmp/aws-args
          cp "$3" /tmp/aws-uploaded.json
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/aws"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -f /tmp/aws-args /tmp/aws-uploaded.json
          cat > "$RUNNER_TEMP/metrics.json" <<'EOF'
          [
            {"type": "system", "subtype": "init"},
            {"type": "assistant", "message": {"content": "hi"}},
            {"type": "result", "duration_ms": 12345, "num_turns": 7,
             "total_cost_usd": 0.42, "result": "long text",
             "usage": {"input_tokens": 100, "output_tokens": 200,
                       "cache_read_input_tokens": 300, "cache_creation_input_tokens": 400},
             "modelUsage": {"claude-sonnet-4": {"inputTokens": 100}}}
          ]
          EOF
      - id: action
        uses: .
        with:
          metrics-file: ${{ runner.temp }}/metrics.json
          s3-bucket: test-bucket
          s3-prefix: test-prefix
      - name: Assert upload happened with correct payload
        run: |
          if [ ! -f /tmp/aws-args ]; then
            echo "FAIL: aws was not called"; exit 1
          fi
          ARGS="$(cat /tmp/aws-args)"
          echo "aws args: $ARGS"
          case "$ARGS" in
            "s3 cp /tmp/claude_usage.json s3://test-bucket/test-prefix/"*.json) ;;
            *) echo "FAIL: unexpected aws args"; exit 1 ;;
          esac
          cat /tmp/aws-uploaded.json
          P=/tmp/aws-uploaded.json
          check() {
            actual="$(jq -r "$1" "$P")"
            echo "$1 = $actual"
            if [ "$actual" != "$2" ]; then echo "FAIL: expected '$2'"; exit 1; fi
          }
          check '.duration_ms' '12345'
          check '.num_turns' '7'
          check '.total_cost_usd' '0.42'
          check '.input_tokens' '100'
          check '.output_tokens' '200'
          check '.cache_read_input_tokens' '300'
          check '.cache_creation_input_tokens' '400'
          check '.model' 'claude-sonnet-4'
          check '.pr_number' '0'
          check '.event_name' 'workflow_dispatch'
          check 'has("result")' 'false'
          check '.run_id | type' 'number'
          check '.timestamp | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.000$")' 'true'
          echo "PASS"
