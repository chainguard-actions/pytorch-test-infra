name: Test unparseable metrics file skips upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws CLI and broken file
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/aws" <<EOF
          #!/bin/sh
          echo "\$@" > "$RUNNER_TEMP/aws-args.txt"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/aws"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -f "$RUNNER_TEMP/aws-args.txt"
          printf '[{"type": "result", "duration_ms": 12' > "$RUNNER_TEMP/broken.json"
      - id: action
        uses: .
        with:
          metrics-file: ${{ runner.temp }}/broken.json
      - name: Assert success and no upload
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/aws-args.txt" ]; then
            echo "FAIL: aws should not have been called"
            exit 1
          fi
          echo "PASS"
