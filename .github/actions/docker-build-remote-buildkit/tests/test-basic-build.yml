name: Test basic buildx build (fake docker)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker that records its arguments
        run: |
          mkdir -p /tmp/fake-docker/bin
          rm -f /tmp/fake-docker/*.log /tmp/fake-docker/*.txt
          cat > /tmp/fake-docker/bin/docker <<'EOF'
          #!/usr/bin/env bash
          echo "$*" >> /tmp/fake-docker/calls.log
          if [ "$1" = "buildx" ] && [ "$2" = "build" ]; then
            printf '%s\n' "$@" > /tmp/fake-docker/build-args.txt
            echo "#1 [internal] load build definition from Dockerfile"
            echo "#2 DONE"
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-docker/bin/docker
          echo "/tmp/fake-docker/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          tags: |
            ghcr.io/example/img:abc123
            ghcr.io/example/img:latest
          context: some/context
          file: some/context/Dockerfile.custom
          target: final
          build-args: |
            FOO=bar
            BAZ=qux
          labels: |
            org.opencontainers.image.title=demo
          cache-from: type=registry,ref=ghcr.io/example/img:cache
          cache-to: type=inline
          connect-attempts: '2'
          connect-delay: '0'
      - name: Assert image output
        env:
          ACTUAL: ${{ steps.action.outputs.image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "ghcr.io/example/img:abc123" ]; then
            echo "FAIL: expected first tag"
            exit 1
          fi
          echo "PASS"
      - name: Assert buildx create and build invocation
        run: |
          echo "--- calls ---"; cat /tmp/fake-docker/calls.log
          echo "--- build args ---"; cat /tmp/fake-docker/build-args.txt
          case "$(uname -m)" in
            aarch64|arm64) plat=linux/arm64; addr=tcp://buildkitd-arm64.buildkit:1234 ;;
            *) plat=linux/amd64; addr=tcp://buildkitd-amd64.buildkit:1234 ;;
          esac
          grep -qF "buildx create --name remote-buildkit --driver remote --use ${addr}" /tmp/fake-docker/calls.log || { echo "FAIL: builder not created"; exit 1; }
          f=/tmp/fake-docker/build-args.txt
          for expected in "--tag" "ghcr.io/example/img:abc123" "ghcr.io/example/img:latest" \
              "--platform" "$plat" "--file" "some/context/Dockerfile.custom" \
              "--target" "final" "--build-arg" "FOO=bar" "BAZ=qux" \
              "--label" "org.opencontainers.image.title=demo" \
              "--cache-from" "type=registry,ref=ghcr.io/example/img:cache" \
              "--cache-to" "type=inline" "--push"; do
            grep -qxF -- "$expected" "$f" || { echo "FAIL: missing arg '$expected'"; exit 1; }
          done
          last="$(tail -n1 "$f")"
          if [ "$last" != "some/context" ]; then
            echo "FAIL: context should be last arg, got '$last'"
            exit 1
          fi
          n="$(grep -c 'buildx build' /tmp/fake-docker/calls.log)"
          [ "$n" = "1" ] || { echo "FAIL: expected 1 build call, got $n"; exit 1; }
          echo "PASS"
