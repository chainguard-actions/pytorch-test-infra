name: Test connection retries exhausted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker on PATH (never connects)
        run: |
          rm -rf /tmp/fakebin /tmp/fake-docker-*
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/docker <<'EOF'
          #!/usr/bin/env bash
          echo "$*" >> /tmp/fake-docker-calls.log
          if [ "$1" = "buildx" ] && [ "$2" = "build" ]; then
            n=$(( $(cat /tmp/fake-docker-count 2>/dev/null || echo 0) + 1 ))
            echo "$n" > /tmp/fake-docker-count
            echo "ERROR: failed to list workers: context deadline exceeded" >&2
            exit 1
          fi
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          echo /tmp/fakebin >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: ghcr.io/example/cold:1
          connect-attempts: '3'
          connect-delay: '0'
      - name: Assert failed after all attempts
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME count: $(cat /tmp/fake-docker-count)"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          [ "$(cat /tmp/fake-docker-count)" = "3" ] || { echo "FAIL: expected exactly 3 attempts"; exit 1; }
          echo "PASS"
