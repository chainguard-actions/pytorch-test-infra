name: Test failure after connect attempts exhausted (mocked docker)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI on PATH
        run: |
          rm -rf /tmp/fake-docker && mkdir -p /tmp/fake-docker/bin
          cat > /tmp/fake-docker/bin/docker <<'EOF'
          #!/usr/bin/env bash
          d=/tmp/fake-docker
          echo "$*" >> "$d/calls.log"
          if [ "$1" = buildx ] && [ "$2" = build ]; then
            n=$(cat "$d/count" 2>/dev/null || echo 0); n=$((n+1)); echo "$n" > "$d/count"
            echo "ERROR: failed to list workers: context deadline exceeded"
            exit 1
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-docker/bin/docker
          echo "/tmp/fake-docker/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: ghcr.io/example/cold:1
          connect-attempts: '3'
          connect-delay: '0'
      - name: Assert failed after exactly connect-attempts tries
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          count="$(cat /tmp/fake-docker/count)"
          echo "outcome: $OUTCOME, attempts: $count"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          [ "$count" = "3" ] || { echo "FAIL: expected exactly 3 attempts"; exit 1; }
          echo "PASS"
