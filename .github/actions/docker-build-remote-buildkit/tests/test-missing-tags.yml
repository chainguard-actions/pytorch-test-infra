name: Test missing tags fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/usr/bin/env bash
          { echo "---CALL---"; printf '%s\n' "$@"; } >> /tmp/fake-docker.log
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          rm -f /tmp/fake-docker.log
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: " , "
          connect-delay: '0'
      - name: Assert failure without building
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          echo "outcome: $OUTCOME image: '$IMAGE'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no tags provided"
            exit 1
          fi
          if [ -n "$IMAGE" ]; then
            echo "FAIL: image output should be empty"
            exit 1
          fi
          if [ -f /tmp/fake-docker.log ]; then
            cat /tmp/fake-docker.log
            echo "FAIL: docker should not have been invoked"
            exit 1
          fi
          echo "PASS"
