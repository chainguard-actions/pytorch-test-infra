name: Test missing tags fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker on PATH
        run: |
          rm -rf /tmp/fake-docker && mkdir -p /tmp/fake-docker/bin
          cat > /tmp/fake-docker/bin/docker <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/fake-docker/calls.log
          exit 0
          EOF
          chmod +x /tmp/fake-docker/bin/docker
          echo "/tmp/fake-docker/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: " , "
      - name: Assert failure and no build
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          echo "outcome: $OUTCOME image: '$IMAGE'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if [ -n "$IMAGE" ]; then
            echo "FAIL: image output should be empty"
            exit 1
          fi
          if [ -f /tmp/fake-docker/calls.log ]; then
            echo "FAIL: docker should not have been invoked"
            cat /tmp/fake-docker/calls.log
            exit 1
          fi
          echo "PASS"
