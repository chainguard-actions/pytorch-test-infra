name: Test missing tags fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAKE_DOCKER_MODE: success
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker
        run: |
          rm -rf /tmp/fake-docker
          mkdir -p "$RUNNER_TEMP/fakebin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker" "$RUNNER_TEMP/fakebin/docker"
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: " , "
      - name: Assert failure and no build
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          echo "outcome: $OUTCOME image: '$IMAGE'"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          [ -z "$IMAGE" ] || { echo "FAIL: image should be empty"; exit 1; }
          if [ -f /tmp/fake-docker/build-count ]; then echo "FAIL: docker build should not run"; exit 1; fi
          echo "PASS"
