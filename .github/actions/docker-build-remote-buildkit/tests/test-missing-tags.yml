name: Test missing tags fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock docker
        run: |
          mkdir -p /tmp/mock-docker/bin
          rm -f /tmp/mock-docker/*.log /tmp/mock-docker/*.txt
          cat > /tmp/mock-docker/bin/docker <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/mock-docker/calls.log
          exit 0
          EOF
          chmod +x /tmp/mock-docker/bin/docker
          echo "/tmp/mock-docker/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: " , "
          connect-attempts: '1'
          connect-delay: '0'
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no tags provided"
            exit 1
          fi
          if [ -f /tmp/mock-docker/calls.log ] && grep -q "buildx" /tmp/mock-docker/calls.log; then
            echo "FAIL: docker should not have been invoked"
            exit 1
          fi
          echo "PASS"
