name: Test retry on connection-phase failure then success
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker on PATH (fails to connect twice)
        run: |
          rm -rf /tmp/fakebin /tmp/fake-docker-*
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/docker <<'EOF'
          #!/usr/bin/env bash
          echo "$*" >> /tmp/fake-docker-calls.log
          if [ "$1" = "buildx" ] && [ "$2" = "build" ]; then
            n=$(( $(cat /tmp/fake-docker-count 2>/dev/null || echo 0) + 1 ))
            echo "$n" > /tmp/fake-docker-count
            if [ "$n" -lt 3 ]; then
              echo "ERROR: failed to dial gRPC: connection refused" >&2
              exit 1
            fi
            echo "#1 [internal] load build definition from Dockerfile"
            exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          echo /tmp/fakebin >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          tags: ghcr.io/example/retry:1
          connect-attempts: '5'
          connect-delay: '0'
      - name: Assert succeeded after 3 attempts
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          echo "outcome: $OUTCOME image: $IMAGE count: $(cat /tmp/fake-docker-count)"
          [ "$OUTCOME" = "success" ] || { echo "FAIL: expected success"; exit 1; }
          [ "$IMAGE" = "ghcr.io/example/retry:1" ] || { echo "FAIL: wrong image"; exit 1; }
          [ "$(cat /tmp/fake-docker-count)" = "3" ] || { echo "FAIL: expected 3 build attempts"; exit 1; }
          echo "PASS"
