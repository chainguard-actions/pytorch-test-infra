name: Test retry on connection-phase failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker that fails to connect twice
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/usr/bin/env bash
          { echo "---CALL---"; printf '%s\n' "$@"; } >> /tmp/fake-docker.log
          if [[ "$1 $2" == "buildx build" ]]; then
            n=$(( $(cat /tmp/fake-build-count 2>/dev/null || echo 0) + 1 ))
            echo "$n" > /tmp/fake-build-count
            if [ "$n" -le 2 ]; then
              echo "ERROR: failed to dial: connection refused" >&2
              exit 1
            fi
            echo "#1 [internal] load build definition from Dockerfile"
          fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          rm -f /tmp/fake-docker.log /tmp/fake-build-count
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          tags: ghcr.io/example/retry:1
          connect-attempts: '5'
          connect-delay: '0'
      - name: Assert build retried and succeeded
        env:
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          count="$(cat /tmp/fake-build-count)"
          echo "build attempts: $count image: $IMAGE"
          if [ "$count" != "3" ]; then
            echo "FAIL: expected 3 build attempts"
            exit 1
          fi
          [ "$IMAGE" = "ghcr.io/example/retry:1" ] || { echo "FAIL: bad image output"; exit 1; }
          echo "PASS"
