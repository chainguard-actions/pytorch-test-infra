name: Test retry on connection-phase failure (mocked docker)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAKE_FAIL_TIMES: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI on PATH
        run: |
          rm -rf /tmp/fake-docker && mkdir -p /tmp/fake-docker/bin
          cat > /tmp/fake-docker/bin/docker <<'EOF'
          #!/usr/bin/env bash
          d=/tmp/fake-docker
          echo "$*" >> "$d/calls.log"
          if [ "$1" = buildx ] && [ "$2" = build ]; then
            n=$(cat "$d/count" 2>/dev/null || echo 0); n=$((n+1)); echo "$n" > "$d/count"
            if [ "$n" -le "${FAKE_FAIL_TIMES:-2}" ]; then
              echo "ERROR: failed to dial gRPC: connection refused"; exit 1
            fi
            echo "#1 [internal] load build definition from Dockerfile"; exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-docker/bin/docker
          echo "/tmp/fake-docker/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          tags: ghcr.io/example/retry:1
          connect-attempts: '5'
          connect-delay: '0'
      - name: Assert build retried until success
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          count="$(cat /tmp/fake-docker/count)"
          echo "outcome: $OUTCOME, attempts: $count, image: $IMAGE"
          [ "$OUTCOME" = "success" ] || { echo "FAIL: expected success"; exit 1; }
          [ "$count" = "3" ] || { echo "FAIL: expected 3 build attempts"; exit 1; }
          [ "$IMAGE" = "ghcr.io/example/retry:1" ] || { echo "FAIL: wrong image output"; exit 1; }
          echo "PASS"
