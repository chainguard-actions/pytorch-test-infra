name: Test command mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker on PATH
        run: |
          rm -rf /tmp/fake-docker && mkdir -p /tmp/fake-docker/bin
          cat > /tmp/fake-docker/bin/docker <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/fake-docker/calls.log
          exit 0
          EOF
          chmod +x /tmp/fake-docker/bin/docker
          echo "/tmp/fake-docker/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          command: echo "custom build ran" > /tmp/fake-docker/command-ran && docker buildx build --push -t ghcr.io/example/cmd:1 .
          tags: ghcr.io/example/ignored:1
          connect-attempts: '1'
          connect-delay: '0'
      - name: Assert command ran and image empty
        env:
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          cat /tmp/fake-docker/calls.log
          echo "image: '$IMAGE'"
          if [ -n "$IMAGE" ]; then
            echo "FAIL: image output should be empty in command mode"
            exit 1
          fi
          if [ "$(cat /tmp/fake-docker/command-ran 2>/dev/null)" != "custom build ran" ]; then
            echo "FAIL: command did not run"
            exit 1
          fi
          grep -q "buildx create --name remote-buildkit --driver remote --use tcp://buildkitd-" /tmp/fake-docker/calls.log || { echo "FAIL: builder not registered"; exit 1; }
          grep -qF "buildx build --push -t ghcr.io/example/cmd:1 ." /tmp/fake-docker/calls.log || { echo "FAIL: command's docker call missing"; exit 1; }
          if grep -q "ignored" /tmp/fake-docker/calls.log; then
            echo "FAIL: tags input should be ignored in command mode"
            exit 1
          fi
          echo "PASS"
