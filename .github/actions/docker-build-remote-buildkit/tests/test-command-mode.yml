name: Test command mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker
        run: |
          mkdir -p /tmp/fake-docker/bin
          rm -f /tmp/fake-docker/*.log /tmp/fake-docker/*.txt /tmp/command-ran
          cat > /tmp/fake-docker/bin/docker <<'EOF'
          #!/usr/bin/env bash
          echo "$*" >> /tmp/fake-docker/calls.log
          exit 0
          EOF
          chmod +x /tmp/fake-docker/bin/docker
          echo "/tmp/fake-docker/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          command: echo "custom-build $((1+2))" > /tmp/command-ran
          tags: ghcr.io/example/ignored:1
          connect-attempts: '1'
          connect-delay: '0'
      - name: Assert command ran and image output is empty
        env:
          ACTUAL: ${{ steps.action.outputs.image }}
        run: |
          echo "image: '$ACTUAL'"
          cat /tmp/fake-docker/calls.log
          [ -z "$ACTUAL" ] || { echo "FAIL: image should be empty in command mode"; exit 1; }
          [ -f /tmp/command-ran ] || { echo "FAIL: command did not run"; exit 1; }
          [ "$(cat /tmp/command-ran)" = "custom-build 3" ] || { echo "FAIL: unexpected command output"; exit 1; }
          grep -q "buildx create --name remote-buildkit" /tmp/fake-docker/calls.log || { echo "FAIL: builder not registered"; exit 1; }
          if grep -q "buildx build" /tmp/fake-docker/calls.log; then echo "FAIL: buildx build should not be invoked"; exit 1; fi
          echo "PASS"
