name: Test command mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAKE_DOCKER_MODE: success
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker
        run: |
          rm -rf /tmp/fake-docker
          mkdir -p "$RUNNER_TEMP/fakebin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker" "$RUNNER_TEMP/fakebin/docker"
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          command: docker buildx build --tag custom/img:cmd --push . && echo cmd-ran > /tmp/fake-docker/cmd-marker
          tags: ignored/img:tag
          connect-delay: '0'
      - name: Assert command ran and image output empty
        env:
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          echo "image: '$IMAGE'"
          cat /tmp/fake-docker/calls.log
          [ -z "$IMAGE" ] || { echo "FAIL: image output should be empty in command mode"; exit 1; }
          [ "$(cat /tmp/fake-docker/cmd-marker)" = "cmd-ran" ] || { echo "FAIL: command not run"; exit 1; }
          grep -q "^buildx create --name remote-buildkit" /tmp/fake-docker/calls.log || { echo "FAIL: builder not registered"; exit 1; }
          A=/tmp/fake-docker/build-args-1.txt
          grep -qxF 'custom/img:cmd' "$A" || { echo "FAIL: command's tag missing"; exit 1; }
          if grep -qxF 'ignored/img:tag' "$A"; then echo "FAIL: tags input should be ignored"; exit 1; fi
          if grep -qxE 'linux/(amd64|arm64)' "$A"; then echo "FAIL: action should not add --platform"; exit 1; fi
          echo "PASS"
