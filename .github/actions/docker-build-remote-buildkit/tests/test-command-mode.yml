name: Test command mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker (no remote BuildKit under act)
        run: |
          mkdir -p /tmp/fake-docker/bin
          rm -f /tmp/fake-docker/calls.log /tmp/fake-docker/cmd-ran
          cat > /tmp/fake-docker/bin/docker <<'EOF'
          #!/usr/bin/env bash
          { printf 'CALL'; printf ' [%s]' "$@"; printf '\n'; } >> /tmp/fake-docker/calls.log
          exit 0
          EOF
          chmod +x /tmp/fake-docker/bin/docker
          echo /tmp/fake-docker/bin >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          command: docker buildx build --tag my/custom:tag --push ./ctx && echo ran > /tmp/fake-docker/cmd-ran
          tags: ignored/tag:1
          push: 'true'
          connect-attempts: '1'
          connect-delay: '0'
      - name: Assert command ran and image output empty
        env:
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          echo "image: '$IMAGE'"
          cat /tmp/fake-docker/calls.log
          [ -z "$IMAGE" ] || { echo "FAIL: image output should be empty in command mode"; exit 1; }
          [ -f /tmp/fake-docker/cmd-ran ] || { echo "FAIL: command did not run"; exit 1; }
          grep -q '^CALL \[buildx\] \[create\]' /tmp/fake-docker/calls.log || { echo "FAIL: builder not registered"; exit 1; }
          grep -qF '[buildx] [build] [--tag] [my/custom:tag] [--push] [./ctx]' /tmp/fake-docker/calls.log || { echo "FAIL: custom build not run"; exit 1; }
          if grep -qF 'ignored/tag:1' /tmp/fake-docker/calls.log; then echo "FAIL: tags input should be ignored"; exit 1; fi
          echo "PASS"
