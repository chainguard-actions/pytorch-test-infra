name: Test command mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI
        run: |
          rm -rf /tmp/fake-docker /tmp/fake-docker-bin
          mkdir -p /tmp/fake-docker /tmp/fake-docker-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker/docker" /tmp/fake-docker-bin/docker
          chmod +x /tmp/fake-docker-bin/docker
          echo success > /tmp/fake-docker/mode
          echo /tmp/fake-docker-bin >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          command: echo "command-ran" > /tmp/fake-docker/cmd-marker && docker buildx build --tag cmd/img:1 --push .
          tags: ignored/img:tag
          connect-delay: '0'
      - name: Assert command ran and image output empty
        env:
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          echo "image: '$IMAGE'"
          if [ -n "$IMAGE" ]; then echo "FAIL: image output must be empty in command mode"; exit 1; fi
          if [ "$(cat /tmp/fake-docker/cmd-marker 2>/dev/null)" != "command-ran" ]; then
            echo "FAIL: command did not run"; exit 1
          fi
          f=/tmp/fake-docker/args-1.txt
          cat "$f"
          if ! grep -Fxq -- "cmd/img:1" "$f"; then echo "FAIL: command's build not invoked"; exit 1; fi
          if grep -Fxq -- "ignored/img:tag" "$f"; then echo "FAIL: tags input should be ignored"; exit 1; fi
          if grep -Fxq -- "--platform" "$f"; then echo "FAIL: action should not assemble buildx args"; exit 1; fi
          if ! grep -Fxq -- "remote-buildkit" /tmp/fake-docker/create.log; then
            echo "FAIL: builder not registered"; exit 1
          fi
          echo "PASS"
