name: Test command mode (mocked docker)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI on PATH
        run: |
          rm -rf /tmp/fake-docker && mkdir -p /tmp/fake-docker/bin
          cat > /tmp/fake-docker/bin/docker <<'EOF'
          #!/usr/bin/env bash
          echo "$*" >> /tmp/fake-docker/calls.log
          exit 0
          EOF
          chmod +x /tmp/fake-docker/bin/docker
          echo "/tmp/fake-docker/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          command: echo "custom-build-ran" > /tmp/fake-docker/cmd-marker && docker buildx build --tag custom/img:1 --push .
          tags: ignored/img:should-not-appear
          connect-delay: '0'
      - name: Assert command ran and image output empty
        env:
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          echo "image: '$IMAGE'"
          echo "--- calls ---"; cat /tmp/fake-docker/calls.log
          if [ -n "$IMAGE" ]; then echo "FAIL: image output should be empty in command mode"; exit 1; fi
          [ "$(cat /tmp/fake-docker/cmd-marker 2>/dev/null)" = "custom-build-ran" ] || { echo "FAIL: command did not run"; exit 1; }
          grep -q '^buildx create --name remote-buildkit' /tmp/fake-docker/calls.log || { echo "FAIL: builder not registered"; exit 1; }
          grep -qx 'buildx build --tag custom/img:1 --push .' /tmp/fake-docker/calls.log || { echo "FAIL: custom build command not run"; exit 1; }
          if grep -q 'should-not-appear' /tmp/fake-docker/calls.log; then echo "FAIL: tags input should be ignored"; exit 1; fi
          echo "PASS"
