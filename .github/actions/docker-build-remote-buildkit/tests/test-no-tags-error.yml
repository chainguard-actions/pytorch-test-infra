name: Test missing tags fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker on PATH
        run: |
          rm -rf /tmp/fakebin /tmp/fake-docker-*
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/docker <<'EOF'
          #!/usr/bin/env bash
          echo "$*" >> /tmp/fake-docker-calls.log
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          echo /tmp/fakebin >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: " , \n "
          connect-attempts: '1'
          connect-delay: '0'
      - name: Assert action failed without calling docker
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          echo "outcome: $OUTCOME image: '$IMAGE'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if [ -n "$IMAGE" ]; then
            echo "FAIL: image output should be empty"
            exit 1
          fi
          if [ -f /tmp/fake-docker-calls.log ]; then
            echo "FAIL: docker should not have been invoked"; cat /tmp/fake-docker-calls.log
            exit 1
          fi
          echo "PASS"
