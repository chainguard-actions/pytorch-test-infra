name: Test missing tags fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI
        run: |
          rm -rf /tmp/fake-docker /tmp/fake-docker-bin
          mkdir -p /tmp/fake-docker /tmp/fake-docker-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker/docker" /tmp/fake-docker-bin/docker
          chmod +x /tmp/fake-docker-bin/docker
          echo success > /tmp/fake-docker/mode
          echo /tmp/fake-docker-bin >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: ' , '
      - name: Assert action failed without building
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          echo "outcome: $OUTCOME image: '$IMAGE'"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          if [ -n "$IMAGE" ]; then echo "FAIL: image output should be empty"; exit 1; fi
          if [ -f /tmp/fake-docker/count ]; then echo "FAIL: build should not have run"; exit 1; fi
          echo "PASS"
