name: Test genuine build error is not retried
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock docker (build starts then fails)
        run: |
          mkdir -p /tmp/mock-docker/bin
          rm -f /tmp/mock-docker/*.log /tmp/mock-docker/*.txt
          cat > /tmp/mock-docker/bin/docker <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/mock-docker/calls.log
          if [ "$1" = buildx ] && [ "$2" = build ]; then
            n=$(cat /tmp/mock-docker/count.txt 2>/dev/null || echo 0)
            n=$((n+1)); echo "$n" > /tmp/mock-docker/count.txt
            echo "#1 [internal] load build definition from Dockerfile"
            echo "#5 [2/3] RUN false"
            echo "ERROR: failed to solve: connection reset during step" >&2
            exit 7
          fi
          exit 0
          EOF
          chmod +x /tmp/mock-docker/bin/docker
          echo "/tmp/mock-docker/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: ghcr.io/example/broken:1
          connect-attempts: '5'
          connect-delay: '0'
      - name: Assert failed once without retry
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          COUNT="$(cat /tmp/mock-docker/count.txt)"
          echo "outcome: $OUTCOME attempts: $COUNT"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          [ "$COUNT" = "1" ] || { echo "FAIL: expected exactly 1 attempt"; exit 1; }
          echo "PASS"
