name: Test real build error is not retried
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker
        run: |
          rm -rf /tmp/fake-docker && mkdir -p /tmp/fake-docker/bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker" /tmp/fake-docker/bin/docker
          chmod +x /tmp/fake-docker/bin/docker
          echo build-error > /tmp/fake-docker/mode
          echo /tmp/fake-docker/bin >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: ghcr.io/example/broken:1
          connect-attempts: '5'
          connect-delay: '0'
      - name: Assert failed after a single attempt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          COUNT="$(cat /tmp/fake-docker/build-count)"
          echo "outcome: $OUTCOME attempts: $COUNT"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          if [ "$COUNT" != "1" ]; then echo "FAIL: real build error must not be retried"; exit 1; fi
          echo "PASS"
