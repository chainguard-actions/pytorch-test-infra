name: Test real build error is not retried
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI (genuine build error)
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/docker-build-* /tmp/docker-all.log
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/docker-all.log
          if [ "$1" = buildx ] && [ "$2" = build ]; then
            n=$(( $(cat /tmp/docker-build-count 2>/dev/null || echo 0) + 1 ))
            echo "$n" > /tmp/docker-build-count
            echo "#1 [internal] load build definition from Dockerfile"
            echo "#5 [2/3] RUN false"
            echo "ERROR: failed to solve: process did not complete successfully: exit code: 1"
            exit 1
          fi
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: ghcr.io/example/broken:1
          connect-attempts: '5'
          connect-delay: '0'
      - name: Assert failed after a single attempt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          count=$(cat /tmp/docker-build-count)
          echo "build count: $count"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          if [ "$count" != "1" ]; then echo "FAIL: genuine build error should not be retried"; exit 1; fi
          echo "PASS"
