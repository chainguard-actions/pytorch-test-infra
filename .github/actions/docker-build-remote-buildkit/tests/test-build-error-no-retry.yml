name: Test genuine build error is not retried
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker on PATH (build error after progress)
        run: |
          rm -rf /tmp/fakebin /tmp/fake-docker-*
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/docker <<'EOF'
          #!/usr/bin/env bash
          echo "$*" >> /tmp/fake-docker-calls.log
          if [ "$1" = "buildx" ] && [ "$2" = "build" ]; then
            n=$(( $(cat /tmp/fake-docker-count 2>/dev/null || echo 0) + 1 ))
            echo "$n" > /tmp/fake-docker-count
            echo "#1 [internal] load build definition from Dockerfile"
            echo "#5 [2/3] RUN false"
            echo "ERROR: connection reset while process did not complete successfully: exit code: 7" >&2
            exit 7
          fi
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          echo /tmp/fakebin >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: ghcr.io/example/broken:1
          connect-attempts: '5'
          connect-delay: '0'
      - name: Assert failed after a single attempt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME count: $(cat /tmp/fake-docker-count)"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          [ "$(cat /tmp/fake-docker-count)" = "1" ] || { echo "FAIL: build error must not be retried"; exit 1; }
          echo "PASS"
