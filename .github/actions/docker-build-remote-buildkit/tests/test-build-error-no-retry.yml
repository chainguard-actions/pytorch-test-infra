name: Test real build error is not retried
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker whose build fails after starting
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          rm -f /tmp/fake-docker.log
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/fake-docker.log
          if [ "$1 $2" = "buildx build" ]; then
            echo "#1 [internal] load build definition from Dockerfile"
            echo "#5 [2/3] RUN false"
            echo "ERROR: process did not complete successfully: exit code: 1" >&2
            exit 7
          fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: ghcr.io/example/img:broken
          connect-attempts: '5'
          connect-delay: '0'
      - name: Assert failed once without retry
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          cat /tmp/fake-docker.log
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"; exit 1
          fi
          count="$(grep -c '^buildx build' /tmp/fake-docker.log)"
          echo "build attempts: $count"
          if [ "$count" != "1" ]; then
            echo "FAIL: real build error should not be retried"; exit 1
          fi
          echo "PASS"
