name: Test genuine build error is not retried
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker that fails during the build
        run: |
          rm -rf /tmp/fake-docker && mkdir -p /tmp/fake-docker/bin
          cat > /tmp/fake-docker/bin/docker <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/fake-docker/calls.log
          if [ "$1" = buildx ] && [ "$2" = build ]; then
            n=$(cat /tmp/fake-docker/count 2>/dev/null || echo 0); n=$((n+1)); echo "$n" > /tmp/fake-docker/count
            echo "#1 [internal] load build definition from Dockerfile"
            echo "#5 [2/3] RUN false"
            echo "ERROR: failed to solve: process did not complete successfully (connection reset mention)"
            exit 7
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-docker/bin/docker
          echo "/tmp/fake-docker/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: ghcr.io/example/broken:1
          connect-attempts: '5'
          connect-delay: '0'
      - name: Assert failed without retry
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          cat /tmp/fake-docker/calls.log
          count="$(cat /tmp/fake-docker/count)"
          echo "outcome: $OUTCOME invocations: $count"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if [ "$count" != "1" ]; then
            echo "FAIL: build error should not be retried"
            exit 1
          fi
          echo "PASS"
