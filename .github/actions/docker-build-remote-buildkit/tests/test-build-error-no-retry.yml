name: Test real build error is not retried
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker with real build error
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/usr/bin/env bash
          { echo "---CALL---"; printf '%s\n' "$@"; } >> /tmp/fake-docker.log
          if [[ "$1 $2" == "buildx build" ]]; then
            n=$(( $(cat /tmp/fake-build-count 2>/dev/null || echo 0) + 1 ))
            echo "$n" > /tmp/fake-build-count
            echo "#1 [internal] load build definition from Dockerfile"
            echo "#5 [2/3] RUN false"
            echo "ERROR: process did not complete successfully: connection reset" >&2
            exit 7
          fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          rm -f /tmp/fake-docker.log /tmp/fake-build-count
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: ghcr.io/example/broken:1
          connect-attempts: '5'
          connect-delay: '0'
      - name: Assert failed after a single attempt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          count="$(cat /tmp/fake-build-count)"
          echo "outcome: $OUTCOME attempts: $count"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if [ "$count" != "1" ]; then
            echo "FAIL: real build error should not be retried"
            exit 1
          fi
          echo "PASS"
