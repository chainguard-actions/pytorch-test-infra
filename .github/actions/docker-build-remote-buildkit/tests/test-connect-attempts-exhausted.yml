name: Test connection retries give up after connect-attempts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI (never connects)
        run: |
          rm -rf /tmp/fake-docker /tmp/fake-docker-bin
          mkdir -p /tmp/fake-docker /tmp/fake-docker-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker/docker" /tmp/fake-docker-bin/docker
          chmod +x /tmp/fake-docker-bin/docker
          echo connfail > /tmp/fake-docker/mode
          echo /tmp/fake-docker-bin >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tags: example.com/cold:1
          connect-attempts: '3'
          connect-delay: '0'
      - name: Assert exactly connect-attempts tries then failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          count=$(cat /tmp/fake-docker/count)
          echo "outcome: $OUTCOME builds: $count"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          if [ "$count" != "3" ]; then echo "FAIL: expected 3 attempts"; exit 1; fi
          echo "PASS"
