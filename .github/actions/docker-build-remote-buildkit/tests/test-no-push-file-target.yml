name: Test push=false with file and target
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker (no remote BuildKit under act)
        run: |
          mkdir -p /tmp/fake-docker/bin
          rm -f /tmp/fake-docker/calls.log /tmp/fake-docker/count
          echo ok > /tmp/fake-docker/mode
          cat > /tmp/fake-docker/bin/docker <<'EOF'
          #!/usr/bin/env bash
          D=/tmp/fake-docker
          { printf 'CALL'; printf ' [%s]' "$@"; printf '\n'; } >> "$D/calls.log"
          if [ "$1" = buildx ] && [ "$2" = build ]; then
            n=$(cat "$D/count" 2>/dev/null || echo 0); n=$((n+1)); echo "$n" > "$D/count"
            echo "#1 [internal] load build definition from Dockerfile"; exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-docker/bin/docker
          echo /tmp/fake-docker/bin >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          tags: |
            registry.example.com/one:1

            registry.example.com/two:2
          file: docker/Custom.Dockerfile
          target: runtime
          push: 'false'
          connect-attempts: '1'
          connect-delay: '0'
      - name: Assert invocation
        env:
          IMAGE: ${{ steps.action.outputs.image }}
        run: |
          echo "image: $IMAGE"
          cat /tmp/fake-docker/calls.log
          [ "$IMAGE" = "registry.example.com/one:1" ] || { echo "FAIL: image output"; exit 1; }
          BUILD="$(grep '^CALL \[buildx\] \[build\]' /tmp/fake-docker/calls.log)"
          for exp in '[--tag] [registry.example.com/one:1]' '[--tag] [registry.example.com/two:2]' \
                     '[--file] [docker/Custom.Dockerfile]' '[--target] [runtime]'; do
            echo "$BUILD" | grep -qF -- "$exp" || { echo "FAIL: missing $exp"; exit 1; }
          done
          [ "$(echo "$BUILD" | grep -o -- '\[--tag\]' | wc -l)" -eq 2 ] || { echo "FAIL: expected 2 tags"; exit 1; }
          if echo "$BUILD" | grep -qF -- '[--push]'; then echo "FAIL: --push should be absent"; exit 1; fi
          echo "$BUILD" | grep -qE '\[\.\]$' || { echo "FAIL: default context '.' not last"; exit 1; }
          echo "PASS"
