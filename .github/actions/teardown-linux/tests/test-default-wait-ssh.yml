name: Test default (wait for ssh sessions)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker and who
        run: |
          BIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$BIN"
          cat > "$BIN/docker" <<'EOF'
          #!/bin/sh
          echo "docker $*" >> "$RUNNER_TEMP/docker.log"
          exit 0
          EOF
          cat > "$BIN/who" <<'EOF'
          #!/bin/sh
          echo "called" >> "$RUNNER_TEMP/who.log"
          exit 0
          EOF
          chmod +x "$BIN/docker" "$BIN/who"
          echo "$BIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
      - name: Assert ssh check ran then docker cleanup ran
        run: |
          echo "--- who.log ---"; cat "$RUNNER_TEMP/who.log" || true
          echo "--- docker.log ---"; cat "$RUNNER_TEMP/docker.log" || true
          [ -f "$RUNNER_TEMP/who.log" ] || { echo "FAIL: who was not called"; exit 1; }
          N=$(wc -l < "$RUNNER_TEMP/who.log")
          if [ "$N" -ne 1 ]; then
            echo "FAIL: expected who to be called once (no sessions), got $N"
            exit 1
          fi
          grep -qx "docker system prune -af" "$RUNNER_TEMP/docker.log" || { echo "FAIL: prune not called"; exit 1; }
          echo "PASS"
