name: Test basic teardown (default, no ssh sessions)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker and who on PATH
        run: |
          MOCK="$RUNNER_TEMP/mockbin"
          mkdir -p "$MOCK"
          cat > "$MOCK/docker" <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/docker-calls.log
          case "$1" in
            ps) echo "abc123"; echo "def456" ;;
          esac
          exit 0
          EOF
          cat > "$MOCK/who" <<'EOF'
          #!/bin/bash
          echo "called" >> /tmp/who-calls.log
          exit 0
          EOF
          chmod +x "$MOCK/docker" "$MOCK/who"
          rm -f /tmp/docker-calls.log /tmp/who-calls.log
          echo "$MOCK" >> "$GITHUB_PATH"
      - id: action
        uses: .
      - name: Assert docker and who were invoked correctly
        run: |
          echo "--- docker calls ---"; cat /tmp/docker-calls.log || true
          echo "--- who calls ---"; cat /tmp/who-calls.log || true
          if [ ! -f /tmp/who-calls.log ]; then
            echo "FAIL: who was not called (ssh wait step should run by default)"
            exit 1
          fi
          if [ "$(wc -l < /tmp/who-calls.log)" -ne 1 ]; then
            echo "FAIL: expected who to be called exactly once"
            exit 1
          fi
          grep -qx "ps -q" /tmp/docker-calls.log || { echo "FAIL: docker ps -q not called"; exit 1; }
          grep -qx "stop abc123 def456" /tmp/docker-calls.log || { echo "FAIL: docker stop not called with container ids"; exit 1; }
          grep -qx "system prune -af" /tmp/docker-calls.log || { echo "FAIL: docker system prune -af not called"; exit 1; }
          echo "PASS"
