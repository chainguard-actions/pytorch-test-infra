name: Test waiting for ssh sessions to drain
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker and a who that reports a session once
        run: |
          set -eu
          BIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$BIN"
          LOG="$RUNNER_TEMP/calls.log"
          STATE="$RUNNER_TEMP/who.state"
          : > "$LOG"
          rm -f "$STATE"
          cat > "$BIN/docker" <<EOF
          #!/bin/sh
          echo "docker \$*" >> "$LOG"
          exit 0
          EOF
          cat > "$BIN/who" <<EOF
          #!/bin/sh
          echo "who" >> "$LOG"
          if [ ! -f "$STATE" ]; then
            touch "$STATE"
            echo "user     pts/0        2024-01-01 00:00 (10.0.0.1)"
          fi
          exit 0
          EOF
          chmod +x "$BIN/docker" "$BIN/who"
          echo "$BIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
      - name: Assert runner waited until ssh drained, then cleaned up
        run: |
          LOG="$RUNNER_TEMP/calls.log"
          echo "--- calls ---"; cat "$LOG"
          WHO_COUNT=$(grep -c '^who$' "$LOG" || true)
          echo "who count: $WHO_COUNT"
          if [ "$WHO_COUNT" != "2" ]; then
            echo "FAIL: expected who to be polled twice"; exit 1
          fi
          if ! grep -q '^docker system prune -af$' "$LOG"; then
            echo "FAIL: docker system prune -af not invoked"; exit 1
          fi
          echo "PASS"
