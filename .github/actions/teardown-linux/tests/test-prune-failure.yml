name: Test docker prune failure fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker (system prune fails)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          LOG="$RUNNER_TEMP/calls.log"
          : > "$LOG"
          cat > "$RUNNER_TEMP/fakebin/docker" <<EOF
          #!/bin/sh
          echo "docker \$*" >> "$LOG"
          if [ "\$1" = "system" ]; then exit 3; fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-wait-ssh: "true"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat "$RUNNER_TEMP/calls.log"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          echo "PASS"
