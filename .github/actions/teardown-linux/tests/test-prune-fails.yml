name: Test docker prune failure fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker whose prune fails
        run: |
          FAKEBIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$FAKEBIN"
          LOG="$RUNNER_TEMP/docker-calls.log"
          : > "$LOG"
          cat > "$FAKEBIN/docker" <<EOF
          #!/bin/bash
          echo "docker \$*" >> "$LOG"
          if [ "\$1" = "system" ]; then
            echo "Error: prune failed" >&2
            exit 1
          fi
          exit 0
          EOF
          chmod +x "$FAKEBIN/docker"
          echo "$FAKEBIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-wait-ssh: "true"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat "$RUNNER_TEMP/docker-calls.log"
          grep -qx "docker system prune -af" "$RUNNER_TEMP/docker-calls.log" || { echo "FAIL: prune not called"; exit 1; }
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when prune fails"
            exit 1
          fi
          echo "PASS"
