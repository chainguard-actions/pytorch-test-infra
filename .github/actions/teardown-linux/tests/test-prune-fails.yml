name: Test docker prune failure fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker (prune fails)
        run: |
          BIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$BIN"
          cat > "$BIN/docker" <<'EOF'
          #!/bin/sh
          echo "docker $*" >> "$RUNNER_TEMP/docker.log"
          case "$1" in
            system) echo "prune failed" >&2; exit 3 ;;
          esac
          exit 0
          EOF
          chmod +x "$BIN/docker"
          echo "$BIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-wait-ssh: "true"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat "$RUNNER_TEMP/docker.log" || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when docker system prune fails"
            exit 1
          fi
          grep -qx "docker system prune -af" "$RUNNER_TEMP/docker.log" || { echo "FAIL: prune not attempted"; exit 1; }
          echo "PASS"
