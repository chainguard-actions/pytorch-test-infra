name: Test docker stop failure is tolerated
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker whose stop fails (no running containers)
        run: |
          set -eu
          BIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$BIN"
          LOG="$RUNNER_TEMP/calls.log"
          : > "$LOG"
          cat > "$BIN/docker" <<EOF
          #!/bin/sh
          echo "docker \$*" >> "$LOG"
          case "\$1" in
            ps) exit 0 ;;
            stop) echo "requires at least 1 argument" >&2; exit 1 ;;
          esac
          exit 0
          EOF
          chmod +x "$BIN/docker"
          echo "$BIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          skip-wait-ssh: "1"
      - name: Assert action succeeded and prune still ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          LOG="$RUNNER_TEMP/calls.log"
          echo "outcome: $OUTCOME"
          echo "--- calls ---"; cat "$LOG"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"; exit 1
          fi
          if ! grep -q '^docker stop$' "$LOG"; then
            echo "FAIL: docker stop not invoked"; exit 1
          fi
          if ! grep -q '^docker system prune -af$' "$LOG"; then
            echo "FAIL: prune not invoked after failed stop"; exit 1
          fi
          echo "PASS"
