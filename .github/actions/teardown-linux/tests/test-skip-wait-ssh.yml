name: Test skip-wait-ssh skips ssh drain
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker and who on PATH
        run: |
          MOCK="$RUNNER_TEMP/mockbin"
          mkdir -p "$MOCK"
          cat > "$MOCK/docker" <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/docker-calls.log
          case "$1" in
            ps) echo "abc123" ;;
          esac
          exit 0
          EOF
          # who always reports an active session; if the wait step ran it would hang
          cat > "$MOCK/who" <<'EOF'
          #!/bin/bash
          echo "called" >> /tmp/who-calls.log
          echo "user pts/0 2024-01-01 00:00 (10.0.0.1)"
          EOF
          chmod +x "$MOCK/docker" "$MOCK/who"
          rm -f /tmp/docker-calls.log /tmp/who-calls.log
          echo "$MOCK" >> "$GITHUB_PATH"
      - id: action
        uses: .
        timeout-minutes: 5
        with:
          skip-wait-ssh: "true"
      - name: Assert who not called and docker cleanup ran
        run: |
          echo "--- docker calls ---"; cat /tmp/docker-calls.log || true
          if [ -f /tmp/who-calls.log ]; then
            echo "FAIL: who was called even though skip-wait-ssh was set"
            cat /tmp/who-calls.log
            exit 1
          fi
          grep -qx "stop abc123" /tmp/docker-calls.log || { echo "FAIL: docker stop not called"; exit 1; }
          grep -qx "system prune -af" /tmp/docker-calls.log || { echo "FAIL: docker system prune -af not called"; exit 1; }
          echo "PASS"
