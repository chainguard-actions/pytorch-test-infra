name: Test skip-wait-ssh skips the ssh drain wait
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker and who (who always reports a session)
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/docker.log /tmp/who.log
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/docker.log
          case "$1" in
            ps) printf 'abc123\n' ;;
          esac
          exit 0
          EOF
          cat > /tmp/fakebin/who <<'EOF'
          #!/bin/sh
          echo "called" >> /tmp/who.log
          echo "user     pts/0        2024-01-01 00:00 (10.0.0.1)"
          EOF
          chmod +x /tmp/fakebin/docker /tmp/fakebin/who
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          skip-wait-ssh: "true"
      - name: Assert wait skipped and docker cleanup happened
        run: |
          echo "--- docker.log ---"; cat /tmp/docker.log 2>/dev/null || true
          if [ -e /tmp/who.log ]; then
            echo "FAIL: 'who' was called even though skip-wait-ssh was set"
            exit 1
          fi
          grep -qx "stop abc123" /tmp/docker.log || { echo "FAIL: docker stop not called"; exit 1; }
          grep -qx "system prune -af" /tmp/docker.log || { echo "FAIL: docker system prune -af not called"; exit 1; }
          echo "PASS"
