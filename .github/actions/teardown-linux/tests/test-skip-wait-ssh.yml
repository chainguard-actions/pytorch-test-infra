name: Test skip-wait-ssh skips the ssh drain wait
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker and who on PATH
        run: |
          BIN="$RUNNER_TEMP/fakebin"
          LOG="$RUNNER_TEMP/calls.log"
          mkdir -p "$BIN"
          : > "$LOG"
          cat > "$BIN/docker" <<EOF
          #!/bin/sh
          echo "docker \$*" >> "$LOG"
          exit 0
          EOF
          # who always reports a session; if the wait step ran it would hang
          cat > "$BIN/who" <<EOF
          #!/bin/sh
          echo "who" >> "$LOG"
          echo "user pts/0 2024-01-01 00:00"
          exit 0
          EOF
          chmod +x "$BIN/docker" "$BIN/who"
          echo "$BIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        timeout-minutes: 3
        with:
          skip-wait-ssh: "true"
      - name: Assert wait skipped and docker cleanup ran
        run: |
          LOG="$RUNNER_TEMP/calls.log"
          echo "--- calls ---"; cat "$LOG"
          if grep -qx "who" "$LOG"; then
            echo "FAIL: who was called; wait step should be skipped"
            exit 1
          fi
          grep -q "^docker ps -q$" "$LOG" || { echo "FAIL: docker ps -q not called"; exit 1; }
          grep -q "^docker system prune -af$" "$LOG" || { echo "FAIL: docker system prune -af not called"; exit 1; }
          echo "PASS"
