name: Test activate-environment input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.12"
          activate-environment: "true"
      - name: Assert virtual environment is activated
        run: |
          echo "VIRTUAL_ENV: $VIRTUAL_ENV"
          if [ -z "$VIRTUAL_ENV" ]; then
            echo "FAIL: VIRTUAL_ENV not set"
            exit 1
          fi
          if [ ! -d "$VIRTUAL_ENV" ]; then
            echo "FAIL: VIRTUAL_ENV directory does not exist"
            exit 1
          fi
          if [ ! -x "$VIRTUAL_ENV/bin/python" ]; then
            echo "FAIL: venv python not found"
            exit 1
          fi
          PY="$(command -v python)"
          echo "python on PATH: $PY"
          case "$PY" in
            "$VIRTUAL_ENV"/*) ;;
            *) echo "FAIL: python on PATH is not from the venv"; exit 1 ;;
          esac
          VER="$(python --version 2>&1)"
          echo "python --version: $VER"
          if ! echo "$VER" | grep -q "3.12"; then
            echo "FAIL: expected Python 3.12"
            exit 1
          fi
          echo "PASS"
