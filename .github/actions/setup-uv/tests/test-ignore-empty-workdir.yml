name: Test ignore-empty-workdir with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ignore-empty-workdir: "true"
          enable-cache: "false"
      - name: Assert uv installed and runnable
        env:
          ACTUAL: ${{ steps.action.outputs.uv-version }}
          UV_PATH: ${{ steps.action.outputs.uv-path }}
        run: |
          echo "uv-version: $ACTUAL"
          echo "uv-path: $UV_PATH"
          if [ "$ACTUAL" != "0.11.14" ]; then
            echo "FAIL: expected '0.11.14'"
            exit 1
          fi
          "$UV_PATH" --version || { echo "FAIL: uv not runnable"; exit 1; }
          echo "PASS"
