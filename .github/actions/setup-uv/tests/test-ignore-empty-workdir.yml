name: Test ignore-empty-workdir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ignore-empty-workdir: "true"
          enable-cache: "false"
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.uv-version }}
          UV_PATH: ${{ steps.action.outputs.uv-path }}
        run: |
          echo "version: $VERSION"
          echo "uv-path: $UV_PATH"
          if [ "$VERSION" != "0.11.14" ]; then
            echo "FAIL: expected version 0.11.14"
            exit 1
          fi
          if [ ! -x "$UV_PATH" ]; then
            echo "FAIL: uv-path not executable"
            exit 1
          fi
          "$UV_PATH" --version
          echo "PASS"
