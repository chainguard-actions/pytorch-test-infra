name: Test python-version sets UV_PYTHON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.12"
      - name: Assert UV_PYTHON is set
        run: |
          echo "UV_PYTHON: $UV_PYTHON"
          if [ "$UV_PYTHON" != "3.12" ]; then
            echo "FAIL: expected UV_PYTHON=3.12"
            exit 1
          fi
          echo "PASS"
      - name: Assert uv-version output
        env:
          ACTUAL: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "0.11.14" ]; then
            echo "FAIL: expected '0.11.14'"
            exit 1
          fi
          echo "PASS"
