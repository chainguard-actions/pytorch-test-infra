name: Test nvidia-smi verification failure fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAKE_CMD_FAIL_ON: nvidia-smi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake cmd shell on PATH (fails on nvidia-smi)
        run: |
          mkdir -p "$HOME/fakebin"
          cat > "$HOME/fakebin/cmd" <<'EOF'
          #!/bin/bash
          LOG=/tmp/fake-cmd.log
          echo "ARGS: $*" >> "$LOG"
          for a in "$@"; do
            for w in $a; do
              w="${w//\"/}"
              if [ -f "$w" ]; then
                echo "--- SCRIPT $w" >> "$LOG"
                cat "$w" >> "$LOG"
                echo >> "$LOG"
                if [ -n "$FAKE_CMD_FAIL_ON" ] && grep -q "$FAKE_CMD_FAIL_ON" "$w"; then
                  echo "fake cmd: simulated failure" >&2
                  exit 1
                fi
              fi
            done
          done
          exit 0
          EOF
          chmod +x "$HOME/fakebin/cmd"
          rm -f /tmp/fake-cmd.log
          echo "$HOME/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed after running driver update
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/fake-cmd.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when nvidia-smi fails"
            exit 1
          fi
          if ! grep -q 'scripts\\driver_update.bat' /tmp/fake-cmd.log; then
            echo "FAIL: driver update step should have run before verification"
            exit 1
          fi
          echo "PASS"
