name: Test basic driver update and verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake Windows cmd shell and fake nvidia-smi
        run: |
          set -e
          SHIM_DIR="$RUNNER_TEMP/winshim"
          mkdir -p "$SHIM_DIR"
          rm -f /tmp/setup-nvidia-windows.log
          # Fake cmd: locate the generated script, translate Windows paths and
          # interpret each line. Batch files cannot run on Linux, so a .bat
          # invocation is simulated after verifying the referenced file exists.
          cat > "$SHIM_DIR/cmd" <<'EOF'
          #!/bin/bash
          LOG=/tmp/setup-nvidia-windows.log
          script=""
          for arg in "$@"; do
            a="${arg#CALL }"
            a="${a//\"/}"
            if [ -f "$a" ]; then script="$a"; fi
          done
          if [ -z "$script" ]; then
            echo "fake cmd: could not find script in args: $*" >&2
            exit 1
          fi
          echo "CMD-SCRIPT $script" >> "$LOG"
          rc=0
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            case "$line" in
              @*|rem\ *|REM\ *|::*) continue ;;
            esac
            line="${line//\\//}"
            echo "CMD-LINE $line" >> "$LOG"
            case "$line" in
              *.bat|*.BAT)
                if [ ! -f "$line" ]; then
                  echo "'$line' is not recognized as an internal or external command" >&2
                  exit 1
                fi
                echo "DRIVER-UPDATE-RAN $line" >> "$LOG"
                ;;
              *)
                bash -c "$line" || rc=$?
                ;;
            esac
          done < "$script"
          exit $rc
          EOF
          cat > "$SHIM_DIR/nvidia-smi" <<'EOF'
          #!/bin/bash
          echo "NVIDIA-SMI-RAN" >> /tmp/setup-nvidia-windows.log
          echo "NVIDIA-SMI 999.99  Driver Version: 999.99  CUDA Version: 99.9"
          exit 0
          EOF
          sed -i 's/^          //' "$SHIM_DIR/cmd" "$SHIM_DIR/nvidia-smi"
          chmod +x "$SHIM_DIR/cmd" "$SHIM_DIR/nvidia-smi"
          echo "$SHIM_DIR" >> "$GITHUB_PATH"
      - id: action
        uses: .
      - name: Assert driver update and verification ran
        run: |
          echo "--- log ---"
          cat /tmp/setup-nvidia-windows.log || true
          if ! grep -q "DRIVER-UPDATE-RAN .*scripts/driver_update.bat" /tmp/setup-nvidia-windows.log; then
            echo "FAIL: driver_update.bat was not invoked"
            exit 1
          fi
          if ! grep -q "NVIDIA-SMI-RAN" /tmp/setup-nvidia-windows.log; then
            echo "FAIL: nvidia-smi was not run"
            exit 1
          fi
          upd=$(grep -n "DRIVER-UPDATE-RAN" /tmp/setup-nvidia-windows.log | head -1 | cut -d: -f1)
          smi=$(grep -n "NVIDIA-SMI-RAN" /tmp/setup-nvidia-windows.log | head -1 | cut -d: -f1)
          if [ "$upd" -ge "$smi" ]; then
            echo "FAIL: expected driver update before nvidia-smi verification"
            exit 1
          fi
          echo "PASS"
