name: Test setup-nvidia-windows basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action was executed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: driver update and nvidia-smi verification succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed as expected (Windows/cmd/GPU not available in act Linux container)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
