name: Test setup-nvidia-windows basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action uses "shell: cmd" and requires a Windows GPU runner with an
      # NVIDIA driver. Under act (Linux container, no GPU) it cannot succeed, so
      # assert on its outcome: it must actually run (not be skipped), and if it
      # ever succeeds, nvidia-smi must be available.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action ran (succeeded with a driver, or failed on non-Windows runner)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v nvidia-smi >/dev/null 2>&1 && ! command -v nvidia-smi.exe >/dev/null 2>&1; then
              echo "FAIL: action succeeded but nvidia-smi is not available"
              exit 1
            fi
            echo "PASS: action succeeded and nvidia-smi is available"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected on a non-Windows / non-GPU runner"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
