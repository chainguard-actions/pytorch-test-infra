name: Test basic usage (Windows-only action invoked under act)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action ran (succeeded with GPU/cmd, or failed because cmd/nvidia-smi is unavailable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v nvidia-smi >/dev/null 2>&1 && ! command -v cmd >/dev/null 2>&1; then
              echo "FAIL: action reported success but neither cmd nor nvidia-smi exists"
              exit 1
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected on a non-Windows, non-GPU runner"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
