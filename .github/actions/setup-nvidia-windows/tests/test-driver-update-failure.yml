name: Test driver update failure propagates
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake cmd interpreter that fails on driver update
        run: |
          FAKEBIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$FAKEBIN"
          LOG="$RUNNER_TEMP/cmd-calls.log"
          : > "$LOG"
          cat > "$FAKEBIN/cmd" <<EOF
          #!/bin/bash
          echo "ARGS: \$*" >> "$LOG"
          script=\$(printf '%s\n' "\$*" | grep -oE '/[^" ]*\.(cmd|bat)' | head -n1)
          if [ -n "\$script" ] && [ -f "\$script" ]; then
            cat "\$script" >> "$LOG"
            echo "" >> "$LOG"
            if grep -q 'driver_update.bat' "\$script"; then
              echo "DRIVER-UPDATE-FAILED" >> "$LOG"
              exit 1
            fi
            if grep -q 'nvidia-smi' "\$script"; then
              nvidia-smi
            fi
          fi
          exit 0
          EOF
          chmod +x "$FAKEBIN/cmd"
          cp "$FAKEBIN/cmd" "$FAKEBIN/%ComSpec%"
          cat > "$FAKEBIN/nvidia-smi" <<EOF
          #!/bin/bash
          echo "NVIDIA-SMI-CALLED" >> "$LOG"
          EOF
          chmod +x "$FAKEBIN/nvidia-smi"
          echo "$FAKEBIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed and skipped verification
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          LOG="$RUNNER_TEMP/cmd-calls.log"
          echo "outcome: $OUTCOME"
          cat "$LOG"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when driver update fails"
            exit 1
          fi
          if ! grep -q 'DRIVER-UPDATE-FAILED' "$LOG"; then
            echo "FAIL: driver update step was not attempted"
            exit 1
          fi
          if grep -q 'NVIDIA-SMI-CALLED' "$LOG"; then
            echo "FAIL: nvidia-smi should not run after driver update failure"
            exit 1
          fi
          echo "PASS"
