name: Test relay server error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MOCK_PORT: "18767"
      MOCK_OUT: /tmp/mock-relay-500
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local mock OIDC + relay server
        run: |
          rm -rf "$MOCK_OUT"; mkdir -p "$MOCK_OUT"
          nohup setsid python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" "$MOCK_PORT" "$MOCK_OUT" > /tmp/mock-relay-500.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:$MOCK_PORT/health" >/dev/null; then echo "server up"; break; fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:$MOCK_PORT/health" || { cat /tmp/mock-relay-500.log; exit 1; }
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:$MOCK_PORT/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=fake-request-token" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: completed
          conclusion: success
          delivery-id: 0123456789abcdef0123456789abcdef01234567
          event-type: nightly
          callback-url: http://127.0.0.1:18767/fail
      - name: Assert action failed after sending exactly one request
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/mock-relay-500.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when relay returns HTTP 500"
            exit 1
          fi
          count=$(ls "$MOCK_OUT"/request-*.meta.json 2>/dev/null | wc -l)
          echo "requests: $count"
          if [ "$count" -ne 1 ]; then
            echo "FAIL: expected exactly 1 callback attempt (no retry on 500), got $count"
            exit 1
          fi
          echo "PASS"
