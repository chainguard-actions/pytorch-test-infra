name: Test relay server error
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock OIDC + relay server (POST returns 500)
        run: |
          nohup python3 tests/fixtures/mock_server.py 18085 /tmp/mock 500 '{"error":"boom"}' > /tmp/mock.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18085/ready >/dev/null; then echo "mock ready"; break; fi
            sleep 1
          done
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:18085/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=fake-request-token" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: completed
          conclusion: success
          delivery-id: 0123456789abcdef0123456789abcdef01234567
          event-type: nightly
          callback-url: http://127.0.0.1:18085/github/callback/
      - name: Assert action failed after sending the callback
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/mock.log || true
          if [ ! -f /tmp/mock/request-1.json ]; then
            echo "FAIL: callback request was never sent"
            exit 1
          fi
          if [ -f /tmp/mock/request-2.json ]; then
            echo "FAIL: a 500 must not be retried"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when relay returns HTTP 500"
            exit 1
          fi
          echo "PASS"
