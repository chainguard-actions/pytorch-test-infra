name: Test late report fails on invalid report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ID_TOKEN_REQUEST_URL: http://127.0.0.1:8765/token?api-version=2.0
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: mock-oidc-request-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local OIDC + relay stand-in
        run: |
          rm -rf /tmp/mock-captures && mkdir -p /tmp/mock-captures
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay_server.py" 8765 /tmp/mock-captures > /tmp/mock-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health >/dev/null; then echo "server up"; exit 0; fi
            sleep 1
          done
          cat /tmp/mock-server.log
          echo "FAIL: mock server did not start"
          exit 1
      - id: action
        uses: .
        continue-on-error: true
        with:
          event-type: late-report
          callback-url: http://127.0.0.1:8765/github/callback
          triage-verdict-list: >-
            [{"delivery_id": "d1", "workflow_name": "wf", "job_name": "good-job",
              "triage_verdict": {"schema_version": 1, "category": "flake", "confidence": "low", "summary": "x"}},
             {"delivery_id": "d2", "workflow_name": "wf", "job_name": "make-invalid",
              "triage_verdict": {"schema_version": 1, "category": "flake", "confidence": "low", "summary": "y"}}]
      - name: Assert step failed after sending the request
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure for an invalid report"; exit 1; fi
          COUNT=$(ls /tmp/mock-captures/*.json 2>/dev/null | wc -l)
          echo "requests: $COUNT"
          if [ "$COUNT" != "1" ]; then echo "FAIL: expected the request to be sent once"; exit 1; fi
          echo "PASS"
