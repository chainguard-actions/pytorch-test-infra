name: Test completed callback with test results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake curl that captures the callback payload
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/curl <<'EOF'
          #!/bin/sh
          # Fake curl: capture the POSTed payload instead of contacting the relay.
          out=""; hdr=""; data=""; prev=""
          for arg in "$@"; do
            case "$prev" in
              --output|-o) out="$arg" ;;
              --dump-header|-D) hdr="$arg" ;;
              --data|-d) data="$arg" ;;
            esac
            prev="$arg"
          done
          cap="${CAPTURE_FILE:-/tmp/action-payload.json}"
          case "$data" in
            @*) cp "${data#@}" "$cap" ;;
            *) printf '%s' "$data" > "$cap" ;;
          esac
          [ -n "$out" ] && echo '{"ok":true}' > "$out"
          [ -n "$hdr" ] && printf 'HTTP/1.1 200 OK\r\n\r\n' > "$hdr"
          printf '200'
          exit 0
          EOF
          chmod +x /tmp/fakebin/curl
          echo "/tmp/fakebin" >> "$GITHUB_PATH"

      - name: Locate report_callback.py
        run: |
          if [ -f "$GITHUB_WORKSPACE/report_callback.py" ]; then
            SCRIPT="$GITHUB_WORKSPACE/report_callback.py"
          else
            SCRIPT="$(find "$GITHUB_WORKSPACE" -name report_callback.py -not -path '*/tests/*' | head -1)"
          fi
          echo "script: $SCRIPT"
          [ -n "$SCRIPT" ] || { echo "FAIL: report_callback.py not found"; exit 1; }
          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"

      - name: Run reporter directly in completed mode with all optional fields
        env:
          SCHEMA_VERSION: "1"
          STATUS: completed
          CONCLUSION: failure
          WORKFLOW_NAME: My Workflow
          WORKFLOW_URL: https://github.com/example/repo/actions/runs/7
          RUN_ID: "7"
          RUN_ATTEMPT: "2"
          JOB_NAME: build-cuda
          CHECK_RUN_ID: "999"
          OIDC_TOKEN: dummy-oidc
          CALLBACK_URL: http://127.0.0.1:9/
          CLIENT_PAYLOAD: '{"event_type":"push","delivery_id":"d-1","payload":{"head_sha":"cafe"}}'
          TEST_RESULTS: '{"passed": 10, "failed": 2, "skipped": 1}'
          FAILED_TESTS_DETAIL: '[{"name":"test_foo","classname":"TestBar","message":"AssertionError"}]'
          TRIAGE_VERDICT: '{"schema_version":1,"category":"flake","confidence":"low","summary":"flaky"}'
          ARTIFACT_URL: https://example.com/artifacts/7
          CAPTURE_FILE: /tmp/direct-completed.json
        run: |
          PATH="/tmp/fakebin:$PATH" python3 "$SCRIPT" | tee /tmp/direct-out.txt
          grep -q "Relay server response HTTP: 200" /tmp/direct-out.txt || { echo "FAIL: missing response line"; exit 1; }
          cat /tmp/direct-completed.json; echo
          python3 - /tmp/direct-completed.json <<'EOF'
          import json, sys
          p = json.load(open(sys.argv[1]))
          w = p["workflow"]
          assert p["event_type"] == "push", p
          assert w["status"] == "completed", w
          assert w["conclusion"] == "failure", w
          assert w["started_at"] is None, w
          assert w["completed_at"], w
          assert w["check_run_id"] == "999", w
          assert w["run_attempt"] == "2", w
          assert w["job_name"] == "build-cuda", w
          assert w["test_results"] == {"passed": 10, "failed": 2, "skipped": 1}, w
          assert w["failed_tests_detail"][0]["name"] == "test_foo", w
          assert w["triage_verdict"]["category"] == "flake", w
          assert w["artifact_url"] == "https://example.com/artifacts/7", w
          print("PASS")
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          status: completed
          conclusion: success
          callback-url: http://127.0.0.1:9/
          test-results: '{"passed": 3, "failed": 0, "skipped": 0}'
          artifact-url: https://example.com/artifacts/1

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            cat /tmp/action-payload.json || { echo "FAIL: no payload captured"; exit 1; }
            python3 -c 'import json; w=json.load(open("/tmp/action-payload.json"))["workflow"]; assert w["status"]=="completed" and w["conclusion"]=="success" and w["test_results"]["passed"]==3, w'
            echo "PASS: payload sent"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no OIDC token / no client_payload under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
