name: Test late report from file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock OIDC + relay server
        run: |
          mkdir -p /tmp/mock-relay
          rm -f /tmp/mock-relay/requests.jsonl
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" > /tmp/mock-relay/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health >/dev/null; then echo "server up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/health || { cat /tmp/mock-relay/server.log; exit 1; }
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:8765/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=mock-request-token" >> "$GITHUB_ENV"
          echo "NO_PROXY=127.0.0.1,localhost" >> "$GITHUB_ENV"
          echo "no_proxy=127.0.0.1,localhost" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          event-type: late-report
          triage-verdict-list: '@tests/fixtures/late-report-list.json'
          callback-url: http://127.0.0.1:8765/github/callback/late

      - name: Assert recorded late-report payload
        run: |
          cat /tmp/mock-relay/requests.jsonl || true
          python3 - <<'EOF'
          import json, sys
          reqs = [json.loads(l) for l in open("/tmp/mock-relay/requests.jsonl") if l.strip()]
          posts = [r for r in reqs if r["method"] == "POST"]
          def fail(msg):
              print("FAIL: " + msg); sys.exit(1)
          if len(posts) != 1: fail(f"expected 1 POST, got {len(posts)}")
          if posts[0]["authorization"] != "Bearer mock-oidc-token-12345": fail("authorization header")
          body = json.loads(posts[0]["body"])
          print(json.dumps(body, indent=2))
          if body.get("event_type") != "late-report": fail("event_type")
          if "workflow" in body: fail("late report must not carry a workflow object")
          reports = body.get("reports")
          if not isinstance(reports, list) or len(reports) != 2: fail("expected 2 reports")
          if [r["job_name"] for r in reports] != ["build-npu", "build-cpu"]: fail("report job names")
          if reports[0]["triage_verdict"]["category"] != "upstream": fail("verdict content")
          print("PASS")
          EOF
