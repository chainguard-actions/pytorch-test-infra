name: Test late-report triage verdict list
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local relay stand-in
        run: |
          rm -rf /tmp/crcr-requests
          nohup setsid python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" 18080 /tmp/crcr-requests > /tmp/mock-relay.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/ || { cat /tmp/mock-relay.log; exit 1; }
      - id: action
        uses: .
        continue-on-error: true
        with:
          event-type: late-report
          callback-url: http://127.0.0.1:18080/github/callback/
          triage-verdict-list: >-
            [{"delivery_id":"d1","workflow_name":"CI","job_name":"build-npu","check_run_id":123,
            "triage_verdict":{"schema_version":1,"category":"flake","confidence":"low","summary":"flaky"}},
            {"delivery_id":"d2","workflow_name":"CI","job_name":"build-cpu",
            "triage_verdict":{"schema_version":1,"category":"infra","confidence":"medium","summary":"runner died"}}]
      - name: Assert late report (or graceful OIDC failure under act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          ls -la /tmp/crcr-requests || true
          if [ "$OUTCOME" = "success" ]; then
            f=/tmp/crcr-requests/1.json
            [ -f "$f" ] || { echo "FAIL: action succeeded but no request was received"; exit 1; }
            cat "$f"
            python3 - "$f" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["event_type"] == "late-report", d
          assert len(d["reports"]) == 2, d
          assert d["reports"][0]["job_name"] == "build-npu", d
          assert "workflow" not in d, d
          print("PASS: late-report payload is correct")
          EOF
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (OIDC token cannot be minted under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
