name: Test error when delivery-id set without event-type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ACTIONS_ID_TOKEN_REQUEST_URL: http://127.0.0.1:18084/token?api-version=2.0
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: mock-request-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock OIDC + relay server
        run: |
          mkdir -p /tmp/relay
          setsid nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" 18084 /tmp/relay > /tmp/relay-server.log 2>&1 < /dev/null &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18084/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18084/health || { cat /tmp/relay-server.log; exit 1; }
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: completed
          conclusion: success
          delivery-id: 2222222222222222222222222222222222222222
          callback-url: http://127.0.0.1:18084/github/callback
          max-time: '5'
      - name: Assert action failed and sent nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if ls /tmp/relay/*.json >/dev/null 2>&1; then
            echo "FAIL: no callback should have been sent"
            exit 1
          fi
          echo "PASS"
