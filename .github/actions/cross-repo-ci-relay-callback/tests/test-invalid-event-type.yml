name: Test invalid event-type is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock OIDC + relay server
        run: |
          mkdir -p /tmp/mock-relay
          rm -f /tmp/mock-relay/requests.jsonl
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" > /tmp/mock-relay/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health >/dev/null; then echo "server up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/health || { cat /tmp/mock-relay/server.log; exit 1; }
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:8765/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=mock-request-token" >> "$GITHUB_ENV"
          echo "NO_PROXY=127.0.0.1,localhost" >> "$GITHUB_ENV"
          echo "no_proxy=127.0.0.1,localhost" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          status: completed
          conclusion: success
          delivery-id: 0e797b5a6acf1234567890abcdef1234567890ab
          event-type: weekly
          callback-url: http://127.0.0.1:8765/github/callback

      - name: Assert action failed before sending a callback
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/mock-relay/requests.jsonl 2>/dev/null || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for event-type 'weekly'"
            exit 1
          fi
          if ! grep -q '"method": "GET"' /tmp/mock-relay/requests.jsonl 2>/dev/null; then
            echo "FAIL: OIDC token step never ran; failure came from the wrong place"
            exit 1
          fi
          if grep -q '"method": "POST"' /tmp/mock-relay/requests.jsonl; then
            echo "FAIL: a callback was sent despite invalid event-type"
            exit 1
          fi
          echo "PASS"
