name: Test triage-verdict-list without late-report is rejected
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local relay stand-in
        run: |
          rm -rf /tmp/crcr-requests
          nohup setsid python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" 18080 /tmp/crcr-requests > /tmp/mock-relay.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/ || { cat /tmp/mock-relay.log; exit 1; }
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: completed
          conclusion: success
          callback-url: http://127.0.0.1:18080/github/callback/
          triage-verdict-list: '[{"delivery_id":"d1","workflow_name":"CI","job_name":"x","triage_verdict":{}}]'
      - name: Assert action failed and sent nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          ls -la /tmp/crcr-requests || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for triage-verdict-list without late-report, got '$OUTCOME'"
            exit 1
          fi
          if ls /tmp/crcr-requests/*.json >/dev/null 2>&1; then
            echo "FAIL: a callback was sent despite invalid inputs"
            exit 1
          fi
          echo "PASS"
