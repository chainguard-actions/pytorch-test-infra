name: Test triage-verdict-list without late-report is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local OIDC + relay server
        run: |
          rm -rf /tmp/relay && mkdir -p /tmp/relay
          nohup python3 tests/fixtures/mock_relay.py 8765 /tmp/relay > /tmp/relay-server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8765/health && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8765/health || { cat /tmp/relay-server.log; exit 1; }
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:8765/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=mock-request-token" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: completed
          conclusion: success
          delivery-id: 0123456789abcdef0123456789abcdef01234567
          event-type: nightly
          triage-verdict-list: '[{"delivery_id":"d1","workflow_name":"wf","job_name":"j","triage_verdict":{}}]'
          callback-url: http://127.0.0.1:8765/github/callback
      - name: Assert step failed and nothing was sent
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when verdict list is used outside late-report"
            exit 1
          fi
          if [ -s /tmp/relay/requests.jsonl ]; then
            cat /tmp/relay/requests.jsonl
            echo "FAIL: no callback should have been sent"
            exit 1
          fi
          echo "PASS"
