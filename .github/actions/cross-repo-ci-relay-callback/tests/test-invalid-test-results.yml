name: Test invalid test-results JSON rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MOCK_PORT: "18766"
      MOCK_OUT: /tmp/mock-relay-badjson
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local mock OIDC + relay server
        run: |
          rm -rf "$MOCK_OUT"; mkdir -p "$MOCK_OUT"
          nohup setsid python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" "$MOCK_PORT" "$MOCK_OUT" > /tmp/mock-relay-badjson.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:$MOCK_PORT/health" >/dev/null; then echo "server up"; break; fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:$MOCK_PORT/health" || { cat /tmp/mock-relay-badjson.log; exit 1; }
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:$MOCK_PORT/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=fake-request-token" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: completed
          conclusion: success
          delivery-id: 0123456789abcdef0123456789abcdef01234567
          event-type: nightly
          test-results: '{not valid json'
          callback-url: http://127.0.0.1:18766/callback
      - name: Assert action failed and sent nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid test-results JSON"
            exit 1
          fi
          if ! [ -s "$MOCK_OUT/token-requests.log" ]; then
            echo "FAIL: OIDC step did not run (failure came from the wrong step)"
            exit 1
          fi
          if ls "$MOCK_OUT"/request-*.json >/dev/null 2>&1; then
            echo "FAIL: callback should not have been sent"
            exit 1
          fi
          echo "PASS"
