name: Test late report from file split into chunks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ID_TOKEN_REQUEST_URL: http://127.0.0.1:8765/token?api-version=2.0
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: mock-oidc-request-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local OIDC + relay stand-in
        run: |
          rm -rf /tmp/mock-captures && mkdir -p /tmp/mock-captures
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay_server.py" 8765 /tmp/mock-captures > /tmp/mock-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health >/dev/null; then echo "server up"; exit 0; fi
            sleep 1
          done
          cat /tmp/mock-server.log
          echo "FAIL: mock server did not start"
          exit 1
      - name: Write 60 reports to a file
        run: |
          python3 - <<'EOF'
          import json
          reports = [
              {"delivery_id": f"d{i}", "workflow_name": "wf", "job_name": f"job-{i}",
               "triage_verdict": {"schema_version": 1, "category": "infra",
                                  "confidence": "high", "summary": f"s{i}"}}
              for i in range(60)
          ]
          json.dump(reports, open("/tmp/verdicts.json", "w"))
          EOF
      - id: action
        uses: .
        with:
          event-type: late-report
          callback-url: http://127.0.0.1:8765/github/callback
          triage-verdict-list: '@/tmp/verdicts.json'
      - name: Assert two chunked requests (50 + 10)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then echo "FAIL: action did not succeed"; exit 1; fi
          python3 - <<'EOF'
          import glob, json, sys
          files = sorted(glob.glob("/tmp/mock-captures/*.json"))
          print("captures:", files)
          if len(files) != 2:
              sys.exit(f"FAIL: expected 2 requests, got {len(files)}")
          sizes = sorted(len(json.load(open(f))["body"]["reports"]) for f in files)
          print("chunk sizes:", sizes)
          if sizes != [10, 50]:
              sys.exit(f"FAIL: expected chunks [10, 50], got {sizes}")
          names = set()
          for f in files:
              b = json.load(open(f))["body"]
              if b["event_type"] != "late-report":
                  sys.exit("FAIL: event_type")
              names.update(r["job_name"] for r in b["reports"])
          if names != {f"job-{i}" for i in range(60)}:
              sys.exit("FAIL: not every report was sent exactly once")
          print("PASS")
          EOF
