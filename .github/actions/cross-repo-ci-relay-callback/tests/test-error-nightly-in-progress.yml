name: Test error nightly in progress
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock OIDC + relay server
        run: |
          rm -rf /tmp/mock-relay && mkdir -p /tmp/mock-relay
          setsid nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" 8765 /tmp/mock-relay > /tmp/mock-relay.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/health || { cat /tmp/mock-relay.log; exit 1; }
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:8765/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=mock-request-token" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: in_progress
          delivery-id: 0e797b5a6acf1234567890abcdef1234567890ab
          event-type: nightly
          callback-url: http://127.0.0.1:8765/github/callback
      - name: Assert action failed validation without sending
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if [ ! -f /tmp/mock-relay/token-request.json ]; then
            echo "FAIL: OIDC token was not minted, failure came from the wrong step"
            exit 1
          fi
          if ls /tmp/mock-relay/req-*.json >/dev/null 2>&1; then
            echo "FAIL: a callback was sent despite invalid input"
            exit 1
          fi
          echo "PASS"
