name: Test delivery-id without event-type
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock OIDC + relay server
        run: |
          nohup python3 tests/fixtures/mock_server.py 18084 /tmp/mock > /tmp/mock.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18084/ready >/dev/null; then echo "mock ready"; break; fi
            sleep 1
          done
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:18084/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=fake-request-token" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: completed
          conclusion: success
          delivery-id: 0123456789abcdef0123456789abcdef01234567
          callback-url: http://127.0.0.1:18084/github/callback/
      - name: Assert action failed without sending a callback
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/mock.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when delivery-id is set without event-type"
            exit 1
          fi
          if ! grep -q "token" /tmp/mock/oidc-requests.log 2>/dev/null; then
            echo "FAIL: OIDC token was never requested (failed for the wrong reason)"
            exit 1
          fi
          if ls /tmp/mock/request-*.json >/dev/null 2>&1; then
            echo "FAIL: a callback was sent despite invalid input"
            exit 1
          fi
          echo "PASS"
