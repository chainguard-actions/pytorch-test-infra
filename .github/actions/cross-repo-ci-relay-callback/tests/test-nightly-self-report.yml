name: Test nightly self-report callback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake curl that captures the callback payload
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/curl <<'EOF'
          #!/bin/sh
          # Fake curl: capture the POSTed payload instead of contacting the relay.
          out=""; hdr=""; data=""; prev=""
          for arg in "$@"; do
            case "$prev" in
              --output|-o) out="$arg" ;;
              --dump-header|-D) hdr="$arg" ;;
              --data|-d) data="$arg" ;;
            esac
            prev="$arg"
          done
          cap="${CAPTURE_FILE:-/tmp/action-payload.json}"
          case "$data" in
            @*) cp "${data#@}" "$cap" ;;
            *) printf '%s' "$data" > "$cap" ;;
          esac
          [ -n "$out" ] && echo '{"ok":true}' > "$out"
          [ -n "$hdr" ] && printf 'HTTP/1.1 200 OK\r\n\r\n' > "$hdr"
          printf '200'
          exit 0
          EOF
          chmod +x /tmp/fakebin/curl
          echo "/tmp/fakebin" >> "$GITHUB_PATH"

      - name: Locate report_callback.py
        run: |
          if [ -f "$GITHUB_WORKSPACE/report_callback.py" ]; then
            SCRIPT="$GITHUB_WORKSPACE/report_callback.py"
          else
            SCRIPT="$(find "$GITHUB_WORKSPACE" -name report_callback.py -not -path '*/tests/*' | head -1)"
          fi
          echo "script: $SCRIPT"
          [ -n "$SCRIPT" ] || { echo "FAIL: report_callback.py not found"; exit 1; }
          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"

      - name: Run reporter directly in nightly mode (no client_payload)
        env:
          SCHEMA_VERSION: "1"
          STATUS: completed
          CONCLUSION: success
          WORKFLOW_NAME: Nightly
          WORKFLOW_URL: https://github.com/example/repo/actions/runs/5
          RUN_ID: "5"
          RUN_ATTEMPT: "1"
          JOB_NAME: nightly-job
          OIDC_TOKEN: dummy-oidc
          CALLBACK_URL: http://127.0.0.1:9/
          CLIENT_PAYLOAD: "null"
          DELIVERY_ID_OVERRIDE: 0123456789abcdef0123456789abcdef01234567
          EVENT_TYPE_OVERRIDE: nightly
          CAPTURE_FILE: /tmp/direct-nightly.json
        run: |
          PATH="/tmp/fakebin:$PATH" python3 "$SCRIPT"
          cat /tmp/direct-nightly.json; echo
          python3 - /tmp/direct-nightly.json <<'EOF'
          import json, sys
          sha = "0123456789abcdef0123456789abcdef01234567"
          p = json.load(open(sys.argv[1]))
          w = p["workflow"]
          assert p["event_type"] == "nightly", p
          assert p["delivery_id"] == sha, p
          assert p["payload"]["head_sha"] == sha, p
          assert p["payload"]["repository"]["full_name"] == "pytorch/pytorch", p
          assert w["status"] == "completed" and w["conclusion"] == "success", w
          assert w["started_at"] and w["completed_at"], "self-report sets both timestamps"
          print("PASS")
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          status: completed
          conclusion: success
          delivery-id: 0123456789abcdef0123456789abcdef01234567
          event-type: periodic
          callback-url: http://127.0.0.1:9/
          job-name: periodic-job

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            cat /tmp/action-payload.json || { echo "FAIL: no payload captured"; exit 1; }
            python3 -c 'import json; p=json.load(open("/tmp/action-payload.json")); assert p["event_type"]=="periodic" and p["delivery_id"].startswith("0123456789abcdef") and p["workflow"]["job_name"]=="periodic-job", p'
            echo "PASS: payload sent"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (OIDC token unavailable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
