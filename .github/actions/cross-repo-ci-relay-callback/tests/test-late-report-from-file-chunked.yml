name: Test late report from file (chunked)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock OIDC + relay server
        run: |
          rm -rf /tmp/mock-relay
          mkdir -p /tmp/mock-relay
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" --dir /tmp/mock-relay > /tmp/mock-relay.log 2>&1 &
          for i in $(seq 1 30); do
            [ -f /tmp/mock-relay/port ] && break
            sleep 1
          done
          if [ ! -f /tmp/mock-relay/port ]; then cat /tmp/mock-relay.log; echo "FAIL: mock server did not start"; exit 1; fi
          PORT="$(cat /tmp/mock-relay/port)"
          curl -sf --noproxy '*' "http://127.0.0.1:$PORT/health"
          echo "MOCK_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:$PORT/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=fake-request-token" >> "$GITHUB_ENV"
          echo "NO_PROXY=127.0.0.1,localhost" >> "$GITHUB_ENV"
          echo "no_proxy=127.0.0.1,localhost" >> "$GITHUB_ENV"
      - name: Write 60 reports to a file
        run: |
          python3 - <<'EOF'
          import json
          reports = [
              {"delivery_id": "d%d" % i, "workflow_name": "wf", "job_name": "job-%d" % i,
               "triage_verdict": {"schema_version": 1, "category": "infra", "confidence": "low", "summary": "s%d" % i}}
              for i in range(60)
          ]
          json.dump(reports, open("/tmp/late-reports.json", "w"))
          EOF
      - id: action
        uses: .
        with:
          event-type: late-report
          triage-verdict-list: '@/tmp/late-reports.json'
          callback-url: ${{ env.MOCK_URL }}/github/callback/
      - name: Assert reports were split into two requests
        run: |
          cat /tmp/mock-relay.log || true
          python3 - <<'EOF'
          import glob, json, sys
          def fail(msg):
              print("FAIL:", msg); sys.exit(1)
          files = sorted(glob.glob("/tmp/mock-relay/request-*.json"), key=lambda p: int(p.rsplit("-", 1)[1].split(".")[0]))
          print("requests:", files)
          if len(files) != 2:
              fail("expected 2 requests (50 + 10 reports), got %d" % len(files))
          sizes = []
          names = []
          for f in files:
              b = json.load(open(f))["body"]
              if b.get("event_type") != "late-report": fail("event_type in %s" % f)
              sizes.append(len(b["reports"]))
              names += [r["job_name"] for r in b["reports"]]
          print("sizes:", sizes)
          if sorted(sizes) != [10, 50]: fail("unexpected chunk sizes %r" % sizes)
          if sorted(names) != sorted("job-%d" % i for i in range(60)): fail("not all reports were sent")
          print("PASS")
          EOF
