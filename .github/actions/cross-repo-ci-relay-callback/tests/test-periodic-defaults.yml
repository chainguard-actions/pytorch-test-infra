name: Test periodic callback with defaults and invalid triage verdict
on:
  workflow_dispatch:
jobs:
  periodic-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local OIDC + relay server
        run: |
          rm -rf /tmp/mock-relay && mkdir -p /tmp/mock-relay
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" 18765 /tmp/mock-relay > /tmp/mock-relay-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18765/health >/dev/null; then echo "server up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18765/health >/dev/null || { cat /tmp/mock-relay-server.log; exit 1; }
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:18765/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=mock-request-token" >> "$GITHUB_ENV"
          echo "NO_PROXY=127.0.0.1,localhost" >> "$GITHUB_ENV"
          echo "no_proxy=127.0.0.1,localhost" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          status: completed
          conclusion: failure
          delivery-id: abcdef0123456789abcdef0123456789abcdef01
          event-type: periodic
          callback-url: http://127.0.0.1:18765/callback
          triage-verdict: '["not", "an", "object"]'
      - name: Assert callback payload
        run: |
          cat /tmp/mock-relay-server.log || true
          COUNT=$(ls /tmp/mock-relay/req-*.json 2>/dev/null | wc -l)
          if [ "$COUNT" != "1" ]; then echo "FAIL: expected 1 callback request, got $COUNT"; exit 1; fi
          python3 - <<'EOF'
          import json, sys
          r = json.load(open("/tmp/mock-relay/req-001.json"))
          print(json.dumps(r, indent=2))
          b = r["body"]; w = b["workflow"]
          bad = False
          def check(actual, expected):
              global bad
              if actual != expected:
                  print(f"FAIL: expected {expected!r}, got {actual!r}"); bad = True
          check(b["event_type"], "periodic")
          check(b["delivery_id"], "abcdef0123456789abcdef0123456789abcdef01")
          check(w["status"], "completed")
          check(w["conclusion"], "failure")
          check(w["job_name"], "periodic-job")  # defaults to github.job
          for key in ("triage_verdict", "test_results", "failed_tests_detail", "artifact_url"):
              if key in w:
                  print(f"FAIL: unexpected key {key} in workflow"); bad = True
          if bad:
              sys.exit(1)
          print("PASS")
          EOF
