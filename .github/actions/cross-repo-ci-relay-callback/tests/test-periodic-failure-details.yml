name: Test periodic failure details
on:
  workflow_dispatch:
jobs:
  periodic-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock OIDC + relay server
        run: |
          rm -rf /tmp/mock-relay && mkdir -p /tmp/mock-relay
          setsid nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" 8765 /tmp/mock-relay > /tmp/mock-relay.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/health || { cat /tmp/mock-relay.log; exit 1; }
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:8765/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=mock-request-token" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          status: completed
          conclusion: failure
          delivery-id: abcdef0123456789abcdef0123456789abcdef01
          event-type: periodic
          failed-tests-detail: '[{"name": "test_foo", "classname": "TestBar", "message": "AssertionError"}]'
          triage-verdict: '["not", "an", "object"]'
          callback-url: http://127.0.0.1:8765/github/callback
      - name: Assert payload sent to relay
        run: |
          python3 - <<'EOF'
          import json, os, sys
          d = "/tmp/mock-relay"
          reqs = sorted(f for f in os.listdir(d) if f.startswith("req-"))
          if len(reqs) != 1:
              sys.exit(f"FAIL: expected 1 request, got {reqs}")
          b = json.loads(json.load(open(os.path.join(d, reqs[0])))["body"])
          print(json.dumps(b, indent=2))
          assert b["event_type"] == "periodic", "event_type"
          assert b["delivery_id"] == "abcdef0123456789abcdef0123456789abcdef01", "delivery_id"
          w = b["workflow"]
          assert w["status"] == "completed", "status"
          assert w["conclusion"] == "failure", "conclusion"
          assert w["job_name"] == "periodic-job", f"job_name defaults to github.job, got {w['job_name']}"
          assert w["failed_tests_detail"] == [{"name": "test_foo", "classname": "TestBar", "message": "AssertionError"}], "failed_tests_detail"
          assert "triage_verdict" not in w, "invalid triage verdict should be dropped"
          assert "test_results" not in w, "no test_results expected"
          assert "artifact_url" not in w, "no artifact_url expected"
          print("PASS")
          EOF
