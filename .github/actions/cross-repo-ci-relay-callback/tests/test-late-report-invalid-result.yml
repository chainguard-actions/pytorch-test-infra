name: Test late report fails on invalid result
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock OIDC + relay server (answers every report as invalid)
        run: |
          rm -rf /tmp/mock-relay
          mkdir -p /tmp/mock-relay
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" --dir /tmp/mock-relay --late-result invalid > /tmp/mock-relay.log 2>&1 &
          for i in $(seq 1 30); do
            [ -f /tmp/mock-relay/port ] && break
            sleep 1
          done
          if [ ! -f /tmp/mock-relay/port ]; then cat /tmp/mock-relay.log; echo "FAIL: mock server did not start"; exit 1; fi
          PORT="$(cat /tmp/mock-relay/port)"
          curl -sf --noproxy '*' "http://127.0.0.1:$PORT/health"
          echo "MOCK_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:$PORT/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=fake-request-token" >> "$GITHUB_ENV"
          echo "NO_PROXY=127.0.0.1,localhost" >> "$GITHUB_ENV"
          echo "no_proxy=127.0.0.1,localhost" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          event-type: late-report
          triage-verdict-list: '[{"delivery_id": "d1", "workflow_name": "wf", "job_name": "build-npu", "triage_verdict": {"schema_version": 1, "category": "bogus", "confidence": "high", "summary": "x"}}]'
          callback-url: ${{ env.MOCK_URL }}/github/callback/
      - name: Assert step failed after sending the report
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/mock-relay.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when the relay marks a report invalid"
            exit 1
          fi
          n=$(ls /tmp/mock-relay/request-*.json 2>/dev/null | wc -l)
          echo "requests: $n"
          if [ "$n" -ne 1 ]; then
            echo "FAIL: expected the report to be sent exactly once"
            exit 1
          fi
          echo "PASS"
