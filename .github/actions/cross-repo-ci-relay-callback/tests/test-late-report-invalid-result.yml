name: Test late report fails when relay marks a report invalid
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local OIDC + relay server
        run: |
          rm -rf /tmp/mock-relay && mkdir -p /tmp/mock-relay
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_relay.py" 18765 /tmp/mock-relay > /tmp/mock-relay-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18765/health >/dev/null; then echo "server up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18765/health >/dev/null || { cat /tmp/mock-relay-server.log; exit 1; }
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=http://127.0.0.1:18765/token?api-version=2.0" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=mock-request-token" >> "$GITHUB_ENV"
          echo "NO_PROXY=127.0.0.1,localhost" >> "$GITHUB_ENV"
          echo "no_proxy=127.0.0.1,localhost" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          event-type: late-report
          triage-verdict-list: '[{"delivery_id":"d-1","workflow_name":"wf","job_name":"build-npu","triage_verdict":{"schema_version":1,"category":"infra","confidence":"high","summary":"s"}}]'
          callback-url: http://127.0.0.1:18765/late-invalid
      - name: Assert step failed after sending the report
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/mock-relay-server.log || true
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          COUNT=$(ls /tmp/mock-relay/req-*.json 2>/dev/null | wc -l)
          if [ "$COUNT" != "1" ]; then echo "FAIL: expected the report to be sent once, got $COUNT"; exit 1; fi
          grep -q '"late-report"' /tmp/mock-relay/req-001.json || { echo "FAIL: not a late report"; exit 1; }
          echo "PASS"
