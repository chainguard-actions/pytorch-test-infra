name: Test basic usage (non-Windows no-op)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create marker file
        run: echo "marker" > "$GITHUB_WORKSPACE/cleanup-marker.txt"
      - id: action
        uses: .
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Assert workspace left intact
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/cleanup-marker.txt" ]; then
            echo "FAIL: marker file removed"
            exit 1
          fi
          if [ "$(cat "$GITHUB_WORKSPACE/cleanup-marker.txt")" != "marker" ]; then
            echo "FAIL: marker content changed"
            exit 1
          fi
          if ! git -C "$GITHUB_WORKSPACE" rev-parse HEAD >/dev/null 2>&1; then
            echo "FAIL: git repo broken"
            exit 1
          fi
          echo "PASS"
