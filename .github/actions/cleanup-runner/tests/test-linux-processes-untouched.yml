name: Test processes are untouched on non-Windows runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start a background process
        run: |
          nohup sleep 600 >/dev/null 2>&1 &
          echo "BG_PID=$!" >> "$GITHUB_ENV"
          echo "started pid $!"
      - id: action
        uses: .
      - name: Assert action succeeded and background process still alive
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "checking pid $BG_PID"
          if ! kill -0 "$BG_PID" 2>/dev/null; then
            echo "FAIL: background process was killed on a non-Windows runner"
            exit 1
          fi
          kill "$BG_PID" || true
          echo "PASS"
