name: Test processes untouched on non-Windows runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start background process
        run: |
          nohup sleep 300 > /dev/null 2>&1 &
          echo $! > /tmp/bg-pid
          echo "started pid $(cat /tmp/bg-pid)"
      - id: action
        uses: .
      - name: Assert background process still alive
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          PID="$(cat /tmp/bg-pid)"
          echo "pid: $PID"
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "FAIL: background process was killed"
            exit 1
          fi
          kill "$PID" || true
          echo "PASS"
