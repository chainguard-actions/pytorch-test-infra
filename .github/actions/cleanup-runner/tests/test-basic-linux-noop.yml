name: Test basic usage on Linux (no-op)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record workspace state
        run: |
          echo "marker" > "$GITHUB_WORKSPACE/.cleanup-marker"
      - id: action
        uses: .
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Assert workspace untouched
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/.cleanup-marker" ]; then
            echo "FAIL: marker file removed"
            exit 1
          fi
          if [ "$(cat "$GITHUB_WORKSPACE/.cleanup-marker")" != "marker" ]; then
            echo "FAIL: marker content changed"
            exit 1
          fi
          rm -f "$GITHUB_WORKSPACE/.cleanup-marker"
          echo "PASS"
