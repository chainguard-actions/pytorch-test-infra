name: Test available space exactly at minimum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fake df reporting exactly 10GB free on /
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/df" <<'EOF'
          #!/bin/sh
          echo "Filesystem 1024-blocks Used Available Capacity iused ifree %iused Mounted on"
          echo "/dev/disk1s1 488245288 400000000 10485760 90% 100 200 1% /"
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/df"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          minimum-available-space-in-gb: 10
      - name: Assert success
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
