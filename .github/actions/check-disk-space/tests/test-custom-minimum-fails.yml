name: Test custom minimum above available fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fake df reporting 100GB free on /
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/df" <<'EOF'
          #!/bin/sh
          echo "Filesystem 1024-blocks Used Available Capacity iused ifree %iused Mounted on"
          echo "/dev/disk1s1 488245288 100000000 104857600 50% 100 200 1% /"
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/df"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          minimum-available-space-in-gb: 200
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (200GB required, 100GB available)"
            exit 1
          fi
          echo "PASS"
