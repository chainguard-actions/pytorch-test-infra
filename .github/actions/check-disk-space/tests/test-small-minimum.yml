name: Test small explicit minimum available space
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          minimum-available-space-in-gb: "1"
      - name: Assert action succeeded and workspace still usable
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with a 1GB minimum"
            exit 1
          fi
          if [ ! -d "$GITHUB_WORKSPACE" ]; then
            echo "FAIL: workspace missing after action"
            exit 1
          fi
          echo "PASS"
