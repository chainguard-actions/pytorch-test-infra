name: Test low disk space fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fake df reporting 1GB free on /
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/df" <<'EOF'
          #!/bin/sh
          echo "Filesystem 1024-blocks Used Available Capacity iused ifree %iused Mounted on"
          echo "/dev/disk1s1 488245288 400000000 1048576 99% 100 200 1% /"
          echo "/dev/disk1s2 488245288 100 400000000 1% 100 200 1% /data"
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/df"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          minimum-available-space-in-gb: 6
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to low disk space"
            exit 1
          fi
          echo "PASS"
