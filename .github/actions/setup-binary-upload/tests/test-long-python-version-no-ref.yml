name: Test long python version and default ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide pkg-helpers at the path the action expects
        run: |
          rm -rf "$GITHUB_WORKSPACE/test-infra"
          mkdir -p "$GITHUB_WORKSPACE/test-infra/tools"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/pkg-helpers" "$GITHUB_WORKSPACE/test-infra/tools/pkg-helpers"
      - id: action
        uses: .
        with:
          repository: actions/checkout
          python-version: '3.10.19'
          cuda-version: cu126
          arch: aarch64
      - name: Assert ARTIFACT_NAME shortens python version
        run: |
          echo "actual: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "actions_checkout__3.10_cu126_aarch64" ]; then
            echo "FAIL: unexpected ARTIFACT_NAME"
            exit 1
          fi
          echo "PASS"
      - name: Assert BUILD_ENV_FILE generated with full python version
        run: |
          if [ -z "$BUILD_ENV_FILE" ] || [ ! -f "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing"
            exit 1
          fi
          cat "$BUILD_ENV_FILE"
          grep -qxF "export FAKE_PYTHON_VERSION=3.10.19" "$BUILD_ENV_FILE" || { echo "FAIL: python version"; exit 1; }
          grep -qxF "export FAKE_CU_VERSION=cu126" "$BUILD_ENV_FILE" || { echo "FAIL: cu version"; exit 1; }
          grep -qxF "export FAKE_REF=" "$BUILD_ENV_FILE" || { echo "FAIL: ref should be empty"; exit 1; }
          echo "PASS"
