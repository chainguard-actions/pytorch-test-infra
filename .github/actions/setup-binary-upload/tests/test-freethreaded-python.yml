name: Test free-threaded python suffix preserved
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check out test-infra (provides tools/pkg-helpers)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          path: test-infra
      - id: action
        uses: .
        with:
          repository: pytorch/vision
          ref: main
          python-version: '3.13t'
          cuda-version: cpu
          arch: x86_64
      - name: Assert artifact name keeps 't' suffix
        run: |
          echo "ARTIFACT_NAME: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "pytorch_vision_main_3.13t_cpu_x86_64" ]; then
            echo "FAIL: unexpected artifact name"
            exit 1
          fi
          echo "PASS"
      - name: Assert build env file
        run: |
          echo "BUILD_ENV_FILE: $BUILD_ENV_FILE"
          if [ -z "$BUILD_ENV_FILE" ] || [ ! -s "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing or empty"
            exit 1
          fi
          echo "PASS"
