name: Test free-threaded python version suffix is preserved
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PACKAGE_TYPE: wheel
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide test-infra/tools/pkg-helpers under the workspace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          path: test-infra
          sparse-checkout: tools/pkg-helpers
      - id: action
        uses: .
        with:
          repository: pytorch/test-infra
          ref: main
          python-version: 3.13t
          cuda-version: cu126
          arch: aarch64
      - name: Assert artifact name
        run: |
          echo "ARTIFACT_NAME: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "pytorch_test-infra_main_3.13t_cu126_aarch64" ]; then
            echo "FAIL: unexpected ARTIFACT_NAME"
            exit 1
          fi
          echo "PASS"
      - name: Assert build env file produced
        run: |
          echo "BUILD_ENV_FILE: $BUILD_ENV_FILE"
          if [ -z "$BUILD_ENV_FILE" ] || [ ! -f "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE not set or missing"
            exit 1
          fi
          echo "PASS"
