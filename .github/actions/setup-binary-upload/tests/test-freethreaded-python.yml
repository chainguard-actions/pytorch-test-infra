name: Test free-threaded python suffix is preserved
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          ref: main
          path: test-infra
      - id: action
        uses: .
        with:
          repository: pytorch/vision
          ref: main
          python-version: '3.13t'
          cuda-version: cpu
          arch: x86_64
      - name: Assert ARTIFACT_NAME keeps the t suffix
        run: |
          echo "ARTIFACT_NAME: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "pytorch_vision_main_3.13t_cpu_x86_64" ]; then
            echo "FAIL: expected pytorch_vision_main_3.13t_cpu_x86_64"
            exit 1
          fi
          echo "PASS"
