name: Test ref with slashes is sanitized
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check out pytorch/test-infra for pkg-helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          path: test-infra
      - id: action
        uses: .
        with:
          repository: pytorch/vision
          ref: refs/heads/main
          python-version: 3.12.4
          cuda-version: cu126
          arch: x86_64
      - name: Assert ARTIFACT_NAME has all slashes replaced
        run: |
          echo "ARTIFACT_NAME: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "pytorch_vision_refs_heads_main_3.12_cu126_x86_64" ]; then
            echo "FAIL: unexpected ARTIFACT_NAME"
            exit 1
          fi
          case "$ARTIFACT_NAME" in
            */*) echo "FAIL: slash present"; exit 1 ;;
          esac
          echo "PASS"
