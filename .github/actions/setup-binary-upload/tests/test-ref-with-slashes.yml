name: Test ref with slashes and python 't' suffix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check out pkg-helpers from pytorch/test-infra
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          path: test-infra
          sparse-checkout: |
            tools/pkg-helpers
      - id: action
        uses: .
        with:
          repository: pytorch/vision
          ref: release/0.20
          python-version: '3.13t'
          cuda-version: cpu
          arch: x86_64
      - name: Assert ARTIFACT_NAME replaces slashes and keeps 't' suffix
        run: |
          echo "actual: $ARTIFACT_NAME"
          EXPECTED="pytorch_vision_release_0.20_3.13t_cpu_x86_64"
          if [ "$ARTIFACT_NAME" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED'"
            exit 1
          fi
          echo "PASS"
      - name: Assert release branch checked out
        working-directory: pytorch/vision
        run: |
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          echo "branch: $BRANCH"
          if [ "$BRANCH" != "release/0.20" ]; then
            echo "FAIL: expected release/0.20 checked out"
            exit 1
          fi
          echo "PASS"
      - name: Assert BUILD_ENV_FILE generated
        run: |
          echo "BUILD_ENV_FILE: $BUILD_ENV_FILE"
          if [ -z "$BUILD_ENV_FILE" ] || [ ! -s "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing or empty"
            exit 1
          fi
          echo "PASS"
