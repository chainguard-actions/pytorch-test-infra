name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action installs ${GITHUB_WORKSPACE}/test-infra/tools/pkg-helpers
      - name: Check out pytorch/test-infra for pkg-helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          ref: main
          path: test-infra
      - id: action
        uses: .
        with:
          repository: pytorch/vision
          ref: main
          python-version: "3.10.19"
          cuda-version: cpu
          arch: x86_64
      - name: Assert artifact name
        run: |
          echo "ARTIFACT_NAME: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "pytorch_vision_main_3.10_cpu_x86_64" ]; then
            echo "FAIL: expected 'pytorch_vision_main_3.10_cpu_x86_64'"
            exit 1
          fi
          echo "PASS"
      - name: Assert target repo checked out and build env file generated
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/pytorch/vision/.git" ] && [ ! -f "$GITHUB_WORKSPACE/pytorch/vision/.git" ]; then
            echo "FAIL: pytorch/vision not checked out"
            exit 1
          fi
          echo "BUILD_ENV_FILE: $BUILD_ENV_FILE"
          if [ -z "$BUILD_ENV_FILE" ] || [ ! -s "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing or empty"
            exit 1
          fi
          cat "$BUILD_ENV_FILE"
          echo "PASS"
