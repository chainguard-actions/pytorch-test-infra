name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Make pkg-helpers available at $GITHUB_WORKSPACE/test-infra
        run: |
          set -ex
          if [ -e "$GITHUB_WORKSPACE/test-infra/tools/pkg-helpers" ]; then
            exit 0
          fi
          if [ -d "$GITHUB_WORKSPACE/tools/pkg-helpers" ]; then
            ln -s . "$GITHUB_WORKSPACE/test-infra"
          else
            git clone --depth 1 https://github.com/pytorch/test-infra.git "$GITHUB_WORKSPACE/test-infra"
          fi
          ls "$GITHUB_WORKSPACE/test-infra/tools/pkg-helpers"
      - id: action
        uses: .
        with:
          repository: pytorch/test-infra
          ref: main
          python-version: 3.10.19
          cuda-version: cu121
          arch: x86_64
      - name: Assert ARTIFACT_NAME
        run: |
          echo "actual: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "pytorch_test-infra_main_3.10_cu121_x86_64" ]; then
            echo "FAIL: expected 'pytorch_test-infra_main_3.10_cu121_x86_64'"
            exit 1
          fi
          echo "PASS"
      - name: Assert target repository checked out
        run: |
          ls "$GITHUB_WORKSPACE/pytorch/test-infra" | head
          if [ ! -d "$GITHUB_WORKSPACE/pytorch/test-infra/tools" ]; then
            echo "FAIL: target repository not checked out under pytorch/test-infra"
            exit 1
          fi
          echo "PASS"
      - name: Assert BUILD_ENV_FILE
        run: |
          echo "BUILD_ENV_FILE: $BUILD_ENV_FILE"
          if [ -z "$BUILD_ENV_FILE" ] || [ ! -s "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing or empty"
            exit 1
          fi
          cat "$BUILD_ENV_FILE"
          echo "PASS"
