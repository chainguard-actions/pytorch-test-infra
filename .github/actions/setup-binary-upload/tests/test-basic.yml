name: Test basic usage (default ref, long python version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action installs ${GITHUB_WORKSPACE}/test-infra/tools/pkg-helpers
      - name: Check out pkg-helpers from pytorch/test-infra
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          path: test-infra
          sparse-checkout: |
            tools/pkg-helpers
      - id: action
        uses: .
        with:
          repository: pytorch/vision
          python-version: '3.10.19'
          cuda-version: cpu
          arch: x86_64
      - name: Assert ARTIFACT_NAME
        run: |
          echo "actual: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "pytorch_vision__3.10_cpu_x86_64" ]; then
            echo "FAIL: expected 'pytorch_vision__3.10_cpu_x86_64'"
            exit 1
          fi
          echo "PASS"
      - name: Assert target repo checked out
        run: |
          ls "$GITHUB_WORKSPACE/pytorch/vision" | head -50
          if [ ! -f "$GITHUB_WORKSPACE/pytorch/vision/setup.py" ]; then
            echo "FAIL: pytorch/vision not checked out"
            exit 1
          fi
          echo "PASS"
      - name: Assert BUILD_ENV_FILE generated
        run: |
          echo "BUILD_ENV_FILE: $BUILD_ENV_FILE"
          if [ -z "$BUILD_ENV_FILE" ] || [ ! -s "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing or empty"
            exit 1
          fi
          cat "$BUILD_ENV_FILE"
          echo "PASS"
