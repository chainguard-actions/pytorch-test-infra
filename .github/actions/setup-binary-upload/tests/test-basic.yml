name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide pkg-helpers at the path the action expects
        run: |
          rm -rf "$GITHUB_WORKSPACE/test-infra"
          mkdir -p "$GITHUB_WORKSPACE/test-infra/tools"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/pkg-helpers" "$GITHUB_WORKSPACE/test-infra/tools/pkg-helpers"
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: v4
          python-version: '3.11'
          cuda-version: cpu
          arch: x86_64
      - name: Assert ARTIFACT_NAME
        run: |
          echo "actual: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "actions_checkout_v4_3.11_cpu_x86_64" ]; then
            echo "FAIL: unexpected ARTIFACT_NAME"
            exit 1
          fi
          echo "PASS"
      - name: Assert target repo checked out
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/actions/checkout/action.yml" ]; then
            echo "FAIL: target repository not checked out into actions/checkout"
            exit 1
          fi
          echo "PASS"
      - name: Assert BUILD_ENV_FILE generated
        run: |
          echo "BUILD_ENV_FILE: $BUILD_ENV_FILE"
          if [ -z "$BUILD_ENV_FILE" ] || [ ! -f "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing"
            exit 1
          fi
          cat "$BUILD_ENV_FILE"
          for expected in \
            "export FAKE_REPOSITORY=actions/checkout" \
            "export FAKE_REF=v4" \
            "export FAKE_PYTHON_VERSION=3.11" \
            "export FAKE_CU_VERSION=cpu" \
            "export FAKE_ARCH=x86_64"; do
            if ! grep -qxF "$expected" "$BUILD_ENV_FILE"; then
              echo "FAIL: missing line '$expected'"
              exit 1
            fi
          done
          if ! grep -qE '^export FAKE_CWD=.*/actions/checkout$' "$BUILD_ENV_FILE"; then
            echo "FAIL: helper did not run in the target repo directory"
            exit 1
          fi
          echo "PASS"
