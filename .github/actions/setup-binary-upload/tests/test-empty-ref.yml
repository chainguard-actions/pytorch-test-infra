name: Test default empty ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          ref: main
          path: test-infra
      - id: action
        uses: .
        with:
          repository: pytorch/test-infra
          python-version: '3.12'
          cuda-version: cu124
          arch: x86_64
      - name: Assert artifact name with empty ref
        run: |
          echo "ARTIFACT_NAME: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "pytorch_test-infra__3.12_cu124_x86_64" ]; then
            echo "FAIL: unexpected ARTIFACT_NAME"
            exit 1
          fi
          if [ ! -d "$GITHUB_WORKSPACE/pytorch/test-infra" ]; then
            echo "FAIL: default branch not checked out"
            exit 1
          fi
          echo "PASS"
