name: Test preset CHANNEL is preserved
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHANNEL: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert CHANNEL is unchanged
        run: |
          echo "CHANNEL: '${CHANNEL:-}'"
          if [ "${CHANNEL:-}" != "test" ]; then
            echo "FAIL: expected CHANNEL=test to be preserved"
            exit 1
          fi
          echo "PASS"
