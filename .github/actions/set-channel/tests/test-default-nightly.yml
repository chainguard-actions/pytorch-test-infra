name: Test default channel is nightly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert CHANNEL is nightly
        run: |
          echo "CHANNEL: '${CHANNEL:-}'"
          if [ "${CHANNEL:-}" != "nightly" ]; then
            echo "FAIL: expected CHANNEL=nightly for a non-tag, non-release workflow_dispatch run"
            exit 1
          fi
          echo "PASS"
