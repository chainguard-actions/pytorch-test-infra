name: Test default channel is nightly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert CHANNEL is nightly
        run: |
          echo "CHANNEL: '${CHANNEL:-}'"
          if [ "${CHANNEL:-}" != "nightly" ]; then
            echo "FAIL: expected CHANNEL=nightly"
            exit 1
          fi
          echo "PASS"
      - name: Assert CHANNEL written to GITHUB_ENV exactly once
        env:
          CHANNEL_EXPR: ${{ env.CHANNEL }}
        run: |
          echo "env.CHANNEL: '$CHANNEL_EXPR'"
          if [ "$CHANNEL_EXPR" != "nightly" ]; then
            echo "FAIL: expected env.CHANNEL=nightly"
            exit 1
          fi
          echo "PASS"
