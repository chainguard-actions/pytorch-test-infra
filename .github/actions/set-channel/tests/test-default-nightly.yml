name: Test default channel is nightly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert CHANNEL is nightly
        run: |
          echo "CHANNEL: '${CHANNEL:-}'"
          if [ "${CHANNEL:-}" != "nightly" ]; then
            echo "FAIL: expected CHANNEL=nightly"
            exit 1
          fi
          echo "PASS"
      - name: Assert CHANNEL via env context
        env:
          ACTUAL: ${{ env.CHANNEL }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "nightly" ]; then
            echo "FAIL: expected nightly"
            exit 1
          fi
          echo "PASS"
