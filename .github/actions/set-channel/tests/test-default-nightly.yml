name: Test default nightly channel
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert CHANNEL is nightly
        run: |
          echo "CHANNEL: '${CHANNEL:-}'"
          if [ "${CHANNEL:-}" != "nightly" ]; then
            echo "FAIL: expected CHANNEL=nightly"
            exit 1
          fi
          if ! grep -q '^CHANNEL=nightly$' "$GITHUB_ENV" 2>/dev/null; then
            echo "note: GITHUB_ENV file already consumed; env check passed"
          fi
          echo "PASS"
