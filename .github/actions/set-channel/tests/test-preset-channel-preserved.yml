name: Test preset CHANNEL is not overwritten
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Preset CHANNEL via GITHUB_ENV
        run: echo "CHANNEL=test" >> "$GITHUB_ENV"
      - id: action
        uses: .
      - name: Assert CHANNEL remains test
        run: |
          echo "CHANNEL: ${CHANNEL:-<unset>}"
          if [ "${CHANNEL:-}" != "test" ]; then
            echo "FAIL: expected CHANNEL to remain 'test'"
            exit 1
          fi
          echo "PASS"
