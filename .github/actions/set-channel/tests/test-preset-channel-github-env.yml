name: Test preset CHANNEL via GITHUB_ENV is preserved
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Preset CHANNEL
        run: echo "CHANNEL=test" >> "$GITHUB_ENV"
      - id: action
        uses: .
      - name: Assert CHANNEL remains test
        run: |
          echo "CHANNEL: '${CHANNEL:-}'"
          if [ "${CHANNEL:-}" != "test" ]; then
            echo "FAIL: expected CHANNEL=test (default step should be skipped)"
            exit 1
          fi
          echo "PASS"
