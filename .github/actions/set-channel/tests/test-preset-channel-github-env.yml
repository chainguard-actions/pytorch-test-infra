name: Test CHANNEL preset via GITHUB_ENV is preserved
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Preset CHANNEL
        run: echo "CHANNEL=release" >> "$GITHUB_ENV"
      - id: action
        uses: .
      - name: Assert CHANNEL remains release
        run: |
          echo "CHANNEL: ${CHANNEL:-<unset>}"
          if [ "${CHANNEL:-}" != "release" ]; then
            echo "FAIL: expected CHANNEL=release (default should not override)"
            exit 1
          fi
          echo "PASS"
