name: Test preset CHANNEL in job env is preserved
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHANNEL: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert CHANNEL remains test
        run: |
          echo "CHANNEL: ${CHANNEL:-<unset>}"
          if [ "${CHANNEL:-}" != "test" ]; then
            echo "FAIL: expected CHANNEL=test (default should not override)"
            exit 1
          fi
          echo "PASS"
