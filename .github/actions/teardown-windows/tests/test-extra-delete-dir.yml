name: Test teardown with extra-delete-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAKE_SSH_COUNT_FILE: /tmp/fake-ssh-count-extra
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up powershell shim
        run: |
          echo 0 > "$FAKE_SSH_COUNT_FILE"
          mkdir -p /tmp/extra-dir-test
          bash tests/fixtures/setup-powershell.sh
      - id: action
        uses: .
        with:
          extra-delete-dir: /tmp/extra-dir-test
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
