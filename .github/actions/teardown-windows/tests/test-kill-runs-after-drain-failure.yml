name: Test kill step still runs when drain step fails (if always)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install a powershell shim that fails the drain step
        run: |
          mkdir -p "$HOME/shimbin"
          cat > "$HOME/shimbin/powershell" <<'EOF'
          #!/bin/sh
          # act invokes: powershell -command . /path/to/script.ps1
          log=/tmp/powershell-invocations.log
          echo "=== INVOCATION: $* ===" >> "$log"
          rc=0
          for arg in "$@"; do
            for cand in "$arg" \
                "$(printf '%s' "$arg" | sed -n "s/.*'\(.*\)'.*/\1/p")" \
                "$(printf '%s' "$arg" | sed -e 's/^\. *//' -e 's/^"//' -e 's/"$//')"; do
              if [ -n "$cand" ] && [ -f "$cand" ]; then
                cat "$cand" >> "$log"
                echo >> "$log"
                if grep -q 'Get-SSH-Users' "$cand"; then rc=1; fi
                break
              fi
            done
          done
          exit $rc
          EOF
          chmod +x "$HOME/shimbin/powershell"
          echo "$HOME/shimbin" >> "$GITHUB_PATH"
          if [ -w /usr/local/bin ]; then
            cp "$HOME/shimbin/powershell" /usr/local/bin/powershell
          elif command -v sudo >/dev/null 2>&1; then
            sudo cp "$HOME/shimbin/powershell" /usr/local/bin/powershell || true
          fi
          rm -f /tmp/powershell-invocations.log
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed but kill step still executed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/powershell-invocations.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome, got '$OUTCOME'"
            exit 1
          fi
          grep -q 'Get-SSH-Users' /tmp/powershell-invocations.log || { echo "FAIL: drain step not run"; exit 1; }
          grep -q 'Stop-Process' /tmp/powershell-invocations.log || { echo "FAIL: kill step did not run after drain failure"; exit 1; }
          echo "PASS"
