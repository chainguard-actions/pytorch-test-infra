name: Test teardown kills lingering sshd sessions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide powershell shim and Windows CIM stubs
        id: setup
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            mkdir -p /tmp/psshim
            printf '#!/bin/sh\nexec pwsh "$@"\n' > /tmp/psshim/powershell
            chmod +x /tmp/psshim/powershell
            echo "/tmp/psshim" >> "$GITHUB_PATH"
            PROFILE_PATH="$(pwsh -NoLogo -NoProfile -Command 'Write-Output $PROFILE.CurrentUserCurrentHost')"
            mkdir -p "$(dirname "$PROFILE_PATH")"
            cat > "$PROFILE_PATH" <<'EOF'
          function Get-CimInstance { param([Parameter(ValueFromRemainingArguments=$true)]$Rest) }
          function Get-CimAssociatedInstance { param([Parameter(ValueFromPipeline=$true)]$InputObject, [Parameter(ValueFromRemainingArguments=$true)]$Rest) process { } }
          EOF
            echo "pwsh=true" >> "$GITHUB_OUTPUT"
          else
            echo "pwsh not available in this runner image"
            echo "pwsh=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start a fake sshd session process
        run: |
          mkdir -p /tmp/fakesshd
          cp "$(command -v sleep)" /tmp/fakesshd/sshd
          setsid nohup /tmp/fakesshd/sshd 600 >/dev/null 2>&1 &
          echo $! > /tmp/fakesshd.pid
          sleep 1
          echo "fake sshd pid: $(cat /tmp/fakesshd.pid)"
          ps -eo pid,user,comm | grep sshd || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          extra-delete-dir: /tmp/does-not-matter
      - name: Assert fake sshd session was killed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_PWSH: ${{ steps.setup.outputs.pwsh }}
        run: |
          echo "outcome: $OUTCOME (pwsh available: $HAS_PWSH)"
          PID="$(cat /tmp/fakesshd.pid)"
          ALIVE=false
          if [ -r "/proc/$PID/stat" ]; then
            STATE="$(awk '{print $3}' "/proc/$PID/stat")"
            echo "process state: $STATE"
            [ "$STATE" != "Z" ] && ALIVE=true
          fi
          # cleanup regardless
          kill "$PID" 2>/dev/null || true
          if [ "$HAS_PWSH" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: expected action success"
              exit 1
            fi
            if [ "$ALIVE" = "true" ]; then
              echo "FAIL: fake sshd process $PID is still running"
              exit 1
            fi
            echo "PASS: lingering sshd session was stopped"
          elif [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (no powershell available on this Linux runner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
