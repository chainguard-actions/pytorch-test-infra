name: Test environment-file, pip requirements, custom python and packages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.10"
          environment-file: tests/fixtures/conda-packages.txt
          pip-requirements-file: tests/fixtures/requirements.txt
          default-packages: "wheel"
      - name: Assert python version
        run: |
          set -x
          VER=$($CONDA_RUN python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "python version: $VER"
          if [ "$VER" != "3.10" ]; then
            echo "FAIL: expected python 3.10"
            exit 1
          fi
          if [ ! -d "${RUNNER_TEMP}/conda-python-3.10" ]; then
            echo "FAIL: base env for 3.10 missing"
            exit 1
          fi
          echo "PASS"
      - name: Assert env file and pip requirements installed
        run: |
          set -x
          $CONDA_RUN python -c 'import yaml; print("yaml", yaml.__version__)' || { echo "FAIL: pyyaml (environment-file) not installed"; exit 1; }
          SIX=$($CONDA_RUN python -c 'import six; print(six.__version__)')
          echo "six: $SIX"
          if [ "$SIX" != "1.16.0" ]; then
            echo "FAIL: expected six 1.16.0 from pip requirements"
            exit 1
          fi
          $CONDA_RUN python -c 'import wheel' || { echo "FAIL: wheel not installed"; exit 1; }
          if [ -x "$CONDA_PREFIX/bin/cmake" ]; then
            echo "FAIL: cmake should not be installed with custom default-packages"
            exit 1
          fi
          echo "PASS"
