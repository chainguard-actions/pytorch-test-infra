name: Test conda environment file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.10"
          default-packages: "pip"
          environment-file: tests/fixtures/conda-spec.txt
      - name: Assert python version and env-file package installed
        run: |
          VER=$($CONDA_RUN python --version 2>&1)
          echo "python: $VER"
          case "$VER" in
            "Python 3.10"*) ;;
            *) echo "FAIL: expected Python 3.10"; exit 1 ;;
          esac
          if [ ! -d "${RUNNER_TEMP}/conda-python-3.10" ]; then
            echo "FAIL: base env for 3.10 missing"; exit 1
          fi
          $CONDA_RUN python -c "import six; print(six.__version__)" || { echo "FAIL: six from env file not installed"; exit 1; }
          echo "PASS"
