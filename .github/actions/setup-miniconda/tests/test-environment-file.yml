name: Test conda environment file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.11"
          default-packages: "pip"
          environment-file: tests/fixtures/conda-packages.txt
      - name: Assert env file package installed
        shell: bash
        run: |
          PYV=$($CONDA_RUN python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "python: $PYV"
          if [ "$PYV" != "3.11" ]; then echo "FAIL: expected python 3.11"; exit 1; fi
          $CONDA_RUN python -c 'import six; print(six.__version__)' || { echo "FAIL: six not installed from env file"; exit 1; }
          echo "PASS"
