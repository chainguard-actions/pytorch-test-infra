name: Test missing environment and requirements files are tolerated
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.9"
          default-packages: "pip"
          environment-file: tests/fixtures/does-not-exist.yml
          pip-requirements-file: tests/fixtures/does-not-exist.txt
      - name: Assert env created despite missing files
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -z "$CONDA_PREFIX" ] || [ ! -d "$CONDA_PREFIX" ]; then
            echo "FAIL: CONDA_PREFIX missing"
            exit 1
          fi
          VER="$($CONDA_RUN python --version 2>&1)"
          echo "python: $VER"
          case "$VER" in
            "Python 3.9."*) echo "PASS" ;;
            *) echo "FAIL: expected Python 3.9.x"; exit 1 ;;
          esac
