name: Test missing env and pip files are tolerated
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          default-packages: "wheel"
          environment-file: tests/fixtures/does-not-exist.yml
          pip-requirements-file: tests/fixtures/does-not-exist.txt
      - name: Assert step succeeded and env usable
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -z "$CONDA_PREFIX" ] || [ ! -d "$CONDA_PREFIX" ]; then
            echo "FAIL: CONDA_PREFIX missing"
            exit 1
          fi
          $CONDA_RUN python -c 'import wheel' || { echo "FAIL: wheel not installed"; exit 1; }
          echo "PASS"
