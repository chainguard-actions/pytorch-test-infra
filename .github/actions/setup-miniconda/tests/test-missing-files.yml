name: Test conda setup with nonexistent env and requirements files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.9"
          default-packages: "pip"
          environment-file: does/not/exist/environment.yml
          pip-requirements-file: does/not/exist/requirements.txt
      - name: Assert action succeeded and env usable
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -z "$CONDA_PREFIX" ] || [ ! -d "$CONDA_PREFIX" ]; then
            echo "FAIL: CONDA_PREFIX missing"
            exit 1
          fi
          OUT=$($CONDA_RUN python -c 'print("hello")')
          echo "out: $OUT"
          if [ "$OUT" != "hello" ]; then
            echo "FAIL: conda run did not work"
            exit 1
          fi
          echo "PASS"
