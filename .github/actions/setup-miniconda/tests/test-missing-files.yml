name: Test missing environment and requirements files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.11"
          default-packages: "wheel"
          environment-file: tests/fixtures/does-not-exist.yml
          pip-requirements-file: tests/fixtures/does-not-exist.txt
      - name: Assert env created despite missing files
        shell: bash
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then echo "FAIL"; exit 1; fi
          if [ ! -d "$CONDA_PREFIX" ]; then echo "FAIL: env dir missing"; exit 1; fi
          PYV=$($CONDA_RUN python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "python: $PYV"
          if [ "$PYV" != "3.11" ]; then echo "FAIL: expected python 3.11"; exit 1; fi
          echo "PASS"
