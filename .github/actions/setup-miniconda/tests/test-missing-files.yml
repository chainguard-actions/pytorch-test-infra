name: Test missing environment and requirements files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.12"
          default-packages: "pip"
          environment-file: tests/fixtures/does-not-exist.txt
          pip-requirements-file: tests/fixtures/also-missing.txt
      - name: Assert env created despite missing files
        run: |
          echo "CONDA_ENV=$CONDA_ENV"
          if [ -z "$CONDA_ENV" ] || [ ! -d "$CONDA_ENV" ]; then
            echo "FAIL: CONDA_ENV not created"; exit 1
          fi
          VER=$($CONDA_RUN python --version 2>&1)
          echo "python: $VER"
          case "$VER" in
            "Python 3.12"*) ;;
            *) echo "FAIL: expected Python 3.12"; exit 1 ;;
          esac
          if $CONDA_RUN python -c "import six" 2>/dev/null; then
            echo "FAIL: six should not be installed"; exit 1
          fi
          echo "PASS"
