name: Test missing environment and pip files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.11"
          default-packages: ""
          environment-file: tests/fixtures/does-not-exist-env.txt
          pip-requirements-file: tests/fixtures/does-not-exist-reqs.txt
      - name: Assert action succeeded and env usable
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"; exit 1
          fi
          VER=$($CONDA_RUN python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "python: $VER"
          if [ "$VER" != "3.11" ]; then
            echo "FAIL: expected python 3.11"; exit 1
          fi
          echo "PASS"
