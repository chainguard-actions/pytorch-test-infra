name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.9"
          default-packages: "pip"
      - name: Assert conda env variables exported
        run: |
          echo "CONDA_ENV=$CONDA_ENV"
          echo "CONDA_PREFIX=$CONDA_PREFIX"
          echo "CONDA_RUN=$CONDA_RUN"
          echo "CONDA_INSTALL=$CONDA_INSTALL"
          echo "CONDA_EXE=$CONDA_EXE"
          if [ -z "$CONDA_ENV" ] || [ "$CONDA_ENV" != "$CONDA_PREFIX" ]; then
            echo "FAIL: CONDA_ENV/CONDA_PREFIX not set consistently"
            exit 1
          fi
          case "$CONDA_PREFIX" in
            "$RUNNER_TEMP"/conda_environment_*) ;;
            *) echo "FAIL: unexpected CONDA_PREFIX"; exit 1 ;;
          esac
          if [ ! -d "$CONDA_PREFIX" ]; then
            echo "FAIL: CONDA_PREFIX directory does not exist"
            exit 1
          fi
          if [ "$CONDA_EXE" != "$RUNNER_TEMP/miniconda/bin/conda" ] || [ ! -x "$CONDA_EXE" ]; then
            echo "FAIL: CONDA_EXE not set to installed miniconda"
            exit 1
          fi
          case "$CONDA_RUN" in
            *"run -p $CONDA_PREFIX --no-capture-output"*) ;;
            *) echo "FAIL: CONDA_RUN malformed"; exit 1 ;;
          esac
          case "$CONDA_INSTALL" in
            *"install --yes --quiet -p $CONDA_PREFIX"*) ;;
            *) echo "FAIL: CONDA_INSTALL malformed"; exit 1 ;;
          esac
          echo "PASS"
      - name: Assert python version in env
        run: |
          VER="$($CONDA_RUN python --version 2>&1)"
          echo "python: $VER"
          case "$VER" in
            "Python 3.9."*) echo "PASS" ;;
            *) echo "FAIL: expected Python 3.9.x"; exit 1 ;;
          esac
      - name: Assert channel priority reset
        run: |
          OUT="$(conda config --show channel_priority)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q "disabled\|false"; then
            echo "FAIL: channel_priority not disabled"
            exit 1
          fi
          echo "PASS"
