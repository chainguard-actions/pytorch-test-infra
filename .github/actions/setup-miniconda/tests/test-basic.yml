name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.10"
      - name: Assert conda env exported
        run: |
          echo "CONDA_ENV=$CONDA_ENV"
          echo "CONDA_PREFIX=$CONDA_PREFIX"
          echo "CONDA_RUN=$CONDA_RUN"
          echo "CONDA_INSTALL=$CONDA_INSTALL"
          if [ -z "$CONDA_ENV" ] || [ ! -d "$CONDA_ENV" ]; then
            echo "FAIL: CONDA_ENV not set or missing"; exit 1
          fi
          if [ "$CONDA_ENV" != "$CONDA_PREFIX" ]; then
            echo "FAIL: CONDA_ENV != CONDA_PREFIX"; exit 1
          fi
          if [ "$CONDA_ENV" != "${RUNNER_TEMP}/conda_environment_${GITHUB_RUN_ID}" ]; then
            echo "FAIL: unexpected CONDA_ENV path"; exit 1
          fi
          if [ -z "$CONDA_RUN" ] || [ -z "$CONDA_INSTALL" ]; then
            echo "FAIL: CONDA_RUN/CONDA_INSTALL not set"; exit 1
          fi
          echo "PASS"
      - name: Assert python version and default packages
        run: |
          VER=$($CONDA_RUN python --version 2>&1)
          echo "python: $VER"
          case "$VER" in
            "Python 3.10"*) ;;
            *) echo "FAIL: expected Python 3.10"; exit 1 ;;
          esac
          $CONDA_RUN cmake --version || { echo "FAIL: cmake missing"; exit 1; }
          $CONDA_RUN ninja --version || { echo "FAIL: ninja missing"; exit 1; }
          echo "PASS"
      - name: Assert conda on PATH and channel priority reset
        run: |
          which conda
          case "$(which conda)" in
            "${RUNNER_TEMP}/miniconda/bin/conda") ;;
            *) echo "FAIL: conda not from miniconda install"; exit 1 ;;
          esac
          PRIO=$(conda config --show channel_priority)
          echo "$PRIO"
          echo "$PRIO" | grep -q "disabled" || { echo "FAIL: channel_priority not disabled"; exit 1; }
          echo "PASS"
