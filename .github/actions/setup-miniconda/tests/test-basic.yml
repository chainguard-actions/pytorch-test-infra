name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert conda env exported
        shell: bash
        run: |
          echo "CONDA_ENV=$CONDA_ENV"
          echo "CONDA_PREFIX=$CONDA_PREFIX"
          echo "CONDA_RUN=$CONDA_RUN"
          echo "CONDA_INSTALL=$CONDA_INSTALL"
          echo "CONDA_EXE=$CONDA_EXE"
          for v in CONDA_ENV CONDA_PREFIX CONDA_RUN CONDA_INSTALL CONDA_EXE; do
            if [ -z "${!v}" ]; then echo "FAIL: $v is empty"; exit 1; fi
          done
          if [ "$CONDA_ENV" != "$CONDA_PREFIX" ]; then echo "FAIL: CONDA_ENV != CONDA_PREFIX"; exit 1; fi
          if [ ! -d "$CONDA_PREFIX" ]; then echo "FAIL: env dir missing"; exit 1; fi
          if [ ! -x "$CONDA_EXE" ]; then echo "FAIL: conda exe missing"; exit 1; fi
          echo "PASS"
      - name: Assert python version and default packages
        shell: bash
        run: |
          PYV=$($CONDA_RUN python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "python: $PYV"
          if [ "$PYV" != "3.9" ]; then echo "FAIL: expected python 3.9"; exit 1; fi
          $CONDA_RUN cmake --version | tee /tmp/cmake.txt
          grep -q "3.22" /tmp/cmake.txt || { echo "FAIL: cmake 3.22 not installed"; exit 1; }
          $CONDA_RUN ninja --version || { echo "FAIL: ninja missing"; exit 1; }
          echo "PASS"
      - name: Assert channel priority reset
        shell: bash
        run: |
          OUT=$(conda config --show channel_priority)
          echo "$OUT"
          echo "$OUT" | grep -q "disabled" || { echo "FAIL: channel_priority not disabled"; exit 1; }
          echo "PASS"
