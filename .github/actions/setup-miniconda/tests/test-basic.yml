name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert conda env variables exported
        run: |
          echo "CONDA_ENV=$CONDA_ENV"
          echo "CONDA_PREFIX=$CONDA_PREFIX"
          echo "CONDA_RUN=$CONDA_RUN"
          echo "CONDA_INSTALL=$CONDA_INSTALL"
          echo "CONDA_EXE=$CONDA_EXE"
          expected="${RUNNER_TEMP}/conda_environment_${GITHUB_RUN_ID}"
          if [ "$CONDA_ENV" != "$expected" ] || [ "$CONDA_PREFIX" != "$expected" ]; then
            echo "FAIL: expected CONDA_ENV/CONDA_PREFIX to be $expected"
            exit 1
          fi
          if [ ! -d "$CONDA_PREFIX" ]; then
            echo "FAIL: conda prefix dir missing"
            exit 1
          fi
          case "$CONDA_RUN" in
            *"run -p ${expected} --no-capture-output"*) ;;
            *) echo "FAIL: CONDA_RUN unexpected"; exit 1 ;;
          esac
          case "$CONDA_INSTALL" in
            *"install --yes --quiet -p ${expected}"*) ;;
            *) echo "FAIL: CONDA_INSTALL unexpected"; exit 1 ;;
          esac
          if [ "$CONDA_EXE" != "${RUNNER_TEMP}/miniconda/bin/conda" ] || [ ! -x "$CONDA_EXE" ]; then
            echo "FAIL: CONDA_EXE unexpected or not executable"
            exit 1
          fi
          echo "PASS"
      - name: Assert python version and default packages
        run: |
          ver="$($CONDA_RUN python --version 2>&1)"
          echo "python: $ver"
          case "$ver" in
            "Python 3.9."*) ;;
            *) echo "FAIL: expected Python 3.9"; exit 1 ;;
          esac
          cm="$($CONDA_RUN cmake --version | head -n1)"
          echo "cmake: $cm"
          case "$cm" in
            *"3.22"*) ;;
            *) echo "FAIL: expected cmake 3.22"; exit 1 ;;
          esac
          $CONDA_RUN ninja --version || { echo "FAIL: ninja missing"; exit 1; }
          echo "PASS"
      - name: Assert channel priority reset
        run: |
          out="$("$CONDA_EXE" config --show channel_priority)"
          echo "$out"
          if ! echo "$out" | grep -qi "disabled\|false"; then
            echo "FAIL: channel_priority not disabled"
            exit 1
          fi
          echo "PASS"
