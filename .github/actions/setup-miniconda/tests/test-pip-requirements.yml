name: Test pip requirements file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.10"
          default-packages: "wheel"
          pip-requirements-file: tests/fixtures/requirements.txt
      - name: Assert pip requirement installed
        shell: bash
        run: |
          echo "CONDA_RUN=$CONDA_RUN"
          PYV=$($CONDA_RUN python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "python: $PYV"
          if [ "$PYV" != "3.10" ]; then echo "FAIL: expected python 3.10"; exit 1; fi
          VER=$($CONDA_RUN python -c 'import six; print(six.__version__)')
          echo "six: $VER"
          if [ "$VER" != "1.16.0" ]; then echo "FAIL: expected six 1.16.0"; exit 1; fi
          echo "PASS"
