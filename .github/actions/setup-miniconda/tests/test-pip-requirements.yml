name: Test pip requirements file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.10"
          default-packages: "wheel"
          pip-requirements-file: tests/fixtures/requirements.txt
      - name: Assert python version
        shell: bash
        run: |
          OUT="$($CONDA_RUN python --version 2>&1)"
          echo "python: $OUT"
          case "$OUT" in
            *"Python 3.10"*) ;;
            *) echo "FAIL: expected Python 3.10"; exit 1 ;;
          esac
          echo "PASS"
      - name: Assert pip requirement installed
        shell: bash
        run: |
          VER="$($CONDA_RUN python -c 'import six; print(six.__version__)')"
          echo "six: $VER"
          if [ "$VER" != "1.16.0" ]; then
            echo "FAIL: expected six 1.16.0"; exit 1
          fi
          echo "PASS"
