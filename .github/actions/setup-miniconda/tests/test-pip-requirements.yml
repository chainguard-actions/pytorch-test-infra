name: Test pip requirements file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.11"
          default-packages: "pip"
          pip-requirements-file: tests/fixtures/requirements.txt
      - name: Assert pip package installed in env
        run: |
          VER=$($CONDA_RUN python --version 2>&1)
          echo "python: $VER"
          case "$VER" in
            "Python 3.11"*) ;;
            *) echo "FAIL: expected Python 3.11"; exit 1 ;;
          esac
          SIX=$($CONDA_RUN python -c "import six; print(six.__version__)")
          echo "six: $SIX"
          if [ "$SIX" != "1.16.0" ]; then
            echo "FAIL: expected six 1.16.0"; exit 1
          fi
          echo "PASS"
