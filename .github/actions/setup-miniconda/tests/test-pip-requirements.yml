name: Test pip requirements file with custom python version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.10"
          default-packages: "wheel"
          pip-requirements-file: tests/fixtures/requirements.txt
      - name: Assert python version
        run: |
          VER=$($CONDA_RUN python --version 2>&1)
          echo "python: $VER"
          case "$VER" in
            "Python 3.10"*) ;;
            *) echo "FAIL: expected Python 3.10"; exit 1 ;;
          esac
          case "$CONDA_PREFIX" in
            "${RUNNER_TEMP}/conda_environment_"*) ;;
            *) echo "FAIL: unexpected CONDA_PREFIX $CONDA_PREFIX"; exit 1 ;;
          esac
          [ -d "${RUNNER_TEMP}/conda-python-3.10" ] || { echo "FAIL: base env missing"; exit 1; }
          echo "PASS"
      - name: Assert pip requirement installed
        run: |
          OUT=$($CONDA_RUN python -c "import six; print(six.__version__)")
          echo "six: $OUT"
          if [ "$OUT" != "1.16.0" ]; then
            echo "FAIL: expected six 1.16.0"; exit 1
          fi
          echo "PASS"
