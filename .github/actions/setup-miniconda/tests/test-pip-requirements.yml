name: Test pip requirements file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.10"
          default-packages: "wheel"
          pip-requirements-file: tests/fixtures/requirements.txt
      - name: Assert python version and pip package installed
        shell: bash
        run: |
          OUT="$($CONDA_RUN python --version 2>&1)"
          echo "python: $OUT"
          if ! echo "$OUT" | grep -q "Python 3.10"; then
            echo "FAIL: expected Python 3.10"
            exit 1
          fi
          V="$($CONDA_RUN python -c 'import six; print(six.__version__)' 2>&1)"
          echo "six: $V"
          if [ "$(echo "$V" | tail -1)" != "1.16.0" ]; then
            echo "FAIL: expected six 1.16.0"
            exit 1
          fi
          echo "PASS"
