name: Test pip requirements file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.9"
          default-packages: "pip"
          pip-requirements-file: tests/fixtures/requirements.txt
      - name: Assert pip requirement installed in cloned env
        run: |
          echo "CONDA_RUN=$CONDA_RUN"
          OUT=$($CONDA_RUN python -c "import six; print(six.__version__)" 2>&1)
          echo "six: $OUT"
          if [ "$(echo "$OUT" | tail -n1)" != "1.16.0" ]; then
            echo "FAIL: expected six 1.16.0"; exit 1
          fi
          echo "PASS"
