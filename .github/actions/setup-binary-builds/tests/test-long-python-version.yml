name: Test long python version is shortened in artifact name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: pytorch/test-infra
      REF: main
      PYTHON_VERSION: "3.11"
      GPU_ARCH_VERSION: cpu
      GPU_ARCH_TYPE: cpu
      PACKAGE_TYPE: wheel
      CHANNEL: nightly
      BUILD_VERSION: ""
      UPLOAD_TO_BASE_BUCKET: "no"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Point test-infra at the checkout location used by the action
        run: |
          rm -rf "$GITHUB_WORKSPACE/test-infra"
          ln -s pytorch/test-infra "$GITHUB_WORKSPACE/test-infra"
      - id: action
        uses: .
        with:
          repository: pytorch/test-infra
          ref: main
          submodules: "false"
          setup-miniconda: "true"
          python-version: "3.11.9"
          cuda-version: cu126
          arch: aarch64
      - name: Assert artifact name uses short python version
        run: |
          echo "ARTIFACT_NAME: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "pytorch_test-infra_main_3.11_cu126_aarch64" ]; then
            echo "FAIL: unexpected artifact name"
            exit 1
          fi
          echo "PASS"
      - name: Assert conda env created
        run: |
          echo "CONDA_ENV: $CONDA_ENV"
          if [ -z "$CONDA_ENV" ] || [ ! -d "$CONDA_ENV" ]; then
            echo "FAIL: CONDA_ENV missing"
            exit 1
          fi
          echo "PASS"
