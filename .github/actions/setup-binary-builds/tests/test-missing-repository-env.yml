name: Test failure when REPOSITORY/REF env are not set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actions/hello-world-javascript-action
          ref: main
          submodules: "false"
          python-version: "3.11"
          cuda-version: cpu
          arch: x86_64
      - name: Assert action failed and no artifact name was set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ARTIFACT_NAME: ${ARTIFACT_NAME:-}"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (REPOSITORY/REF unset under set -u)"
            exit 1
          fi
          if [ -n "${ARTIFACT_NAME:-}" ]; then
            echo "FAIL: ARTIFACT_NAME should not be set"
            exit 1
          fi
          echo "PASS"
