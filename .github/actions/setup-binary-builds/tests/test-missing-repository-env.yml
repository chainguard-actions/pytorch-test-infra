name: Test failure when REPOSITORY/REF env vars are not set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # No job-level REPOSITORY/REF: the "Set artifact name" step runs under
      # `set -u` and must abort on the unbound variable before any conda work.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: pytorch/test-infra
          ref: main
          submodules: "false"
          python-version: "3.11"
          cuda-version: cu124
          arch: x86_64
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when REPOSITORY/REF are unset"
            exit 1
          fi
          echo "PASS"
      - name: Assert ARTIFACT_NAME was not exported
        run: |
          echo "ARTIFACT_NAME: ${ARTIFACT_NAME:-}"
          if [ -n "${ARTIFACT_NAME:-}" ]; then
            echo "FAIL: ARTIFACT_NAME should not be set"
            exit 1
          fi
          echo "PASS"
