name: Test free-threaded Python 3.14t setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: actions/checkout
      REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake conda
        run: |
          if [ "$(id -u)" = "0" ]; then SUDO=""; else SUDO="sudo"; fi
          $SUDO cp "$GITHUB_WORKSPACE/tests/fixtures/fake-conda.sh" /usr/local/bin/conda
          $SUDO chmod +x /usr/local/bin/conda
          rm -f /tmp/fake-conda.log
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          submodules: "false"
          python-version: "3.14t"
          cuda-version: cpu
          arch: aarch64
      - name: Assert ARTIFACT_NAME keeps the t suffix
        run: |
          echo "ARTIFACT_NAME: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "actions_checkout_main_3.14t_cpu_aarch64" ]; then
            echo "FAIL: unexpected ARTIFACT_NAME"
            exit 1
          fi
          echo "PASS"
      - name: Assert freethreading conda create
        run: |
          cat /tmp/fake-conda.log
          LINE="$(grep "conda_environment_" /tmp/fake-conda.log | grep "conda create" || true)"
          echo "create line: $LINE"
          echo "$LINE" | grep -q "python=3.14 " || { echo "FAIL: expected python=3.14"; exit 1; }
          echo "$LINE" | grep -q "python-freethreading" || { echo "FAIL: expected python-freethreading"; exit 1; }
          echo "$LINE" | grep -q "openssl=3.5.6" || { echo "FAIL: expected openssl pin"; exit 1; }
          if echo "$LINE" | grep -q "conda-forge"; then echo "FAIL: unexpected conda-forge"; exit 1; fi
          echo "PASS"
