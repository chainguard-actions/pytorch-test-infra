name: Test basic CPU setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: pytorch/test-infra
      REF: main
      PACKAGE_NAME: torchvision
      GPU_ARCH_VERSION: cpu
      GPU_ARCH: cpu
      CHANNEL: nightly
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Stage pkg-helpers where the action expects them
        run: |
          set -euxo pipefail
          if [ ! -d "$GITHUB_WORKSPACE/tools/pkg-helpers" ]; then
            echo "FAIL: tools/pkg-helpers not found in workspace"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/test-infra/tools"
          rm -rf "$GITHUB_WORKSPACE/test-infra/tools/pkg-helpers"
          cp -r "$GITHUB_WORKSPACE/tools/pkg-helpers" "$GITHUB_WORKSPACE/test-infra/tools/pkg-helpers"
      - id: action
        uses: .
        with:
          repository: pytorch/test-infra
          ref: main
          submodules: "false"
          setup-miniconda: "true"
          python-version: "3.11.9"
          cuda-version: cpu
          arch: x86_64
      - name: Assert checkout landed in repository subdirectory
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/pytorch/test-infra/.git" ] && [ ! -f "$GITHUB_WORKSPACE/pytorch/test-infra/.git" ]; then
            echo "FAIL: repository not checked out to pytorch/test-infra"
            exit 1
          fi
          echo "PASS"
      - name: Assert ARTIFACT_NAME
        run: |
          echo "actual: ${ARTIFACT_NAME:-}"
          if [ "${ARTIFACT_NAME:-}" != "pytorch_test-infra_main_3.11_cpu_x86_64" ]; then
            echo "FAIL: expected 'pytorch_test-infra_main_3.11_cpu_x86_64'"
            exit 1
          fi
          echo "PASS"
      - name: Assert BUILD_ENV_FILE generated
        run: |
          echo "BUILD_ENV_FILE: ${BUILD_ENV_FILE:-}"
          if [ -z "${BUILD_ENV_FILE:-}" ] || [ ! -f "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing"
            exit 1
          fi
          cat "$BUILD_ENV_FILE"
          echo "PASS"
      - name: Assert conda build env created
        shell: bash -l {0}
        run: |
          echo "CONDA_ENV: ${CONDA_ENV:-}"
          echo "CONDA_RUN: ${CONDA_RUN:-}"
          if [ -z "${CONDA_ENV:-}" ] || [ ! -d "$CONDA_ENV" ]; then
            echo "FAIL: CONDA_ENV missing"
            exit 1
          fi
          case "${CONDA_RUN:-}" in
            "conda run --no-capture-output -p ${CONDA_ENV}") ;;
            *) echo "FAIL: unexpected CONDA_RUN"; exit 1 ;;
          esac
          VER=$(${CONDA_RUN} python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "python in env: $VER"
          if [ "$VER" != "3.11" ]; then
            echo "FAIL: expected python 3.11"
            exit 1
          fi
          echo "PASS"
