name: Test basic CPU binary build setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The action's "Set artifact name" step reads these from the env (callers set them)
      REPOSITORY: pytorch/vision
      REF: main
      PYTHON_VERSION: "3.11"
      CU_VERSION: cpu
      ARCH: x86_64
      PACKAGE_TYPE: wheel
      CHANNEL: nightly
      GPU_ARCH_VERSION: ""
      CONDA_PLUGINS_AUTO_ACCEPT_TOS: "yes"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action installs pkg-helpers from $GITHUB_WORKSPACE/test-infra/tools/pkg-helpers
      - name: Check out test-infra (provides tools/pkg-helpers)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          ref: main
          path: test-infra
      - id: action
        uses: .
        with:
          repository: pytorch/vision
          ref: main
          submodules: "false"
          setup-miniconda: "true"
          python-version: "3.11"
          cuda-version: cpu
          arch: x86_64
      - name: Assert repository checked out into its subdirectory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/pytorch/vision/setup.py" ]; then
            echo "FAIL: pytorch/vision not checked out"
            ls -la "$GITHUB_WORKSPACE/pytorch/vision" || true
            exit 1
          fi
          echo "PASS"
      - name: Assert ARTIFACT_NAME
        run: |
          echo "ARTIFACT_NAME: ${ARTIFACT_NAME:-}"
          if [ "${ARTIFACT_NAME:-}" != "pytorch_vision_main_3.11_cpu_x86_64" ]; then
            echo "FAIL: expected pytorch_vision_main_3.11_cpu_x86_64"
            exit 1
          fi
          echo "PASS"
      - name: Assert BUILD_ENV_FILE generated
        run: |
          echo "BUILD_ENV_FILE: ${BUILD_ENV_FILE:-}"
          if [ -z "${BUILD_ENV_FILE:-}" ] || [ ! -f "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing"
            exit 1
          fi
          cat "$BUILD_ENV_FILE"
          echo "PASS"
      - name: Assert conda build env created
        shell: bash -l {0}
        run: |
          echo "CONDA_ENV: ${CONDA_ENV:-}"
          echo "CONDA_RUN: ${CONDA_RUN:-}"
          if [ -z "${CONDA_ENV:-}" ] || [ ! -d "$CONDA_ENV" ]; then
            echo "FAIL: CONDA_ENV missing"
            exit 1
          fi
          if [ "${CONDA_RUN:-}" != "conda run --no-capture-output -p ${CONDA_ENV}" ]; then
            echo "FAIL: unexpected CONDA_RUN"
            exit 1
          fi
          PYV=$(${CONDA_RUN} python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "python in env: $PYV"
          if [ "$PYV" != "3.11" ]; then
            echo "FAIL: expected python 3.11"
            exit 1
          fi
          echo "PASS"
