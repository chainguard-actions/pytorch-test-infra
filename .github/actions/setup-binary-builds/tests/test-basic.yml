name: Test basic binary build setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Callers of this action provide REPOSITORY / REF in the environment
      REPOSITORY: pytorch/test-infra
      REF: main
      PACKAGE_TYPE: wheel
      GPU_ARCH_VERSION: cpu
      CHANNEL: nightly
      PLATFORM: linux
      BUILD_VERSION: 0.0.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check out test-infra (provides tools/pkg-helpers)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          ref: main
          path: test-infra
      - id: action
        uses: .
        with:
          repository: pytorch/test-infra
          ref: main
          submodules: "false"
          setup-miniconda: "true"
          python-version: "3.11"
          cuda-version: cpu
          arch: x86_64
      - name: Assert ARTIFACT_NAME
        run: |
          echo "ARTIFACT_NAME: ${ARTIFACT_NAME:-}"
          if [ "${ARTIFACT_NAME:-}" != "pytorch_test-infra_main_3.11_cpu_x86_64" ]; then
            echo "FAIL: unexpected ARTIFACT_NAME"
            exit 1
          fi
          echo "PASS"
      - name: Assert repository checked out
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/pytorch/test-infra/tools/pkg-helpers" ]; then
            echo "FAIL: repository not checked out at pytorch/test-infra"
            exit 1
          fi
          echo "PASS"
      - name: Assert BUILD_ENV_FILE generated
        run: |
          echo "BUILD_ENV_FILE: ${BUILD_ENV_FILE:-}"
          if [ -z "${BUILD_ENV_FILE:-}" ] || [ ! -f "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing"
            exit 1
          fi
          cat "$BUILD_ENV_FILE"
          echo "PASS"
      - name: Assert conda build environment
        shell: bash -l {0}
        run: |
          echo "CONDA_ENV: ${CONDA_ENV:-}"
          echo "CONDA_RUN: ${CONDA_RUN:-}"
          if [ -z "${CONDA_ENV:-}" ] || [ ! -d "$CONDA_ENV" ]; then
            echo "FAIL: CONDA_ENV missing"
            exit 1
          fi
          VER="$($CONDA_RUN python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "python in env: $VER"
          if [ "$VER" != "3.11" ]; then
            echo "FAIL: expected python 3.11"
            exit 1
          fi
          echo "PASS"
