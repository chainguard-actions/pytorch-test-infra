name: Test basic binary build setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The action's "Set artifact name" step reads REPOSITORY and REF from the
      # caller's environment (as upstream workflows provide them).
      REPOSITORY: pytorch/test-infra
      REF: main
      PACKAGE_TYPE: wheel
      CHANNEL: nightly
      CONDA_PLUGINS_AUTO_ACCEPT_TOS: "yes"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide test-infra checkout (needed for tools/pkg-helpers)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          ref: main
          path: test-infra
      - id: action
        uses: .
        with:
          repository: pytorch/test-infra
          ref: main
          submodules: "false"
          setup-miniconda: "true"
          python-version: "3.11"
          cuda-version: cpu
          arch: x86_64
      - name: Assert repository checked out into subdirectory
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/pytorch/test-infra/.git" ] && [ ! -f "$GITHUB_WORKSPACE/pytorch/test-infra/.git" ]; then
            echo "FAIL: pytorch/test-infra not checked out"
            exit 1
          fi
          echo "PASS"
      - name: Assert ARTIFACT_NAME
        run: |
          echo "ARTIFACT_NAME: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "pytorch_test-infra_main_3.11_cpu_x86_64" ]; then
            echo "FAIL: unexpected ARTIFACT_NAME"
            exit 1
          fi
          echo "PASS"
      - name: Assert BUILD_ENV_FILE generated
        run: |
          echo "BUILD_ENV_FILE: $BUILD_ENV_FILE"
          if [ -z "$BUILD_ENV_FILE" ] || [ ! -s "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing or empty"
            exit 1
          fi
          cat "$BUILD_ENV_FILE"
          echo "PASS"
      - name: Assert conda build environment
        shell: bash -l {0}
        run: |
          echo "CONDA_ENV: $CONDA_ENV"
          echo "CONDA_RUN: $CONDA_RUN"
          if [ -z "$CONDA_ENV" ] || [ ! -d "$CONDA_ENV" ]; then
            echo "FAIL: CONDA_ENV missing"
            exit 1
          fi
          if [ "$CONDA_RUN" != "conda run --no-capture-output -p ${CONDA_ENV}" ]; then
            echo "FAIL: unexpected CONDA_RUN"
            exit 1
          fi
          VER="$($CONDA_RUN python --version 2>&1)"
          echo "python: $VER"
          case "$VER" in
            *"Python 3.11"*) echo "PASS" ;;
            *) echo "FAIL: expected Python 3.11"; exit 1 ;;
          esac
