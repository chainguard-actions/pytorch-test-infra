name: Test basic binary build setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: pytorch/test-infra
      REF: main
      PYTHON_VERSION: "3.11"
      GPU_ARCH_VERSION: cpu
      GPU_ARCH_TYPE: cpu
      PACKAGE_TYPE: wheel
      CHANNEL: nightly
      BUILD_VERSION: ""
      UPLOAD_TO_BASE_BUCKET: "no"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Point test-infra at the checkout location used by the action
        run: |
          rm -rf "$GITHUB_WORKSPACE/test-infra"
          ln -s pytorch/test-infra "$GITHUB_WORKSPACE/test-infra"
      - id: action
        uses: .
        with:
          repository: pytorch/test-infra
          ref: main
          submodules: "false"
          setup-miniconda: "true"
          python-version: "3.11"
          cuda-version: cpu
          arch: x86_64
      - name: Assert repository checked out into subdirectory
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/pytorch/test-infra/tools/pkg-helpers" ]; then
            echo "FAIL: pkg-helpers not found in checkout"
            exit 1
          fi
          echo "PASS"
      - name: Assert artifact name
        run: |
          echo "ARTIFACT_NAME: $ARTIFACT_NAME"
          if [ "$ARTIFACT_NAME" != "pytorch_test-infra_main_3.11_cpu_x86_64" ]; then
            echo "FAIL: unexpected artifact name"
            exit 1
          fi
          echo "PASS"
      - name: Assert build env file and conda env
        run: |
          echo "BUILD_ENV_FILE: $BUILD_ENV_FILE"
          echo "CONDA_ENV: $CONDA_ENV"
          echo "CONDA_RUN: $CONDA_RUN"
          if [ -z "$BUILD_ENV_FILE" ] || [ ! -f "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing"
            exit 1
          fi
          if [ -z "$CONDA_ENV" ] || [ ! -d "$CONDA_ENV" ]; then
            echo "FAIL: CONDA_ENV missing"
            exit 1
          fi
          case "$CONDA_RUN" in
            "conda run --no-capture-output -p $CONDA_ENV") ;;
            *) echo "FAIL: unexpected CONDA_RUN"; exit 1 ;;
          esac
          echo "PASS"
