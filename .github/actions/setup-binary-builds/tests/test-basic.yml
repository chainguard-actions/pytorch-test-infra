name: Test basic binary build setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The action's "Set artifact name" and pkg-helpers steps read these from the job env
      REPOSITORY: actions/hello-world-javascript-action
      REF: main
      PYTHON_VERSION: "3.11"
      CU_VERSION: cpu
      GPU_ARCH_VERSION: ""
      ARCH: x86_64
      PACKAGE_TYPE: wheel
      CHANNEL: nightly
      UPLOAD_TO_BASE_BUCKET: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check out test-infra pkg-helpers (expected at $GITHUB_WORKSPACE/test-infra)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          ref: main
          path: test-infra
          sparse-checkout: tools/pkg-helpers
      - id: action
        uses: .
        with:
          repository: actions/hello-world-javascript-action
          ref: main
          submodules: "false"
          setup-miniconda: "true"
          python-version: "3.11"
          cuda-version: cpu
          arch: x86_64
      - name: Assert repository checked out into subdirectory
        run: |
          ls -la "$GITHUB_WORKSPACE/actions/hello-world-javascript-action" || true
          if [ ! -f "$GITHUB_WORKSPACE/actions/hello-world-javascript-action/action.yml" ]; then
            echo "FAIL: expected checked-out repository not found"
            exit 1
          fi
          echo "PASS"
      - name: Assert ARTIFACT_NAME
        run: |
          echo "actual: ${ARTIFACT_NAME:-}"
          EXPECTED="actions_hello-world-javascript-action_main_3.11_cpu_x86_64"
          if [ "${ARTIFACT_NAME:-}" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED'"
            exit 1
          fi
          echo "PASS"
      - name: Assert BUILD_ENV_FILE generated
        run: |
          echo "BUILD_ENV_FILE: ${BUILD_ENV_FILE:-}"
          if [ -z "${BUILD_ENV_FILE:-}" ] || [ ! -s "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE not set or empty"
            exit 1
          fi
          cat "$BUILD_ENV_FILE"
          echo "PASS"
      - name: Assert conda build environment created
        shell: bash -l {0}
        run: |
          echo "CONDA_ENV: ${CONDA_ENV:-}"
          echo "CONDA_RUN: ${CONDA_RUN:-}"
          if [ -z "${CONDA_ENV:-}" ] || [ ! -d "$CONDA_ENV" ]; then
            echo "FAIL: CONDA_ENV not set or missing"
            exit 1
          fi
          case "${CONDA_RUN:-}" in
            "conda run --no-capture-output -p ${CONDA_ENV}") ;;
            *) echo "FAIL: unexpected CONDA_RUN"; exit 1 ;;
          esac
          PYV=$(${CONDA_RUN} python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "python in env: $PYV"
          if [ "$PYV" != "3.11" ]; then
            echo "FAIL: expected python 3.11"
            exit 1
          fi
          echo "PASS"
