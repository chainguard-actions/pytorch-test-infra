name: Test basic binary build setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The action's "Set artifact name" step reads REPOSITORY and REF from the
      # caller's environment (callers set them at job level).
      REPOSITORY: octocat/Hello-World
      REF: master
      PACKAGE_TYPE: wheel
      GPU_ARCH_VERSION: cpu
      GPU_ARCH_TYPE: cpu
      CHANNEL: nightly
      BUILD_VERSION: 0.0.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide pkg-helpers at $GITHUB_WORKSPACE/test-infra
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pytorch/test-infra
          ref: main
          path: test-infra
      - id: action
        uses: .
        with:
          repository: octocat/Hello-World
          ref: master
          submodules: "false"
          setup-miniconda: "true"
          python-version: "3.11.9"
          cuda-version: cpu
          arch: x86_64
      - name: Assert repository checked out into subdirectory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/octocat/Hello-World/README" ]; then
            echo "FAIL: octocat/Hello-World/README not found"
            ls -la "$GITHUB_WORKSPACE/octocat/Hello-World" || true
            exit 1
          fi
          echo "PASS"
      - name: Assert ARTIFACT_NAME
        run: |
          echo "ARTIFACT_NAME: ${ARTIFACT_NAME:-}"
          if [ "${ARTIFACT_NAME:-}" != "octocat_Hello-World_master_3.11_cpu_x86_64" ]; then
            echo "FAIL: unexpected ARTIFACT_NAME"
            exit 1
          fi
          echo "PASS"
      - name: Assert build env file and conda env exported
        run: |
          echo "BUILD_ENV_FILE: ${BUILD_ENV_FILE:-}"
          echo "CONDA_ENV: ${CONDA_ENV:-}"
          echo "CONDA_RUN: ${CONDA_RUN:-}"
          if [ -z "${BUILD_ENV_FILE:-}" ] || [ ! -f "$BUILD_ENV_FILE" ]; then
            echo "FAIL: BUILD_ENV_FILE missing"
            exit 1
          fi
          if [ -z "${CONDA_ENV:-}" ] || [ ! -d "$CONDA_ENV" ]; then
            echo "FAIL: CONDA_ENV directory missing"
            exit 1
          fi
          if [ "${CONDA_RUN:-}" != "conda run --no-capture-output -p ${CONDA_ENV}" ]; then
            echo "FAIL: unexpected CONDA_RUN"
            exit 1
          fi
          echo "PASS"
      - name: Assert conda env python version
        shell: bash -l {0}
        run: |
          VER=$(conda run --no-capture-output -p "$CONDA_ENV" python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "python: $VER"
          if [ "$VER" != "3.11" ]; then
            echo "FAIL: expected python 3.11"
            exit 1
          fi
          echo "PASS"
