name: Test dry-run upload with results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture exists
        run: |
          test -f "$GITHUB_WORKSPACE/tests/fixtures/benchmark-results/results.json" || { echo "FAIL: fixture missing"; exit 1; }
          echo "PASS: fixture present"
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: ${{ github.workspace }}/tests/fixtures/benchmark-results
          benchmark-name: act-test-benchmark
          dry-run: 'true'
          github-token: ${{ github.token }}
      - name: Assert action ran (or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: dry-run upload succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow job lookup on sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert device env was detected
        run: |
          echo "DEVICE_NAME=${DEVICE_NAME:-<unset>}"
          if [ -n "${DEVICE_NAME:-}" ]; then
            case "$DEVICE_NAME" in
              cpu|arm64-cpu|cuda|rocm|hpu|xpu) echo "PASS: device name '$DEVICE_NAME'" ;;
              *) echo "FAIL: unexpected device name '$DEVICE_NAME'"; exit 1 ;;
            esac
          else
            echo "PASS: device detection did not run (earlier setup step failed)"
          fi
