name: Test dry-run upload with results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create benchmark results
        run: |
          mkdir -p "$RUNNER_TEMP/bench-results"
          cat > "$RUNNER_TEMP/bench-results/results.json" <<'EOF'
          [
            {
              "benchmark": {"name": "act-test", "mode": "inference", "dtype": "float32", "extra_info": {}},
              "model": {"name": "toy", "type": "test", "origins": ["local"]},
              "metric": {"name": "latency", "benchmark_values": [1.0, 2.0], "target_value": 0}
            }
          ]
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: ${{ runner.temp }}/bench-results
          benchmark-name: act-test
          dry-run: 'true'
          github-token: ${{ github.token }}
      - name: Assert action ran (or failed gracefully on the sentinel repo job-id lookup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: dry-run upload succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow job lookup on sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert venv was created by the action
        run: |
          if [ ! -d "$RUNNER_TEMP/benchmark-upload-venv" ]; then
            echo "FAIL: expected isolated venv at $RUNNER_TEMP/benchmark-upload-venv"
            exit 1
          fi
          echo "PASS"
