name: Test dry-run upload with results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare results dir
        run: |
          mkdir -p "$RUNNER_TEMP/benchmark-results"
          cat > "$RUNNER_TEMP/benchmark-results/results.json" <<'EOF'
          [
            {
              "benchmark": {"name": "test-bench", "mode": "inference", "extra_info": {}},
              "model": {"name": "dummy", "type": "test"},
              "metric": {"name": "latency", "benchmark_values": [1.0], "target_value": 0}
            }
          ]
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: ${{ runner.temp }}/benchmark-results
          benchmark-name: act-test
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: 'true'
      - name: Assert action ran (or failed gracefully on the sentinel repo job-id lookup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f "$RUNNER_TEMP/benchmark-results/results.json" ]; then
              echo "FAIL: results file missing after dry-run"
              exit 1
            fi
            echo "PASS: dry-run completed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
