name: Test nonexistent results dir is skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: ${{ runner.temp }}/does-not-exist
          dry-run: 'true'
          github-token: ${{ github.token }}
      - name: Assert action ran (or failed gracefully on the sentinel repo job-id lookup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: missing dir skipped without failure"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow job lookup on sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert device name was detected
        run: |
          echo "DEVICE_NAME=${DEVICE_NAME:-}"
          case "${DEVICE_NAME:-}" in
            cpu|arm64-cpu|cuda|rocm|hpu|xpu) echo "PASS" ;;
            *) echo "FAIL: unexpected DEVICE_NAME '${DEVICE_NAME:-}'"; exit 1 ;;
          esac
