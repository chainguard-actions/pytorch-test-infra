name: Test nonexistent results dir is skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: ${{ runner.temp }}/does-not-exist-dir
          dry-run: 'true'
          github-token: ${{ github.token }}
      - name: Assert action skipped or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -e "$RUNNER_TEMP/does-not-exist-dir" ]; then
              echo "FAIL: action unexpectedly created the results dir"
              exit 1
            fi
            echo "PASS: missing dir skipped without error"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo job-id lookup not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
