name: Test nonexistent results dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: ${{ runner.temp }}/does-not-exist
          dry-run: 'true'
          github-token: ${{ github.token }}
      - name: Assert action skipped (or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -e "$RUNNER_TEMP/does-not-exist" ]; then
            echo "FAIL: action should not create the results dir"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: missing dir skipped"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (job id lookup on sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
