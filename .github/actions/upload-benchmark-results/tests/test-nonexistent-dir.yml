name: Test nonexistent results dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: ${{ runner.temp }}/does-not-exist
          dry-run: 'true'
          if-no-files-found: ignore
          github-token: ${{ github.token }}
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: nonexistent dir skipped"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo job-id lookup / harness layout)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
