name: Test nonexistent results directory is skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: ${{ runner.temp }}/does-not-exist-benchmarks
          dry-run: 'true'
          if-no-files-found: ignore
          github-token: ${{ github.token }}
      - name: Assert action skipped (or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: missing directory was skipped"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow job lookup on sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert no results dir was created
        run: |
          if [ -d "$RUNNER_TEMP/does-not-exist-benchmarks" ]; then
            echo "FAIL: action should not create the results directory"
            exit 1
          fi
          echo "PASS"
