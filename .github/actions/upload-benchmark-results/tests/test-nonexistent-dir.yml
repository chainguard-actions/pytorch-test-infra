name: Test nonexistent results directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: /tmp/does-not-exist-benchmark-results
          if-no-files-found: ignore
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action ran (skipped upload, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -d /tmp/does-not-exist-benchmark-results ]; then
            echo "FAIL: action should not create the results dir"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: missing dir skipped"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo job lookup / harness layout)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
