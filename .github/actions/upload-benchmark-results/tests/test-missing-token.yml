name: Test missing github-token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare results dir
        run: |
          mkdir -p "$RUNNER_TEMP/bench-results"
          echo '[]' > "$RUNNER_TEMP/bench-results/empty.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: ${{ runner.temp }}/bench-results
          dry-run: 'true'
          github-token: ''
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when github-token is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert device detection ran before the token check
        run: |
          echo "DEVICE_NAME=${DEVICE_NAME:-<unset>}"
          echo "VIRTUAL_ENV=${VIRTUAL_ENV:-<unset>}"
          if [ -z "${DEVICE_NAME:-}" ]; then
            echo "FAIL: DEVICE_NAME was not exported by the action"
            exit 1
          fi
          case "$DEVICE_NAME" in
            cpu|arm64-cpu|cuda|rocm|hpu|xpu) ;;
            *) echo "FAIL: unexpected DEVICE_NAME '$DEVICE_NAME'"; exit 1 ;;
          esac
          if [ -z "${VIRTUAL_ENV:-}" ] || [ ! -d "$VIRTUAL_ENV" ]; then
            echo "FAIL: VIRTUAL_ENV not exported or venv dir missing"
            exit 1
          fi
          echo "PASS"
