name: Test missing github-token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create results dir
        run: |
          mkdir -p "$RUNNER_TEMP/bench-results"
          echo '[]' > "$RUNNER_TEMP/bench-results/results.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: ${{ runner.temp }}/bench-results
          github-token: ''
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when github-token is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert device name (if propagated) is a CPU value
        run: |
          echo "DEVICE_NAME: ${DEVICE_NAME:-<unset>}"
          if [ -n "${DEVICE_NAME:-}" ]; then
            case "$DEVICE_NAME" in
              cpu|arm64-cpu|cuda|rocm|hpu|xpu) echo "PASS" ;;
              *) echo "FAIL: unexpected DEVICE_NAME '$DEVICE_NAME'"; exit 1 ;;
            esac
          else
            echo "PASS: DEVICE_NAME not propagated"
          fi
