name: Test missing github-token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create benchmark results
        run: |
          mkdir -p "$RUNNER_TEMP/bench-results"
          echo '[{"benchmark":{"name":"test"},"model":{"name":"m"},"metric":{"name":"latency","benchmark_values":[1.0]}}]' > "$RUNNER_TEMP/bench-results/results.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          benchmark-results-dir: ${{ runner.temp }}/bench-results
          dry-run: 'true'
          github-token: ''
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail without a github-token"
            exit 1
          fi
          echo "PASS"
