name: Test failure when nightly branch is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local bare remote with only main
        run: |
          set -euo pipefail
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          git config --global init.defaultBranch main
          rm -rf /tmp/remote.git /tmp/seed
          git init --bare /tmp/remote.git
          git init /tmp/seed
          cd /tmp/seed
          echo "hello main" > file.txt
          git add file.txt
          git commit -m "main commit"
          git push /tmp/remote.git HEAD:refs/heads/main
          git config --global url."file:///tmp/remote.git".insteadOf "https://github.com/example-org/nightly-test"
          git config --global --add url."file:///tmp/remote.git".insteadOf "https://github.com/example-org/nightly-test.git"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: example-org/nightly-test
          ref: main
          path: nightly-checkout
      - name: Assert action failed and no nightly branch was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when nightly branch is missing"
            exit 1
          fi
          if git --git-dir=/tmp/remote.git rev-parse --verify -q refs/heads/nightly; then
            echo "FAIL: nightly branch should not exist"
            exit 1
          fi
          echo "PASS"
