name: Test checkout into path, fails when nightly branch is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # actions/checkout has no "nightly" branch, so the action checks out the
      # repo into the subdirectory, configures git, and then fails at
      # "git fetch origin nightly" -- before any push can happen.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: actions/checkout
          ref: main
          path: nightly-target
      - name: Assert checkout landed in the requested path
        run: |
          ls -la "$GITHUB_WORKSPACE/nightly-target" || true
          if [ ! -f "$GITHUB_WORKSPACE/nightly-target/action.yml" ]; then
            echo "FAIL: expected nightly-target/action.yml to exist"
            exit 1
          fi
          BRANCH="$(git -C "$GITHUB_WORKSPACE/nightly-target" rev-parse --abbrev-ref HEAD)"
          echo "branch: $BRANCH"
          if [ "$BRANCH" != "main" ]; then
            echo "FAIL: expected branch 'main'"
            exit 1
          fi
          echo "PASS"
      - name: Assert git identity was configured globally
        run: |
          EMAIL="$(git config --global user.email || true)"
          NAME="$(git config --global user.name || true)"
          echo "email: $EMAIL name: $NAME"
          if [ "$EMAIL" != "pytorchbot@pytorch.com" ] || [ "$NAME" != "pytorchbot" ]; then
            echo "FAIL: expected pytorchbot git identity"
            exit 1
          fi
          echo "PASS"
      - name: Assert action failed because nightly branch is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no nightly branch on remote)"
            exit 1
          fi
          echo "PASS"
