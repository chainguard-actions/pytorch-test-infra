name: Test basic nightly commit creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a local remote with main and nightly branches
        run: |
          set -euo pipefail
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          rm -rf /tmp/nightly-basic-src /tmp/nightly-basic-remote.git
          git init --bare /tmp/nightly-basic-remote.git
          git init /tmp/nightly-basic-src
          cd /tmp/nightly-basic-src
          git checkout -b main
          echo "hello main" > README.md
          git add README.md
          git commit -m "main commit 1"
          echo "more" > file2.txt
          git add file2.txt
          git commit -m "main commit 2"
          git checkout --orphan nightly
          git rm -rf . >/dev/null
          echo "old nightly" > NIGHTLY.md
          git add NIGHTLY.md
          git commit -m "old nightly"
          git push /tmp/nightly-basic-remote.git main nightly
          echo "OLD_NIGHTLY=$(git rev-parse nightly)" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$(git rev-parse main)" >> "$GITHUB_ENV"
          echo "MAIN_TREE=$(git rev-parse 'main^{tree}')" >> "$GITHUB_ENV"
          # Redirect the GitHub URL for the fake repo to the local bare remote
          git config --global url."file:///tmp/nightly-basic-remote.git".insteadOf "https://github.com/test-owner/nightly-basic"

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          repository: test-owner/nightly-basic
          ref: main
          path: nightly-basic-target

      - name: Assert checkout landed in the requested path
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/nightly-basic-target/README.md" ]; then
            echo "FAIL: README.md not found in checkout path"
            exit 1
          fi
          echo "PASS"

      - name: Assert nightly branch was updated correctly
        run: |
          set -euo pipefail
          cd /tmp/nightly-basic-remote.git
          NEW_NIGHTLY=$(git rev-parse refs/heads/nightly)
          echo "old nightly: $OLD_NIGHTLY"
          echo "new nightly: $NEW_NIGHTLY"
          if [ "$NEW_NIGHTLY" = "$OLD_NIGHTLY" ]; then
            echo "FAIL: nightly was not updated"
            exit 1
          fi
          PARENT=$(git rev-parse "${NEW_NIGHTLY}^")
          echo "parent: $PARENT"
          if [ "$PARENT" != "$OLD_NIGHTLY" ]; then
            echo "FAIL: new nightly parent should be old nightly"
            exit 1
          fi
          TREE=$(git rev-parse "${NEW_NIGHTLY}^{tree}")
          echo "tree: $TREE (expected $MAIN_TREE)"
          if [ "$TREE" != "$MAIN_TREE" ]; then
            echo "FAIL: nightly tree does not match main tree"
            exit 1
          fi
          MSG=$(git log -1 --format=%s "$NEW_NIGHTLY")
          echo "message: $MSG"
          if ! echo "$MSG" | grep -qE "^[0-9]{4}-[0-9]{2}-[0-9]{2} nightly release \(${MAIN_SHA}\)$"; then
            echo "FAIL: unexpected commit message"
            exit 1
          fi
          AUTHOR=$(git log -1 --format='%an <%ae>' "$NEW_NIGHTLY")
          echo "author: $AUTHOR"
          if [ "$AUTHOR" != "pytorchbot <pytorchbot@pytorch.com>" ]; then
            echo "FAIL: unexpected author"
            exit 1
          fi
          MAIN_NOW=$(git rev-parse refs/heads/main)
          if [ "$MAIN_NOW" != "$MAIN_SHA" ]; then
            echo "FAIL: main should be untouched"
            exit 1
          fi
          echo "PASS"
