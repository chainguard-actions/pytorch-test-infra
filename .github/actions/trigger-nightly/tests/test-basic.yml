name: Test basic usage (checkout into subdirectory, push not permitted)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: actions/checkout
          ref: main
          path: nightly-target
      - name: Assert repository was checked out into the requested path
        run: |
          ls -la "$GITHUB_WORKSPACE/nightly-target" || true
          if [ ! -f "$GITHUB_WORKSPACE/nightly-target/action.yml" ]; then
            echo "FAIL: expected nightly-target/action.yml to exist"
            exit 1
          fi
          if [ ! -d "$GITHUB_WORKSPACE/nightly-target/.git" ]; then
            echo "FAIL: nightly-target is not a git repository"
            exit 1
          fi
          echo "PASS: checkout landed in nightly-target"
      - name: Assert git identity was configured by the action
        run: |
          EMAIL="$(git config --global user.email || true)"
          NAME="$(git config --global user.name || true)"
          echo "email: $EMAIL name: $NAME"
          if [ "$EMAIL" != "pytorchbot@pytorch.com" ] || [ "$NAME" != "pytorchbot" ]; then
            echo "FAIL: expected pytorchbot git identity"
            exit 1
          fi
          echo "PASS"
      - name: Assert nightly push could not succeed on a repo we do not own
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no nightly branch / no push permission), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed at the nightly fetch/push stage as expected"
