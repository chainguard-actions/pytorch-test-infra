name: Test basic nightly commit creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up a local fake remote (redirected via url.insteadOf)
        run: |
          set -e
          rm -rf /tmp/fake-remote /tmp/fake-remote.git /tmp/seed
          git init --bare /tmp/fake-remote
          ln -s /tmp/fake-remote /tmp/fake-remote.git
          git init /tmp/seed
          cd /tmp/seed
          git config user.email "seed@example.com"
          git config user.name "Seed"
          git checkout -b main
          echo "nightly base" > file.txt
          git add file.txt
          git commit -m "nightly base"
          git push /tmp/fake-remote HEAD:refs/heads/nightly
          echo "main content" > file.txt
          echo "extra" > extra.txt
          git add -A
          git commit -m "main change"
          git push /tmp/fake-remote HEAD:refs/heads/main
          # Redirect the GitHub URL that actions/checkout will use to the local bare repo
          git config --global url."file:///tmp/fake-remote".insteadOf "https://github.com/test-owner/test-repo"
          echo "MAIN_SHA=$(git -C /tmp/fake-remote rev-parse refs/heads/main)" >> "$GITHUB_ENV"
          echo "OLD_NIGHTLY_SHA=$(git -C /tmp/fake-remote rev-parse refs/heads/nightly)" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          repository: test-owner/test-repo
          ref: main
          path: nightly-checkout
      - name: Assert checkout landed in the subdirectory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/nightly-checkout/extra.txt" ]; then
            echo "FAIL: expected nightly-checkout/extra.txt"
            exit 1
          fi
          echo "PASS"
      - name: Assert nightly branch was updated correctly
        run: |
          set -e
          NEW_NIGHTLY=$(git -C /tmp/fake-remote rev-parse refs/heads/nightly)
          echo "old nightly: $OLD_NIGHTLY_SHA"
          echo "new nightly: $NEW_NIGHTLY"
          echo "main: $MAIN_SHA"
          if [ "$NEW_NIGHTLY" = "$OLD_NIGHTLY_SHA" ]; then
            echo "FAIL: nightly was not updated"
            exit 1
          fi
          PARENT=$(git -C /tmp/fake-remote rev-parse "${NEW_NIGHTLY}^")
          if [ "$PARENT" != "$OLD_NIGHTLY_SHA" ]; then
            echo "FAIL: new nightly parent '$PARENT' is not old nightly"
            exit 1
          fi
          NEW_TREE=$(git -C /tmp/fake-remote rev-parse "${NEW_NIGHTLY}^{tree}")
          MAIN_TREE=$(git -C /tmp/fake-remote rev-parse "${MAIN_SHA}^{tree}")
          if [ "$NEW_TREE" != "$MAIN_TREE" ]; then
            echo "FAIL: nightly tree differs from main tree"
            exit 1
          fi
          MSG=$(git -C /tmp/fake-remote log -1 --format=%B "$NEW_NIGHTLY")
          echo "message: $MSG"
          if ! echo "$MSG" | grep -qE "^[0-9]{4}-[0-9]{2}-[0-9]{2} nightly release \(${MAIN_SHA}\)"; then
            echo "FAIL: unexpected commit message"
            exit 1
          fi
          AUTHOR=$(git -C /tmp/fake-remote log -1 --format='%an <%ae>' "$NEW_NIGHTLY")
          echo "author: $AUTHOR"
          if [ "$AUTHOR" != "pytorchbot <pytorchbot@pytorch.com>" ]; then
            echo "FAIL: unexpected author"
            exit 1
          fi
          echo "PASS"
