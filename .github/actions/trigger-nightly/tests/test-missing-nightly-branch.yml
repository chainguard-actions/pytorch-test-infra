name: Test failure when nightly branch is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up a local fake remote without a nightly branch
        run: |
          set -e
          rm -rf /tmp/fake-remote2 /tmp/fake-remote2.git /tmp/seed2
          git init --bare /tmp/fake-remote2
          ln -s /tmp/fake-remote2 /tmp/fake-remote2.git
          git init /tmp/seed2
          cd /tmp/seed2
          git config user.email "seed@example.com"
          git config user.name "Seed"
          git checkout -b main
          echo "main content" > file.txt
          git add file.txt
          git commit -m "main"
          git push /tmp/fake-remote2 HEAD:refs/heads/main
          git config --global url."file:///tmp/fake-remote2".insteadOf "https://github.com/test-owner/no-nightly-repo"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: test-owner/no-nightly-repo
          ref: main
          path: no-nightly-checkout
      - name: Assert action failed and no nightly branch was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when nightly branch is missing"
            exit 1
          fi
          if git -C /tmp/fake-remote2 rev-parse --verify -q refs/heads/nightly; then
            echo "FAIL: nightly branch should not exist"
            exit 1
          fi
          echo "PASS"
