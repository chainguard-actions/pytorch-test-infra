name: Test failure when nightly branch is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a local fake remote with only a main branch
        shell: bash
        run: |
          set -euo pipefail
          REMOTE=/tmp/fake-remote/test-owner/test-repo
          rm -rf /tmp/fake-remote /tmp/seed
          mkdir -p "$(dirname "$REMOTE")"
          git init --bare "$REMOTE"
          git init /tmp/seed
          cd /tmp/seed
          git config user.email "seed@example.com"
          git config user.name "Seed"
          git checkout -b main
          echo base > file.txt
          git add file.txt
          git commit -m "initial"
          git push "$REMOTE" main:refs/heads/main
          git --git-dir="$REMOTE" symbolic-ref HEAD refs/heads/main
          git config --global url."file:///tmp/fake-remote/".insteadOf "https://github.com/"
          echo "REMOTE=$REMOTE" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: test-owner/test-repo
          ref: main
          path: nightly-checkout

      - name: Assert action failed and no nightly branch was created
        shell: bash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when nightly branch is missing"
            exit 1
          fi
          if git --git-dir="$REMOTE" rev-parse --verify -q refs/heads/nightly; then
            echo "FAIL: nightly branch unexpectedly exists"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup git config
        if: always()
        shell: bash
        run: git config --global --unset-all url."file:///tmp/fake-remote/".insteadOf || true
