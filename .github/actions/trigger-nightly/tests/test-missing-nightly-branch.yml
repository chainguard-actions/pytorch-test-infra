name: Test failure when nightly branch is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create local fake remote with only a main branch
        run: |
          set -euo pipefail
          REMOTE_ROOT=/tmp/fake-remote
          rm -rf "$REMOTE_ROOT" /tmp/seed
          mkdir -p "$REMOTE_ROOT/fake-owner"
          git init --bare "$REMOTE_ROOT/fake-owner/fake-repo"
          ln -s fake-repo "$REMOTE_ROOT/fake-owner/fake-repo.git"
          git init /tmp/seed
          cd /tmp/seed
          git config user.email "seed@example.com"
          git config user.name "Seed"
          git checkout -b main
          echo "main content" > main.txt
          git add main.txt
          git commit -m "main commit"
          git push "$REMOTE_ROOT/fake-owner/fake-repo" main
          git -C "$REMOTE_ROOT/fake-owner/fake-repo" symbolic-ref HEAD refs/heads/main
          git config --global url."file://$REMOTE_ROOT/".insteadOf "https://github.com/"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: fake-owner/fake-repo
          ref: main
          path: nightly-target
      - name: Assert action failed and no nightly branch was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          git config --global --unset-all url."file:///tmp/fake-remote/".insteadOf || true
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when nightly branch does not exist"
            exit 1
          fi
          if git -C /tmp/fake-remote/fake-owner/fake-repo rev-parse --verify -q refs/heads/nightly >/dev/null; then
            echo "FAIL: nightly branch should not have been created"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/nightly-target/main.txt" ]; then
            echo "FAIL: checkout step should have succeeded before the failure"
            exit 1
          fi
          echo "PASS"
