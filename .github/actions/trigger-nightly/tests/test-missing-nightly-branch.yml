name: Test failure when nightly branch is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a local fake "GitHub" remote with only a main branch
        run: |
          set -euo pipefail
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          rm -rf /tmp/fakegh /tmp/seed
          mkdir -p /tmp/fakegh/fake-owner
          git init --bare /tmp/fakegh/fake-owner/fake-repo
          ln -s /tmp/fakegh/fake-owner/fake-repo /tmp/fakegh/fake-owner/fake-repo.git
          git init /tmp/seed
          cd /tmp/seed
          git checkout -b main
          echo "hello main" > file.txt
          git add file.txt
          git commit -m "main commit"
          git push /tmp/fakegh/fake-owner/fake-repo main:refs/heads/main
          git config --global url."file:///tmp/fakegh/".insteadOf "https://github.com/"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: fake-owner/fake-repo
          ref: main
          path: nightly-target

      - name: Assert action failed and no nightly branch was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when nightly branch is missing"
            exit 1
          fi
          if git -C /tmp/fakegh/fake-owner/fake-repo rev-parse --verify -q refs/heads/nightly; then
            echo "FAIL: nightly branch unexpectedly exists"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup git url rewrite
        if: always()
        run: git config --global --unset-all url."file:///tmp/fakegh/".insteadOf || true
