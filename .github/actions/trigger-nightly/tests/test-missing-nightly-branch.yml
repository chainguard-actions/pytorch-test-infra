name: Test failure when nightly branch does not exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a local remote without a nightly branch
        run: |
          set -euo pipefail
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          rm -rf /tmp/nightly-miss-src /tmp/nightly-miss-remote.git
          git init --bare /tmp/nightly-miss-remote.git
          git init /tmp/nightly-miss-src
          cd /tmp/nightly-miss-src
          git checkout -b main
          echo "main" > README.md
          git add README.md
          git commit -m "main commit"
          git push /tmp/nightly-miss-remote.git main
          git config --global url."file:///tmp/nightly-miss-remote.git".insteadOf "https://github.com/test-owner/nightly-miss"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: test-owner/nightly-miss
          ref: main
          path: nightly-miss-target

      - name: Assert action failed and no nightly branch was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when nightly branch is missing"
            exit 1
          fi
          if git --git-dir=/tmp/nightly-miss-remote.git rev-parse --verify -q refs/heads/nightly; then
            echo "FAIL: nightly branch should not have been created"
            exit 1
          fi
          echo "PASS"
