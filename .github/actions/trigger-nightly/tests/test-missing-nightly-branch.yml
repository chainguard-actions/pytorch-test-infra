name: Test failure when repository has no nightly branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Redirect git pushes to a local path (never push to GitHub)
        run: |
          rm -rf /tmp/fake-github
          mkdir -p /tmp/fake-github
          git config --global url."/tmp/fake-github/".pushInsteadOf "https://github.com/"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: actions/checkout
          ref: main
          path: no-nightly-checkout
      - name: Assert action failed and nothing was pushed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because origin has no nightly branch"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/no-nightly-checkout/action.yml" ]; then
            echo "FAIL: checkout into path did not happen before failure"
            exit 1
          fi
          if [ -n "$(ls -A /tmp/fake-github 2>/dev/null)" ]; then
            echo "FAIL: something was pushed"
            exit 1
          fi
          echo "PASS"
