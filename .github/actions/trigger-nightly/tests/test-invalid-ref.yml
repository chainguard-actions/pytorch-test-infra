name: Test invalid ref fails at checkout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: actions/checkout
          ref: this-branch-does-not-exist-xyz-123
          path: invalid-ref-target
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent ref"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/invalid-ref-target/action.yml" ]; then
            echo "FAIL: checkout should not have produced files"
            exit 1
          fi
          echo "PASS"
