name: Test ref input pointing at a tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: actions/checkout
          ref: v4.1.0
          path: tagged-target
      - name: Assert the requested tag was checked out
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tagged-target/action.yml" ]; then
            echo "FAIL: expected tagged-target/action.yml to exist"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/tagged-target"
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse 'v4.1.0^{commit}' 2>/dev/null || true)"
          echo "HEAD: $HEAD_SHA tag: $TAG_SHA"
          if [ -z "$TAG_SHA" ] || [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "FAIL: HEAD does not match tag v4.1.0"
            exit 1
          fi
          echo "PASS"
      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure at nightly fetch/push stage, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
