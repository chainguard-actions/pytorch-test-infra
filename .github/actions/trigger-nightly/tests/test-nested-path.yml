name: Test nested checkout path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: actions/checkout
          ref: main
          path: build/nested/repo
      - name: Assert checkout into nested path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -d "$GITHUB_WORKSPACE/build/nested/repo/.git" ]; then
            echo "FAIL: nested path is not a git checkout"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/build/nested/repo/action.yml" ]; then
            echo "FAIL: expected action.yml in nested checkout"
            exit 1
          fi
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          EMAIL="$(git config --global user.email || true)"
          echo "email: $EMAIL"
          if [ "$EMAIL" != "pytorchbot@pytorch.com" ]; then
            echo "FAIL: nightly commit step did not run in nested path"
            exit 1
          fi
          echo "PASS"
