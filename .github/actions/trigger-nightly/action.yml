name: Trigger nightly builds

inputs:
  token:
    description: GitHub token
    required: true
  repository:
    required: true
    description: 'Which repo to checkout'
    default: false
  ref:
    description: Branch to cut from
    required: true
  path:
    description: Path to use for checkout
    required: true


runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ inputs.ref }}
        repository: ${{ inputs.repository }}
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}
    - name: Create nightly commit
      shell: bash
      env:
        PATH_INPUT: ${{ inputs.path }}
      run: |
        pushd "$PATH_INPUT"
        git config --global user.email "pytorchbot@pytorch.com"
        git config --global user.name "pytorchbot"
        git fetch origin nightly
        HEAD_COMMIT_HASH=$(git rev-parse HEAD)
        NIGHTLY_DATE=$(date +"%Y-%m-%d")
        # shellcheck disable=SC1083
        NIGHTLY_RELEASE_COMMIT=$(git commit-tree -p FETCH_HEAD HEAD^{tree} -m "${NIGHTLY_DATE} nightly release (${HEAD_COMMIT_HASH})")
        # shellcheck disable=SC1083
        git push -f origin "${NIGHTLY_RELEASE_COMMIT}:nightly"
        popd
