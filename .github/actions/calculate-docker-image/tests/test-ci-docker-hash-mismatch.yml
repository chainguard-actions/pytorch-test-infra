name: Test ci-docker-hash mismatch fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install fake aws and docker
        run: |
          FAKEBIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$FAKEBIN"
          printf '#!/bin/sh\necho "fake aws $*" >&2\necho fake-token\nexit 0\n' > "$FAKEBIN/aws"
          printf '#!/bin/sh\necho "fake docker $*" >&2\nexit 0\n' > "$FAKEBIN/docker"
          chmod +x "$FAKEBIN/aws" "$FAKEBIN/docker"
          echo "$FAKEBIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image-name: my-image
          docker-build-dir: tests/fixtures/docker
          repo-name: myrepo
          ci-docker-hash: 0000000000000000000000000000000000000000
      - name: Assert action failed on hash mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "outcome: $OUTCOME"
          echo "docker-image: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on ci-docker-hash mismatch"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: no docker-image output expected on mismatch"
            exit 1
          fi
          echo "PASS"
