name: Test ci-docker-hash mismatch fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image-name: myimage
          docker-build-dir: tests/fixtures/docker-build
          repo-name: myrepo
          docker-registry: registry.example.com
          always-rebuild: "true"
          ci-docker-hash: 0000000000000000000000000000000000000000
      - name: Assert action failed on hash mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on ci-docker-hash mismatch"
            exit 1
          fi
          if [ -f /tmp/calc-docker-build-args.txt ]; then
            echo "FAIL: build script should not have run"
            exit 1
          fi
          echo "PASS"
