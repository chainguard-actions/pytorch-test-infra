name: Test ci-docker-hash mismatch fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws and docker
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/aws" <<'EOF'
          #!/bin/sh
          echo "fake-password"
          exit 0
          EOF
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/bin/sh
          if [ "$1" = "login" ]; then cat >/dev/null; fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/aws" "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image-name: my-image
          docker-build-dir: tests/fixtures/docker
          docker-registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
          repo-name: pytorch
          ci-docker-hash: 0000000000000000000000000000000000000000
      - name: Assert action failed on hash mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "outcome: $OUTCOME"
          echo "docker-image: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on ci-docker-hash mismatch"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: docker-image should not be set on mismatch"
            exit 1
          fi
          echo "PASS"
