name: Test push with custom registry disabled (skip path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker-image-name: my-image:custom-tag
          use-custom-docker-registry: "false"
          push: "true"
          force-push: "true"
          repo-name: test-repo
      - name: Assert image passed through unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "my-image:custom-tag" ]; then
            echo "FAIL: expected 'my-image:custom-tag'"
            exit 1
          fi
          echo "PASS"
