name: Test push input with missing build dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker-image-name: "my-image:custom-tag"
          docker-build-dir: nonexistent/docker/dir
          push: "true"
          force-push: "true"
      - name: Assert image name returned unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "my-image:custom-tag" ]; then
            echo "FAIL: expected 'my-image:custom-tag'"
            exit 1
          fi
          echo "PASS"
