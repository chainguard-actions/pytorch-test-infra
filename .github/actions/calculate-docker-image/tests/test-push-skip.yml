name: Test push input with no build script (skip path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker-image-name: pytorch-linux-jammy-py3-push
          docker-build-dir: does-not-exist/docker
          repo-name: pytorch
          push: "true"
          force-push: "true"
      - name: Assert image name passed through and nothing pushed
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "pytorch-linux-jammy-py3-push" ]; then
            echo "FAIL: expected 'pytorch-linux-jammy-py3-push'"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/fake-build-args.txt" ]; then
            echo "FAIL: build script should not have run"
            exit 1
          fi
          echo "PASS"
