name: Test push input with custom registry disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker-image-name: pytorch-linux-jammy-push-test
          docker-build-dir: this-dir-does-not-exist
          use-custom-docker-registry: "false"
          repo-name: myrepo
          push: "true"
          force-push: "true"
      - name: Assert image name returned unchanged and no push attempted
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "pytorch-linux-jammy-push-test" ]; then
            echo "FAIL: expected 'pytorch-linux-jammy-push-test'"
            exit 1
          fi
          echo "PASS"
