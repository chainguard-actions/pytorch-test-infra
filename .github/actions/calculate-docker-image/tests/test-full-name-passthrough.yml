name: Test full ECR image name passthrough
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws and docker CLIs
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/aws <<'EOF'
          #!/bin/sh
          echo "fake-password"
          EOF
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo "docker $*" >> /tmp/fake-docker.log
          exit 0
          EOF
          chmod +x /tmp/fakebin/aws /tmp/fakebin/docker
          echo /tmp/fakebin >> "$GITHUB_PATH"
          rm -f /tmp/fake-build-args.txt /tmp/fake-docker.log
      - id: action
        uses: .
        with:
          docker-image-name: 308535385114.dkr.ecr.us-east-1.amazonaws.com/myrepo/test-image:abc123
          docker-build-dir: tests/fixtures/docker
          repo-name: myrepo
      - name: Assert image passed through
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "308535385114.dkr.ecr.us-east-1.amazonaws.com/myrepo/test-image:abc123" ]; then
            echo "FAIL: expected full name unchanged"
            exit 1
          fi
          if [ -f /tmp/fake-build-args.txt ]; then
            echo "FAIL: build should be skipped when image exists"
            exit 1
          fi
          echo "PASS"
