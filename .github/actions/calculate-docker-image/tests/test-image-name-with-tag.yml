name: Test image name containing a tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws and docker CLIs
        run: |
          mkdir -p "$HOME/fakebin"
          cat > "$HOME/fakebin/aws" <<'EOF'
          #!/bin/sh
          echo "fake-password"
          exit 0
          EOF
          cat > "$HOME/fakebin/docker" <<'EOF'
          #!/bin/sh
          echo "fake docker $*" >&2
          case "$1" in
            login) cat >/dev/null; exit 0 ;;
            manifest) echo '{}'; exit 0 ;;
          esac
          exit 0
          EOF
          chmod +x "$HOME/fakebin/aws" "$HOME/fakebin/docker"
          echo "$HOME/fakebin" >> "$GITHUB_PATH"
      - name: Compute expected hash
        id: hash
        run: echo "hash=$(git rev-parse HEAD:tests/fixtures/docker)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          docker-image-name: my-image:rocm
          docker-build-dir: tests/fixtures/docker
          repo-name: myrepo
      - name: Assert tag from name used as prefix
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          EXPECTED="308535385114.dkr.ecr.us-east-1.amazonaws.com/myrepo/my-image:rocm-${HASH}"
          echo "actual:   $ACTUAL"
          echo "expected: $EXPECTED"
          if [ -z "$HASH" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL"
            exit 1
          fi
          echo "PASS"
