name: Test full ECR image name passthrough
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install fake aws and docker (image already exists)
        run: |
          FAKEBIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$FAKEBIN"
          printf '#!/bin/sh\necho "fake aws $*" >&2\necho fake-token\nexit 0\n' > "$FAKEBIN/aws"
          printf '#!/bin/sh\necho "fake docker $*" >&2\nexit 0\n' > "$FAKEBIN/docker"
          chmod +x "$FAKEBIN/aws" "$FAKEBIN/docker"
          echo "$FAKEBIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          docker-image-name: 308535385114.dkr.ecr.us-east-1.amazonaws.com/myrepo/my-image:abc123
          docker-build-dir: tests/fixtures/docker
          repo-name: myrepo
      - name: Assert full name passed through
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "308535385114.dkr.ecr.us-east-1.amazonaws.com/myrepo/my-image:abc123" ]; then
            echo "FAIL"
            exit 1
          fi
          echo "PASS"
