name: Test missing build script returns full ECR name as-is
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker-image-name: 308535385114.dkr.ecr.us-east-1.amazonaws.com/pytorch/my-image:abc123
          docker-build-dir: tests/fixtures/docker
          docker-build-script: ./no-such-build.sh
          repo-name: pytorch
      - name: Assert docker-image passthrough
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "308535385114.dkr.ecr.us-east-1.amazonaws.com/pytorch/my-image:abc123" ]; then
            echo "FAIL: unexpected docker-image"
            exit 1
          fi
          echo "PASS"
