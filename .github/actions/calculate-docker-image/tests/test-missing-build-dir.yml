name: Test missing docker build dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker-image-name: some-image:custom-tag
          docker-build-dir: does/not/exist
          repo-name: pytorch
      - name: Assert image name passed through unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "some-image:custom-tag" ]; then
            echo "FAIL: expected 'some-image:custom-tag'"
            exit 1
          fi
          echo "PASS"
