name: Test custom registry disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker-image-name: some/registry/image:1.0
          docker-build-dir: tests/fixtures/docker
          use-custom-docker-registry: "false"
          repo-name: myrepo
      - name: Assert image name returned unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "some/registry/image:1.0" ]; then
            echo "FAIL: expected 'some/registry/image:1.0'"
            exit 1
          fi
          echo "PASS"
