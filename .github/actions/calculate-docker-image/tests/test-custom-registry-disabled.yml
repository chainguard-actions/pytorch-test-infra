name: Test custom registry disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker-image-name: my-image:sometag
          docker-build-dir: tests/fixtures/docker
          use-custom-docker-registry: "false"
          repo-name: my-repo
      - name: Assert image name returned unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "my-image:sometag" ]; then
            echo "FAIL: expected 'my-image:sometag'"
            exit 1
          fi
          if [ -f /tmp/fake-build-args.txt ]; then
            echo "FAIL: build script should not have been called"
            exit 1
          fi
          echo "PASS"
