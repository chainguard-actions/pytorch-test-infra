name: Test computed image with always-rebuild and matching hash
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws and docker CLIs (no real ECR under act)
        run: |
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\necho "aws $*" >> /tmp/fake-aws-calls.txt\necho fake-password\nexit 0\n' > /tmp/fakebin/aws
          printf '#!/bin/sh\ncat >/dev/null 2>&1 </dev/null\necho "docker $*" >> /tmp/fake-docker-calls.txt\nexit 0\n' > /tmp/fakebin/docker
          chmod +x /tmp/fakebin/aws /tmp/fakebin/docker
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - name: Compute expected hash
        id: hash
        run: |
          rm -f /tmp/fake-build-args.txt
          echo "hash=$(git rev-parse HEAD:tests/fixtures/docker)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          docker-image-name: myimage
          docker-build-dir: tests/fixtures/docker
          docker-registry: example.registry.local
          repo-name: my-repo
          always-rebuild: "true"
          ci-docker-hash: ${{ steps.hash.outputs.hash }}
      - name: Assert computed docker image
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          EXPECTED="example.registry.local/my-repo/myimage:${HASH}"
          echo "actual: $ACTUAL"
          echo "expected: $EXPECTED"
          if [ -z "$HASH" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL"
            exit 1
          fi
          echo "PASS"
      - name: Assert build script was invoked with -t image
        env:
          IMAGE: ${{ steps.action.outputs.docker-image }}
        run: |
          cat /tmp/fake-build-args.txt || { echo "FAIL: build script not called"; exit 1; }
          if ! grep -qx -- "-t" /tmp/fake-build-args.txt || ! grep -qxF -- "$IMAGE" /tmp/fake-build-args.txt; then
            echo "FAIL: build script args missing '-t $IMAGE'"
            exit 1
          fi
          echo "PASS"
