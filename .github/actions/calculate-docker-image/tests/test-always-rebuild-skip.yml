name: Test always-rebuild and push are ignored when custom registry is disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker-image-name: pytorch-linux-jammy-py3-clang15
          docker-build-dir: does/not/exist
          use-custom-docker-registry: "false"
          always-rebuild: "true"
          push: "true"
          force-push: "true"
          repo-name: pytorch
      - name: Assert docker-image passthrough (no build attempted)
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "pytorch-linux-jammy-py3-clang15" ]; then
            echo "FAIL: expected 'pytorch-linux-jammy-py3-clang15'"
            exit 1
          fi
          echo "PASS"
