name: Test ci-docker-hash matching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install fake aws and docker (image already exists)
        run: |
          FAKEBIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$FAKEBIN"
          printf '#!/bin/sh\necho "fake aws $*" >&2\necho fake-token\nexit 0\n' > "$FAKEBIN/aws"
          printf '#!/bin/sh\necho "fake docker $*" >&2\nexit 0\n' > "$FAKEBIN/docker"
          chmod +x "$FAKEBIN/aws" "$FAKEBIN/docker"
          echo "$FAKEBIN" >> "$GITHUB_PATH"
      - name: Compute expected hash
        id: expected
        run: echo "hash=$(git rev-parse HEAD:tests/fixtures/docker)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          docker-image-name: my-image
          docker-build-dir: tests/fixtures/docker
          repo-name: myrepo
          ci-docker-hash: ${{ steps.expected.outputs.hash }}
      - name: Assert image computed
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
          HASH: ${{ steps.expected.outputs.hash }}
        run: |
          EXPECTED="308535385114.dkr.ecr.us-east-1.amazonaws.com/myrepo/my-image:${HASH}"
          echo "actual:   $ACTUAL"
          echo "expected: $EXPECTED"
          if [ -z "$HASH" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL"
            exit 1
          fi
          echo "PASS"
