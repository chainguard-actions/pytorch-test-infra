name: Test ci-docker-hash mismatch fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image-name: my-image
          docker-build-dir: tests/fixtures/docker
          repo-name: myrepo
          ci-docker-hash: 0000000000000000000000000000000000000000
      - name: Assert action failed on mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "outcome: $OUTCOME"
          echo "docker-image: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on hash mismatch"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: docker-image should not be set on mismatch"
            exit 1
          fi
          echo "PASS"
