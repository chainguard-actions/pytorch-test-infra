name: Test ci-docker-hash mismatch fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws and docker CLIs
        run: |
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\necho fake-password\n' > /tmp/fakebin/aws
          printf '#!/bin/sh\nexit 0\n' > /tmp/fakebin/docker
          chmod +x /tmp/fakebin/aws /tmp/fakebin/docker
          echo /tmp/fakebin >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image-name: test-image
          docker-build-dir: tests/fixtures/docker
          repo-name: myrepo
          ci-docker-hash: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IMAGE: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "outcome: $OUTCOME"
          echo "image: $IMAGE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on hash mismatch"
            exit 1
          fi
          if [ -n "$IMAGE" ]; then
            echo "FAIL: no docker-image output expected on mismatch"
            exit 1
          fi
          echo "PASS"
