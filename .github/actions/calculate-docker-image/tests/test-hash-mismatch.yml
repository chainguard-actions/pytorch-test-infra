name: Test ci-docker-hash mismatch fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image-name: my-image
          docker-build-dir: tests/fixtures/docker
          repo-name: pytorch
          always-rebuild: "true"
          ci-docker-hash: "0000000000000000000000000000000000000000"
      - name: Assert action failed on hash mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IMAGE: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "outcome: $OUTCOME"
          echo "image: $IMAGE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on hash mismatch"
            exit 1
          fi
          if [ -n "$IMAGE" ]; then
            echo "FAIL: no docker-image output expected"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/fake-build-args.txt" ]; then
            echo "FAIL: build script should not have run"
            exit 1
          fi
          echo "PASS"
