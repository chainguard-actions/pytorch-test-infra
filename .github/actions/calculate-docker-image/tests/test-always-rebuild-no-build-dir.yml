name: Test always-rebuild with missing build dir skips the build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker-image-name: my-image:custom
          docker-build-dir: does-not-exist-dir
          always-rebuild: "yes"
          push: "false"
      - name: Assert docker-image passed through unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "my-image:custom" ]; then
            echo "FAIL: expected 'my-image:custom'"
            exit 1
          fi
          echo "PASS"
