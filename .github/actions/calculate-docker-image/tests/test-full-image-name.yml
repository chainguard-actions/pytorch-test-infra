name: Test full image name with registry prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws and docker CLIs (no real AWS/ECR access in act)
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/aws <<'EOF'
          #!/bin/sh
          echo "fake-password"
          exit 0
          EOF
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          if [ "$1" = "login" ]; then
            cat >/dev/null
            echo "Login Succeeded (fake)"
            exit 0
          fi
          echo "fake docker: $*"
          exit 0
          EOF
          chmod +x /tmp/fakebin/aws /tmp/fakebin/docker
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          docker-image-name: registry.example.com/myrepo/myimage:sometag
          docker-build-dir: tests/fixtures/docker-build
          repo-name: myrepo
          docker-registry: registry.example.com
          always-rebuild: "true"
      - name: Assert docker-image is used as-is
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "registry.example.com/myrepo/myimage:sometag" ]; then
            echo "FAIL: expected full image name unchanged"
            exit 1
          fi
          echo "PASS"
