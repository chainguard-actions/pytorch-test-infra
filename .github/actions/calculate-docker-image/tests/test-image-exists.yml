name: Test image already exists (custom tag prefix)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws and docker CLIs
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/aws <<'EOF'
          #!/bin/sh
          echo "aws $*" >> /tmp/fake-aws.log
          echo "fake-password"
          EOF
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo "docker $*" >> /tmp/fake-docker.log
          cat >/dev/null 2>&1 </dev/null || true
          exit 0
          EOF
          chmod +x /tmp/fakebin/aws /tmp/fakebin/docker
          echo /tmp/fakebin >> "$GITHUB_PATH"
          rm -f /tmp/fake-build-args.txt /tmp/fake-docker.log
      - name: Compute expected hash
        id: hash
        run: echo "hash=$(git rev-parse HEAD:tests/fixtures/docker)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          docker-image-name: test-image
          docker-build-dir: tests/fixtures/docker
          custom-tag-prefix: myprefix
          repo-name: myrepo
      - name: Assert computed image
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          EXPECTED="308535385114.dkr.ecr.us-east-1.amazonaws.com/myrepo/test-image:myprefix-${HASH}"
          echo "actual:   $ACTUAL"
          echo "expected: $EXPECTED"
          if [ -z "$HASH" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: image mismatch"
            exit 1
          fi
          cat /tmp/fake-docker.log || true
          if ! grep -q "manifest inspect $EXPECTED" /tmp/fake-docker.log; then
            echo "FAIL: expected docker manifest inspect of the image"
            exit 1
          fi
          if [ -f /tmp/fake-build-args.txt ]; then
            echo "FAIL: build should be skipped when image exists"
            exit 1
          fi
          echo "PASS"
