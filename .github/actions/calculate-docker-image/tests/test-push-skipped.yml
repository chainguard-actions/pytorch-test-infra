name: Test push and force-push with custom registry disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker-image-name: some-registry.example.com/my-image:v1
          use-custom-docker-registry: "false"
          push: "true"
          force-push: "true"
          docker-build-dir: does-not-exist
      - name: Assert docker-image passes through unchanged (no push attempted)
        env:
          ACTUAL: ${{ steps.action.outputs.docker-image }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "some-registry.example.com/my-image:v1" ]; then
            echo "FAIL: expected 'some-registry.example.com/my-image:v1'"
            exit 1
          fi
          echo "PASS"
