name: Sanity check and upload clang-tidy and clang-format binaries

description: Sanity check and upload clang-tidy and clang-format binaries to s3 and GHA

# Used by clang-tidy-macos and clang-tidy-linux workflows since the sanity
# checks and uploads are pretty much the same for them, so this helps reduce
# code duplication

inputs:
  platform:
    description: 'The platform to upload the binaries for'
    required: true
  version:
    description: 'The version of the binaries'
    required: true
  upload-to-s3:
    description: 'Whether to upload the binaries to s3'
    required: false
    default: false

runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Check if binaries have changed
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        VERSION: ${{ inputs.version }}
      run: |
        set -ex
        python3 tools/clang-tidy-checks/check_s3.py \
          --s3-key "${PLATFORM}/${VERSION}/clang-tidy" \
          --local-file clang-tidy
        python3 tools/clang-tidy-checks/check_s3.py \
          --s3-key "${PLATFORM}/${VERSION}/clang-format" \
          --local-file clang-format

    - name: configure aws credentials
      id: aws-credentials
      uses: chainguard-actions/aws-actions-configure-aws-credentials@05c5161294fac31f72449e5671350b7bf823c91f # v4
      if: ${{ fromJSON(inputs.upload-to-s3) }}
      with:
        role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_clang_tidy_upload
        aws-region: us-east-1
        output-credentials: true

    - uses: seemethere/upload-artifact-s3@baba72d0712b404f646cebe0730933554ebce96a # v5
      name: Publish clang-tidy binary
      if: ${{ fromJSON(inputs.upload-to-s3) }}
      with:
        if-no-files-found: error
        s3-prefix: ${{ inputs.platform }}/${{ inputs.version }}
        s3-bucket: oss-clang-format
        path: clang-tidy

    - uses: seemethere/upload-artifact-s3@baba72d0712b404f646cebe0730933554ebce96a # v5
      name: Publish clang-format binary
      if: ${{ fromJSON(inputs.upload-to-s3) }}
      with:
        if-no-files-found: error
        s3-prefix: ${{ inputs.platform }}/${{ inputs.version }}
        s3-bucket: oss-clang-format
        path: clang-format

    - name: Upload clang-tidy to GHA
      uses: chainguard-actions/actions-upload-artifact@58b2f77fde711fbc8c271d0e5877c5d7d9a19733 # v6
      with:
        name: ${{ inputs.platform }}-${{ inputs.version }}-clang-tidy
        retention-days: 14
        if-no-files-found: warn
        path: clang-tidy

    - name: Upload clang-format to GHA
      uses: chainguard-actions/actions-upload-artifact@58b2f77fde711fbc8c271d0e5877c5d7d9a19733 # v6
      with:
        name: ${{ inputs.platform }}-${{ inputs.version }}-clang-format
        retention-days: 14
        if-no-files-found: warn
        path: clang-format
