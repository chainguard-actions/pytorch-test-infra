name: Test unchanged binary fails sanity check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHECK_S3_LOG: ${{ github.workspace }}/check_s3_calls.log
      CHECK_S3_FAIL_KEY: macos-arm/18.1.8/clang-tidy
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare binaries and check_s3 stub
        run: |
          mkdir -p tools/clang-tidy-checks
          cp tests/fixtures/check_s3_stub.py tools/clang-tidy-checks/check_s3.py
          printf 'fake clang-tidy\n' > clang-tidy
          printf 'fake clang-format\n' > clang-format
          rm -f "$CHECK_S3_LOG"
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: macos-arm
          version: "18.1.8"
      - name: Assert action failed and stopped after first check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- log ---"
          cat "$CHECK_S3_LOG" || { echo "FAIL: check_s3 never invoked"; exit 1; }
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          actual="$(cat "$CHECK_S3_LOG")"
          if [ "$actual" != "macos-arm/18.1.8/clang-tidy clang-tidy" ]; then
            echo "FAIL: expected only the clang-tidy check to have run"
            exit 1
          fi
          echo "PASS"
