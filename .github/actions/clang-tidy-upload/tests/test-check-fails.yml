name: Test sanity check failure stops the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHECK_S3_LOG: /tmp/check_s3_fail.log
      CHECK_S3_EXIT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare failing stub checker and fake binaries
        run: |
          rm -f "$CHECK_S3_LOG"
          mkdir -p tools/clang-tidy-checks
          cp tests/fixtures/check_s3_stub.py tools/clang-tidy-checks/check_s3.py
          printf 'fake clang-tidy\n' > clang-tidy
          printf 'fake clang-format\n' > clang-format
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: macos-arm
          version: "15.0.0"
          upload-to-s3: "false"
      - name: Assert action failed after first check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- log ---"; cat "$CHECK_S3_LOG" || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome when sanity check fails"; exit 1
          fi
          if [ "$(wc -l < "$CHECK_S3_LOG")" -ne 1 ]; then
            echo "FAIL: expected set -e to stop after the first check"; exit 1
          fi
          grep -qx 'macos-arm/15.0.0/clang-tidy clang-tidy exists=True' "$CHECK_S3_LOG" || { echo "FAIL: wrong first check args"; exit 1; }
          echo "PASS"
