name: Test sanity check failure stops the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHECK_S3_LOG: ${{ github.workspace }}/check_s3.log
      CHECK_S3_EXIT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare stub check script and binaries
        run: |
          mkdir -p tools/clang-tidy-checks
          cp tests/fixtures/check_s3.py tools/clang-tidy-checks/check_s3.py
          rm -f "$CHECK_S3_LOG"
          printf '#!/bin/sh\necho clang-tidy\n' > clang-tidy
          printf '#!/bin/sh\necho clang-format\n' > clang-format
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: macos-arm
          version: "15.0.0"
          upload-to-s3: "false"
      - name: Assert action failed after first check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat "$CHECK_S3_LOG" || { echo "FAIL: check_s3 never ran"; exit 1; }
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when check_s3 fails"
            exit 1
          fi
          actual="$(cat "$CHECK_S3_LOG")"
          if [ "$actual" != "macos-arm/15.0.0/clang-tidy clang-tidy exists=True" ]; then
            echo "FAIL: expected only the clang-tidy check to run (set -e)"
            exit 1
          fi
          echo "PASS"
