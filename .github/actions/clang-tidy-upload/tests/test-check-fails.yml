name: Test sanity check failure aborts the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake python3 whose check_s3.py fails
        run: |
          set -e
          REAL_PY="$(command -v python3)"
          mkdir -p /tmp/fakebin
          rm -f /tmp/check_s3_calls.log
          cat > /tmp/fakebin/python3 <<EOF
          #!/bin/bash
          case "\$*" in
            *check_s3.py*)
              echo "\$*" >> /tmp/check_s3_calls.log
              echo "binary changed unexpectedly" >&2
              exit 1
              ;;
          esac
          exec "$REAL_PY" "\$@"
          EOF
          chmod +x /tmp/fakebin/python3
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
          echo "fake clang-tidy" > "$GITHUB_WORKSPACE/clang-tidy"
          echo "fake clang-format" > "$GITHUB_WORKSPACE/clang-format"
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: macos-arm
          version: "15"
          upload-to-s3: "false"
      - name: Assert action failed after first check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/check_s3_calls.log || { echo "FAIL: check_s3.py never invoked"; exit 1; }
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if [ "$(wc -l < /tmp/check_s3_calls.log)" -ne 1 ]; then
            echo "FAIL: expected set -e to stop after first failing check"
            exit 1
          fi
          grep -q -- '--s3-key macos-arm/15/clang-tidy --local-file clang-tidy' /tmp/check_s3_calls.log || { echo "FAIL: wrong args"; exit 1; }
          echo "PASS"
