name: Test action fails when binaries unchanged
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Stub failing check_s3.py and create dummy binaries
        run: |
          set -e
          rm -f /tmp/check_s3_calls.log /tmp/check_s3_fail /tmp/check_s3_backup /tmp/check_s3_created_dir
          mkdir -p tools
          if [ ! -d tools/clang-tidy-checks ]; then
            mkdir -p tools/clang-tidy-checks
            touch /tmp/check_s3_created_dir
          fi
          if [ -f tools/clang-tidy-checks/check_s3.py ]; then
            cp tools/clang-tidy-checks/check_s3.py /tmp/check_s3_backup
          fi
          cat > tools/clang-tidy-checks/check_s3.py <<'EOF'
          import os, sys
          with open("/tmp/check_s3_calls.log", "a") as f:
              f.write(" ".join(sys.argv[1:]) + "\n")
          if os.path.exists("/tmp/check_s3_fail"):
              print("stub: binary unchanged", file=sys.stderr)
              sys.exit(1)
          print("stub: binary changed")
          EOF
          touch /tmp/check_s3_fail
          echo "fake clang-tidy" > clang-tidy
          echo "fake clang-format" > clang-format
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: macos-arm
          version: "15.0.0"
          upload-to-s3: "false"
      - name: Assert action failed at the sanity check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- calls ---"
          cat /tmp/check_s3_calls.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when check_s3.py fails"
            exit 1
          fi
          if [ "$(wc -l < /tmp/check_s3_calls.log)" -ne 1 ]; then
            echo "FAIL: expected set -e to stop after first failing call"
            exit 1
          fi
          if ! grep -qx -- "--s3-key macos-arm/15.0.0/clang-tidy --local-file clang-tidy" /tmp/check_s3_calls.log; then
            echo "FAIL: wrong arguments for clang-tidy check"
            exit 1
          fi
          echo "PASS"
      - name: Restore workspace
        if: always()
        run: |
          rm -f clang-tidy clang-format /tmp/check_s3_fail
          if [ -f /tmp/check_s3_backup ]; then
            cp /tmp/check_s3_backup tools/clang-tidy-checks/check_s3.py
          else
            rm -f tools/clang-tidy-checks/check_s3.py
          fi
          if [ -f /tmp/check_s3_created_dir ]; then
            rm -rf tools/clang-tidy-checks
            rmdir tools 2>/dev/null || true
          fi
