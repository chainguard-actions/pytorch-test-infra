name: Test action fails when binary check fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare failing stub check script
        run: |
          rm -f /tmp/check_s3_calls.log
          touch /tmp/check_s3_fail
          mkdir -p tools/clang-tidy-checks
          cp tests/fixtures/check_s3_stub.py tools/clang-tidy-checks/check_s3.py
          echo "fake clang-tidy" > clang-tidy
          echo "fake clang-format" > clang-format
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: macos-arm
          version: 18.1.0
      - name: Assert action failed after first check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          rm -f /tmp/check_s3_fail
          echo "outcome: $OUTCOME"
          cat /tmp/check_s3_calls.log || { echo "FAIL: check script never called"; exit 1; }
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if [ "$(wc -l < /tmp/check_s3_calls.log)" -ne 1 ]; then
            echo "FAIL: expected set -e to stop after the first call"
            exit 1
          fi
          if [ "$(cat /tmp/check_s3_calls.log)" != "s3-key=macos-arm/18.1.0/clang-tidy local-file=clang-tidy" ]; then
            echo "FAIL: call arguments wrong"
            exit 1
          fi
          echo "PASS"
