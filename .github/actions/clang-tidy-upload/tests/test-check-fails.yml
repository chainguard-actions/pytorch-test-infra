name: Test action fails when binary sanity check fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install python3 shim that fails check_s3.py
        run: |
          set -e
          REAL_PY="$(command -v python3 || true)"
          mkdir -p "$RUNNER_TEMP/shim"
          LOG="$RUNNER_TEMP/check_s3_calls.log"
          : > "$LOG"
          cat > "$RUNNER_TEMP/shim/python3" <<EOF
          #!/bin/sh
          case "\$*" in
            *tools/clang-tidy-checks/check_s3.py*)
              echo "\$*" >> "$LOG"
              echo "binary unchanged" >&2
              exit 1
              ;;
          esac
          exec "$REAL_PY" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/shim/python3"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
          rm -f "$GITHUB_WORKSPACE/clang-tidy" "$GITHUB_WORKSPACE/clang-format"
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: macos-arm
          version: "15.0.0"
          upload-to-s3: false
      - name: Assert action failed and stopped after first check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          LOG="$RUNNER_TEMP/check_s3_calls.log"
          echo "outcome: $OUTCOME"
          cat "$LOG"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          COUNT=$(wc -l < "$LOG")
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: expected exactly 1 call (set -e should abort), got $COUNT"
            exit 1
          fi
          if ! grep -q -- '--s3-key macos-arm/15.0.0/clang-tidy' "$LOG"; then
            echo "FAIL: wrong s3 key"
            exit 1
          fi
          echo "PASS"
