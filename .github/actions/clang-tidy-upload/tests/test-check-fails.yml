name: Test action fails when binaries sanity check fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHECK_S3_LOG: /tmp/check_s3_fail.log
      STUB_FAIL: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare stub script and binaries
        run: |
          mkdir -p tools/clang-tidy-checks
          cp tests/fixtures/check_s3_stub.py tools/clang-tidy-checks/check_s3.py
          echo "fake clang-tidy" > clang-tidy
          echo "fake clang-format" > clang-format
          rm -f "$CHECK_S3_LOG"
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: macos-arm
          version: "15.0.0"
      - name: Assert action failed at first sanity check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- log ---"; cat "$CHECK_S3_LOG" || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          grep -qx "macos-arm/15.0.0/clang-tidy clang-tidy" "$CHECK_S3_LOG" || { echo "FAIL: clang-tidy check not invoked"; exit 1; }
          if grep -q "clang-format" "$CHECK_S3_LOG"; then
            echo "FAIL: clang-format check should not run after first failure (set -e)"
            exit 1
          fi
          echo "PASS"
