name: Test action fails when binary check fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake check_s3 interceptor (avoid network S3 access)
        run: |
          REAL_PY="$(command -v python3 || echo /usr/bin/python3)"
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/python3" <<EOF
          #!/bin/sh
          if [ "\$1" = "tools/clang-tidy-checks/check_s3.py" ]; then
            shift
            echo "\$*" >> /tmp/check_s3_calls.log
            exit \${FAKE_CHECK_EXIT:-0}
          fi
          exec "$REAL_PY" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/python3"
          rm -f /tmp/check_s3_calls.log
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -f clang-tidy clang-format
      - id: action
        uses: .
        continue-on-error: true
        env:
          FAKE_CHECK_EXIT: "1"
        with:
          platform: linux64
          version: "17.0.6"
          upload-to-s3: "false"
      - name: Assert action failed and stopped after first check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/check_s3_calls.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"; exit 1
          fi
          COUNT=$(wc -l < /tmp/check_s3_calls.log)
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: expected set -e to stop after 1 call, got $COUNT"; exit 1
          fi
          echo "PASS"
