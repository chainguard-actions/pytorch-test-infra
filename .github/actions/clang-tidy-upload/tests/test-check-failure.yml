name: Test sanity check failure aborts action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare failing check_s3.py stub
        run: |
          set -e
          echo "fake clang-tidy" > clang-tidy
          echo "fake clang-format" > clang-format
          mkdir -p tools/clang-tidy-checks
          if [ -f tools/clang-tidy-checks/check_s3.py ]; then
            cp tools/clang-tidy-checks/check_s3.py /tmp/check_s3.py.bak
          fi
          rm -f /tmp/check_s3_calls.log
          cat > tools/clang-tidy-checks/check_s3.py <<'EOF'
          import sys
          with open("/tmp/check_s3_calls.log", "a") as f:
              f.write(" ".join(sys.argv[1:]) + "\n")
          sys.exit(1)
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: linux64
          version: "17.0.6"
      - name: Assert action failed after the first check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/check_s3_calls.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if [ "$(wc -l < /tmp/check_s3_calls.log)" -ne 1 ]; then
            echo "FAIL: expected exactly 1 call (set -e should abort)"
            exit 1
          fi
          if ! grep -qx -- "--s3-key linux64/17.0.6/clang-tidy --local-file clang-tidy" /tmp/check_s3_calls.log; then
            echo "FAIL: first call did not target clang-tidy"
            exit 1
          fi
          echo "PASS"
      - name: Restore check_s3.py
        if: always()
        run: |
          if [ -f /tmp/check_s3.py.bak ]; then
            cp /tmp/check_s3.py.bak tools/clang-tidy-checks/check_s3.py
          else
            rm -f tools/clang-tidy-checks/check_s3.py
          fi
          rm -f clang-tidy clang-format
