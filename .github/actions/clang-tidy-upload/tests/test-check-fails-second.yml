name: Test failure when clang-format s3 check fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up stub check_s3.py failing on clang-format
        run: |
          mkdir -p tools/clang-tidy-checks
          cat > tools/clang-tidy-checks/check_s3.py <<'EOF'
          import sys
          with open("/tmp/check_s3_calls.log", "a") as f:
              f.write(" ".join(sys.argv[1:]) + "\n")
          if any(a.endswith("/clang-format") for a in sys.argv[1:]):
              sys.exit(2)
          sys.exit(0)
          EOF
          rm -f /tmp/check_s3_calls.log
          echo "fake clang-tidy" > clang-tidy
          echo "fake clang-format" > clang-format
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: linux64
          version: 15.0.0
          upload-to-s3: "false"
      - name: Assert action failed after both checks
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/check_s3_calls.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"; exit 1
          fi
          if [ "$(wc -l < /tmp/check_s3_calls.log)" -ne 2 ]; then
            echo "FAIL: expected 2 calls"; exit 1
          fi
          if [ "$(sed -n 2p /tmp/check_s3_calls.log)" != "--s3-key linux64/15.0.0/clang-format --local-file clang-format" ]; then
            echo "FAIL: unexpected second call"; exit 1
          fi
          echo "PASS"
