name: Test action fails when clang-format binary is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock check_s3.py and only clang-tidy binary
        run: |
          set -e
          rm -f /tmp/check_s3_calls.log /tmp/check_s3_fail clang-format
          mkdir -p tools/clang-tidy-checks
          if [ -f tools/clang-tidy-checks/check_s3.py ]; then
            cp tools/clang-tidy-checks/check_s3.py /tmp/check_s3.py.orig
          fi
          cp tests/fixtures/mock_check_s3.py tools/clang-tidy-checks/check_s3.py
          echo "fake clang-tidy" > clang-tidy
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: linux-aarch64
          version: "18.1.0"
          upload-to-s3: "false"
      - name: Assert action failed on second check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "calls:"; cat /tmp/check_s3_calls.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          printf '%s\n' "linux-aarch64/18.1.0/clang-tidy clang-tidy" "linux-aarch64/18.1.0/clang-format clang-format" > /tmp/expected.log
          if ! diff /tmp/expected.log /tmp/check_s3_calls.log; then
            echo "FAIL: check_s3 calls did not match expected"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: |
          rm -f clang-tidy clang-format
          if [ -f /tmp/check_s3.py.orig ]; then
            cp /tmp/check_s3.py.orig tools/clang-tidy-checks/check_s3.py
          else
            rm -rf tools/clang-tidy-checks
            rmdir tools 2>/dev/null || true
          fi
