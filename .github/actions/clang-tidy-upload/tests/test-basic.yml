name: Test basic usage (default upload-to-s3=false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake python3 that intercepts check_s3.py
        run: |
          set -e
          REAL_PY="$(command -v python3)"
          mkdir -p /tmp/fakebin
          rm -f /tmp/check_s3_calls.log
          cat > /tmp/fakebin/python3 <<EOF
          #!/bin/bash
          case "\$*" in
            *check_s3.py*)
              echo "\$*" >> /tmp/check_s3_calls.log
              exit 0
              ;;
          esac
          exec "$REAL_PY" "\$@"
          EOF
          chmod +x /tmp/fakebin/python3
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
          echo "fake clang-tidy" > "$GITHUB_WORKSPACE/clang-tidy"
          echo "fake clang-format" > "$GITHUB_WORKSPACE/clang-format"
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: linux64
          version: "17"
      - name: Assert check_s3 invoked for both binaries
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- calls ---"
          cat /tmp/check_s3_calls.log || { echo "FAIL: check_s3.py never invoked"; exit 1; }
          if [ "$(wc -l < /tmp/check_s3_calls.log)" -ne 2 ]; then
            echo "FAIL: expected exactly 2 check_s3 calls"
            exit 1
          fi
          grep -q -- '--s3-key linux64/17/clang-tidy --local-file clang-tidy' /tmp/check_s3_calls.log || { echo "FAIL: clang-tidy check missing"; exit 1; }
          grep -q -- '--s3-key linux64/17/clang-format --local-file clang-format' /tmp/check_s3_calls.log || { echo "FAIL: clang-format check missing"; exit 1; }
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # failure is tolerated only for GHA artifact upload (no artifact server under act);
          # the sanity check step itself completed with both calls above.
          echo "PASS"
