name: Test basic usage (no S3 upload)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHECK_S3_LOG: /tmp/check_s3_basic.log
      CHECK_S3_EXIT: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare stub checker and fake binaries
        run: |
          rm -f "$CHECK_S3_LOG"
          mkdir -p tools/clang-tidy-checks
          cp tests/fixtures/check_s3_stub.py tools/clang-tidy-checks/check_s3.py
          printf 'fake clang-tidy\n' > clang-tidy
          printf 'fake clang-format\n' > clang-format
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: linux64
          version: "17.0.6"
      - name: Assert check step invoked with correct keys
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- log ---"; cat "$CHECK_S3_LOG" || true
          if [ ! -f "$CHECK_S3_LOG" ]; then
            echo "FAIL: check_s3.py was never invoked"; exit 1
          fi
          if [ "$(wc -l < "$CHECK_S3_LOG")" -ne 2 ]; then
            echo "FAIL: expected 2 check invocations"; exit 1
          fi
          grep -qx 'linux64/17.0.6/clang-tidy clang-tidy exists=True' "$CHECK_S3_LOG" || { echo "FAIL: clang-tidy check missing"; exit 1; }
          grep -qx 'linux64/17.0.6/clang-format clang-format exists=True' "$CHECK_S3_LOG" || { echo "FAIL: clang-format check missing"; exit 1; }
          # The trailing GHA artifact upload may not work under act; any
          # outcome other than success/failure (e.g. skipped) is a bug.
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          echo "PASS"
