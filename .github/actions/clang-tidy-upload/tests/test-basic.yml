name: Test basic usage (no s3 upload)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Stub check_s3.py and create dummy binaries
        run: |
          set -e
          rm -f /tmp/check_s3_calls.log /tmp/check_s3_fail /tmp/check_s3_backup /tmp/check_s3_created_dir
          mkdir -p tools
          if [ ! -d tools/clang-tidy-checks ]; then
            mkdir -p tools/clang-tidy-checks
            touch /tmp/check_s3_created_dir
          fi
          if [ -f tools/clang-tidy-checks/check_s3.py ]; then
            cp tools/clang-tidy-checks/check_s3.py /tmp/check_s3_backup
          fi
          cat > tools/clang-tidy-checks/check_s3.py <<'EOF'
          import os, sys
          with open("/tmp/check_s3_calls.log", "a") as f:
              f.write(" ".join(sys.argv[1:]) + "\n")
          if os.path.exists("/tmp/check_s3_fail"):
              print("stub: binary unchanged", file=sys.stderr)
              sys.exit(1)
          print("stub: binary changed")
          EOF
          echo "fake clang-tidy" > clang-tidy
          echo "fake clang-format" > clang-format
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: linux64
          version: "17.0.6"
      - name: Assert check_s3.py was called with correct arguments
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- calls ---"
          cat /tmp/check_s3_calls.log || true
          if [ ! -f /tmp/check_s3_calls.log ]; then
            echo "FAIL: check_s3.py was never called"
            exit 1
          fi
          if ! grep -qx -- "--s3-key linux64/17.0.6/clang-tidy --local-file clang-tidy" /tmp/check_s3_calls.log; then
            echo "FAIL: missing clang-tidy check call"
            exit 1
          fi
          if ! grep -qx -- "--s3-key linux64/17.0.6/clang-format --local-file clang-format" /tmp/check_s3_calls.log; then
            echo "FAIL: missing clang-format check call"
            exit 1
          fi
          if [ "$(wc -l < /tmp/check_s3_calls.log)" -ne 2 ]; then
            echo "FAIL: expected exactly 2 calls"
            exit 1
          fi
          # Artifact upload may fail under act (no artifact server); either outcome
          # is acceptable once the sanity checks ran, but skipped is not.
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Restore workspace
        if: always()
        run: |
          rm -f clang-tidy clang-format
          if [ -f /tmp/check_s3_backup ]; then
            cp /tmp/check_s3_backup tools/clang-tidy-checks/check_s3.py
          else
            rm -f tools/clang-tidy-checks/check_s3.py
          fi
          if [ -f /tmp/check_s3_created_dir ]; then
            rm -rf tools/clang-tidy-checks
            rmdir tools 2>/dev/null || true
          fi
