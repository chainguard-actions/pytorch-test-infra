name: Test basic usage (no s3 upload)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare stub check script and fake binaries
        run: |
          rm -f /tmp/check_s3_calls.log /tmp/check_s3_fail
          mkdir -p tools/clang-tidy-checks
          cp tests/fixtures/check_s3_stub.py tools/clang-tidy-checks/check_s3.py
          echo "fake clang-tidy" > clang-tidy
          echo "fake clang-format" > clang-format
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: linux64
          version: 17.0.6
          upload-to-s3: "false"
      - name: Assert check script was called with correct arguments
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- calls ---"
          cat /tmp/check_s3_calls.log || { echo "FAIL: check script never called"; exit 1; }
          if [ "$(wc -l < /tmp/check_s3_calls.log)" -ne 2 ]; then
            echo "FAIL: expected exactly 2 calls"
            exit 1
          fi
          if [ "$(sed -n 1p /tmp/check_s3_calls.log)" != "s3-key=linux64/17.0.6/clang-tidy local-file=clang-tidy" ]; then
            echo "FAIL: first call wrong"
            exit 1
          fi
          if [ "$(sed -n 2p /tmp/check_s3_calls.log)" != "s3-key=linux64/17.0.6/clang-format local-file=clang-format" ]; then
            echo "FAIL: second call wrong"
            exit 1
          fi
          # GHA artifact upload may not be available under act; accept success or failure there
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
