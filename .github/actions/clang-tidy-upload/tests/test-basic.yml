name: Test basic sanity check without s3 upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHECK_S3_LOG: /tmp/check_s3_basic.log
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare stub script and binaries
        run: |
          mkdir -p tools/clang-tidy-checks
          cp tests/fixtures/check_s3_stub.py tools/clang-tidy-checks/check_s3.py
          echo "fake clang-tidy" > clang-tidy
          echo "fake clang-format" > clang-format
          rm -f "$CHECK_S3_LOG"
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: linux64
          version: "17.0.6"
          upload-to-s3: "false"
      - name: Assert sanity checks ran with correct keys
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- log ---"; cat "$CHECK_S3_LOG" || true
          grep -qx "linux64/17.0.6/clang-tidy clang-tidy" "$CHECK_S3_LOG" || { echo "FAIL: clang-tidy check missing"; exit 1; }
          grep -qx "linux64/17.0.6/clang-format clang-format" "$CHECK_S3_LOG" || { echo "FAIL: clang-format check missing"; exit 1; }
          # The GHA artifact upload steps may fail if act has no artifact server;
          # success or failure there is acceptable, skipped is not.
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
