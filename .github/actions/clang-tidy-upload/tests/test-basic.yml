name: Test basic usage (no s3 upload)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up stub check_s3.py and dummy binaries
        run: |
          mkdir -p tools/clang-tidy-checks
          cat > tools/clang-tidy-checks/check_s3.py <<'EOF'
          import sys
          with open("/tmp/check_s3_calls.log", "a") as f:
              f.write(" ".join(sys.argv[1:]) + "\n")
          sys.exit(0)
          EOF
          rm -f /tmp/check_s3_calls.log
          echo "fake clang-tidy" > clang-tidy
          echo "fake clang-format" > clang-format
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: linux64
          version: 17.0.6
          upload-to-s3: false
      - name: Assert check_s3.py was invoked with correct args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "calls:"; cat /tmp/check_s3_calls.log || true
          if [ ! -f /tmp/check_s3_calls.log ]; then
            echo "FAIL: check_s3.py was never called"; exit 1
          fi
          L1="$(sed -n 1p /tmp/check_s3_calls.log)"
          L2="$(sed -n 2p /tmp/check_s3_calls.log)"
          if [ "$L1" != "--s3-key linux64/17.0.6/clang-tidy --local-file clang-tidy" ]; then
            echo "FAIL: unexpected first call: $L1"; exit 1
          fi
          if [ "$L2" != "--s3-key linux64/17.0.6/clang-format --local-file clang-format" ]; then
            echo "FAIL: unexpected second call: $L2"; exit 1
          fi
          if [ "$(wc -l < /tmp/check_s3_calls.log)" -ne 2 ]; then
            echo "FAIL: expected exactly 2 calls"; exit 1
          fi
          # The GHA artifact upload depends on the harness artifact server; the
          # check step (verified above) succeeded either way.
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          echo "PASS"
