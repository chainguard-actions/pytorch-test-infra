name: Test failure when first s3 check fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up failing stub check_s3.py
        run: |
          mkdir -p tools/clang-tidy-checks
          cat > tools/clang-tidy-checks/check_s3.py <<'EOF'
          import sys
          with open("/tmp/check_s3_calls.log", "a") as f:
              f.write(" ".join(sys.argv[1:]) + "\n")
          if any(a.endswith("/clang-tidy") for a in sys.argv[1:]):
              print("binary changed / check failed")
              sys.exit(1)
          sys.exit(0)
          EOF
          rm -f /tmp/check_s3_calls.log
          echo "fake clang-tidy" > clang-tidy
          echo "fake clang-format" > clang-format
      - id: action
        uses: .
        continue-on-error: true
        with:
          platform: macos-arm
          version: 18.1.0
      - name: Assert action failed and stopped after first check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/check_s3_calls.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"; exit 1
          fi
          if [ "$(wc -l < /tmp/check_s3_calls.log)" -ne 1 ]; then
            echo "FAIL: expected exactly 1 call (set -e should stop)"; exit 1
          fi
          if ! grep -qx -- "--s3-key macos-arm/18.1.0/clang-tidy --local-file clang-tidy" /tmp/check_s3_calls.log; then
            echo "FAIL: unexpected call args"; exit 1
          fi
          echo "PASS"
