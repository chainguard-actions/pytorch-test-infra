name: Test basic usage with fail-silently
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        timeout-minutes: 10
        with:
          github-secret: ${{ secrets.GITHUB_TOKEN }}
          instructions: 'Run your tests after connecting'
      - name: Assert step succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: action should always succeed with fail-silently=true"
            exit 1
          fi
          if [ -f "$HOME/.ssh/authorized_keys" ]; then
            echo "authorized_keys contents:"
            cat "$HOME/.ssh/authorized_keys"
          fi
          echo "PASS"
