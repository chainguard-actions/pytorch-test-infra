name: Test activate-with-label skips when label absent
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Seed existing authorized_keys
        run: |
          mkdir -p ~/.ssh
          echo "ssh-ed25519 AAAAMARKERKEY marker@test" > ~/.ssh/authorized_keys
      - id: action
        uses: .
        with:
          github-secret: ${{ github.token }}
          activate-with-label: "true"
          label: with-ssh
          remove-existing-keys: "true"
          fail-silently: "false"
      - name: Assert action succeeded and did not touch keys
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat ~/.ssh/authorized_keys || true
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! grep -q "AAAAMARKERKEY" ~/.ssh/authorized_keys; then
            echo "FAIL: authorized_keys was modified even though label not applied"
            exit 1
          fi
          echo "PASS"
