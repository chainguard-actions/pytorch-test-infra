name: Test basic usage (fail-silently default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-secret: ${{ secrets.GITHUB_TOKEN }}
          instructions: "Connect and debug"
      - name: Assert action succeeded and any written keys file is valid
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: with fail-silently=true (default) the action must succeed"
            exit 1
          fi
          KEYS="$HOME/.ssh/authorized_keys"
          if [ -f "$KEYS" ]; then
            echo "authorized_keys contents:"
            cat "$KEYS"
            if [ ! -s "$KEYS" ]; then
              echo "FAIL: authorized_keys was written but is empty"
              exit 1
            fi
          else
            echo "No authorized_keys written (keys could not be fetched; failed silently)"
          fi
          echo "PASS"
