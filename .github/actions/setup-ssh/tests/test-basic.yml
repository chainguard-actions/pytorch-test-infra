name: Test basic usage (fail-silently default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-secret: ${{ github.token }}
          instructions: "Run your debugging commands now"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: with fail-silently=true the action must always succeed"
            exit 1
          fi
          if [ -f "$HOME/.ssh/authorized_keys" ]; then
            echo "authorized_keys written:"
            wc -l "$HOME/.ssh/authorized_keys"
          else
            echo "no authorized_keys written (no keys found or fetch failed silently)"
          fi
          echo "PASS"
