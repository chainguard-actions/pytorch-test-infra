name: Test activate-with-label skips outside pull requests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Seed authorized_keys with a sentinel
        run: |
          mkdir -p ~/.ssh
          echo "ssh-ed25519 AAAASENTINELKEY sentinel@test" > ~/.ssh/authorized_keys
      - id: action
        uses: .
        with:
          github-secret: ${{ github.token }}
          activate-with-label: 'true'
          label: with-ssh
          remove-existing-keys: 'true'
          fail-silently: 'false'
      - name: Assert step succeeded and keys untouched
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          cat ~/.ssh/authorized_keys
          if ! grep -q "AAAASENTINELKEY" ~/.ssh/authorized_keys; then
            echo "FAIL: authorized_keys was modified even though label gating should skip"
            exit 1
          fi
          echo "PASS"
