name: Test activate-with-label skips outside labeled PR
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Seed existing authorized_keys
        run: |
          mkdir -p "$HOME/.ssh"
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPRESERVEDKEYMARKER preserved@test" > "$HOME/.ssh/authorized_keys"
      - id: action
        uses: .
        with:
          github-secret: ${{ secrets.GITHUB_TOKEN }}
          activate-with-label: "true"
          label: with-ssh
          remove-existing-keys: "true"
          fail-silently: "false"
      - name: Assert action succeeded and did not touch keys
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          cat "$HOME/.ssh/authorized_keys" || true
          if ! grep -q "PRESERVEDKEYMARKER" "$HOME/.ssh/authorized_keys"; then
            echo "FAIL: existing key removed although label activation should have skipped"
            exit 1
          fi
          echo "PASS"
