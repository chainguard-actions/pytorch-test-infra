name: Test activate-with-label skips outside labeled PR
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-populate authorized_keys with a marker
        run: |
          mkdir -p ~/.ssh
          echo "ssh-ed25519 AAAAMARKERKEY marker@test" > ~/.ssh/authorized_keys
      - id: action
        uses: .
        with:
          github-secret: ${{ secrets.GITHUB_TOKEN }}
          activate-with-label: "true"
          label: with-ssh
          remove-existing-keys: "true"
          fail-silently: "false"
      - name: Assert action succeeded and did not touch authorized_keys
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat ~/.ssh/authorized_keys || true
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! grep -q "AAAAMARKERKEY" ~/.ssh/authorized_keys; then
            echo "FAIL: existing keys were removed although label gating should skip"
            exit 1
          fi
          echo "PASS"
