name: Test remove-existing-keys false preserves keys
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Seed existing authorized_keys
        run: |
          mkdir -p "$HOME/.ssh"
          echo "ssh-ed25519 AAAATESTSENTINELKEY sentinel@test" > "$HOME/.ssh/authorized_keys"
      - id: action
        uses: .
        with:
          github-secret: ${{ github.token }}
          activate-with-label: "false"
          remove-existing-keys: "false"
          fail-silently: "true"
      - name: Assert existing key preserved
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: with fail-silently=true the action must succeed"
            exit 1
          fi
          cat "$HOME/.ssh/authorized_keys" || true
          if ! grep -q "AAAATESTSENTINELKEY" "$HOME/.ssh/authorized_keys"; then
            echo "FAIL: existing key was removed although remove-existing-keys=false"
            exit 1
          fi
          echo "PASS"
