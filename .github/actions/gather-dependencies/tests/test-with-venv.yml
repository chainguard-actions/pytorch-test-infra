name: Test with venv input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          venv: /tmp/nonexistent-venv
      - name: Assert dependencies output is valid JSON object
        env:
          ACTUAL: ${{ steps.action.outputs.dependencies }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "{}" ]; then
            echo "FAIL: expected '{}'"
            exit 1
          fi
          if command -v python3 >/dev/null 2>&1; then
            echo "$ACTUAL" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d, dict)' || { echo "FAIL: not a JSON object"; exit 1; }
          fi
          echo "PASS"
