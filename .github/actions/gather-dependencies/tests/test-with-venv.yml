name: Test with venv input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          venv: /tmp/nonexistent-venv
      - name: Assert dependencies output is valid JSON object
        env:
          ACTUAL: ${{ steps.action.outputs.dependencies }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          case "$ACTUAL" in
            \{*\}) ;;
            *) echo "FAIL: expected a JSON object"; exit 1 ;;
          esac
          if [ "$ACTUAL" != "{}" ]; then
            echo "FAIL: expected '{}'"
            exit 1
          fi
          echo "PASS"
