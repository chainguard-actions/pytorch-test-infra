name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert dependencies output is {}
        env:
          ACTUAL: ${{ steps.action.outputs.dependencies }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "{}" ]; then
            echo "FAIL: expected '{}'"
            exit 1
          fi
          echo "PASS"
      - name: Assert output is valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.dependencies }}
        run: |
          if ! echo "$ACTUAL" | python3 -c 'import json,sys; json.load(sys.stdin)'; then
            echo "FAIL: output is not valid JSON"
            exit 1
          fi
          echo "PASS"
