name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert dependencies output is valid JSON object
        env:
          ACTUAL: ${{ steps.action.outputs.dependencies }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "{}" ]; then
            echo "FAIL: expected '{}'"
            exit 1
          fi
          echo "PASS"
