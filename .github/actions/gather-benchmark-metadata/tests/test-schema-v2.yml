name: Test metadata gathering with schema v2
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          schema-version: v2
      - name: Assert metadata (or graceful failure on sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.benchmark-metadata }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but metadata is empty"
              exit 1
            fi
            echo "$RESULT" | python3 -c 'import json,sys; json.loads(sys.stdin.read())' || {
              echo "FAIL: metadata is not valid JSON"
              exit 1
            }
            echo "PASS: got valid JSON metadata"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (job id lookup on sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
