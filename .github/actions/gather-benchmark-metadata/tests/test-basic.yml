name: Test basic usage with token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          schema-version: v3
      - name: Assert metadata gathered (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.benchmark-metadata }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but benchmark-metadata is empty"
              exit 1
            fi
            if ! printf '%s' "$RESULT" | python3 -c 'import json,sys; json.load(sys.stdin)'; then
              echo "FAIL: benchmark-metadata is not valid JSON"
              exit 1
            fi
            echo "PASS: got valid JSON metadata"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / job id lookup not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
