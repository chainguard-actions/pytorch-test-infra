name: Test missing github-token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ''
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.benchmark-metadata }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when github-token is empty"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no metadata output"
            exit 1
          fi
          echo "PASS"
