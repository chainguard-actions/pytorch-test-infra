name: Update commit hash

inputs:
  repo-owner:
    required: false
    type: string
    description: Name of the owner of the target repository
    default: pytorch
  repo-name:
    required: true
    type: string
    description: Name of the target repository we are updating commit hash for
  branch:
    required: true
    type: string
    description: Branch to fetch commit of from the target repository
  pin-folder:
    type: string
    description: Path to folder with commit pin in the source repository
    required: false
    default: .ci/docker/ci_commit_pins
  test-infra-repository:
    description: Test infra repository to use
    default: 'pytorch/test-infra'
    type: string
  test-infra-ref:
    description: Test infra reference to use
    default: ''
    type: string
  updatebot-token:
    required: true
    type: string
    description: Update bot token
  pytorchbot-token:
    required: true
    type: string
    description: Update bot token

description: Update the pinned commit hash of the target repo on the source repo

runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Checkout the source repo with the pinned commit file
      uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4
      with:
        ref: 'main'
        submodules: true
        token: ${{ inputs.updatebot-token }}

    - name: Checkout test-infra for the update_commit_hashes scripts
      uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4
      with:
        repository: ${{ inputs.test-infra-repository }}
        ref: ${{ inputs.test-infra-ref }}
        path: test-infra

    - name: Checkout the target repo
      shell: bash
      env:
        REPO_OWNER: ${{ inputs.repo-owner }}
        REPO_NAME: ${{ inputs.repo-name }}
      run: |
        git clone "https://github.com/${REPO_OWNER}/${REPO_NAME}.git" --quiet

    - uses: chainguard-actions/actions-setup-python@ace3254bb5011efbd0650a7120a0441ebd1f9400 # v5
      with:
        python-version: '3.11'
        cache: pip

    - name: Check if there already exists a PR
      shell: bash
      env:
        SOURCE_REPO: ${{ github.repository }}
        REPO_NAME: ${{ inputs.repo-name }}
        BRANCH: ${{ inputs.branch }}
        PIN_FOLDER: ${{ inputs.pin-folder }}
        UPDATEBOT_TOKEN: ${{ inputs.updatebot-token }}
        PYTORCHBOT_TOKEN: ${{ inputs.pytorchbot-token }}
        NEW_BRANCH_NAME: update-${{ inputs.repo-name }}-commit-hash/${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
      run: |
        set -ex

        pip install requests==2.31.0
        # put this here instead of the script to prevent accidentally changing the config when running the script locally
        git config --global user.name "PyTorch UpdateBot"
        git config --global user.email "pytorchupdatebot@users.noreply.github.com"

        python test-infra/.github/scripts/update_commit_hashes.py \
          --repo-name "${REPO_NAME}" \
          --branch "${BRANCH}" \
          --pin-folder "${PIN_FOLDER}" \
          --source-repo "${SOURCE_REPO}"
