name: Test custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-owner: pytorch
          repo-name: audio
          branch: main
          pin-folder: .github/ci_commit_pins
          test-infra-repository: pytorch/test-infra
          test-infra-ref: main
          updatebot-token: ${{ github.token }}
          pytorchbot-token: ${{ github.token }}
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel source repo is not resolvable / no push rights)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
