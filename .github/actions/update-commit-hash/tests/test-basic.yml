name: Test basic usage (custom owner, small target repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action checks out the source repo (github.repository, which is a
      # non-existent harness sentinel) and queries the GitHub API for PRs on
      # it, so it cannot fully succeed under the harness. Assert on outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-owner: octocat
          repo-name: Hello-World
          branch: master
          test-infra-ref: main
          updatebot-token: ${{ secrets.GITHUB_TOKEN }}
          pytorchbot-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action ran (or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -d "$GITHUB_WORKSPACE/Hello-World/.git" ]; then
              echo "FAIL: action succeeded but target repo was not cloned"
              exit 1
            fi
            if [ ! -f "$GITHUB_WORKSPACE/test-infra/.github/scripts/update_commit_hashes.py" ]; then
              echo "FAIL: action succeeded but test-infra script missing"
              exit 1
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
