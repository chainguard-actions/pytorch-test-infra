name: Test custom pin folder and explicit test-infra repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-owner: octocat
          repo-name: Spoon-Knife
          branch: main
          pin-folder: tests/pins
          test-infra-repository: pytorch/test-infra
          test-infra-ref: main
          updatebot-token: ${{ secrets.GITHUB_TOKEN }}
          pytorchbot-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action ran (or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -d "$GITHUB_WORKSPACE/Spoon-Knife/.git" ]; then
              echo "FAIL: action succeeded but target repo was not cloned"
              exit 1
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
