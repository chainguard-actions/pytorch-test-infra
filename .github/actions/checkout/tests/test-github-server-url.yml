name: Test explicit github-server-url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: server-url-target
          github-server-url: https://github.com
      - name: Assert files checked out
        run: |
          ls -la "$GITHUB_WORKSPACE/server-url-target"
          if [ ! -f "$GITHUB_WORKSPACE/server-url-target/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          echo "PASS"
      - name: Assert remote URL uses the given server
        run: |
          URL="$(git -C "$GITHUB_WORKSPACE/server-url-target" remote get-url origin)"
          echo "origin: $URL"
          case "$URL" in
            https://github.com/actions/checkout*) echo "PASS" ;;
            *) echo "FAIL: unexpected origin URL"; exit 1 ;;
          esac
      - name: Assert commit output is a SHA
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit output is not a SHA"
            exit 1
          fi
          echo "PASS"
