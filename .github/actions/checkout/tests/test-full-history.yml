name: Test full history fetch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: full-target
          fetch-depth: 0
      - name: Assert full history and tags
        run: |
          cd "$GITHUB_WORKSPACE/full-target"
          COUNT="$(git rev-list --count HEAD)"
          echo "history count: $COUNT"
          if [ "$COUNT" -le 10 ]; then
            echo "FAIL: expected full history"
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "FAIL: repository is shallow"
            exit 1
          fi
          if ! git rev-parse -q --verify 'refs/tags/v4.1.0' >/dev/null; then
            echo "FAIL: tags not fetched"
            exit 1
          fi
          echo "PASS"
