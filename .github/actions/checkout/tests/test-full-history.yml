name: Test full history checkout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          fetch-depth: 0
          path: full-target
      - name: Assert full history present
        run: |
          cd "$GITHUB_WORKSPACE/full-target"
          COUNT="$(git rev-list --count HEAD)"
          echo "history count: $COUNT"
          if [ "$COUNT" -le 10 ]; then
            echo "FAIL: expected full history (>10 commits)"
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "FAIL: repository is shallow"
            exit 1
          fi
          echo "PASS"
