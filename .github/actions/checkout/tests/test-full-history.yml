name: Test full history checkout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: full-target
          fetch-depth: 0
      - name: Assert full history fetched
        run: |
          COUNT="$(git -C "$GITHUB_WORKSPACE/full-target" rev-list --count HEAD)"
          echo "commit count: $COUNT"
          if [ "$COUNT" -le 1 ]; then
            echo "FAIL: expected more than 1 commit with fetch-depth 0"
            exit 1
          fi
          echo "PASS"
