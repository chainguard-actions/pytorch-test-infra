name: Test persist-credentials false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: nocred-target
          persist-credentials: false
      - name: Assert no credentials persisted
        run: |
          cd "$GITHUB_WORKSPACE/nocred-target"
          if [ ! -f action.yml ]; then
            echo "FAIL: checkout did not produce files"
            exit 1
          fi
          CFG="$(git config --local --list || true)"
          if echo "$CFG" | grep -qi 'extraheader'; then
            echo "FAIL: credentials header persisted in local git config"
            exit 1
          fi
          if git config --local --get-regexp 'includeIf' >/dev/null 2>&1; then
            echo "FAIL: credentials include persisted in local git config"
            exit 1
          fi
          echo "PASS"
