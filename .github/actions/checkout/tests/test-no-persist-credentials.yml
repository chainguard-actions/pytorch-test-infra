name: Test persist-credentials false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: nocred-target
          persist-credentials: false
      - name: Assert no credentials persisted
        run: |
          DIR="$GITHUB_WORKSPACE/nocred-target"
          if [ ! -f "$DIR/action.yml" ]; then
            echo "FAIL: checkout did not happen"
            exit 1
          fi
          if git -C "$DIR" config --local --get-regexp 'http\..*\.extraheader'; then
            echo "FAIL: extraheader credentials persisted in local git config"
            exit 1
          fi
          echo "PASS"
