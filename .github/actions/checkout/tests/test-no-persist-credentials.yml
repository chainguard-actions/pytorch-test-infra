name: Test persist-credentials false with full history
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: nocred-target
          persist-credentials: false
          fetch-depth: 0
      - name: Assert no credentials persisted and full history
        run: |
          T="$GITHUB_WORKSPACE/nocred-target"
          if [ ! -f "$T/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          if git -C "$T" config --local --get-regexp 'http\..*extraheader' ; then
            echo "FAIL: extraheader credentials were persisted"
            exit 1
          fi
          COUNT="$(git -C "$T" rev-list --count HEAD)"
          echo "commit count: $COUNT"
          if [ "$COUNT" -le 1 ]; then
            echo "FAIL: expected full history"
            exit 1
          fi
          echo "PASS"
