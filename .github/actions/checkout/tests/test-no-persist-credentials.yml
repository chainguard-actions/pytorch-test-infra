name: Test persist-credentials false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          persist-credentials: false
          path: nocred-target
      - name: Assert no credentials persisted
        run: |
          T="$GITHUB_WORKSPACE/nocred-target"
          if [ ! -f "$T/action.yml" ]; then
            echo "FAIL: checkout did not happen"
            exit 1
          fi
          CFG="$(git -C "$T" config --local --list || true)"
          echo "$CFG" | sed 's/AUTHORIZATION:.*/AUTHORIZATION: ***/'
          if echo "$CFG" | grep -qi 'extraheader'; then
            echo "FAIL: auth extraheader persisted in local git config"
            exit 1
          fi
          echo "PASS"
