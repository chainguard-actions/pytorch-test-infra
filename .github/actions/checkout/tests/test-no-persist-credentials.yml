name: Test persist-credentials false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          persist-credentials: false
          path: nocreds-target
      - name: Assert no credentials persisted
        run: |
          T="$GITHUB_WORKSPACE/nocreds-target"
          if [ ! -f "$T/action.yml" ]; then
            echo "FAIL: checkout did not produce files"
            exit 1
          fi
          if git -C "$T" config --local --get-regexp 'http\..*extraheader' ; then
            echo "FAIL: extraheader credentials were persisted"
            exit 1
          fi
          echo "PASS"
