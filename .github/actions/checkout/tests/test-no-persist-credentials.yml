name: Test persist-credentials false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          path: nocred-target
          persist-credentials: false
      - name: Assert no credentials persisted
        run: |
          cd "$GITHUB_WORKSPACE/nocred-target"
          if [ ! -f action.yml ]; then
            echo "FAIL: checkout did not happen"
            exit 1
          fi
          echo "local config:"
          git config --local --list || true
          if git config --local --get-regexp 'http\..*\.extraheader' >/dev/null 2>&1; then
            echo "FAIL: extraheader credential persisted"
            exit 1
          fi
          if git config --local --get-regexp 'includeif\..*' >/dev/null 2>&1; then
            echo "FAIL: includeIf credential config persisted"
            exit 1
          fi
          echo "PASS"
