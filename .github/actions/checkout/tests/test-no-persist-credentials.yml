name: Test persist-credentials false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          persist-credentials: false
          path: nocred-target
      - name: Assert no credentials persisted
        run: |
          cd "$GITHUB_WORKSPACE/nocred-target"
          if [ ! -f action.yml ]; then
            echo "FAIL: checkout missing"
            exit 1
          fi
          if git config --local --get-regexp 'http\..*\.extraheader'; then
            echo "FAIL: extraheader persisted in local git config"
            exit 1
          fi
          if git config --local --get-regexp 'includeIf\..*'; then
            echo "FAIL: credentials include persisted"
            exit 1
          fi
          echo "PASS"
