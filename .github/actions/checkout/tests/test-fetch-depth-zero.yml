name: Test full history checkout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: main
          fetch-depth: 0
          path: full-history
      - name: Assert full history fetched
        run: |
          COUNT="$(git -C "$GITHUB_WORKSPACE/full-history" rev-list --count HEAD)"
          echo "count: $COUNT"
          if [ "$COUNT" -le 1 ]; then
            echo "FAIL: expected more than one commit in history"
            exit 1
          fi
          echo "PASS"
      - name: Assert tags fetched
        run: |
          TAGS="$(git -C "$GITHUB_WORKSPACE/full-history" tag | wc -l)"
          echo "tags: $TAGS"
          if [ "$TAGS" -lt 1 ]; then
            echo "FAIL: expected tags with fetch-depth 0"
            exit 1
          fi
          echo "PASS"
