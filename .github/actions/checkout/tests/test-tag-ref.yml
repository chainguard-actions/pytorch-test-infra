name: Test checkout of a tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: v4.1.0
          path: tag-target
      - name: Assert tag checked out
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit: $COMMIT"
          cd "$GITHUB_WORKSPACE/tag-target"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "head: $HEAD_SHA"
          if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit output is not a SHA"
            exit 1
          fi
          if [ "$HEAD_SHA" != "$COMMIT" ]; then
            echo "FAIL: HEAD does not match commit output"
            exit 1
          fi
          TAG_SHA="$(git rev-parse 'v4.1.0^{commit}')"
          echo "tag sha: $TAG_SHA"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "FAIL: HEAD is not at tag v4.1.0"
            exit 1
          fi
          if ! grep -q '"version": "4.1.0"' package.json; then
            echo "FAIL: package.json does not show version 4.1.0"
            exit 1
          fi
          echo "PASS"
