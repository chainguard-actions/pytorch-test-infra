name: Test checkout at a tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: v4.0.0
          path: tag-target
      - name: Assert tag checked out
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
          REF: ${{ steps.action.outputs.ref }}
        run: |
          echo "commit: $COMMIT"
          echo "ref: $REF"
          HEAD_SHA="$(git -C "$GITHUB_WORKSPACE/tag-target" rev-parse HEAD)"
          TAG_SHA="$(git ls-remote https://github.com/actions/checkout 'refs/tags/v4.0.0^{}' | cut -f1)"
          [ -z "$TAG_SHA" ] && TAG_SHA="$(git ls-remote https://github.com/actions/checkout refs/tags/v4.0.0 | cut -f1)"
          echo "HEAD: $HEAD_SHA  tag: $TAG_SHA"
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "FAIL: HEAD does not match tag v4.0.0"
            exit 1
          fi
          if [ "$COMMIT" != "$HEAD_SHA" ]; then
            echo "FAIL: commit output does not match HEAD"
            exit 1
          fi
          echo "PASS"
