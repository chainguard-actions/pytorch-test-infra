name: Test checkout of a tag ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: v4.0.0
          path: tag-target
      - name: Assert tag checked out
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          T="$GITHUB_WORKSPACE/tag-target"
          HEAD_SHA="$(git -C "$T" rev-parse HEAD)"
          echo "commit: $COMMIT HEAD: $HEAD_SHA"
          if [ "$COMMIT" != "$HEAD_SHA" ]; then
            echo "FAIL: commit output does not match HEAD"
            exit 1
          fi
          TAG_SHA="$(git -C "$T" rev-parse 'v4.0.0^{commit}')"
          echo "tag sha: $TAG_SHA"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "FAIL: HEAD is not at tag v4.0.0"
            exit 1
          fi
          if ! grep -q '"version": "4.0.0"' "$T/package.json"; then
            echo "FAIL: package.json version is not 4.0.0"
            grep '"version"' "$T/package.json"
            exit 1
          fi
          echo "PASS"
