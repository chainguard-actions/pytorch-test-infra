name: Test checkout of a tag ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: v4.0.0
          path: tag-target
      - name: Assert tag checked out
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          DIR="$GITHUB_WORKSPACE/tag-target"
          echo "commit: $COMMIT"
          HEAD_SHA="$(git -C "$DIR" rev-parse HEAD)"
          echo "HEAD: $HEAD_SHA"
          if [ ! -f "$DIR/action.yml" ]; then
            echo "FAIL: action.yml missing"
            exit 1
          fi
          if [ "$HEAD_SHA" != "$COMMIT" ]; then
            echo "FAIL: commit output mismatch"
            exit 1
          fi
          TAG_SHA="$(git ls-remote https://github.com/actions/checkout 'refs/tags/v4.0.0^{}' | cut -f1)"
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA="$(git ls-remote https://github.com/actions/checkout 'refs/tags/v4.0.0' | cut -f1)"
          fi
          echo "remote tag sha: $TAG_SHA"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "FAIL: HEAD is not at tag v4.0.0"
            exit 1
          fi
          if ! grep -q "node20" "$DIR/action.yml"; then
            echo "FAIL: expected v4.0.0 action.yml to use node20"
            exit 1
          fi
          echo "PASS"
