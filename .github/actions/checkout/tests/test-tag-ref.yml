name: Test checkout of a tag ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: v4.1.0
          path: tag-target
      - name: Assert tag checked out
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "commit output: $COMMIT"
          HEAD_SHA="$(git -C "$GITHUB_WORKSPACE/tag-target" rev-parse HEAD)"
          echo "HEAD: $HEAD_SHA"
          if [ "$HEAD_SHA" != "8ade135a41bc03ea155e62e844d188df1ea18608" ]; then
            echo "FAIL: HEAD is not the v4.1.0 commit"
            exit 1
          fi
          if [ "$COMMIT" != "$HEAD_SHA" ]; then
            echo "FAIL: commit output does not match HEAD"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/tag-target/action.yml" ]; then
            echo "FAIL: action.yml missing"
            exit 1
          fi
          echo "PASS"
