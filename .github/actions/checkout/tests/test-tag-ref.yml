name: Test checkout of a tag ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: actions/checkout
          ref: v4.1.0
          path: tag-target
      - name: Assert tag checked out
        env:
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          T="$GITHUB_WORKSPACE/tag-target"
          echo "commit: $COMMIT"
          TAG_SHA="$(git -C "$T" rev-parse 'refs/tags/v4.1.0^{commit}')"
          HEAD_SHA="$(git -C "$T" rev-parse HEAD)"
          echo "tag sha: $TAG_SHA"
          echo "head sha: $HEAD_SHA"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "FAIL: HEAD is not at tag v4.1.0"
            exit 1
          fi
          if [ -n "$COMMIT" ] && [ "$COMMIT" != "$HEAD_SHA" ]; then
            echo "FAIL: commit output mismatch"
            exit 1
          fi
          echo "PASS"
