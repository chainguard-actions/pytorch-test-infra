name: Test fake GPU inside container runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create container marker and fake nvidia-smi
        run: |
          SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
          $SUDO touch /.incontainer
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/nvidia-smi" <<'EOF'
          #!/bin/sh
          if [ "$1" = "-L" ]; then
            echo "GPU 0: Fake NVIDIA A10G (UUID: GPU-00000000-0000-0000-0000-000000000000)"
            exit 0
          fi
          echo "fake nvidia-smi $*"
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/nvidia-smi"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
      - name: Assert outputs and env
        env:
          HAS: ${{ steps.action.outputs.has-nvidia }}
          INC: ${{ steps.action.outputs.in-container-runner }}
        run: |
          echo "has-nvidia: $HAS"
          echo "in-container-runner: $INC"
          echo "HAS_NVIDIA_GPU: $HAS_NVIDIA_GPU"
          echo "GPU_FLAG: ${GPU_FLAG:-}"
          [ "$HAS" = "true" ] || { echo "FAIL: expected has-nvidia=true"; exit 1; }
          [ "$INC" = "true" ] || { echo "FAIL: expected in-container-runner=true"; exit 1; }
          [ "$HAS_NVIDIA_GPU" = "true" ] || { echo "FAIL: expected HAS_NVIDIA_GPU=true"; exit 1; }
          [ "${GPU_FLAG:-}" = "--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all" ] || { echo "FAIL: unexpected GPU_FLAG"; exit 1; }
          echo "PASS"
