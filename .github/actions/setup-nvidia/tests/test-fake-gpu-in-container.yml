name: Test GPU detection with fake nvidia-smi inside container runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake nvidia-smi and container marker
        run: |
          if [ "$(id -u)" = 0 ]; then S=""; else S="sudo"; fi
          $S touch /.incontainer
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/nvidia-smi" <<'EOF'
          #!/bin/sh
          if [ "$1" = "-L" ]; then
            echo "GPU 0: Fake Tesla T4 (UUID: GPU-00000000-0000-0000-0000-000000000000)"
            exit 0
          fi
          echo "fake nvidia-smi"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/nvidia-smi"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          driver-version: '580.65.06'
      - name: Cleanup marker
        if: always()
        run: |
          if [ "$(id -u)" = 0 ]; then S=""; else S="sudo"; fi
          $S rm -f /.incontainer || true
      - name: Assert GPU detected and env exported
        env:
          HAS: ${{ steps.action.outputs.has-nvidia }}
          INC: ${{ steps.action.outputs.in-container-runner }}
        run: |
          echo "has-nvidia: $HAS"
          echo "in-container-runner: $INC"
          echo "HAS_NVIDIA_GPU: $HAS_NVIDIA_GPU"
          echo "GPU_FLAG: ${GPU_FLAG:-}"
          if [ "$HAS" != "true" ]; then
            echo "FAIL: expected has-nvidia=true"; exit 1
          fi
          if [ "$INC" != "true" ]; then
            echo "FAIL: expected in-container-runner=true"; exit 1
          fi
          if [ "$HAS_NVIDIA_GPU" != "true" ]; then
            echo "FAIL: expected HAS_NVIDIA_GPU=true"; exit 1
          fi
          if [ "${GPU_FLAG:-}" != "--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all" ]; then
            echo "FAIL: unexpected GPU_FLAG"; exit 1
          fi
          echo "PASS"
