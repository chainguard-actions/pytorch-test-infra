name: Test GPU detected via nvidia-smi inside container runner (install skipped)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create container marker and fake nvidia-smi
        run: |
          if [ "$(id -u)" = 0 ]; then touch /.inarc; else sudo touch /.inarc; fi
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/nvidia-smi" <<'EOF'
          #!/bin/sh
          if [ "$1" = "-L" ]; then
            echo "GPU 0: Fake Tesla T4 (UUID: GPU-00000000-0000-0000-0000-000000000000)"
            exit 0
          fi
          echo "fake nvidia-smi"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/nvidia-smi"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
      - name: Assert outputs
        env:
          HAS_NVIDIA: ${{ steps.action.outputs.has-nvidia }}
          IN_CONTAINER: ${{ steps.action.outputs.in-container-runner }}
        run: |
          echo "has-nvidia: $HAS_NVIDIA"
          echo "in-container-runner: $IN_CONTAINER"
          echo "HAS_NVIDIA_GPU env: ${HAS_NVIDIA_GPU:-<unset>}"
          echo "GPU_FLAG env: ${GPU_FLAG:-<unset>}"
          if [ "$IN_CONTAINER" != "true" ]; then
            echo "FAIL: expected in-container-runner=true"; exit 1
          fi
          if [ "$HAS_NVIDIA" != "true" ]; then
            echo "FAIL: expected has-nvidia=true"; exit 1
          fi
          if [ "${HAS_NVIDIA_GPU:-}" != "true" ]; then
            echo "FAIL: expected HAS_NVIDIA_GPU=true env"; exit 1
          fi
          if [ "${GPU_FLAG:-}" != "--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all" ]; then
            echo "FAIL: unexpected GPU_FLAG"; exit 1
          fi
          echo "PASS"
