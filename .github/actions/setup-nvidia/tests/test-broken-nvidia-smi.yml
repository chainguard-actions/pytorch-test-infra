name: Test failing nvidia-smi is not treated as a GPU
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install failing nvidia-smi
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/nvidia-smi" <<'EOF'
          #!/bin/sh
          echo "NVIDIA-SMI has failed because it couldn't communicate with the NVIDIA driver." >&2
          exit 9
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/nvidia-smi"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
      - name: Assert no GPU detected
        env:
          HAS_NVIDIA: ${{ steps.action.outputs.has-nvidia }}
        run: |
          echo "has-nvidia: $HAS_NVIDIA"
          echo "HAS_NVIDIA_GPU: ${HAS_NVIDIA_GPU:-<unset>}"
          if [ "$HAS_NVIDIA" != "false" ]; then
            echo "FAIL: expected has-nvidia=false when nvidia-smi fails"
            exit 1
          fi
          if [ "${HAS_NVIDIA_GPU:-}" != "false" ]; then
            echo "FAIL: expected HAS_NVIDIA_GPU=false"
            exit 1
          fi
          if [ -n "${GPU_FLAG:-}" ]; then
            echo "FAIL: GPU_FLAG should be unset"
            exit 1
          fi
          echo "PASS"
