name: Test in-container runner detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create /.incontainer marker
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          $SUDO rm -f /.inarc || true
          $SUDO touch /.incontainer
          ls -la /.incontainer
      - id: action
        uses: .
      - name: Assert in-container-runner is true
        env:
          IN_CONTAINER: ${{ steps.action.outputs.in-container-runner }}
          HAS_NVIDIA: ${{ steps.action.outputs.has-nvidia }}
        run: |
          echo "in-container-runner: $IN_CONTAINER"
          echo "has-nvidia: $HAS_NVIDIA"
          if [ "$IN_CONTAINER" != "true" ]; then
            echo "FAIL: expected in-container-runner=true"; exit 1
          fi
          if [ "$HAS_NVIDIA" != "false" ]; then
            echo "FAIL: expected has-nvidia=false"; exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          $SUDO rm -f /.incontainer || true
