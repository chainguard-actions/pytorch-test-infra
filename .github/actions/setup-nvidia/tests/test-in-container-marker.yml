name: Test in-container marker detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create /.incontainer marker
        run: |
          if [ "$(id -u)" = "0" ]; then touch /.incontainer; else sudo touch /.incontainer; fi
          ls -la /.incontainer
      - id: action
        uses: .
      - name: Assert in-container-runner is true
        env:
          ACTUAL: ${{ steps.action.outputs.in-container-runner }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true'"
            exit 1
          fi
          echo "PASS"
      - name: Assert has-nvidia is false
        env:
          ACTUAL: ${{ steps.action.outputs.has-nvidia }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false'"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: |
          if [ "$(id -u)" = "0" ]; then rm -f /.incontainer; else sudo rm -f /.incontainer; fi
