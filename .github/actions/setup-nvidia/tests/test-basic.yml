name: Test basic usage (no GPU, not in container)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure container marker files are absent
        run: |
          if [ -w / ]; then rm -f /.inarc /.incontainer; else sudo rm -f /.inarc /.incontainer || true; fi
      - id: action
        uses: .
      - name: Assert outputs
        env:
          HAS_NVIDIA: ${{ steps.action.outputs.has-nvidia }}
          IN_CONTAINER: ${{ steps.action.outputs.in-container-runner }}
        run: |
          echo "has-nvidia: $HAS_NVIDIA"
          echo "in-container-runner: $IN_CONTAINER"
          echo "HAS_NVIDIA_GPU env: $HAS_NVIDIA_GPU"
          if [ "$IN_CONTAINER" != "false" ]; then
            echo "FAIL: expected in-container-runner=false"
            exit 1
          fi
          if [ "$HAS_NVIDIA" != "false" ]; then
            echo "FAIL: expected has-nvidia=false on a runner without NVIDIA GPU"
            exit 1
          fi
          if [ "$HAS_NVIDIA_GPU" != "false" ]; then
            echo "FAIL: expected HAS_NVIDIA_GPU=false exported"
            exit 1
          fi
          if [ -n "${GPU_FLAG:-}" ]; then
            echo "FAIL: GPU_FLAG should not be set, got '$GPU_FLAG'"
            exit 1
          fi
          echo "PASS"
