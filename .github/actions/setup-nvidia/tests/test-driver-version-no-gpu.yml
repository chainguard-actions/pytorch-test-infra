name: Test driver-version input without GPU (install skipped)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no container marker files exist
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          $SUDO rm -f /.inarc /.incontainer || true
      - id: action
        uses: .
        with:
          driver-version: '570.133.20'
      - name: Assert action succeeded and skipped install
        env:
          HAS_NVIDIA: ${{ steps.action.outputs.has-nvidia }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-nvidia: $HAS_NVIDIA"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"; exit 1
          fi
          if [ "$HAS_NVIDIA" != "false" ]; then
            echo "FAIL: expected has-nvidia=false"; exit 1
          fi
          if [ "$HAS_NVIDIA_GPU" != "false" ]; then
            echo "FAIL: expected HAS_NVIDIA_GPU=false"; exit 1
          fi
          echo "PASS"
