name: Test driver-version input without GPU
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          driver-version: "570.133.20"
      - name: Assert has-nvidia is false and install skipped
        env:
          ACTUAL: ${{ steps.action.outputs.has-nvidia }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false'"
            exit 1
          fi
          if [ "$HAS_NVIDIA_GPU" != "false" ]; then
            echo "FAIL: expected HAS_NVIDIA_GPU=false"
            exit 1
          fi
          echo "PASS"
      - name: Assert in-container-runner is a boolean
        env:
          ACTUAL: ${{ steps.action.outputs.in-container-runner }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ] && [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected true/false"
            exit 1
          fi
          echo "PASS"
