name: Test driver-version input without GPU (install skipped)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no container markers
        run: |
          if [ "$(id -u)" = 0 ]; then S=""; else S="sudo"; fi
          $S rm -f /.inarc /.incontainer || true
          if command -v nvidia-smi >/dev/null 2>&1 || ls /dev/nvidia* >/dev/null 2>&1; then
            echo "NOTE: GPU-like environment present"
          fi
      - id: action
        uses: .
        with:
          driver-version: '570.133.20'
      - name: Assert action completed and outputs set
        env:
          HAS: ${{ steps.action.outputs.has-nvidia }}
          INC: ${{ steps.action.outputs.in-container-runner }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME has-nvidia: $HAS in-container: $INC"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: action did not succeed"; exit 1
          fi
          if [ "$INC" != "false" ]; then
            echo "FAIL: expected in-container-runner=false"; exit 1
          fi
          if [ "$HAS" != "true" ] && [ "$HAS" != "false" ]; then
            echo "FAIL: has-nvidia must be true/false"; exit 1
          fi
          if [ "$HAS_NVIDIA_GPU" != "$HAS" ]; then
            echo "FAIL: HAS_NVIDIA_GPU mismatch"; exit 1
          fi
          echo "PASS"
