name: Test BC lint with suppression, config_dir and docs_link
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: sha
        name: Resolve HEAD sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: test/repo
          base_sha: ${{ steps.sha.outputs.sha }}
          head_sha: ${{ steps.sha.outputs.sha }}
          suppression: 'true'
          config_dir: '.'
          docs_link: 'https://github.com/pytorch/test-infra/wiki/BC-Linter'
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -d "$GITHUB_WORKSPACE/_repo" ] || [ -d "$GITHUB_WORKSPACE/_test-infra" ]; then
              echo "FAIL: cleanup did not remove _repo/_test-infra"
              exit 1
            fi
            echo "PASS: action succeeded and cleaned up"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repository cannot be checked out)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
