name: Test identical base/head with suppression and docs link
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Compute SHA
        id: shas
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: pytorch/test-infra
          base_sha: ${{ steps.shas.outputs.head }}
          head_sha: ${{ steps.shas.outputs.head }}
          suppression: 'true'
          docs_link: https://github.com/pytorch/test-infra/wiki/BC-Linter
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -d "$GITHUB_WORKSPACE/_repo" ] || [ -d "$GITHUB_WORKSPACE/_test-infra" ]; then
              echo "FAIL: cleanup step did not remove _repo/_test-infra"
              exit 1
            fi
            echo "PASS: no-diff run succeeded and cleaned up"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
