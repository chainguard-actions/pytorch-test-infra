name: Test invalid SHA fails
on:
  workflow_dispatch:
jobs:
  run-action:
    runs-on: ubuntu-latest
    # The action is expected to fail here; isolate it in its own job so the
    # composite-internal failure cannot fail the overall workflow.
    continue-on-error: true
    outputs:
      outcome: ${{ steps.record.outputs.outcome }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: ${{ github.repository }}
          base_sha: 'deadbeefdeadbeefdeadbeefdeadbeefdeadbeef'
          head_sha: 'deadbeefdeadbeefdeadbeefdeadbeefdeadbeef'
          docs_link: 'https://github.com/pytorch/test-infra/wiki/BC-Linter'
      - id: record
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: echo "outcome=${OUTCOME:-unknown}" >> "$GITHUB_OUTPUT"
  assert:
    runs-on: ubuntu-latest
    needs: run-action
    if: always()
    steps:
      - name: Assert action did not succeed
        env:
          OUTCOME: ${{ needs.run-action.outputs.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected failure for nonexistent SHAs, got success"
            exit 1
          fi
          echo "PASS: action did not succeed with nonexistent SHAs"
