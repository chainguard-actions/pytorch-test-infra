name: Test invalid SHAs cause failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: ${{ github.repository }}
          base_sha: 'deadbeefdeadbeefdeadbeefdeadbeefdeadbeef'
          head_sha: 'feedfacefeedfacefeedfacefeedfacefeedface'
          docs_link: 'https://github.com/pytorch/test-infra/wiki/BC-Linter'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-existent SHAs, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
