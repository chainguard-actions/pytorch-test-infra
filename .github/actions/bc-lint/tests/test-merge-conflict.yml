name: Test merge conflict skips BC-linter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare _repo with conflicting base/head commits
        id: setup
        run: |
          set -eux
          rm -rf _repo .bc-origin
          git init -q _repo
          cd _repo
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "line" > file.txt
          git add file.txt
          git commit -q -m init
          git checkout -q -b base-branch
          echo "base change" > file.txt
          git commit -q -am base
          BASE_SHA=$(git rev-parse HEAD)
          git checkout -q -b act-harness HEAD~1
          echo "head change" > file.txt
          git commit -q -am head
          cd ..
          git init -q --bare .bc-origin
          git -C .bc-origin config uploadpack.allowAnySHA1InWant true
          git -C _repo push -q "$GITHUB_WORKSPACE/.bc-origin" --all
          git -C _repo remote add origin "$GITHUB_WORKSPACE/.bc-origin"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: pytorch/test-infra
          base_sha: ${{ steps.setup.outputs.base_sha }}
          head_sha: refs/heads/act-harness
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -d "$GITHUB_WORKSPACE/_repo" ] || [ -d "$GITHUB_WORKSPACE/_test-infra" ]; then
              echo "FAIL: cleanup did not remove _repo/_test-infra"
              exit 1
            fi
            echo "PASS: merge conflict handled, linter skipped, cleanup ran"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (repository checkout not resolvable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
