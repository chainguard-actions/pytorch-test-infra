name: 'BC Lint Action'
description: 'A reusable action for running the BC Lint workflow.
    See https://github.com/pytorch/test-infra/wiki/BC-Linter for more information.'
inputs:
  repo:
    description: 'Repository to run BC Lint on'
    required: true
  base_sha:
    description: 'PR base SHA (events.pull_request.base.sha)'
    required: true
  head_sha:
    description: 'PR head SHA (events.pull_request.head.sha)'
    required: true
  suppression:
    description: 'Suppression flag (true/false)'
    required: false
    default: 'false'
  docs_link:
    description: 'Link to the docs to display in case of failure'
    required: false
    default: ''
  config_dir:
    description: 'Directory to load .bc-linter.yml from (defaults to repository root)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Checkout pytorch/test-infra repository
      uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4
      with:
        repository: pytorch/test-infra
        path: _test-infra

    - name: Checkout ${{ inputs.repo }}
      uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4
      with:
        ref: ${{ inputs.head_sha }}
        fetch-depth: -1
        submodules: false
        show-progress: false
        path: _repo

    - name: Merge PR changes onto base
      id: merge_changes
      working-directory: _repo
      shell: bash
      env:
        INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        INPUT_BASE_SHA: ${{ inputs.base_sha }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git fetch origin "$INPUT_HEAD_SHA"
        git fetch origin "$INPUT_BASE_SHA"
        git reset --hard "$INPUT_BASE_SHA"
        git merge "$INPUT_HEAD_SHA" || MERGE_CONFLICT=1
        if [ -z "$MERGE_CONFLICT" ]; then
          NEW_HEAD_SHA=$(git rev-parse HEAD)
          echo "new_head_sha=${NEW_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
        else
          echo "Hit merge conflict, skipping BC-linter. You PR is too old. Please rebase it to resolve the conflict."
        fi

    - name: Build and run BC-linter
      if: steps.merge_changes.outputs.new_head_sha != ''
      working-directory: _repo
      shell: bash
      env:
        INPUT_BASE_SHA: ${{ inputs.base_sha }}
        NEW_HEAD_SHA: ${{ steps.merge_changes.outputs.new_head_sha }}
        INPUT_SUPPRESSION: ${{ inputs.suppression }}
        INPUT_CONFIG_DIR: ${{ inputs.config_dir }}
      run: |
        set -eux
        python3 -m pip install -r ../_test-infra/tools/stronghold/requirements.runtime.txt
        ../_test-infra/tools/stronghold/bin/build-check-api-compatibility
        extra_args=()
        if [ "$INPUT_SUPPRESSION" = "true" ]; then
          extra_args+=(--suppressed)
        fi
        if [ -n "$INPUT_CONFIG_DIR" ]; then
          extra_args+=("--config-dir=$INPUT_CONFIG_DIR")
        fi
        ../_test-infra/tools/stronghold/bin/check-api-compatibility \
            "--base-commit=$INPUT_BASE_SHA" \
            "--head-commit=$NEW_HEAD_SHA" \
            ${extra_args[@]+"${extra_args[@]}"}

    - name: Display documentation link if failed
      if: ${{ failure() && inputs.docs_link }}
      env:
        INPUT_DOCS_LINK: ${{ inputs.docs_link }}
      run: |
        echo "BC-linter failed. Please check the following documentation for resolving issues:"
        echo "$INPUT_DOCS_LINK"
      shell: bash

    - name: Cleanup
      run: |
        rm -rf _repo
        rm -rf _test-infra
      shell: bash
