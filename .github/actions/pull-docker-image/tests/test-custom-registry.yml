name: Test custom docker registry login
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock aws and docker
        run: |
          MOCK_DIR="$RUNNER_TEMP/mockbin"
          mkdir -p "$MOCK_DIR"
          rm -f /tmp/mock-calls.log /tmp/mock-local-image /tmp/mock-pull-fail
          cat > "$MOCK_DIR/aws" <<'EOF'
          #!/bin/bash
          echo "aws $*" >> /tmp/mock-calls.log
          echo "fake-ecr-password"
          EOF
          cat > "$MOCK_DIR/docker" <<'EOF'
          #!/bin/bash
          echo "docker $*" >> /tmp/mock-calls.log
          case "$1" in
            login) cat >/dev/null; exit 0 ;;
            manifest) echo '{"config":{"size":1048576},"layers":[{"size":2097152}]}'; exit 0 ;;
            inspect) [ -f /tmp/mock-local-image ] && exit 0 || exit 1 ;;
            pull) [ -f /tmp/mock-pull-fail ] && exit 1; touch /tmp/mock-local-image; exit 0 ;;
          esac
          exit 0
          EOF
          chmod +x "$MOCK_DIR/aws" "$MOCK_DIR/docker"
          echo "$MOCK_DIR" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          docker-image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/foo:bar
          docker-registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
      - name: Assert custom registry used
        run: |
          cat /tmp/mock-calls.log
          grep -q "docker login -u AWS --password-stdin 123456789012.dkr.ecr.us-east-1.amazonaws.com$" /tmp/mock-calls.log || { echo "FAIL: custom registry not used for login"; exit 1; }
          if grep -q "308535385114" /tmp/mock-calls.log; then echo "FAIL: default registry used"; exit 1; fi
          grep -q "^docker pull 123456789012.dkr.ecr.us-east-1.amazonaws.com/foo:bar$" /tmp/mock-calls.log || { echo "FAIL: image not pulled"; exit 1; }
          echo "PASS"
