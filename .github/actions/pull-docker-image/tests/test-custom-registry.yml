name: Test custom docker-registry
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mocks
        run: |
          rm -f /tmp/fake-docker/image-present /tmp/fake-docker/pull-fail
          bash tests/fixtures/setup-mocks.sh
      - id: action
        uses: .
        with:
          docker-image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/repo:tag
          docker-registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
      - name: Assert login used custom registry
        run: |
          cat /tmp/fake-docker/calls.log
          grep -qx "docker login -u AWS --password-stdin 123456789012.dkr.ecr.us-east-1.amazonaws.com" /tmp/fake-docker/calls.log || { echo "FAIL: login to custom registry not called"; exit 1; }
          if grep -q "308535385114" /tmp/fake-docker/calls.log; then
            echo "FAIL: default registry should not be used"
            exit 1
          fi
          grep -qx "docker pull 123456789012.dkr.ecr.us-east-1.amazonaws.com/repo:tag" /tmp/fake-docker/calls.log || { echo "FAIL: pull not called"; exit 1; }
          echo "PASS"
