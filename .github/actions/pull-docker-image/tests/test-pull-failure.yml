name: Test pull failure is retried then fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAKE_DOCKER_PULL_RC: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mocks
        run: bash tests/fixtures/setup-mocks.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image: example.com/myorg/missing:none
      - name: Assert step failed after 3 pull attempts
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          cat /tmp/fake-calls.log
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          n=$(grep -c "^docker pull example.com/myorg/missing:none$" /tmp/fake-calls.log || true)
          if [ "$n" != "3" ]; then echo "FAIL: expected 3 pull attempts, got $n"; exit 1; fi
          echo "PASS"
