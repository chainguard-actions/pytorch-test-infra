name: Test pull failure is retried and fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws and docker on PATH
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/docker.log /tmp/aws.log /tmp/login-stdin.log
          cat > /tmp/fakebin/aws <<'EOF'
          #!/bin/sh
          echo "aws $*" >> /tmp/aws.log
          echo "fake-ecr-password"
          EOF
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo "docker $*" >> /tmp/docker.log
          case "$1" in
            login) cat >> /tmp/login-stdin.log; exit 0 ;;
            manifest) echo '{"config":{"size":1048576},"layers":[{"size":1048576}]}'; exit 0 ;;
            inspect) [ -f /tmp/image-present ] && exit 0; exit 1 ;;
            pull) [ -f /tmp/pull-fails ] && exit 1; echo "pulled $2"; exit 0 ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/aws /tmp/fakebin/docker
          rm -f /tmp/image-present
          touch /tmp/pull-fails
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image: example.com/test/missing:nope
      - name: Assert step failed after 3 pull attempts
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- docker.log"; cat /tmp/docker.log
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure outcome"; exit 1; }
          COUNT=$(grep -c "^docker pull example.com/test/missing:nope$" /tmp/docker.log || true)
          echo "pull attempts: $COUNT"
          [ "$COUNT" = "3" ] || { echo "FAIL: expected 3 pull attempts"; exit 1; }
          echo "PASS"
