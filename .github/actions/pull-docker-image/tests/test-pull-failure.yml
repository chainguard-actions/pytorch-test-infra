name: Test pull failure fails the action after retries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK_INSPECT_RC: "1"
      MOCK_PULL_RC: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock aws and docker
        run: |
          mkdir -p /tmp/mockbin /tmp/mock
          : > /tmp/mock/calls.log
          cat > /tmp/mockbin/aws <<'EOF'
          #!/bin/bash
          echo "aws $*" >> /tmp/mock/calls.log
          echo "fake-ecr-password"
          exit ${MOCK_AWS_RC:-0}
          EOF
          cat > /tmp/mockbin/docker <<'EOF'
          #!/bin/bash
          echo "docker $*" >> /tmp/mock/calls.log
          case "$1" in
            login) pw=$(cat); echo "login-password:$pw" >> /tmp/mock/calls.log; exit ${MOCK_LOGIN_RC:-0} ;;
            manifest) echo '{"config":{"size":1048576},"layers":[{"size":1048576},{"size":2097152}]}'; exit 0 ;;
            inspect) exit ${MOCK_INSPECT_RC:-1} ;;
            pull) exit ${MOCK_PULL_RC:-0} ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/mockbin/aws /tmp/mockbin/docker
          echo "/tmp/mockbin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image: example.com/my/image:missing
      - name: Assert action failed after 3 pull attempts
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          cat /tmp/mock/calls.log
          echo "outcome: $OUTCOME"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure outcome"; exit 1; }
          n=$(grep -c "^docker pull example.com/my/image:missing$" /tmp/mock/calls.log)
          echo "pull count: $n"
          [ "$n" = "3" ] || { echo "FAIL: expected 3 pull attempts"; exit 1; }
          echo "PASS"
