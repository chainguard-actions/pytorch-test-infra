name: Test pull failure retries and fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mocks (pull fails)
        run: |
          rm -f /tmp/fake-docker/image-present
          bash tests/fixtures/setup-mocks.sh
          touch /tmp/fake-docker/pull-fail
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image: example.com/my/image:broken
      - name: Assert failure after retries
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          rm -f /tmp/fake-docker/pull-fail
          cat /tmp/fake-docker/calls.log
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure outcome"; exit 1; fi
          COUNT=$(grep -cx "docker pull example.com/my/image:broken" /tmp/fake-docker/calls.log || true)
          echo "pull count: $COUNT"
          if [ "$COUNT" != "3" ]; then echo "FAIL: expected 3 pull attempts"; exit 1; fi
          echo "PASS"
