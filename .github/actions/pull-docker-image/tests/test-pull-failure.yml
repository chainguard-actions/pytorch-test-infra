name: Test pull failure retries and fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK_LOG: /tmp/mock-calls.log
      MOCK_INSPECT_EXIT: "1"
      MOCK_PULL_EXIT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mocks
        run: bash tests/fixtures/setup-mocks.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image: pytorch/missing-image:nope
      - name: Assert action failed after 3 pull attempts
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "---- calls ----"; cat "$MOCK_LOG"; echo "---------------"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pull fails"
            exit 1
          fi
          N=$(grep -cx "docker pull pytorch/missing-image:nope" "$MOCK_LOG" || true)
          echo "pull count: $N"
          if [ "$N" != "3" ]; then echo "FAIL: expected 3 pull attempts"; exit 1; fi
          echo "PASS"
