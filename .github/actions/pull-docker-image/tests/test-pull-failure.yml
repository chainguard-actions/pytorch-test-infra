name: Test pull failure fails the step after retries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws and docker (pull fails)
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/docker-calls.log /tmp/aws-calls.log /tmp/fake-inspect-exit /tmp/fake-pull-exit /tmp/fake-aws-exit
          cat > /tmp/fakebin/aws <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/aws-calls.log
          if [ -f /tmp/fake-aws-exit ]; then exit "$(cat /tmp/fake-aws-exit)"; fi
          echo "fake-password"
          EOF
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/docker-calls.log
          case "$1" in
            login) cat >/dev/null; echo "Login Succeeded"; exit 0 ;;
            manifest) echo '{"config":{"size":1048576},"layers":[{"size":1048576}]}'; exit 0 ;;
            inspect) if [ -f /tmp/fake-inspect-exit ]; then exit "$(cat /tmp/fake-inspect-exit)"; fi; exit 1 ;;
            pull) if [ -f /tmp/fake-pull-exit ]; then exit "$(cat /tmp/fake-pull-exit)"; fi; echo "pulled $2"; exit 0 ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/aws /tmp/fakebin/docker
          echo "1" > /tmp/fake-pull-exit
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image: example.com/missing/image:nope
      - name: Assert step failed after 3 pull attempts
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- docker calls ---"; cat /tmp/docker-calls.log
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure outcome"; exit 1; fi
          N=$(grep -cx "pull example.com/missing/image:nope" /tmp/docker-calls.log)
          echo "pull attempts: $N"
          if [ "$N" != "3" ]; then echo "FAIL: expected 3 pull attempts"; exit 1; fi
          echo "PASS"
