name: Test pull failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mocks
        run: |
          bash tests/fixtures/setup-mocks.sh
          touch /tmp/mock/pull-fail
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image: example.com/my/image:broken
      - name: Assert failure after retries
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          cat /tmp/mock/docker.log
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure outcome"; exit 1; fi
          n=$(grep -cx "docker pull example.com/my/image:broken" /tmp/mock/docker.log || true)
          if [ "$n" != "3" ]; then echo "FAIL: expected 3 pull attempts, got $n"; exit 1; fi
          echo "PASS"
