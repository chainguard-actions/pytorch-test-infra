name: Test pull failure retries and fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock aws and docker
        run: |
          MOCK_BIN="$RUNNER_TEMP/mockbin"
          mkdir -p "$MOCK_BIN"
          rm -f /tmp/mock-docker.log /tmp/mock-docker-local /tmp/mock-docker-pull-fail
          touch /tmp/mock-docker-pull-fail
          cat > "$MOCK_BIN/aws" <<'EOF'
          #!/bin/sh
          echo "aws $*" >> /tmp/mock-docker.log
          echo "fake-password"
          EOF
          cat > "$MOCK_BIN/docker" <<'EOF'
          #!/bin/sh
          echo "docker $*" >> /tmp/mock-docker.log
          case "$1" in
            login) cat >/dev/null; echo "Login Succeeded"; exit 0 ;;
            manifest) echo '{"layers":[{"size":1048576}],"config":{"size":1048576}}'; exit 0 ;;
            inspect) [ -f /tmp/mock-docker-local ] && exit 0; exit 1 ;;
            pull) [ -f /tmp/mock-docker-pull-fail ] && exit 1; echo "pulled $2"; exit 0 ;;
          esac
          exit 0
          EOF
          chmod +x "$MOCK_BIN/aws" "$MOCK_BIN/docker"
          echo "$MOCK_BIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          docker-image: example.com/missing:nope
      - name: Assert action failed after retries
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          cat /tmp/mock-docker.log
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"; exit 1
          fi
          COUNT=$(grep -c "^docker pull example.com/missing:nope$" /tmp/mock-docker.log)
          echo "pull attempts: $COUNT"
          if [ "$COUNT" != "3" ]; then
            echo "FAIL: expected 3 pull attempts, got $COUNT"; exit 1
          fi
          echo "PASS"
