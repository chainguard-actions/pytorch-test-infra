name: Test basic pull (image not present locally)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock aws and docker
        run: |
          MOCK_DIR="$RUNNER_TEMP/mockbin"
          mkdir -p "$MOCK_DIR"
          rm -f /tmp/mock-calls.log /tmp/mock-local-image /tmp/mock-pull-fail
          cat > "$MOCK_DIR/aws" <<'EOF'
          #!/bin/bash
          echo "aws $*" >> /tmp/mock-calls.log
          echo "fake-ecr-password"
          EOF
          cat > "$MOCK_DIR/docker" <<'EOF'
          #!/bin/bash
          echo "docker $*" >> /tmp/mock-calls.log
          case "$1" in
            login) cat >/dev/null; exit 0 ;;
            manifest) echo '{"config":{"size":1048576},"layers":[{"size":2097152},{"size":1048576}]}'; exit 0 ;;
            inspect) [ -f /tmp/mock-local-image ] && exit 0 || exit 1 ;;
            pull) [ -f /tmp/mock-pull-fail ] && exit 1; touch /tmp/mock-local-image; exit 0 ;;
          esac
          exit 0
          EOF
          chmod +x "$MOCK_DIR/aws" "$MOCK_DIR/docker"
          echo "$MOCK_DIR" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          docker-image: example.com/myrepo/myimage:latest
      - name: Assert calls
        run: |
          cat /tmp/mock-calls.log
          grep -q "aws ecr get-login-password --region us-east-1" /tmp/mock-calls.log || { echo "FAIL: no aws login"; exit 1; }
          grep -q "docker login -u AWS --password-stdin 308535385114.dkr.ecr.us-east-1.amazonaws.com" /tmp/mock-calls.log || { echo "FAIL: no docker login to default registry"; exit 1; }
          grep -q "docker manifest inspect example.com/myrepo/myimage:latest" /tmp/mock-calls.log || { echo "FAIL: no manifest inspect"; exit 1; }
          grep -q "docker inspect --type=image example.com/myrepo/myimage:latest" /tmp/mock-calls.log || { echo "FAIL: no local inspect"; exit 1; }
          N=$(grep -c "^docker pull example.com/myrepo/myimage:latest$" /tmp/mock-calls.log || true)
          if [ "$N" != "1" ]; then echo "FAIL: expected 1 pull, got $N"; exit 1; fi
          echo "PASS"
