name: Test basic pull (image not present locally)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake aws and docker
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/fake-calls.log
          cat > /tmp/fakebin/aws <<'EOF'
          #!/bin/sh
          echo "aws $*" >> /tmp/fake-calls.log
          echo "fake-password"
          EOF
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo "docker $*" >> /tmp/fake-calls.log
          case "$1" in
            login) cat >/dev/null; echo "Login Succeeded"; exit 0 ;;
            manifest) echo '{"config":{"size":1048576},"layers":[{"size":1048576},{"size":2097152}]}'; exit 0 ;;
            inspect) exit 1 ;;
            pull) echo "pulled $2"; exit 0 ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/aws /tmp/fakebin/docker
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          docker-image: example.com/my/image:latest
      - name: Assert calls
        run: |
          cat /tmp/fake-calls.log
          grep -q "aws ecr get-login-password --region us-east-1" /tmp/fake-calls.log || { echo "FAIL: aws login not called"; exit 1; }
          grep -q "docker login -u AWS --password-stdin 308535385114.dkr.ecr.us-east-1.amazonaws.com" /tmp/fake-calls.log || { echo "FAIL: docker login to default registry missing"; exit 1; }
          grep -q "docker manifest inspect example.com/my/image:latest" /tmp/fake-calls.log || { echo "FAIL: manifest inspect missing"; exit 1; }
          grep -q "docker inspect --type=image example.com/my/image:latest" /tmp/fake-calls.log || { echo "FAIL: local inspect missing"; exit 1; }
          COUNT=$(grep -c "^docker pull example.com/my/image:latest$" /tmp/fake-calls.log)
          echo "pull count: $COUNT"
          if [ "$COUNT" != "1" ]; then echo "FAIL: expected exactly 1 pull"; exit 1; fi
          echo "PASS"
